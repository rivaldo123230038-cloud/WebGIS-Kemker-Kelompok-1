<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>WEBGIS KELOMPOK 1</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

/* =========================================================
   DASAR
========================================================= */

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}


/* =========================================================
   MAP
========================================================= */

#map {
    position: absolute;
    left: 350px;
    top: 0;
    width: calc(100% - 350px);
    height: 100vh;
    transition: all 0.3s ease;
    z-index: 1;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 350px;
    height: 100vh;
    background: #ffffff;
    z-index: 2000;
    transition: transform 0.3s ease;
    box-shadow: 2px 0 8px rgba(0,0,0,0.25);
}

.sidebar.collapsed {
    transform: translateX(-350px);
}


/* =========================================================
   LOGO
========================================================= */

.logo-section {
    height: 108px;
    width: 100%;
    display: flex;
    background: #ffffff;
    border-bottom: 1px solid #222;
}

.logo-item {
    width: 25%;
    height: 108px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.logo-item img {
    max-width: 90%;
    max-height: 85px;
    object-fit: contain;
}


/* =========================================================
   SIDEBAR BODY
========================================================= */

.sidebar-body {
    position: relative;
    height: calc(100vh - 108px);
    overflow-y: auto;
    overflow-x: hidden;
}


/* =========================================================
   BACKGROUND SLIDESHOW
========================================================= */

.background-slideshow {
    position: absolute;
    left: 0;
    top: 0;
    width: 350px;
    height: 100%;
    overflow: hidden;
    z-index: 0;
}

.bg-photo {
    position: absolute;
    left: 0;
    width: 100%;
    height: 33.333%;
    object-fit: cover;
    opacity: 0.20;
    transition: opacity 1.5s ease;
}

#bgPhoto1 {
    top: 0;
}

#bgPhoto2 {
    top: 33.333%;
}

#bgPhoto3 {
    top: 66.666%;
}


/* =========================================================
   SIDEBAR CONTENT
========================================================= */

.sidebar-content {
    position: relative;
    z-index: 5;
}


/* =========================================================
   TITLE
========================================================= */

.title-section {
    background: #B65F3A;
    color: white;
    text-align: center;
    padding: 16px 10px;
    border-bottom: 2px solid #222;
}

.title-section h1 {
    margin: 0;
    font-size: 24px;
    font-weight: bold;
}

.title-section p {
    margin: 7px 0 0 0;
    font-size: 13px;
}


/* =========================================================
   PANEL
========================================================= */

.panel {
    margin: 12px;
    background: rgba(255,255,255,0.92);
    border: 1px solid #777;
    border-radius: 6px;
    overflow: hidden;
}

.panel-title {
    background: #eeeeee;
    padding: 10px;
    font-size: 15px;
    font-weight: bold;
    border-bottom: 1px solid #aaa;
}

.panel-content {
    padding: 12px;
}


/* =========================================================
   CHECKBOX / RADIO
========================================================= */

.layer-option {
    margin-bottom: 10px;
}

.layer-option label {
    cursor: pointer;
    font-size: 14px;
}

.layer-option input {
    margin-right: 7px;
}


/* =========================================================
   BUTTON
========================================================= */

.zoom-button {
    width: 100%;
    padding: 9px;
    margin-top: 5px;
    border: none;
    border-radius: 4px;
    background: #B65F3A;
    color: white;
    font-size: 13px;
    cursor: pointer;
}

.zoom-button:hover {
    background: #8f452a;
}


/* =========================================================
   KOORDINAT
========================================================= */

.coordinate-box {
    font-size: 13px;
    line-height: 1.6;
}

.coordinate-box strong {
    display: inline-block;
    width: 105px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
    text-align: center;
    font-size: 11px;
    padding: 15px 10px 25px 10px;
    color: #333;
}


/* =========================================================
   TOGGLE SIDEBAR
========================================================= */

.sidebar-toggle {
    position: fixed;
    left: 350px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 55px;
    border: none;
    background: #B65F3A;
    color: white;
    font-size: 18px;
    cursor: pointer;
    z-index: 3000;
    border-radius: 0 7px 7px 0;
    transition: left 0.3s ease;
}

.sidebar-toggle.collapsed {
    left: 0;
}


/* =========================================================
   POPUP
========================================================= */

.popup-title {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 8px;
    color: #B65F3A;
}


/* =========================================================
   LEGEND
========================================================= */

.legend {
    background: white;
    padding: 10px;
    line-height: 20px;
    color: #333;
    border-radius: 5px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.3);
}

.legend-line {
    display: inline-block;
    width: 30px;
    height: 4px;
    background: #00ffff;
    margin-right: 7px;
    vertical-align: middle;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 800px) {

    .sidebar {
        width: 280px;
    }

    .sidebar.collapsed {
        transform: translateX(-280px);
    }

    #map {
        left: 280px;
        width: calc(100% - 280px);
    }

    .sidebar-toggle {
        left: 280px;
    }

    .sidebar-toggle.collapsed {
        left: 0;
    }

    .background-slideshow {
        width: 280px;
    }
}

</style>

</head>


<body>


<!-- =====================================================

===================================================== -->

<div class="sidebar" id="sidebar">

    <div class="logo-section">

        </div>

    <!-- SIDEBAR BODY -->

            <img

                <h1>

                </p>

            <!-- =================================================

                    <button
                        class="zoom-button"

                    </button>

            <!-- =================================================

                    <div class="layer-option">

            <!-- =================================================

            ================================================== -->

            <div class="panel">

                            -

</div>


<!-- =====================================================
     SIDEBAR TOGGLE
===================================================== -->

<button
    id="sidebarToggle"
    class="sidebar-toggle"
>
    ◀
</button>


<!-- =====================================================
     MAP
===================================================== -->

<div id="map"></div>


<!-- =====================================================
     LEAFLET
===================================================== -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {

    center: [-5.45, 105.25],

    zoom: 10,

    minZoom: 0,

    maxZoom: 23,

    zoomControl: true,

    scrollWheelZoom: true,

    doubleClickZoom: true,

    dragging: true,

    boxZoom: true,

    keyboard: true

});


/* =========================================================
   SIDEBAR TOGGLE
========================================================= */

const sidebar =
    document.getElementById("sidebar");

const sidebarToggle =
    document.getElementById("sidebarToggle");

const mapContainer =
    document.getElementById("map");


sidebarToggle.addEventListener(
    "click",
    function () {

        sidebar.classList.toggle("collapsed");

        sidebarToggle.classList.toggle("collapsed");


        if (
            sidebar.classList.contains("collapsed")
        ) {

            mapContainer.style.left = "0";
            mapContainer.style.width = "100%";

            sidebarToggle.innerHTML = "▶";

        }

        else {

            const sidebarWidth =
                window.innerWidth <= 800
                ? "280px"
                : "350px";

            mapContainer.style.left =
                sidebarWidth;

            mapContainer.style.width =
                `calc(100% - ${sidebarWidth})`;

            sidebarToggle.innerHTML = "◀";

        }


        setTimeout(
            function () {

                map.invalidateSize();

            },
            300
        );

    }
);


/* =========================================================
   BASEMAP ESRI SATELLITE
========================================================= */

const satellite = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/" +
    "World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {

        maxZoom: 23,

        maxNativeZoom: 19,

        attribution:
            "Tiles © Esri"

    }

);


/* =========================================================
   BASEMAP ESRI STREET
========================================================= */

const street = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/" +
    "World_Street_Map/MapServer/tile/{z}/{y}/{x}",

    {

        maxZoom: 23,

        maxNativeZoom: 19,

        attribution:
            "Tiles © Esri"

    }

);


/* =========================================================
   DEFAULT BASEMAP
========================================================= */

satellite.addTo(map);


/* =========================================================
   ORTHOPHOTO
========================================================= */

const ORTHO_URL_BASE =
    "https://raw.githubusercontent.com/" +
    "rivaldo123230038-cloud/" +
    "WebGIS-Kemker-Kelompok-1/" +
    "main/" +
    "Fix_Ortho_web/" +
    "_alllayers/";


const OrthoGridLayer =
    L.GridLayer.extend({

        createTile: function(coords, done) {

            const tile =
                document.createElement("canvas");

            tile.width = 256;
            tile.height = 256;

            const ctx =
                tile.getContext("2d");

            const z =
                coords.z;

            const row =
                coords.y;

            const col =
                coords.x;


            if (
                row < 0 ||
                col < 0
            ) {

                setTimeout(
                    function () {

                        done(null, tile);

                    },
                    0
                );

                return tile;

            }


            const rowHex =
                row.toString(16).toUpperCase();

            const colHex =
                col.toString(16).toUpperCase();


            const url =
                ORTHO_URL_BASE +
                "L" + z +
                "/R" + rowHex +
                "/C" + colHex +
                ".png";


            const img =
                new Image();

            img.crossOrigin = "anonymous";


            img.onload =
                function () {

                    ctx.clearRect(
                        0,
                        0,
                        256,
                        256
                    );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        256,
                        256
                    );


                    /* =====================================
                       TRANSPARANSI BACKGROUND PUTIH/HITAM
                    ====================================== */

                    try {

                        const imageData =
                            ctx.getImageData(
                                0,
                                0,
                                256,
                                256
                            );

                        const data =
                            imageData.data;

                        const visited =
                            new Uint8Array(
                                256 * 256
                            );

                        const queue = [];

                        function addPixel(x, y) {

                            if (
                                x < 0 ||
                                x >= 256 ||
                                y < 0 ||
                                y >= 256
                            ) {
                                return;
                            }

                            const index =
                                y * 256 + x;

                            if (
                                visited[index]
                            ) {
                                return;
                            }

                            visited[index] = 1;

                            const p =
                                index * 4;

                            const r =
                                data[p];

                            const g =
                                data[p + 1];

                            const b =
                                data[p + 2];

                            const a =
                                data[p + 3];


                            if (
                                a === 0
                            ) {
                                return;
                            }


                            const isWhite =
                                r > 245 &&
                                g > 245 &&
                                b > 245;


                            const isBlack =
                                r < 10 &&
                                g < 10 &&
                                b < 10;


                            if (
                                isWhite ||
                                isBlack
                            ) {

                                queue.push([
                                    x,
                                    y
                                ]);

                            }

                        }


                        /* ================================
                           AMBIL PIXEL TEPI TILE
                        ================================= */

                        for (
                            let x = 0;
                            x < 256;
                            x++
                        ) {

                            addPixel(x, 0);

                            addPixel(
                                x,
                                255
                            );

                        }


                        for (
                            let y = 0;
                            y < 256;
                            y++
                        ) {

                            addPixel(0, y);

                            addPixel(
                                255,
                                y
                            );

                        }


                        /* ================================
                           FLOOD FILL
                        ================================= */

                        let qIndex = 0;

                        while (
                            qIndex <
                            queue.length
                        ) {

                            const [
                                x,
                                y
                            ] =
                                queue[qIndex++];


                            const index =
                                y * 256 + x;

                            const p =
                                index * 4;


                            data[p + 3] = 0;


                            const neighbors = [

                                [x + 1, y],

                                [x - 1, y],

                                [x, y + 1],

                                [x, y - 1]

                            ];


                            for (
                                const n
                                of neighbors
                            ) {

                                const nx = n[0];
                                const ny = n[1];


                                if (
                                    nx < 0 ||
                                    nx >= 256 ||
                                    ny < 0 ||
                                    ny >= 256
                                ) {
                                    continue;
                                }


                                const ni =
                                    ny * 256 + nx;


                                if (
                                    visited[ni]
                                ) {
                                    continue;
                                }


                                const np =
                                    ni * 4;


                                const nr =
                                    data[np];

                                const ng =
                                    data[np + 1];

                                const nb =
                                    data[np + 2];

                                const na =
                                    data[np + 3];


                                const nearWhite =
                                    nr > 245 &&
                                    ng > 245 &&
                                    nb > 245;

                                const nearBlack =
                                    nr < 10 &&
                                    ng < 10 &&
                                    nb < 10;


                                if (
                                    na > 0 &&
                                    (
                                        nearWhite ||
                                        nearBlack
                                    )
                                ) {

                                    visited[ni] = 1;

                                    queue.push([
                                        nx,
                                        ny
                                    ]);

                                }

                            }

                        }


                        ctx.putImageData(
                            imageData,
                            0,
                            0
                        );

                    }

                    catch(error) {

                        console.warn(
                            "Canvas transparency:",
                            error
                        );

                    }


                    done(
                        null,
                        tile
                    );

                };


            img.onerror =
                function () {

                    done(
                        null,
                        tile
                    );

                };


            img.src = url;


            return tile;

        }

    });


const ortho =
    new OrthoGridLayer({

        tileSize: 256,

        opacity: 0.80,

        zIndex: 500,

        noWrap: true,

        minZoom: 12,

        maxZoom: 18

    });


/* =========================================================
   TAMBAHKAN ORTHOPHOTO
========================================================= */

ortho.addTo(map);


/* =========================================================
   STYLE GARIS PANTAI
========================================================= */

const coastlineStyle = {

    color: "#00ffff",

    weight: 4,

    opacity: 0.95

};


/* =========================================================
   VARIABEL GARIS PANTAI
========================================================= */

let coastline = null;

let coastlineReady = false;


/* =========================================================
   MEMBACA GEOJSON
========================================================= */

function loadCoastlineGeoJSON(data) {

    const group =
        L.geoJSON(
            data,
            {

                style:
                    coastlineStyle,


                onEachFeature:
                    function (
                        feature,
                        layer
                    ) {


                        /* ============================
                           POPUP ATRIBUT
                        ============================ */

                        let html =
                            "<div>" +

                            "<div " +
                            "class='popup-title'>" +

                            "Informasi Garis Pantai" +

                            "</div>";


                        const properties =
                            feature.properties ||
                            {};


                        const keys =
                            Object.keys(
                                properties
                            );


                        if (
                            keys.length === 0
                        ) {

                            html +=
                                "Tidak terdapat atribut.";

                        }

                        else {

                            keys.forEach(
                                function(key) {

                                    let value =
                                        properties[key];


                                    if (
                                        value === null ||
                                        value === undefined ||
                                        value === ""
                                    ) {

                                        value = "-";

                                    }


                                    html +=
                                        "<b>" +
                                        key +
                                        "</b>: " +
                                        value +
                                        "<br>";

                                }
                            );

                        }


                        html +=
                            "</div>";


                        layer.bindPopup(
                            html
                        );


                        /* ============================
                           HIGHLIGHT
                        ============================ */

                        layer.on(
                            "mouseover",
                            function() {

                                this.setStyle({

                                    color:
                                        "#ff0000",

                                    weight:
                                        6

                                });

                            }
                        );


                        layer.on(
                            "mouseout",
                            function() {

                                this.setStyle(
                                    coastlineStyle
                                );

                            }
                        );

                    }

            }
        );


    return group;

}


/* =========================================================
   LOAD FILE GARIS_PANTAI_RTK.GEOJSON
========================================================= */

fetch(
    "Garis_Pantai_RTK.geojson"
)

.then(
    function(response) {

        if (
            !response.ok
        ) {

            throw new Error(
                "File Garis_Pantai_RTK.geojson tidak ditemukan."
            );

        }


        return response.json();

    }
)

.then(
    function(data) {

        coastline =
            loadCoastlineGeoJSON(
                data
            );


        coastline.addTo(
            map
        );


        coastlineReady = true;


        /* ================================
           AUTO ZOOM SETELAH FILE SELESAI
        ================================= */

        setTimeout(
            function() {

                zoomToCoastline();

            },
            500
        );

    }
)

.catch(
    function(error) {

        console.error(
            "Error GeoJSON:",
            error
        );


        coastlineReady = false;


        alert(
            "Garis_Pantai_RTK.geojson gagal dimuat.\n\n" +
            "Pastikan file berada satu folder dengan index.html."
        );

    }
);


/* =========================================================
   AUTO ZOOM GARIS PANTAI
========================================================= */

function zoomToCoastline() {

    if (
        !coastline ||
        !coastlineReady
    ) {

        alert(
            "Garis pantai belum selesai dimuat."
        );

        return;

    }


    const bounds =
        coastline.getBounds();


    if (
        !bounds.isValid()
    ) {

        alert(
            "Extent garis pantai tidak valid."
        );

        return;

    }


    map.fitBounds(
        bounds,
        {

            padding: [
                30,
                30
            ],

            maxZoom: 17

        }
    );

}


/* =========================================================
   TOMBOL AUTO ZOOM SIDEBAR
========================================================= */

document
    .getElementById(
        "zoomLayerButton"
    )
    .addEventListener(
        "click",
        function() {

            zoomToCoastline();

        }
    );


/* =========================================================
   KONTROL ZOOM TO LAYER
========================================================= */

const ZoomToLayerControl =
    L.Control.extend({

        options: {

            position:
                "topright"

        },


        onAdd:
            function(map) {

                const container =
                    L.DomUtil.create(
                        "div",
                        "leaflet-bar leaflet-control"
                    );


                const button =
                    L.DomUtil.create(
                        "a",
                        "",
                        container
                    );


                button.href =
                    "#";

                button.title =
                    "Zoom ke Garis Pantai";

                button.innerHTML =
                    "⌖";

                button.style.fontSize =
                    "20px";

                button.style.textAlign =
                    "center";

                button.style.lineHeight =
                    "30px";


                L.DomEvent.disableClickPropagation(
                    container
                );


                L.DomEvent.on(
                    button,
                    "click",
                    function(e) {

                        L.DomEvent.preventDefault(
                            e
                        );

                        zoomToCoastline();

                    }
                );


                return container;

            }

    });


map.addControl(
    new ZoomToLayerControl()
);


/* =========================================================
   CHECKBOX GARIS PANTAI
========================================================= */

document
    .getElementById(
        "coastlineCheck"
    )
    .addEventListener(
        "change",
        function() {

            if (
                !coastline
            ) {

                return;

            }


            if (
                this.checked
            ) {

                if (
                    !map.hasLayer(
                        coastline
                    )
                ) {

                    coastline.addTo(
                        map
                    );

                }

            }

            else {

                if (
                    map.hasLayer(
                        coastline
                    )
                ) {

                    map.removeLayer(
                        coastline
                    );

                }

            }

        }
    );


/* =========================================================
   CHECKBOX ORTHOPHOTO
========================================================= */

document
    .getElementById(
        "orthoCheck"
    )
    .addEventListener(
        "change",
        function() {

            if (
                this.checked
            ) {

                if (
                    !map.hasLayer(
                        ortho
                    )
                ) {

                    ortho.addTo(
                        map
                    );

                }


                ortho.bringToFront();

            }

            else {

                if (
                    map.hasLayer(
                        ortho
                    )
                ) {

                    map.removeLayer(
                        ortho
                    );

                }

            }

        }
    );


/* =========================================================
   BASemap SWITCH
========================================================= */

function removeBasemaps() {

    if (
        map.hasLayer(
            satellite
        )
    ) {

        map.removeLayer(
            satellite
        );

    }


    if (
        map.hasLayer(
            street
        )
    ) {

        map.removeLayer(
            street
        );

    }

}


/* =========================================================
   SATELLITE
========================================================= */

document
    .getElementById(
        "satelliteRadio"
    )
    .addEventListener(
        "change",
        function() {

            if (
                this.checked
            ) {

                removeBasemaps();

                satellite.addTo(
                    map
                );


                if (
                    document.getElementById(
                        "orthoCheck"
                    ).checked
                ) {

                    ortho.bringToFront();

                }

            }

        }
    );


/* =========================================================
   STREET
========================================================= */

document
    .getElementById(
        "streetRadio"
    )
    .addEventListener(
        "change",
        function() {

            if (
                this.checked
            ) {

                removeBasemaps();

                street.addTo(
                    map
                );


                if (
                    document.getElementById(
                        "orthoCheck"
                    ).checked
                ) {

                    ortho.bringToFront();

                }

            }

        }
    );


/* =========================================================
   SCALE
========================================================= */

L.control.scale({

    imperial: false,

    metric: true,

    position: "bottomleft"

}).addTo(map);


/* =========================================================
   LEGEND
========================================================= */

const legend =
    L.control({

        position:
            "bottomright"

    });


legend.onAdd =
    function(map) {

        const div =
            L.DomUtil.create(
                "div",
                "legend"
            );


        div.innerHTML =

            "<b>Legenda</b><br>" +

            "<span class='legend-line'></span>" +

            "Garis Pantai";


        return div;

    };


legend.addTo(
    map
);


/* =========================================================
   KOORDINAT KURSOR
========================================================= */

map.on(
    "mousemove",
    function(e) {

        document
            .getElementById(
                "latitude"
            )
            .textContent =
                e.latlng.lat.toFixed(
                    6
                );


        document
            .getElementById(
                "longitude"
            )
            .textContent =
                e.latlng.lng.toFixed(
                    6
                );

    }
);


/* =========================================================
   BACKGROUND SLIDESHOW
========================================================= */

const backgroundPhotos = [

    document.getElementById(
        "bgPhoto1"
    ),

    document.getElementById(
        "bgPhoto2"
    ),

    document.getElementById(
        "bgPhoto3"
    )

];


let activeBackground = 0;


/* =========================================================
   RESET OPACITY
========================================================= */

function resetBackgroundOpacity() {

    backgroundPhotos.forEach(
        function(photo) {

            photo.style.opacity =
                "0.20";

        }
    );

}


/* =========================================================
   SLIDESHOW
========================================================= */

setInterval(
    function() {

        resetBackgroundOpacity();


        activeBackground++;

        if (
            activeBackground >=
            backgroundPhotos.length
        ) {

            activeBackground = 0;

        }


        backgroundPhotos[
            activeBackground
        ].style.opacity =
            "0.035";

    },
    5000
);


/* =========================================================
   FINAL INVALIDATE SIZE
========================================================= */

setTimeout(
    function() {

        map.invalidateSize();

    },
    500
);

</script>

</body>

</html>
