<script
    src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js">
</script>


<script>

/* =========================================================
   INISIALISASI MAP
========================================================= */

const map = L.map(
    "map",
    {
        zoomControl: true,
        maxZoom: 24,
        minZoom: 2
    }
);


/* =========================================================
   BASEMAP ESRI IMAGERY
========================================================= */

const imagery = L.tileLayer(

    "https://server.arcgisonline.com/" +
    "ArcGIS/rest/services/" +
    "World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {
        maxZoom: 24,

        attribution:
            "Tiles © Esri"
    }

);


/* =========================================================
   BASEMAP ESRI STREET
========================================================= */

const street = L.tileLayer(

    "https://server.arcgisonline.com/" +
    "ArcGIS/rest/services/" +
    "World_Street_Map/MapServer/tile/{z}/{y}/{x}",

    {
        maxZoom: 24,

        attribution:
            "Tiles © Esri"
    }

);


/* BASEMAP DEFAULT */

imagery.addTo(map);


/* =========================================================
   PROYEKSI UTM 48S
========================================================= */

proj4.defs(

    "EPSG:32748",

    "+proj=utm " +
    "+zone=48 " +
    "+south " +
    "+datum=WGS84 " +
    "+units=m " +
    "+no_defs"

);


/* =========================================================
   UTM 48S -> WGS84
========================================================= */

function UTM48SToWGS84(
    easting,
    northing
) {

    const result = proj4(

        "EPSG:32748",

        "EPSG:4326",

        [
            Number(easting),
            Number(northing)
        ]

    );


    return {

        lng: result[0],

        lat: result[1]

    };

}


/* =========================================================
   MENCARI KOORDINAT PERTAMA
========================================================= */

function getFirstCoordinate(
    coords
) {

    if (
        !Array.isArray(coords)
    ) {

        return null;

    }


    if (

        coords.length >= 2 &&

        typeof coords[0] === "number" &&

        typeof coords[1] === "number"

    ) {

        return coords;

    }


    for (
        let i = 0;
        i < coords.length;
        i++
    ) {

        const result =
            getFirstCoordinate(
                coords[i]
            );


        if (result) {

            return result;

        }

    }


    return null;

}


/* =========================================================
   DETEKSI CRS DARI METADATA
========================================================= */

function detectCRSFromGeoJSON(
    geojson
) {

    if (
        !geojson ||
        !geojson.crs
    ) {

        return null;

    }


    let crsText = "";


    try {

        if (
            geojson.crs.properties
        ) {

            crsText +=
                " " +
                String(
                    geojson.crs.properties.name ||
                    ""
                );


            crsText +=
                " " +
                String(
                    geojson.crs.properties.href ||
                    ""
                );

        }


        crsText +=
            " " +
            String(
                geojson.crs.name ||
                ""
            );

    }

    catch (error) {

        console.warn(
            "Gagal membaca metadata CRS:",
            error
        );

    }


    crsText =
        crsText.toUpperCase();


    if (

        crsText.includes("EPSG:4326") ||
        crsText.includes("EPSG/0/4326") ||
        crsText.includes("4326") ||
        crsText.includes("WGS84") ||
        crsText.includes("WGS 84")

    ) {

        return "EPSG:4326";

    }


    if (

        crsText.includes("EPSG:32748") ||
        crsText.includes("32748")

    ) {

        return "EPSG:32748";

    }


    return null;

}


/* =========================================================
   DETEKSI CRS BERDASARKAN NILAI KOORDINAT
========================================================= */

function detectCRSFromCoordinates(
    geojson
) {

    let coordinate = null;


    /*
       FeatureCollection
    */

    if (
        geojson.type ===
        "FeatureCollection"
    ) {

        if (
            Array.isArray(
                geojson.features
            )
        ) {

            for (
                let i = 0;
                i < geojson.features.length;
                i++
            ) {

                const feature =
                    geojson.features[i];


                if (
                    feature &&
                    feature.geometry &&
                    feature.geometry.coordinates
                ) {

                    coordinate =
                        getFirstCoordinate(
                            feature.geometry.coordinates
                        );


                    if (coordinate) {

                        break;

                    }

                }

            }

        }

    }


    /*
       Feature
    */

    else if (
        geojson.type ===
        "Feature"
    ) {

        if (
            geojson.geometry &&
            geojson.geometry.coordinates
        ) {

            coordinate =
                getFirstCoordinate(
                    geojson.geometry.coordinates
                );

        }

    }


    /*
       Geometry langsung
    */

    else if (
        geojson.geometry
    ) {

        coordinate =
            getFirstCoordinate(
                geojson.geometry.coordinates
            );

    }


    /*
       Geometry object
       langsung
    */

    else if (
        geojson.coordinates
    ) {

        coordinate =
            getFirstCoordinate(
                geojson.coordinates
            );

    }


    if (!coordinate) {

        return null;

    }


    const x =
        Number(
            coordinate[0]
        );


    const y =
        Number(
            coordinate[1]
        );


    if (
        !isFinite(x) ||
        !isFinite(y)
    ) {

        return null;

    }


    /*
       WGS84 geografis
    */

    if (

        x >= -180 &&
        x <= 180 &&

        y >= -90 &&
        y <= 90

    ) {

        return "EPSG:4326";

    }


    /*
       UTM
    */

    if (

        x >= 100000 &&
        x <= 900000 &&

        y >= 0 &&
        y <= 10000000

    ) {

        return "EPSG:32748";

    }


    return null;

}


/* =========================================================
   DETEKSI CRS
========================================================= */

function detectGeoJSONCRS(
    geojson
) {

    /*
       Metadata diprioritaskan
    */

    const metadataCRS =
        detectCRSFromGeoJSON(
            geojson
        );


    if (metadataCRS) {

        return metadataCRS;

    }


    /*
       Jika tidak ada metadata,
       cek nilai koordinat
    */

    return detectCRSFromCoordinates(
        geojson
    );

}


/* =========================================================
   KONVERSI KOORDINAT
========================================================= */

function convertCoordinates(
    coords,
    sourceCRS
) {

    if (
        !Array.isArray(coords)
    ) {

        return coords;

    }


    /*
       Jika sudah merupakan
       pasangan koordinat
    */

    if (

        coords.length >= 2 &&

        typeof coords[0] === "number" &&

        typeof coords[1] === "number"

    ) {

        if (
            sourceCRS ===
            "EPSG:4326"
        ) {

            return [
                coords[0],
                coords[1]
            ];

        }


        if (
            sourceCRS ===
            "EPSG:32748"
        ) {

            const converted =
                UTM48SToWGS84(
                    coords[0],
                    coords[1]
                );


            return [
                converted.lng,
                converted.lat
            ];

        }


        return [
            coords[0],
            coords[1]
        ];

    }


    /*
       Jika masih berupa array
       nested coordinates
    */

    return coords.map(
        function(item) {

            return convertCoordinates(
                item,
                sourceCRS
            );

        }
    );

}


/* =========================================================
   KONVERSI GEOMETRY
========================================================= */

function convertGeometryToWGS84(
    geometry,
    sourceCRS
) {

    if (
        !geometry
    ) {

        return geometry;

    }


    const result =
        JSON.parse(
            JSON.stringify(
                geometry
            )
        );


    if (
        result.coordinates
    ) {

        result.coordinates =
            convertCoordinates(
                result.coordinates,
                sourceCRS
            );

    }


    return result;

}


/* =========================================================
   KONVERSI FEATURE
========================================================= */

function convertFeatureToWGS84(
    feature,
    sourceCRS
) {

    if (
        !feature
    ) {

        return feature;

    }


    const result =
        JSON.parse(
            JSON.stringify(
                feature
            )
        );


    if (
        result.geometry
    ) {

        result.geometry =
            convertGeometryToWGS84(
                result.geometry,
                sourceCRS
            );

    }


    return result;

}


/* =========================================================
   KONVERSI SEMUA GEOJSON
========================================================= */

function convertGeoJSONToWGS84(
    geojson
) {

    const result =
        JSON.parse(
            JSON.stringify(
                geojson
            )
        );


    const sourceCRS =
        detectGeoJSONCRS(
            result
        );


    console.log(
        "================================================"
    );

    console.log(
        "CRS TERDETEKSI:",
        sourceCRS
    );

    console.log(
        "TIPE GEOJSON:",
        result.type
    );


    /*
       Jika tidak diketahui,
       jangan melakukan konversi
    */

    if (
        !sourceCRS
    ) {

        console.warn(
            "CRS tidak dapat dideteksi. " +
            "Koordinat digunakan apa adanya."
        );

        return result;

    }


    /*
       Sudah WGS84
    */

    if (
        sourceCRS ===
        "EPSG:4326"
    ) {

        console.log(
            "GeoJSON sudah EPSG:4326."
        );

        return result;

    }


    /*
       FeatureCollection
    */

    if (

        result.type ===
        "FeatureCollection"

    ) {

        if (
            Array.isArray(
                result.features
            )
        ) {

            result.features =
                result.features.map(

                    function(feature) {

                        return convertFeatureToWGS84(
                            feature,
                            sourceCRS
                        );

                    }

                );

        }

    }


    /*
       Feature tunggal
    */

    else if (
        result.type ===
        "Feature"
    ) {

        return convertFeatureToWGS84(
            result,
            sourceCRS
        );

    }


    /*
       Geometry langsung
    */

    else if (
        result.coordinates
    ) {

        result.coordinates =
            convertCoordinates(
                result.coordinates,
                sourceCRS
            );

    }


    console.log(
        "Konversi",
        sourceCRS,
        "-> EPSG:4326 selesai."
    );


    return result;

}


/* =========================================================
   STYLE RTK
========================================================= */

function styleRTK() {

    return {

        color: "cyan",

        weight: 3,

        opacity: 1

    };

}


/* =========================================================
   STYLE GARIS PANTAI
========================================================= */

function stylePantai() {

    return {

        color: "#ffd700",

        weight: 3,

        opacity: 1

    };

}


/* =========================================================
   STYLE DIGITASI
========================================================= */

function styleDigitasi() {

    return {

        color: "red",

        weight: 3,

        opacity: 1

    };

}


/* =========================================================
   HIGHLIGHT
========================================================= */

function highlightFeature(e) {

    const layer =
        e.target;


    layer.setStyle({

        color: "orange",

        weight: 4

    });


    if (

        !L.Browser.ie &&
        !L.Browser.opera &&
        !L.Browser.edge

    ) {

        layer.bringToFront();

    }

}


/* =========================================================
   VARIABEL LAYER
========================================================= */

let rtkLayer = null;

let pantaiLayer = null;

let digitasiLayer = null;


/* =========================================================
   EVENT RTK
========================================================= */

function onEachRTK(
    feature,
    layer
) {

    layer.on({

        mouseover:
            highlightFeature,

        mouseout:
            function(e) {

                if (
                    rtkLayer
                ) {

                    rtkLayer.resetStyle(
                        e.target
                    );

                }

            }

    });

}


/* =========================================================
   EVENT PANTAI
========================================================= */

function onEachPantai(
    feature,
    layer
) {

    layer.on({

        mouseover:
            highlightFeature,

        mouseout:
            function(e) {

                if (
                    pantaiLayer
                ) {

                    pantaiLayer.resetStyle(
                        e.target
                    );

                }

            }

    });

}


/* =========================================================
   EVENT DIGITASI
========================================================= */

function onEachDigitasi(
    feature,
    layer
) {

    layer.on({

        mouseover:
            highlightFeature,

        mouseout:

/* =========================================================
   ORTHOPHOTO
========================================================= */

const ORTHO_URL_BASE =

    "https://raw.githubusercontent.com/" +

    "rivaldo123230038-cloud/" +

    "WebGIS-Kemker-Kelompok-1/" +

    "main/" +

    "Fix_Ortho_web/" +

    "_alllayers/";


function toHex(num) {

    return num
        .toString(16)
        .toLowerCase()
        .padStart(8,"0");

}


const OrthoGridLayer =
    L.GridLayer.extend({

        createTile:
            function(
                coords,
                done
            ) {

                const tile =
                    document.createElement(
                        "canvas"
                    );


                const size =
                    this.getTileSize();


                tile.width =
                    size.x;

                tile.height =
                    size.y;


                const ctx =
                    tile.getContext(
                        "2d"
                    );


                const nativeZoom =
                    18;


                const sourceZoom =
                    Math.min(
                        coords.z,
                        nativeZoom
                    );


                let sourceX =
                    coords.x;


                let sourceY =
                    coords.y;


                if (
                    coords.z >
                    nativeZoom
                ) {

                    const factor =
                        Math.pow(
                            2,
                            coords.z -
                            nativeZoom
                        );


                    sourceX =
                        Math.floor(
                            coords.x /
                            factor
                        );


                    sourceY =
                        Math.floor(
                            coords.y /
                            factor
                        );

                }


                const rowHex =
                    toHex(
                        sourceY
                    );


                const colHex =
                    toHex(
                        sourceX
                    );


                const url =

                    ORTHO_URL_BASE +

                    "L" +
                    sourceZoom +
                    "/" +

                    "R" +
                    rowHex +
                    "/" +

                    "C" +
                    colHex +
                    ".png";


                const img =
                    new Image();


                img.crossOrigin =
                    "anonymous";


                img.onload =
                    function() {

                        ctx.drawImage(
                            img,
                            0,
                            0,
                            size.x,
                            size.y
                        );


                        done(
                            null,
                            tile
                        );

                    };


                img.onerror =
                    function() {

                        console.warn(
                            "ORTHO 404:",
                            url
                        );


                        done(
                            null,
                            tile
                        );

                    };


                img.src =
                    url;


                return tile;

            }

    });


const ortho =
    new OrthoGridLayer({

        tileSize: 256,

        opacity: 0.80,

        zIndex: 500,

        noWrap: true,

        minZoom: 11,

        maxNativeZoom: 18,

        maxZoom: 24

    });


/* =========================================================
   AUTO ZOOM
========================================================= */

function updateAutoZoom() {

    /*
       Pastikan layer sudah tersedia
    */

    const activeLayers = [];


    if (

        rtkLayer &&
        map.hasLayer(rtkLayer)

    ) {

        activeLayers.push(
            rtkLayer
        );

    }


    if (

        pantaiLayer &&
        map.hasLayer(pantaiLayer)

    ) {

        activeLayers.push(
            pantaiLayer
        );

    }


    if (

        digitasiLayer &&
        map.hasLayer(digitasiLayer)

    ) {

        activeLayers.push(
            digitasiLayer
        );

    }


    /*
       Tidak ada layer aktif
    */

    if (
        activeLayers.length === 0
    ) {

        alert(
            "Layer garis pantai belum tersedia atau tidak ada yang aktif."
        );

        return;

    }


    /*
       Gabungkan bounds
    */

    let bounds = null;


    activeLayers.forEach(

        function(layer) {

            const layerBounds =
                layer.getBounds();


            if (
                !layerBounds ||
                !layerBounds.isValid()
            ) {

                return;

            }


            if (
                bounds === null
            ) {

                bounds =
                    L.latLngBounds(
                        layerBounds.getSouthWest(),
                        layerBounds.getNorthEast()
                    );

            }

            else {

                bounds.extend(
                    layerBounds
                );

            }

        }

    );


    /*
       Validasi akhir
    */

    if (
        !bounds ||
        !bounds.isValid()
    ) {

        alert(
            "Bounds layer tidak valid."
        );

        console.error(
            "Bounds Auto Zoom:",
            bounds
        );

        return;

    }


    console.log(
        "AUTO ZOOM BOUNDS:",
        bounds
    );


    /*
       Status sidebar
    */

    const sidebar =
        document.getElementById(
            "sidebar"
        );


    const sidebarOpen =
        !sidebar.classList.contains(
            "closed"
        );


    /*
       FIT BOUNDS
    */

    map.fitBounds(

        bounds,

        {

            paddingTopLeft:

                sidebarOpen

                    ? [370, 40]

                    : [40, 40],

            paddingBottomRight:
                [40, 40],

            maxZoom: 24,

            animate: true

        }

    );

}

/* =========================================================

========================================================= */

const backgroundGallery =
    document.querySelector(
        ".background-gallery"
    );


let photoOrder = [

    "photo-1",
    "photo-2",
    "photo-3"

];


function rotateBackgroundPhotos() {

    photoOrder.unshift(
        photoOrder.pop()
    );


    const photos =
        backgroundGallery.querySelectorAll(
            ".background-photo"
        );


    photos.forEach(

        function(photo) {

            const className =
                Array.from(
                    photo.classList
                ).find(

                    function(c) {

                        return c.indexOf(
                            "photo-"
                        ) === 0;

                    }

                );


            photo.style.order =
                photoOrder.indexOf(
                    className
                );

        }

    );

}

    rotateBackgroundPhotos,
    4000
