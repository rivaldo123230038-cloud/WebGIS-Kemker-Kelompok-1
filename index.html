<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>WEBGIS KELOMPOK 1</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js">
</script>

<style>

/* =========================================================
   DASAR
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   SIDEBAR
========================================================= */

#sidebar {

    position: fixed;

    top: 0;
    left: 0;

    width: 350px;
    height: 100vh;

    background: rgba(255,255,255,0.96);

    z-index: 2000;

    box-shadow: 2px 0 8px rgba(0,0,0,0.25);

    overflow-y: auto;

    transition: left 0.3s ease;
}

#sidebar.closed {
    left: -350px;
}


/* =========================================================
   TOMBOL SIDEBAR
========================================================= */

#toggleSidebar {

    position: fixed;

    top: 50%;
    left: 350px;

    transform: translateY(-50%);

    width: 30px;
    height: 60px;

    border: none;

    background: rgba(255,255,255,0.95);

    border-radius: 0 8px 8px 0;

    box-shadow: 2px 2px 6px rgba(0,0,0,0.25);

    cursor: pointer;

    z-index: 2100;

    font-size: 20px;

    transition: left 0.3s ease;
}

#sidebar.closed + #toggleSidebar {
    left: 0;
}


/* =========================================================
   LOGO
========================================================= */

.logo-container {

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 10px;

    padding: 18px 10px 10px 10px;
}

.logo-container img {

    height: 55px;

    width: auto;

    object-fit: contain;
}


/* =========================================================
   JUDUL
========================================================= */

.title-box {

    text-align: center;

    padding: 5px 15px 15px 15px;
}

.title-box h1 {

    margin: 0;

    font-size: 22px;

    font-weight: bold;
}

.title-box p {

    margin: 6px 0 0 0;

    font-size: 13px;

    color: #555;
}


/* =========================================================
   SIDEBAR BODY
========================================================= */

.sidebar-body {

    position: relative;

    min-height: calc(100vh - 120px);

    padding: 10px 15px 30px 15px;

    overflow: hidden;
}


/* =========================================================
   3 FOTO BACKGROUND
========================================================= */

.background-gallery {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    z-index: -2;

    overflow: hidden;
}


.background-photo {

    width: 100%;

    height: 33.333333%;

    flex-shrink: 0;

    background-size: cover;

    background-position: center;

    opacity: 0.20;

    transition: all 1.2s ease-in-out;
}


.photo-1 {
    background-image: url("bcg1.jpeg");
}

.photo-2 {
    background-image: url("bcg2.jpeg");
}

.photo-3 {
    background-image: url("bcg3.jpeg");
}


/* =========================================================
   PANEL
========================================================= */

.panel {

    position: relative;

    z-index: 5;

    background: rgba(255,255,255,0.88);

    border-radius: 8px;

    padding: 12px;

    margin-bottom: 12px;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.12);
}

.panel h3 {

    margin: 0 0 10px 0;

    font-size: 15px;

    border-bottom: 1px solid #ddd;

    padding-bottom: 7px;
}


/* =========================================================
   LAYER
========================================================= */

.layer-item {

    display: flex;

    align-items: center;

    gap: 8px;

    margin: 8px 0;

    font-size: 14px;
}

.layer-item input {

    width: 16px;
    height: 16px;
}


/* =========================================================
   AUTO ZOOM
========================================================= */

#autoZoomBtn {

    width: 100%;

    padding: 9px 10px;

    margin-top: 10px;

    border: none;

    border-radius: 6px;

    background: #1976d2;

    color: white;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;
}

#autoZoomBtn:hover {
    background: #125ea8;
}


/* =========================================================
   BASEMAP
========================================================= */

.basemap-item {

    margin: 8px 0;

    font-size: 14px;
}

.basemap-item input {
    margin-right: 7px;
}


/* =========================================================
   KOORDINAT
========================================================= */

.coordinate-box {

    font-size: 13px;

    line-height: 1.6;
}

.coordinate-value {
    font-weight: bold;
}


/* =========================================================
   MAP
========================================================= */

#map {

    position: fixed;

    top: 0;
    right: 0;
    bottom: 0;
    left: 350px;

    z-index: 1;
}


/* =========================================================
   LEGENDA
========================================================= */

.map-legend {

    position: absolute;

    right: 20px;

    bottom: 20px;

    z-index: 1000;

    min-width: 160px;

    background: rgba(255,255,255,0.92);

    padding: 10px 14px;

    border-radius: 6px;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.25);

    font-size: 13px;
}


.map-legend-heading {

    font-weight: bold;

    font-size: 14px;

    margin-bottom: 8px;

    padding-bottom: 6px;

    border-bottom: 1px solid #ddd;
}


.legend-line {

    display: inline-block;

    width: 30px;

    height: 4px;

    background: cyan;

    margin-right: 7px;

    vertical-align: middle;
}


/* =========================================================
   SCALE
========================================================= */

.leaflet-control-scale {
    margin-bottom: 15px !important;
}

</style>

</head>


<body>


<!-- =========================================================
     SIDEBAR
========================================================= -->

<div id="sidebar">


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <div class="logo-container">

        <img src="ITERA.png" alt="ITERA">

        <img src="Logo_GT.png" alt="Geomatics">

        <img src="LOGO_GT23.png" alt="GT23">

        <img src="LOGO_KEMKER.png" alt="Kemker">

    </div>


    <!-- =====================================================
         JUDUL
    ====================================================== -->

    <div class="title-box">

        <h1>
            WEBGIS KELOMPOK 1
        </h1>

        <p>
            Pemetaan dan Visualisasi Garis Pantai
        </p>

    </div>


    <!-- =====================================================
         SIDEBAR BODY
    ====================================================== -->

    <div class="sidebar-body">


        <!-- =================================================
             3 FOTO BACKGROUND
        ================================================== -->

        <div class="background-gallery">

            <div class="background-photo photo-1"></div>

            <div class="background-photo photo-2"></div>

            <div class="background-photo photo-3"></div>

        </div>


        <!-- =================================================
             LAYER
        ================================================== -->

        <div class="panel">

            <h3>
                LAYER
            </h3>


            <label class="layer-item">

                <input
                    type="checkbox"
                    id="coastlineCheck"
                    checked
                >

                <span>
                    Garis Pantai RTK
                </span>

            </label>


            <label class="layer-item">

                <input
                    type="checkbox"
                    id="orthoCheck"
                >

                <span>
                    Orthophoto
                </span>

            </label>


            <button id="autoZoomBtn">

                Auto Zoom to Layer

            </button>

        </div>


        <!-- =================================================
             BASEMAP
        ================================================== -->

        <div class="panel">

            <h3>
                BASEMAP
            </h3>


            <label class="basemap-item">

                <input
                    type="radio"
                    name="basemap"
                    id="imageryRadio"
                    checked
                >

                Esri World Imagery

            </label>


            <label class="basemap-item">

                <input
                    type="radio"
                    name="basemap"
                    id="streetRadio"
                >

                Esri World Street Map

            </label>

        </div>


        <!-- =================================================
             KOORDINAT
        ================================================== -->

        <div class="panel">

            <h3>
                KOORDINAT
            </h3>


            <div class="coordinate-box">

                <div>
                    Sistem Koordinat:
                    <span class="coordinate-value">
                        WGS 84
                    </span>
                </div>

                <div>
                    Sistem Referensi:
                    <span class="coordinate-value">
                        Geographic Coordinate System
                    </span>
                </div>

                <div>
                    EPSG:
                    <span class="coordinate-value">
                        4326
                    </span>
                </div>

                <br>

                <div>
                    Latitude:
                    <span
                        id="latitudeValue"
                        class="coordinate-value">
                        -
                    </span>
                </div>

                <div>
                    Longitude:
                    <span
                        id="longitudeValue"
                        class="coordinate-value">
                        -
                    </span>
                </div>

            </div>

        </div>


    </div>

</div>


<!-- =========================================================
     TOGGLE SIDEBAR
========================================================= -->

<button id="toggleSidebar">
    ❮
</button>


<!-- =========================================================
     MAP
========================================================= -->

<div id="map"></div>


<!-- =========================================================
     LEGENDA
========================================================= -->

<div class="map-legend">

    <div class="map-legend-heading">
        LEGENDA
    </div>

    <div>

        <span class="legend-line"></span>

        Garis Pantai RTK

    </div>

</div>


<script>

/* =========================================================
   PROYEKSI UTM ZONE 48S
========================================================= */

proj4.defs(
    "EPSG:32748",
    "+proj=utm +zone=48 +south +datum=WGS84 +units=m +no_defs"
);


/* =========================================================
   UTM 48S → WGS84
========================================================= */

function UTM48SToWGS84(
    easting,
    northing
) {

    return proj4(
        "EPSG:32748",
        "EPSG:4326",
        [
            easting,
            northing
        ]
    );

}


/* =========================================================
   KONVERSI KOORDINAT GEOJSON
========================================================= */

function convertCoordinates(coords) {

    if (
        typeof coords[0] === "number" &&
        typeof coords[1] === "number"
    ) {

        const result =
            UTM48SToWGS84(
                coords[0],
                coords[1]
            );

        return [
            result[0],
            result[1]
        ];

    }

    return coords.map(
        convertCoordinates
    );

}


/* =========================================================
   KONVERSI GEOJSON
========================================================= */

function convertGeoJSONToWGS84(geojson) {

    const converted =
        JSON.parse(
            JSON.stringify(
                geojson
            )
        );


    if (
        converted.type ===
        "FeatureCollection"
    ) {

        converted.features.forEach(
            function(feature) {

                if (
                    feature.geometry &&
                    feature.geometry.coordinates
                ) {

                    feature.geometry.coordinates =
                        convertCoordinates(
                            feature.geometry.coordinates
                        );

                }

            }
        );

    }


    else if (
        converted.type ===
        "Feature"
    ) {

        if (
            converted.geometry &&
            converted.geometry.coordinates
        ) {

            converted.geometry.coordinates =
                convertCoordinates(
                    converted.geometry.coordinates
                );

        }

    }


    return converted;

}


/* =========================================================
   MAP
========================================================= */

const map =
    L.map(
        "map",
        {

            center: [
                -5.45,
                105.25
            ],

            zoom: 12,

            minZoom: 0,

            maxZoom: 24,

            zoomControl: true

        }
    );


/* =========================================================
   ESRI WORLD IMAGERY
========================================================= */

const esriImagery =
    L.tileLayer(

        "https://server.arcgisonline.com/ArcGIS/rest/services/" +
        "World_Imagery/MapServer/tile/{z}/{y}/{x}",

        {

            attribution:
                "Tiles © Esri",

            minZoom: 0,

            maxZoom: 24

        }

    );


/* =========================================================
   ESRI WORLD STREET MAP
========================================================= */

const esriStreet =
    L.tileLayer(

        "https://server.arcgisonline.com/ArcGIS/rest/services/" +
        "World_Street_Map/MapServer/tile/{z}/{y}/{x}",

        {

            attribution:
                "Tiles © Esri",

            minZoom: 0,

            maxZoom: 24

        }

    );


/* =========================================================
   BASEMAP DEFAULT
========================================================= */

esriImagery.addTo(map);


/* =========================================================
   GARIS PANTAI
========================================================= */

let coastlineLayer;


/* =========================================================
   LOAD GEOJSON
========================================================= */

fetch(
    "Garis_Pantai_RTK.geojson"
)

.then(
    response =>
        response.json()
)

.then(
    function(data) {


        const convertedData =
            convertGeoJSONToWGS84(
                data
            );


        coastlineLayer =
            L.geoJSON(
                convertedData,
                {

                    style:
                        function() {

                            return {

                                color:
                                    "cyan",

                                weight:
                                    3,

                                opacity:
                                    1

                            };

                        },


                    onEachFeature:
                        function(
                            feature,
                            layer
                        ) {


                            if (
                                feature.properties
                            ) {

                                let popup =
                                    "<b>" +
                                    "Informasi Garis Pantai" +
                                    "</b><br><br>";


                                Object.keys(
                                    feature.properties
                                ).forEach(
                                    function(key) {

                                        popup +=
                                            "<b>" +
                                            key +
                                            ":</b> " +
                                            feature.properties[key] +
                                            "<br>";

                                    }
                                );


                                layer.bindPopup(
                                    popup
                                );

                            }


                            layer.on(
                                "mouseover",
                                function() {

                                    this.setStyle({

                                        color:
                                            "red",

                                        weight:
                                            4

                                    });

                                }
                            );


                            layer.on(
                                "mouseout",
                                function() {

                                    coastlineLayer.resetStyle(
                                        this
                                    );

                                }
                            );

                        }

                }
            )
            .addTo(map);


        /* =============================================
           AUTO ZOOM AWAL
        ============================================== */

        if (
            coastlineLayer &&
            coastlineLayer.getBounds().isValid()
        ) {

            map.fitBounds(
                coastlineLayer.getBounds(),
                {
                    padding: [
                        20,
                        20
                    ]
                }
            );

        }

    }
)

.catch(
    function(error) {

        console.error(
            "Gagal memuat Garis_Pantai_RTK.geojson:",
            error
        );

    }
);


/* =========================================================
   ORTHOPHOTO
========================================================= */

const ORTHO_URL_BASE =
    "https://raw.githubusercontent.com/" +
    "rivaldo123230038-cloud/" +
    "WebGIS-Kemker-Kelompok-1/" +
    "main/" +
    "Fix_Ortho_web/" +
    "_alllayers/";


/* =========================================================
   HEX LOWERCASE
========================================================= */

function toHex(num) {

    return num
        .toString(16)
        .toLowerCase()
        .padStart(
            8,
            "0"
        );

}


/* =========================================================
   CUSTOM ORTHOPHOTO GRID
========================================================= */

const OrthoGridLayer =
    L.GridLayer.extend({

        createTile:
            function(
                coords,
                done
            ) {


                const tile =
                    document.createElement(
                        "canvas"
                    );


                const size =
                    this.getTileSize();


                tile.width =
                    size.x;

                tile.height =
                    size.y;


                const ctx =
                    tile.getContext(
                        "2d"
                    );


                /*
                 * TILE NATIVE DATA:
                 * L11 - L18
                 */

                const nativeZoom =
                    18;


                /*
                 * Gunakan zoom maksimal
                 * yang tersedia.
                 */

                const sourceZoom =
                    Math.min(
                        coords.z,
                        nativeZoom
                    );


                let sourceX =
                    coords.x;

                let sourceY =
                    coords.y;


                /*
                 * Jika zoom > L18,
                 * turunkan indeks tile
                 * ke L18.
                 */

                if (
                    coords.z > nativeZoom
                ) {

                    const factor =
                        Math.pow(
                            2,
                            coords.z -
                            nativeZoom
                        );


                    sourceX =
                        Math.floor(
                            coords.x /
                            factor
                        );


                    sourceY =
                        Math.floor(
                            coords.y /
                            factor
                        );

                }


                /*
                 * HEX LOWERCASE
                 */

                const rowHex =
                    toHex(
                        sourceY
                    );


                const colHex =
                    toHex(
                        sourceX
                    );


                /*
                 * URL TILE
                 *
                 * L18/Rxxxxxxxx/Cxxxxxxxx.png
                 */

                const url =
                    ORTHO_URL_BASE +

                    "L" +
                    sourceZoom +
                    "/" +

                    "R" +
                    rowHex +
                    "/" +

                    "C" +
                    colHex +
                    ".png";


                const img =
                    new Image();


                img.crossOrigin =
                    "anonymous";


                img.onload =
                    function() {


                        /*
                         * Tampilkan tile
                         */

                        ctx.drawImage(
                            img,
                            0,
                            0,
                            size.x,
                            size.y
                        );


                        done(
                            null,
                            tile
                        );

                    };


                img.onerror =
                    function() {

                        console.warn(
                            "Tile orthophoto " +
                            "tidak ditemukan:",
                            url
                        );


                        done(
                            null,
                            tile
                        );

                    };


                img.src =
                    url;


                return tile;

            }

    });


/* =========================================================
   LAYER ORTHOPHOTO
========================================================= */

const ortho =
    new OrthoGridLayer({

        tileSize:
            256,

        opacity:
            0.80,

        zIndex:
            500,

        noWrap:
            true,

        minZoom:
            11,

        maxNativeZoom:
            18,

        maxZoom:
            24

    });


/* =========================================================
   CHECKBOX GARIS PANTAI
========================================================= */

document
    .getElementById(
        "coastlineCheck"
    )
    .addEventListener(
        "change",
        function() {


            if (
                this.checked
            ) {

                if (
                    coastlineLayer &&
                    !map.hasLayer(
                        coastlineLayer
                    )
                ) {

                    coastlineLayer.addTo(
                        map
                    );

                }

            }

            else {

                if (
                    coastlineLayer &&
                    map.hasLayer(
                        coastlineLayer
                    )
                ) {

                    map.removeLayer(
                        coastlineLayer
                    );

                }

            }

        }
    );


/* =========================================================
   CHECKBOX ORTHOPHOTO
========================================================= */

document
    .getElementById(
        "orthoCheck"
    )
    .addEventListener(
        "change",
        function() {


            if (
                this.checked
            ) {

                if (
                    !map.hasLayer(
                        ortho
                    )
                ) {

                    ortho.addTo(
                        map
                    );

                }

            }

            else {

                if (
                    map.hasLayer(
                        ortho
                    )
                ) {

                    map.removeLayer(
                        ortho
                    );

                }

            }

        }
    );


/* =========================================================
   BASEMAP IMAGERY
========================================================= */

document
    .getElementById(
        "imageryRadio"
    )
    .addEventListener(
        "change",
        function() {


            if (
                this.checked
            ) {

                if (
                    map.hasLayer(
                        esriStreet
                    )
                ) {

                    map.removeLayer(
                        esriStreet
                    );

                }


                if (
                    !map.hasLayer(
                        esriImagery
                    )
                ) {

                    esriImagery.addTo(
                        map
                    );

                }

            }

        }
    );


/* =========================================================
   BASEMAP STREET
========================================================= */

document
    .getElementById(
        "streetRadio"
    )
    .addEventListener(
        "change",
        function() {


            if (
                this.checked
            ) {

                if (
                    map.hasLayer(
                        esriImagery
                    )
                ) {

                    map.removeLayer(
                        esriImagery
                    );

                }


                if (
                    !map.hasLayer(
                        esriStreet
                    )
                ) {

                    esriStreet.addTo(
                        map
                    );

                }

            }

        }
    );


/* =========================================================
   AUTO ZOOM
========================================================= */

document
    .getElementById(
        "autoZoomBtn"
    )
    .addEventListener(
        "click",
        function() {


            if (
                coastlineLayer &&
                coastlineLayer.getBounds().isValid()
            ) {

                map.fitBounds(
                    coastlineLayer.getBounds(),
                    {
                        padding: [
                            20,
                            20
                        ]
                    }
                );

            }

        }
    );


/* =========================================================
   KOORDINAT KURSOR
========================================================= */

map.on(
    "mousemove",
    function(e) {


        document
            .getElementById(
                "latitudeValue"
            )
            .textContent =
                e.latlng.lat.toFixed(
                    6
                );


        document
            .getElementById(
                "longitudeValue"
            )
            .textContent =
                e.latlng.lng.toFixed(
                    6
                );

    }
);


/* =========================================================
   TOGGLE SIDEBAR
========================================================= */

const sidebar =
    document.getElementById(
        "sidebar"
    );


const toggleSidebar =
    document.getElementById(
        "toggleSidebar"
    );


toggleSidebar
    .addEventListener(
        "click",
        function() {


            sidebar.classList.toggle(
                "closed"
            );


            if (
                sidebar.classList.contains(
                    "closed"
                )
            ) {

                this.innerHTML =
                    "❯";

            }

            else {

                this.innerHTML =
                    "❮";

            }


            setTimeout(
                function() {

                    map.invalidateSize();

                },
                300
            );

        }
    );


/* =========================================================
   SCALE
========================================================= */

L.control.scale({

    imperial:
        false,

    metric:
        true

}).addTo(map);


/* =========================================================
   ANIMASI 3 FOTO BACKGROUND
========================================================= */

const backgroundGallery =
    document.querySelector(
        ".background-gallery"
    );


let photoOrder = [
    "photo-1",
    "photo-2",
    "photo-3"
];


function rotateBackgroundPhotos() {


    photoOrder.unshift(
        photoOrder.pop()
    );


    const photos =
        backgroundGallery
            .querySelectorAll(
                ".background-photo"
            );


    photos.forEach(
        function(photo) {


            const className =
                Array.from(
                    photo.classList
                ).find(
                    function(c) {

                        return c.indexOf(
                            "photo-"
                        ) === 0;

                    }
                );


            photo.style.order =
                photoOrder.indexOf(
                    className
                );

        }
    );

}


/* =========================================================
   GANTI POSISI SETIAP 4 DETIK
========================================================= */

setInterval(
    rotateBackgroundPhotos,
    4000
);

</script>

</body>

</html>
