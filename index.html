<script>

/* =========================================================
   INISIALISASI MAP
========================================================= */

const map = L.map("map", {

    center: [-5.4, 105.25],

    zoom: 12,

    minZoom: 3,

    maxZoom: 24,

    zoomControl: true

});


/* =========================================================
   BASEMAP
========================================================= */

const esriImagery = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/" +
    "World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {
        maxZoom: 24,

        maxNativeZoom: 19,

        attribution:
        "Tiles © Esri"
    }

);


const esriStreet = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/" +
    "World_Street_Map/MapServer/tile/{z}/{y}/{x}",

    {
        maxZoom: 24,

        maxNativeZoom: 19,

        attribution:
        "Tiles © Esri"
    }

);


/* BASEMAP DEFAULT */

esriImagery.addTo(map);


/* =========================================================
   PROJECTION UTM ZONE 48S
========================================================= */

proj4.defs(

    "EPSG:32748",

    "+proj=utm " +
    "+zone=48 " +
    "+south " +
    "+datum=WGS84 " +
    "+units=m " +
    "+no_defs"

);


function UTM48SToWGS84(

    easting,

    northing

) {

    return proj4(

        "EPSG:32748",

        "EPSG:4326",

        [
            easting,
            northing
        ]

    );

}


/* =========================================================
   CONVERT COORDINATES
========================================================= */

function convertCoordinates(coords) {

    if (

        typeof coords[0] === "number" &&

        typeof coords[1] === "number"

    ) {

        const result = UTM48SToWGS84(

            coords[0],

            coords[1]

        );

        return [

            result[0],

            result[1]

        ];

    }


    return coords.map(

        convertCoordinates

    );

}


/* =========================================================
   CONVERT GEOJSON
========================================================= */

function convertGeoJSONToWGS84(

    geojson

) {

    const converted =

        JSON.parse(

            JSON.stringify(

                geojson

            )

        );


    if (

        converted.type ===

        "FeatureCollection"

    ) {

        converted.features.forEach(

            function(feature) {

                if (

                    feature.geometry &&

                    feature.geometry.coordinates

                ) {

                    feature.geometry.coordinates =

                        convertCoordinates(

                            feature.geometry.coordinates

                        );

                }

            }

        );

    }


    else if (

        converted.type ===

        "Feature"

    ) {

        if (

            converted.geometry &&

            converted.geometry.coordinates

        ) {

            converted.geometry.coordinates =

                convertCoordinates(

                    converted.geometry.coordinates

                );

        }

    }


    return converted;

}


/* =========================================================
   STYLE GARIS
========================================================= */

function styleRTK() {

    return {

        color: "cyan",

        weight: 3,

        opacity: 1
    };

}


function stylePantai() {

    return {

        color: "#ffd700",

        weight: 3,

        opacity: 1
    };

}


function styleDigitasi() {

    return {

        color: "red",

        weight: 3,

        opacity: 1
    };

}


/* =========================================================
   HOVER STYLE
========================================================= */

function addHoverEffect(layer) {

    layer.on({

        mouseover: function(e) {

            e.target.setStyle({

                weight: 4,

                color: "#ff6600"

            });

        },

        mouseout: function(e) {

            e.target.setStyle(

                e.target.defaultStyle

            );

        }

    });

}


/* =========================================================
   VARIABLES LAYER
========================================================= */

let rtkLayer = null;

let pantaiLayer = null;

let digitasiLayer = null;


/* =========================================================
   LOAD GARIS PANTAI RTK
========================================================= */

fetch("Garis_Pantai_RTK.geojson")

.then(function(response) {

    if (!response.ok) {

        throw new Error(

            "Garis_Pantai_RTK.geojson tidak ditemukan"

        );

    }

    return response.json();

})

.then(function(data) {

    const converted =

        convertGeoJSONToWGS84(data);


    rtkLayer = L.geoJSON(

        converted,

        {

            style: function() {

                return styleRTK();

            },

            onEachFeature:

                function(

                    feature,

                    layer

                ) {

                    layer.defaultStyle =

                        styleRTK();

                    addHoverEffect(layer);

                }

        }

    ).addTo(map);


    updateAutoZoom();

})

.catch(function(error) {

    console.error(

        "Error RTK:",

        error

    );

});


/* =========================================================
   LOAD GARIS PANTAI
========================================================= */

fetch("Garis_Pantai.json")

.then(function(response) {

    if (!response.ok) {

        throw new Error(

            "Garis_Pantai.json tidak ditemukan"

        );

    }

    return response.json();

})

.then(function(data) {

    const converted =

        convertGeoJSONToWGS84(data);


    pantaiLayer = L.geoJSON(

        converted,

        {

            style: function() {

                return stylePantai();

            },

            onEachFeature:

                function(

                    feature,

                    layer

                ) {

                    layer.defaultStyle =

                        stylePantai();

                    addHoverEffect(layer);

                }

        }

    ).addTo(map);


    updateAutoZoom();

})

.catch(function(error) {

    console.error(

        "Error Garis Pantai:",

        error

    );

});


/* =========================================================
   LOAD GARIS PANTAI DIGITASI
========================================================= */

fetch("Garis_Pantai_Digitasi.json")

.then(function(response) {

    if (!response.ok) {

        throw new Error(

            "Garis_Pantai_Digitasi.json tidak ditemukan"

        );

    }

    return response.json();

})

.then(function(data) {

    const converted =

        convertGeoJSONToWGS84(data);


    digitasiLayer = L.geoJSON(

        converted,

        {

            style: function() {

                return styleDigitasi();

            },

            onEachFeature:

                function(

                    feature,

                    layer

                ) {

                    layer.defaultStyle =

                        styleDigitasi();

                    addHoverEffect(layer);

                }

        }

    ).addTo(map);


    updateAutoZoom();

})

.catch(function(error) {

    console.error(

        "Error Digitasi:",

        error

    );

});


/* =========================================================
   ORTHOPHOTO
========================================================= */

const ORTHO_URL_BASE =

    "https://raw.githubusercontent.com/" +

    "rivaldo123230038-cloud/" +

    "WebGIS-Kemker-Kelompok-1/" +

    "main/" +

    "Fix_Ortho_web/" +

    "_alllayers/";


function toHex(num) {

    return num

        .toString(16)

        .toLowerCase()

        .padStart(

            8,

            "0"

        );

}


const OrthoGridLayer =

    L.GridLayer.extend({

        createTile:

            function(

                coords,

                done

            ) {

                const tile =

                    document.createElement(

                        "canvas"

                    );


                const size =

                    this.getTileSize();


                tile.width = size.x;

                tile.height = size.y;


                const ctx =

                    tile.getContext(

                        "2d"

                    );


                const nativeZoom = 18;


                const sourceZoom =

                    Math.min(

                        coords.z,

                        nativeZoom

                    );


                let sourceX = coords.x;

                let sourceY = coords.y;


                if (

                    coords.z > nativeZoom

                ) {

                    const factor =

                        Math.pow(

                            2,

                            coords.z -

                            nativeZoom

                        );


                    sourceX =

                        Math.floor(

                            coords.x /

                            factor

                        );


                    sourceY =

                        Math.floor(

                            coords.y /

                            factor

                        );

                }


                const rowHex =

                    toHex(sourceY);


                const colHex =

                    toHex(sourceX);


                const url =

                    ORTHO_URL_BASE +

                    "L" +

                    sourceZoom +

                    "/" +

                    "R" +

                    rowHex +

                    "/" +

                    "C" +

                    colHex +

                    ".png";


                const img =

                    new Image();


                img.crossOrigin =

                    "anonymous";


                img.onload =

                    function() {

                        ctx.drawImage(

                            img,

                            0,

                            0,

                            size.x,

                            size.y

                        );

                        done(

                            null,

                            tile

                        );

                    };


                img.onerror =

                    function() {

                        console.warn(

                            "ORTHO 404:",

                            url

                        );

                        done(

                            null,

                            tile

                        );

                    };


                img.src = url;


                return tile;

            }

    });


const ortho =

    new OrthoGridLayer({

        tileSize: 256,

        opacity: 0.80,

        zIndex: 500,

        noWrap: true,

        minZoom: 11,

        maxNativeZoom: 18,

        maxZoom: 24

    });


/* =========================================================
   LAYER CONTROL CHECKBOX
========================================================= */

document

    .getElementById("rtkCheck")

    .addEventListener(

        "change",

        function() {

            if (!rtkLayer) return;


            if (this.checked) {

                map.addLayer(

                    rtkLayer

                );

            }

            else {

                map.removeLayer(

                    rtkLayer

                );

            }

        }

    );


document

    .getElementById("pantaiCheck")

    .addEventListener(

        "change",

        function() {

            if (!pantaiLayer) return;


            if (this.checked) {

                map.addLayer(

                    pantaiLayer

                );

            }

            else {

                map.removeLayer(

                    pantaiLayer

                );

            }

        }

    );


document

    .getElementById("digitasiCheck")

    .addEventListener(

        "change",

        function() {

            if (!digitasiLayer) return;


            if (this.checked) {

                map.addLayer(

                    digitasiLayer

                );

            }

            else {

                map.removeLayer(

                    digitasiLayer

                );

            }

        }

    );


document

    .getElementById("orthoCheck")

    .addEventListener(

        "change",

        function() {

            if (this.checked) {

                map.addLayer(

                    ortho

                );

            }

            else {

                map.removeLayer(

                    ortho

                );

            }

        }

    );


/* =========================================================
   BASEMAP SWITCH
========================================================= */

document

    .querySelectorAll(

        'input[name="basemap"]'

    )

    .forEach(

        function(radio) {

            radio.addEventListener(

                "change",

                function() {

                    if (!this.checked)

                        return;


                    if (

                        this.value ===

                        "imagery"

                    ) {

                        map.removeLayer(

                            esriStreet

                        );

                        map.addLayer(

                            esriImagery

                        );

                    }


                    if (

                        this.value ===

                        "street"

                    ) {

                        map.removeLayer(

                            esriImagery

                        );

                        map.addLayer(

                            esriStreet

                        );

                    }

                }

            );

        }

    );


/* =========================================================
   AUTO ZOOM
========================================================= */

function updateAutoZoom() {

    const layers = [];


    if (

        rtkLayer &&

        map.hasLayer(rtkLayer)

    ) {

        layers.push(rtkLayer);

    }


    if (

        pantaiLayer &&

        map.hasLayer(pantaiLayer)

    ) {

        layers.push(pantaiLayer);

    }


    if (

        digitasiLayer &&

        map.hasLayer(digitasiLayer)

    ) {

        layers.push(digitasiLayer);

    }


    if (layers.length === 0)

        return;


    let group =

        L.featureGroup(

            layers

        );


    if (group.getBounds().isValid()) {

        map.fitBounds(

            group.getBounds(),

            {

                padding: [

                    30,

                    30

                ],

                maxZoom: 24

            }

        );

    }

}


/* =========================================================
   AUTO ZOOM BUTTON
========================================================= */

document

    .getElementById(

        "autoZoomBtn"

    )

    .addEventListener(

        "click",

        function() {

            updateAutoZoom();

        }

    );


/* =========================================================
   SIDEBAR TOGGLE
========================================================= */

const sidebar =

    document.getElementById(

        "sidebar"

    );


const toggleSidebar =

    document.getElementById(

        "toggleSidebar"

    );


toggleSidebar

    .addEventListener(

        "click",

        function() {

            sidebar.classList.toggle(

                "collapsed"

            );


            if (

                sidebar.classList.contains(

                    "collapsed"

                )

            ) {

                this.innerHTML = "›";

            }

            else {

                this.innerHTML = "‹";

            }


            setTimeout(

                function() {

                    map.invalidateSize();

                },

                400

            );

        }

    );


/* =========================================================
   LIVE COORDINATE
========================================================= */

map.on(

    "mousemove",

    function(e) {

        document

            .getElementById(

                "latitude"

            )

            .textContent =

            e.latlng.lat

                .toFixed(7);


        document

            .getElementById(

                "longitude"

            )

            .textContent =

            e.latlng.lng

                .toFixed(7);

    }

);


/* =========================================================
   SCALE
========================================================= */

L.control.scale({

    imperial: false,

    metric: true,

    position: "bottomleft"

}).addTo(map);


/* =========================================================
   BACKGROUND PHOTO ROTATION
========================================================= */

const backgroundGallery =

    document.querySelector(

        ".background-gallery"

    );


let photoOrder = [

    "photo-1",

    "photo-2",

    "photo-3"

];


function rotateBackgroundPhotos() {

    photoOrder.unshift(

        photoOrder.pop()

    );


    const photos =

        backgroundGallery

            .querySelectorAll(

                ".background-photo"

            );


    photos.forEach(

        function(photo) {

            const className =

                Array.from(

                    photo.classList

                ).find(

                    function(c) {

                        return c.indexOf(

                            "photo-"

                        ) === 0;

                    }

                );


            photo.style.order =

                photoOrder.indexOf(

                    className

                );

        }

    );

}


setInterval(

    rotateBackgroundPhotos,

    4000

);


/* =========================================================
   INITIAL MAP SIZE
========================================================= */

setTimeout(

    function() {

        map.invalidateSize();

    },

    500

);

</script>


</body>

</html>
