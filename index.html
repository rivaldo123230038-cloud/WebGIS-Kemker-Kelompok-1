<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WEBGIS KELOMPOK 1</title>


    <!-- =====================================================
         LEAFLET CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        /* =====================================================
           GLOBAL
        ====================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =====================================================
           MAP
        ====================================================== */

        #map {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            z-index: 1;
        }


        /* =====================================================
           SIDEBAR
        ====================================================== */

        .sidebar {

            position: fixed;

            top: 0;

            left: 0;

            width: 350px;

            height: 100vh;

            background: white;

            z-index: 1000;

            box-shadow:
                3px 0 12px rgba(0,0,0,0.25);

            transition:
                transform 0.35s ease;

            overflow: visible;
        }


        .sidebar.collapsed {

            transform:
                translateX(-350px);
        }


        /* =====================================================
           LOGO SECTION
        ====================================================== */

        .logo-section {

            position: relative;

            width: 350px;

            height: 108px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding:
                10px
                12px;

            z-index: 20;
        }


        .logo-section img {

            width: 72px;

            height: 72px;

            object-fit: contain;

            display: block;
        }


        /* =====================================================
           SIDEBAR BODY
        ====================================================== */

        .sidebar-body {

            position: relative;

            width: 350px;

            height:
                calc(100vh - 108px);

            overflow-y: auto;

            padding:
                18px
                18px
                25px
                18px;

            z-index: 10;
        }


        /* =====================================================
           BACKGROUND FOTO
        ====================================================== */

        .sidebar-body::before {

            content: "";

            position: fixed;

            top: 108px;

            left: 0;

            width: 350px;

            height:
                calc(100vh - 108px);

            background-image:
                url("bcg1.jpeg");

            background-size: contain;

            background-position: center;

            background-repeat: no-repeat;

            opacity: 0.20;

            z-index: -2;

            animation:
                backgroundSlide 18s infinite;
        }


        .sidebar-body::after {

            content: "";

            position: fixed;

            top: 108px;

            left: 0;

            width: 350px;

            height:
                calc(100vh - 108px);

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.78
                );

            z-index: -1;

            pointer-events: none;
        }


        /* =====================================================
           BACKGROUND SLIDESHOW
        ====================================================== */

        @keyframes backgroundSlide {

            0% {

                background-image:
                    url("bcg1.jpeg");
            }

            33% {

                background-image:
                    url("bcg1.jpeg");
            }

            34% {

                background-image:
                    url("bcg2.jpeg");
            }

            66% {

                background-image:
                    url("bcg2.jpeg");
            }

            67% {

                background-image:
                    url("bcg3.jpeg");
            }

            99% {

                background-image:
                    url("bcg3.jpeg");
            }

            100% {

                background-image:
                    url("bcg1.jpeg");
            }
        }


        /* =====================================================
           SIDEBAR TOGGLE
        ====================================================== */

        .sidebar-toggle {

            position: absolute;

            top: 50%;

            right: -36px;

            width: 36px;

            height: 76px;

            transform:
                translateY(-50%);

            background: white;

            border: none;

            border-radius:
                0
                8px
                8px
                0;

            box-shadow:
                3px 0 8px
                rgba(0,0,0,0.20);

            cursor: pointer;

            font-size: 23px;

            font-weight: bold;

            z-index: 2000;
        }


        .sidebar-toggle:hover {

            background:
                #f1f1f1;
        }


        /* =====================================================
           TITLE
        ====================================================== */

        .webgis-title {

            text-align: center;

            font-size: 22px;

            font-weight: bold;

            margin:
                2px
                0
                20px
                0;

            color: #111;
        }


        /* =====================================================
           SECTION
        ====================================================== */

        .section {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.88
                );

            border-radius: 8px;

            padding:
                13px
                14px;

            margin-bottom: 14px;

            box-shadow:
                0
                2px
                8px
                rgba(0,0,0,0.12);
        }


        .section-title {

            font-size: 15px;

            font-weight: bold;

            margin-bottom: 10px;

            color: #222;
        }


        /* =====================================================
           CONTROL
        ====================================================== */

        .control-item {

            display: flex;

            align-items: center;

            gap: 8px;

            margin: 8px 0;

            font-size: 14px;

            cursor: pointer;
        }


        .control-item input {

            cursor: pointer;
        }


        /* =====================================================
           BUTTON
        ====================================================== */

        .zoom-button {

            width: 100%;

            padding: 10px;

            margin-top: 4px;

            border: none;

            border-radius: 6px;

            background:
                #198754;

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;
        }


        .zoom-button:hover {

            background:
                #146c43;
        }


        /* =====================================================
           COORDINATE BOX
        ====================================================== */

        .coordinate-box {

            background:
                rgba(
                    245,
                    245,
                    245,
                    0.95
                );

            border-radius: 5px;

            padding:
                8px
                10px;

            font-size: 13px;

            line-height: 1.6;
        }


        /* =====================================================
           FOOTER
        ====================================================== */

        .footer {

            margin-top: 18px;

            text-align: center;

            font-size: 11px;

            color: #444;

            line-height: 1.5;
        }


        /* =====================================================
           AUTO ZOOM MAP CONTROL
        ====================================================== */

        .auto-zoom-control {

            background: white;

            border-radius: 5px;

            box-shadow:
                0
                1px
                5px
                rgba(0,0,0,0.4);

            overflow: hidden;
        }


        .auto-zoom-control button {

            width: 40px;

            height: 40px;

            border: none;

            background: white;

            cursor: pointer;

            font-size: 20px;
        }


        .auto-zoom-control button:hover {

            background:
                #f0f0f0;
        }


        /* =====================================================
           LEGEND
        ====================================================== */

        .legend {

            position: fixed;

            right: 20px;

            bottom: 25px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.94
                );

            padding:
                10px
                13px;

            border-radius: 6px;

            box-shadow:
                0
                1px
                6px
                rgba(0,0,0,0.25);

            font-size: 13px;

            z-index: 900;
        }


        .legend-title {

            font-weight: bold;

            margin-bottom: 7px;
        }


        .legend-line {

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .legend-symbol {

            width: 35px;

            height: 4px;

            background: cyan;
        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 600px) {

            .sidebar {

                width: 310px;
            }


            .sidebar.collapsed {

                transform:
                    translateX(-310px);
            }


            .sidebar-body,
            .logo-section {

                width: 310px;
            }


            .sidebar-body::before,
            .sidebar-body::after {

                width: 310px;
            }


            .sidebar-toggle {

                right: -32px;

                width: 32px;
            }


            .logo-section img {

                width: 62px;

                height: 62px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAP
    ====================================================== -->

    <div id="map"></div>


    <!-- =====================================================

    ====================================================== -->

    <div

        id="sidebar"
    >


        <!-- =================================================
             LOGOS
        ================================================== -->

        <div class="logo-section">

            <img
                src="ITERA.png"

            >

            <img
                src="Logo_GT.png"

            >

            >

        <!-- =================================================

        ================================================== -->

        <div class="sidebar-body">


            <div class="webgis-title">

        </div>


        <!-- =================================================

        <button

        </button>

    </div>


    <!-- =====================================================
         LEGEND
    ====================================================== -->

    <div class="legend">

        <div class="legend-title">

            Legenda

        </div>


        <div class="legend-line">

            <div class="legend-symbol"></div>

            <span>

                Garis Pantai

            </span>

        </div>

    </div>


    <!-- =====================================================
         LEAFLET JS
    ====================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- =====================================================
         GOOGLE MAPS
         
         GANTI API KEY
    ====================================================== -->

    <script
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"
    ></script>


    <!-- =====================================================
         GOOGLE MUTANT
    ====================================================== -->

    <script
        src="https://unpkg.com/leaflet.gridlayer.googlemutant@0.16.0/Leaflet.GoogleMutant.js"
    ></script>


    <script>


        /* =====================================================
           MAP
        ====================================================== */

        const map = L.map(
            "map",
            {

                center:
                    [-5.4, 105.3],

                zoom:
                    10,

                minZoom:
                    0,

                maxZoom:
                    23,

                zoomControl:
                    true

            }
        );


        /* =====================================================
           ESRI WORLD IMAGERY
        ====================================================== */

        const esriImagery =
            L.tileLayer(

                "https://server.arcgisonline.com/" +
                "ArcGIS/rest/services/" +
                "World_Imagery/MapServer/tile/{z}/{y}/{x}",

                {

                    maxZoom:
                        19,

                    attribution:
                        "Tiles &copy; Esri"

                }

            );


        /* =====================================================
           GOOGLE SATELLITE
        ====================================================== */

        const googleSatellite =
            L.gridLayer.googleMutant(

                {

                    type:
                        "satellite",

                    maxZoom:
                        23

                }

            );


        /* =====================================================
           ESRI WORLD STREET MAP
        ====================================================== */

        const esriStreet =
            L.tileLayer(

                "https://server.arcgisonline.com/" +
                "ArcGIS/rest/services/" +
                "World_Street_Map/MapServer/tile/{z}/{y}/{x}",

                {

                    maxZoom:
                        19,

                    attribution:
                        "Tiles &copy; Esri"

                }

            );


        /* =====================================================
           ORTHOPHOTO ARC MAP EXPLODED CACHE

           TEST LEVEL:
           L12
           L13
           L14
           L15
           L16
           L17

           STRUKTUR:

           Fix_Ortho_web/
           └── _alllayers/
               ├── L12/
               │   └── Rxxxxxxxx/
               │       └── Cxxxxxxxx.png
               ├── L13/
               ├── L14/
               ├── L15/
               ├── L16/
               └── L17/
        ====================================================== */


        let orthoLoaded =
            false;


        let orthoErrorCount =
            0;


        const orthoLayer =
            L.tileLayer(
                "",
                {

                    tileSize:
                        256,

                    minZoom:
                        12,

                    maxZoom:
                        17,

                    minNativeZoom:
                        12,

                    maxNativeZoom:
                        17,

                    opacity:
                        1,

                    noWrap:
                        true,

                    attribution:
                        "Orthophoto"

                }
            );


        /* =====================================================
           CUSTOM TILE URL

           ArcMap:

           R + ROW HEX
           C + COLUMN HEX

           Contoh:

           R0000083f
           C00000cad.png
        ====================================================== */

        orthoLayer.getTileUrl =
            function(coords) {


                const z =
                    coords.z;


                const x =
                    coords.x;


                const y =
                    coords.y;


                /* ---------------------------------------------
                   HANYA L12 - L17
                --------------------------------------------- */

                if (
                    z < 12 ||
                    z > 17
                ) {

                    return "";

                }


                /* ---------------------------------------------
                   CEGAH INDEX NEGATIF
                --------------------------------------------- */

                if (
                    x < 0 ||
                    y < 0
                ) {

                    return "";

                }


                /* ---------------------------------------------
                   KONVERSI ROW KE HEX
                --------------------------------------------- */

                const rowHex =
                    Math.floor(y)
                        .toString(16)
                        .padStart(
                            8,
                            "0"
                        )
                        .toLowerCase();


                /* ---------------------------------------------
                   KONVERSI COLUMN KE HEX
                --------------------------------------------- */

                const colHex =
                    Math.floor(x)
                        .toString(16)
                        .padStart(
                            8,
                            "0"
                        )
                        .toLowerCase();


                /* ---------------------------------------------
                   URL FINAL

                   Fix_Ortho_web/
                   _alllayers/
                   L17/
                   Rxxxxxxxx/
                   Cxxxxxxxx.png
                --------------------------------------------- */

                const url =

                    "Fix_Ortho_web/" +
                    "_alllayers/" +
                    "L" + z +
                    "/" +
                    "R" + rowHex +
                    "/" +
                    "C" + colHex +
                    ".png";


                console.log(
                    "ORTHO TILE REQUEST:",
                    url
                );


                return url;

            };


        /* =====================================================
           DEFAULT BASEMAP
        ====================================================== */

        esriImagery.addTo(
            map
        );


        /* =====================================================
           GARIS PANTAI
        ====================================================== */

        let coastlineLayer =
            L.layerGroup();


        let coastlineBounds =
            null;


        /* =====================================================
           LOAD GP_RT.JSON
        ====================================================== */

        fetch(
            "GP_RT.json"
        )

        .then(
            function(response) {

                if (
                    !response.ok
                ) {

                    throw new Error(
                        "GP_RT.json tidak ditemukan"
                    );

                }


                return response.json();

            }
        )

        .then(
            function(data) {


                if (
                    !data ||
                    !data.features ||
                    data.features.length === 0
                ) {

                    console.warn(
                        "Tidak ada feature di GP_RT.json"
                    );

                    return;

                }


                data.features.forEach(
                    function(feature) {


                        if (
                            !feature.geometry ||
                            !feature.geometry.paths
                        ) {

                            return;

                        }


                        feature.geometry.paths.forEach(
                            function(path) {


                                /* ---------------------------------
                                   ESRI [X,Y]
                                   Leaflet [LAT,LNG]
                                --------------------------------- */

                                const latLngs =
                                    path.map(
                                        function(point) {

                                            return [
                                                point[1],
                                                point[0]
                                            ];

                                        }
                                    );


                                /* ---------------------------------
                                   GARIS
                                --------------------------------- */

                                const line =
                                    L.polyline(
                                        latLngs,
                                        {

                                            color:
                                                "cyan",

                                            weight:
                                                3,

                                            opacity:
                                                1,

                                            smoothFactor:
                                                1

                                        }
                                    );


                                /* ---------------------------------
                                   POPUP
                                --------------------------------- */

                                let popupHTML =
                                    "<div " +
                                    "style='min-width:200px'>";


                                popupHTML +=
                                    "<b>Garis Pantai</b>" +
                                    "<br><br>";


                                if (
                                    feature.attributes
                                ) {


                                    Object.keys(
                                        feature.attributes
                                    ).forEach(
                                        function(key) {


                                            const value =
                                                feature
                                                .attributes
                                                [key];


                                            popupHTML +=

                                                "<b>" +
                                                key +
                                                ":</b> " +
                                                value +
                                                "<br>";

                                        }
                                    );

                                }


                                popupHTML +=
                                    "</div>";


                                line.bindPopup(
                                    popupHTML
                                );


                                /* ---------------------------------
                                   HOVER
                                --------------------------------- */

                                line.on(
                                    "mouseover",
                                    function() {

                                        this.setStyle(
                                            {

                                                color:
                                                    "red",

                                                weight:
                                                    6

                                            }
                                        );

                                    }
                                );


                                line.on(
                                    "mouseout",
                                    function() {

                                        this.setStyle(
                                            {

                                                color:
                                                    "cyan",

                                                weight:
                                                    3

                                            }
                                        );

                                    }
                                );


                                coastlineLayer.addLayer(
                                    line
                                );

                            }
                        );

                    }
                );


                /* ---------------------------------
                   ADD TO MAP
                --------------------------------- */

                coastlineLayer.addTo(
                    map
                );


                /* ---------------------------------
                   BOUNDS
                --------------------------------- */

                coastlineBounds =
                    coastlineLayer.getBounds();


                if (
                    coastlineBounds &&
                    coastlineBounds.isValid()
                ) {

                    map.fitBounds(
                        coastlineBounds,
                        {

                            padding:
                                [40, 40],

                            maxZoom:
                                16

                        }
                    );

                }

            }
        )

        .catch(
            function(error) {

                console.error(
                    "Gagal membaca GP_RT.json:",
                    error
                );

            }
        );


        /* =====================================================
           CHECKBOX GARIS PANTAI
        ====================================================== */

        document
            .getElementById(
                "coastlineCheck"
            )
            .addEventListener(
                "change",
                function() {


                    if (
                        this.checked
                    ) {


                        if (
                            !map.hasLayer(
                                coastlineLayer
                            )
                        ) {

                            coastlineLayer.addTo(
                                map
                            );

                        }

                    }

                    else {


                        if (
                            map.hasLayer(
                                coastlineLayer
                            )
                        ) {

                            map.removeLayer(
                                coastlineLayer
                            );

                        }

                    }

                }
            );


        /* =====================================================
           AUTO ZOOM SIDEBAR
        ====================================================== */

        document
            .getElementById(
                "zoomToLayerButton"
            )
            .addEventListener(
                "click",
                function() {


                    if (
                        coastlineBounds &&
                        coastlineBounds.isValid()
                    ) {


                        map.fitBounds(
                            coastlineBounds,
                            {

                                padding:
                                    [40, 40],

                                maxZoom:
                                    16

                            }
                        );

                    }

                }
            );


        /* =====================================================
           AUTO ZOOM BUTTON MAP
        ====================================================== */

        const AutoZoomControl =
            L.Control.extend(

                {

                    options:
                        {
                            position:
                                "topright"
                        },


                    onAdd:
                        function() {


                            const container =
                                L.DomUtil.create(
                                    "div",
                                    "auto-zoom-control"
                                );


                            const button =
                                L.DomUtil.create(
                                    "button",
                                    "",
                                    container
                                );


                            button.innerHTML =
                                "⌖";


                            button.title =
                                "Zoom ke Garis Pantai";


                            L.DomEvent
                                .disableClickPropagation(
                                    container
                                );


                            L.DomEvent.on(
                                button,
                                "click",
                                function() {


                                    if (
                                        coastlineBounds &&
                                        coastlineBounds.isValid()
                                    ) {


                                        map.fitBounds(
                                            coastlineBounds,
                                            {

                                                padding:
                                                    [40, 40],

                                                maxZoom:
                                                    16

                                            }
                                        );

                                    }

                                }
                            );


                            return container;

                        }

                }
            );


        map.addControl(
            new AutoZoomControl()
        );


        /* =====================================================
           FUNGSI HAPUS BASEMAP
        ====================================================== */

        function removeAllBaseMaps() {


            if (
                map.hasLayer(
                    esriImagery
                )
            ) {

                map.removeLayer(
                    esriImagery
                );

            }


            if (
                map.hasLayer(
                    googleSatellite
                )
            ) {

                map.removeLayer(
                    googleSatellite
                );

            }


            if (
                map.hasLayer(
                    esriStreet
                )
            ) {

                map.removeLayer(
                    esriStreet
                );

            }


            if (
                map.hasLayer(
                    orthoLayer
                )
            ) {

                map.removeLayer(
                    orthoLayer
                );

            }

        }


        /* =====================================================
           BASEMAP SWITCHING
        ====================================================== */

        document
            .querySelectorAll(
                'input[name="basemap"]'
            )
            .forEach(
                function(radio) {


                    radio.addEventListener(
                        "change",
                        function() {


                            if (
                                !this.checked
                            ) {

                                return;

                            }


                            /* =================================
                               ESRI WORLD IMAGERY
                            ================================== */

                            if (
                                this.value ===
                                "esri"
                            ) {


                                removeAllBaseMaps();


                                esriImagery.addTo(
                                    map
                                );

                            }


                            /* =================================
                               GOOGLE
                            ================================== */

                            else if (
                                this.value ===
                                "google"
                            ) {


                                removeAllBaseMaps();


                                googleSatellite.addTo(
                                    map
                                );

                            }


                            /* =================================
                               STREET
                            ================================== */

                            else if (
                                this.value ===
                                "street"
                            ) {


                                removeAllBaseMaps();


                                esriStreet.addTo(
                                    map
                                );

                            }


                            /* =================================
                               ORTHOPHOTO
                            ================================== */

                            else if (
                                this.value ===
                                "ortho"
                            ) {


                                /* ------------------------------
                                   RESET STATUS
                                ------------------------------ */

                                orthoLoaded =
                                    false;


                                orthoErrorCount =
                                    0;


                                /* ------------------------------
                                   HAPUS BASEMAP LAIN
                                ------------------------------ */

                                removeAllBaseMaps();


                                /*
                                 * ESRI DIGUNAKAN SEBAGAI
                                 * BACKGROUND SEMENTARA.
                                 *
                                 * Ini sengaja supaya map
                                 * tidak menjadi abu-abu jika
                                 * tile Orthophoto belum ketemu.
                                 */

                                esriImagery.addTo(
                                    map
                                );


                                /*
                                 * Orthophoto ditaruh di atas
                                 */

                                orthoLayer.addTo(
                                    map
                                );


                                /*
                                 * Pastikan Leaflet
                                 * menggambar ulang
                                 */

                                orthoLayer.bringToFront();


                                console.log(
                                    "ORTHOPHOTO AKTIF"
                                );

                                console.log(
                                    "LEVEL: L12-L17"
                                );

                            }

                        }
                    );

                }
            );


        /* =====================================================
           ORTHOPHOTO TILE LOAD
        ====================================================== */

        orthoLayer.on(
            "tileload",
            function(e) {


                console.log(
                    "ORTHO TILE BERHASIL:",
                    e.coords
                );


                /*
                 * Kalau setidaknya ada satu tile
                 * yang berhasil dimuat,
                 * Esri dilepas.
                 */

                if (
                    !orthoLoaded
                ) {


                    orthoLoaded =
                        true;


                    if (
                        map.hasLayer(
                            esriImagery
                        )
                    ) {

                        map.removeLayer(
                            esriImagery
                        );

                    }


                    /*
                     * Pastikan Orthophoto
                     * berada di atas.
                     */

                    if (
                        !map.hasLayer(
                            orthoLayer
                        )
                    ) {

                        orthoLayer.addTo(
                            map
                        );

                    }


                    orthoLayer.bringToFront();


                    console.log(
                        "ORTHOPHOTO BERHASIL DIMUAT."
                    );

                }

            }
        );


        /* =====================================================
           ORTHOPHOTO TILE ERROR
        ====================================================== */

        orthoLayer.on(
            "tileerror",
            function(e) {


                orthoErrorCount++;


                console.error(
                    "ORTHO TILE GAGAL:",
                    e.coords
                );


                console.error(
                    "Jumlah tile gagal:",
                    orthoErrorCount
                );


                /*
                 * Esri TETAP DIBIARKAN
                 * sebagai fallback.
                 */

            }
        );


        /* =====================================================
           KOORDINAT KURSOR
        ====================================================== */

        map.on(
            "mousemove",
            function(e) {


                document
                    .getElementById(
                        "latValue"
                    )
                    .textContent =
                    e.latlng.lat
                        .toFixed(6);


                document
                    .getElementById(
                        "lngValue"
                    )
                    .textContent =
                    e.latlng.lng
                        .toFixed(6);

            }
        );


        /* =====================================================
           SIDEBAR TOGGLE
        ====================================================== */

        const sidebar =
            document.getElementById(
                "sidebar"
            );


        const sidebarToggle =
            document.getElementById(
                "sidebarToggle"
            );


        sidebarToggle.addEventListener(
            "click",
            function() {


                sidebar.classList.toggle(
                    "collapsed"
                );


                if (
                    sidebar.classList.contains(
                        "collapsed"
                    )
                ) {


                    sidebarToggle.innerHTML =
                        "▶";

                }

                else {


                    sidebarToggle.innerHTML =
                        "◀";

                }


                setTimeout(
                    function() {

                        map.invalidateSize();

                    },
                    350
                );

            }
        );


        /* =====================================================
           INITIAL STATE
        ====================================================== */

        document
            .querySelector(
                'input[name="basemap"][value="esri"]'
            )
            .checked = true;


    </script>

</body>

</html>
