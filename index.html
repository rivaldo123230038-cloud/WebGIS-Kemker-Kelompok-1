<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>WEBGIS KELOMPOK 1</title>

<!-- =========================================================
     LEAFLET
========================================================= -->

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<!-- =========================================================
     PROJ4
========================================================= -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js">
</script>


<style>

/* =========================================================
   DASAR
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   SIDEBAR
========================================================= */

#sidebar {

    position: fixed;

    top: 0;
    left: 0;

    width: 350px;
    height: 100vh;

    background: rgba(255,255,255,0.96);

    z-index: 2000;

    box-shadow: 2px 0 8px rgba(0,0,0,0.25);

    overflow-y: auto;

    transition: left 0.3s ease;
}


/* =========================================================
   SIDEBAR SAAT DITUTUP
========================================================= */

#sidebar.closed {

    left: -350px;

}


/* =========================================================
   TOMBOL SIDEBAR
========================================================= */

#toggleSidebar {

    position: fixed;

    top: 50%;
    left: 350px;

    transform: translateY(-50%);

    width: 30px;
    height: 60px;

    border: none;

    background: rgba(255,255,255,0.95);

    border-radius: 0 8px 8px 0;

    box-shadow: 2px 2px 6px rgba(0,0,0,0.25);

    cursor: pointer;

    z-index: 2100;

    font-size: 20px;

    transition: left 0.3s ease;
}


#sidebar.closed + #toggleSidebar {

    left: 0;

}


/* =========================================================
   BAGIAN LOGO
========================================================= */

.logo-container {

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 10px;

    padding: 18px 10px 10px 10px;

}

.logo-container img {

    height: 55px;

    width: auto;

    object-fit: contain;

}


/* =========================================================
   JUDUL
========================================================= */

.title-box {

    text-align: center;

    padding: 5px 15px 15px 15px;

}

.title-box h1 {

    margin: 0;

    font-size: 22px;

    font-weight: bold;

}

.title-box p {

    margin: 6px 0 0 0;

    font-size: 13px;

    color: #555;

}


/* =========================================================
   BACKGROUND SIDEBAR
========================================================= */

.sidebar-body {

    position: relative;

    min-height: calc(100vh - 120px);

    padding: 10px 15px 30px 15px;

    overflow: hidden;

}


.sidebar-body::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:
        url("bcg1.jpeg");

    background-size: cover;

    background-position: center;

    opacity: 0.20;

    z-index: -1;

}


/* =========================================================
   PANEL
========================================================= */

.panel {

    background: rgba(255,255,255,0.88);

    border-radius: 8px;

    padding: 12px;

    margin-bottom: 12px;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.12);

}

.panel h3 {

    margin: 0 0 10px 0;

    font-size: 15px;

    border-bottom: 1px solid #ddd;

    padding-bottom: 7px;

}


/* =========================================================
   CHECKBOX LAYER
========================================================= */

.layer-item {

    display: flex;

    align-items: center;

    gap: 8px;

    margin: 8px 0;

    font-size: 14px;

}

.layer-item input {

    width: 16px;
    height: 16px;

}


/* =========================================================
   TOMBOL AUTO ZOOM
========================================================= */

#autoZoomBtn {

    width: 100%;

    padding: 9px 10px;

    margin-top: 10px;

    border: none;

    border-radius: 6px;

    background: #1976d2;

    color: white;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

}

#autoZoomBtn:hover {

    background: #125ea8;

}


/* =========================================================
   BASEMAP
========================================================= */

.basemap-item {

    margin: 8px 0;

    font-size: 14px;

}

.basemap-item input {

    margin-right: 7px;

}


/* =========================================================
   MAP
========================================================= */

#map {

    position: fixed;

    top: 0;
    right: 0;
    bottom: 0;
    left: 350px;

    z-index: 1;

    max-width: none;

}


/* =========================================================
   LEGENDA PETA
========================================================= */

.map-legend {

    position: absolute;

    right: 20px;

    bottom: 20px;

    z-index: 1000;

    min-width: 150px;

    background: rgba(255,255,255,0.92);

    padding: 10px 14px;

    border-radius: 6px;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.25);

    font-size: 13px;

}


.map-legend-heading {

    font-weight: bold;

    font-size: 14px;

    margin-bottom: 8px;

    padding-bottom: 6px;

    border-bottom: 1px solid #ddd;

}


.legend-line {

    display: inline-block;

    width: 30px;

    height: 4px;

    background: cyan;

    margin-right: 7px;

    vertical-align: middle;

}


/* =========================================================
   LEAFLET
========================================================= */

.leaflet-control-scale {

    margin-bottom: 15px !important;

}

</style>

</head>


<body>


<!-- =========================================================
     SIDEBAR
========================================================= -->

<div id="sidebar">


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <div class="logo-container">

        <img src="ITERA.png" alt="ITERA">

        <img src="Logo_GT.png" alt="Geomatics">

        <img src="LOGO_GT23.png" alt="GT23">

        <img src="LOGO_KEMKER.png" alt="Kemker">

    </div>


    <!-- =====================================================
         JUDUL
    ====================================================== -->

    <div class="title-box">

        <h1>
            WEBGIS KELOMPOK 1
        </h1>

        <p>
            Pemetaan dan Visualisasi Garis Pantai
        </p>

    </div>


    <div class="sidebar-body">


        <!-- =================================================
             LAYER
        ================================================== -->

        <div class="panel">

            <h3>
                LAYER
            </h3>


            <label class="layer-item">

                <input
                    type="checkbox"
                    id="coastlineCheck"
                    checked
                >

                <span>
                    Garis Pantai RTK
                </span>

            </label>


            <label class="layer-item">

                <input
                    type="checkbox"
                    id="orthoCheck"
                >

                <span>
                    Orthophoto
                </span>

            </label>


            <!-- =============================================
                 AUTO ZOOM
            ============================================== -->

            <button id="autoZoomBtn">

                Auto Zoom to Layer

            </button>

        </div>



        <!-- =================================================
             BASEMAP
        ================================================== -->

        <div class="panel">

            <h3>
                BASEMAP
            </h3>


            <label class="basemap-item">

                <input
                    type="radio"
                    name="basemap"
                    id="imageryRadio"
                    checked
                >

                Esri World Imagery

            </label>


            <label class="basemap-item">

                <input
                    type="radio"
                    name="basemap"
                    id="streetRadio"
                >

                Esri World Street Map

            </label>

        </div>


    </div>

</div>



<!-- =========================================================
     TOGGLE SIDEBAR
========================================================= -->

<button id="toggleSidebar">

    ❮

</button>



<!-- =========================================================
     MAP
========================================================= -->

<div id="map"></div>



<!-- =========================================================
     LEGENDA
========================================================= -->

<div class="map-legend">

    <div class="map-legend-heading">

        LEGENDA

    </div>

    <div>

        <span class="legend-line"></span>

        Garis Pantai RTK

    </div>

</div>



<script>

/* =========================================================
   PROYEKSI UTM ZONE 48S
========================================================= */

proj4.defs(
    "EPSG:32748",
    "+proj=utm +zone=48 +south +datum=WGS84 +units=m +no_defs"
);


/* =========================================================
   FUNGSI UTM 48S → WGS84
========================================================= */

function UTM48SToWGS84(easting, northing) {

    return proj4(
        "EPSG:32748",
        "EPSG:4326",
        [easting, northing]
    );

}


/* =========================================================
   KONVERSI KOORDINAT GEOJSON
========================================================= */

function convertCoordinates(coords) {

    if (
        typeof coords[0] === "number" &&
        typeof coords[1] === "number"
    ) {

        const result =
            UTM48SToWGS84(
                coords[0],
                coords[1]
            );

        return [
            result[0],
            result[1]
        ];

    }

    return coords.map(
        convertCoordinates
    );

}


/* =========================================================
   KONVERSI GEOJSON
========================================================= */

function convertGeoJSONToWGS84(geojson) {

    const converted =
        JSON.parse(
            JSON.stringify(geojson)
        );


    if (converted.type === "FeatureCollection") {

        converted.features.forEach(
            function(feature) {

                if (
                    feature.geometry &&
                    feature.geometry.coordinates
                ) {

                    feature.geometry.coordinates =
                        convertCoordinates(
                            feature.geometry.coordinates
                        );

                }

            }
        );

    }


    else if (
        converted.type === "Feature"
    ) {

        if (
            converted.geometry &&
            converted.geometry.coordinates
        ) {

            converted.geometry.coordinates =
                convertCoordinates(
                    converted.geometry.coordinates
                );

        }

    }


    return converted;

}


/* =========================================================
   MAP
========================================================= */

const map = L.map(
    "map",
    {

        center: [
            -5.45,
            105.25
        ],

        zoom: 12,

        minZoom: 0,

        maxZoom: 24,

        zoomControl: true

    }
);


/* =========================================================
   BASEMAP ESRI IMAGERY
========================================================= */

const esriImagery =
    L.tileLayer(

        "https://server.arcgisonline.com/ArcGIS/rest/services/" +
        "World_Imagery/MapServer/tile/{z}/{y}/{x}",

        {

            attribution:
                "Tiles © Esri",

            minZoom: 0,

            maxZoom: 24

        }

    );


/* =========================================================
   BASEMAP ESRI STREET
========================================================= */

const esriStreet =
    L.tileLayer(

        "https://server.arcgisonline.com/ArcGIS/rest/services/" +
        "World_Street_Map/MapServer/tile/{z}/{y}/{x}",

        {

            attribution:
                "Tiles © Esri",

            minZoom: 0,

            maxZoom: 24

        }

    );


/* =========================================================
   BASEMAP DEFAULT
========================================================= */

esriImagery.addTo(map);


/* =========================================================
   GARIS PANTAI
========================================================= */

let coastlineLayer;


/* =========================================================
   LOAD GEOJSON
========================================================= */

fetch(
    "Garis_Pantai_RTK.geojson"
)

.then(
    response => response.json()
)

.then(
    function(data) {


        const convertedData =
            convertGeoJSONToWGS84(
                data
            );


        coastlineLayer =
            L.geoJSON(
                convertedData,
                {

                    style:
                        function() {

                            return {

                                color: "cyan",

                                weight: 3,

                                opacity: 1

                            };

                        },


                    onEachFeature:
                        function(
                            feature,
                            layer
                        ) {


                            /* =========================
                               POPUP
                            ========================== */

                            if (
                                feature.properties
                            ) {

                                let popup =
                                    "<b>Informasi Garis Pantai</b><br><br>";


                                Object.keys(
                                    feature.properties
                                ).forEach(
                                    function(key) {

                                        popup +=
                                            "<b>" +
                                            key +
                                            ":</b> " +
                                            feature.properties[key] +
                                            "<br>";

                                    }
                                );


                                layer.bindPopup(
                                    popup
                                );

                            }


                            /* =========================
                               HOVER
                            ========================== */

                            layer.on(
                                "mouseover",
                                function() {

                                    this.setStyle({

                                        color: "red",

                                        weight: 4

                                    });

                                }
                            );


                            layer.on(
                                "mouseout",
                                function() {

                                    coastlineLayer.resetStyle(
                                        this
                                    );

                                }
                            );

                        }

                }
            )
            .addTo(map);


        /* =============================================
           AUTO ZOOM AWAL
        ============================================== */

        if (
            coastlineLayer &&
            coastlineLayer.getBounds().isValid()
        ) {

            map.fitBounds(
                coastlineLayer.getBounds(),
                {
                    padding: [20,20]
                }
            );

        }

    }
)

.catch(
    function(error) {

        console.error(
            "Gagal memuat Garis_Pantai_RTK.geojson:",
            error
        );

    }
);


/* =========================================================
   ORTHOPHOTO
========================================================= */

const ORTHO_URL_BASE =
    "https://raw.githubusercontent.com/" +
    "rivaldo123230038-cloud/" +
    "WebGIS-Kemker-Kelompok-1/" +
    "main/" +
    "Fix_Ortho_web/" +
    "_alllayers/";


/* =========================================================
   HEX
========================================================= */

function toHex(num) {

    return num
        .toString(16)
        .toUpperCase()
        .padStart(8, "0");

}


/* =========================================================
   CUSTOM ORTHOPHOTO GRID
========================================================= */

const OrthoGridLayer =
    L.GridLayer.extend({

        createTile:
            function(coords, done) {


                const tile =
                    document.createElement(
                        "canvas"
                    );


                const size =
                    this.getTileSize();


                tile.width =
                    size.x;

                tile.height =
                    size.y;


                const ctx =
                    tile.getContext("2d");


                const img =
                    new Image();


                img.crossOrigin =
                    "anonymous";


                const z =
                    coords.z;


                const row =
                    coords.y;


                const col =
                    coords.x;


                const rowHex =
                    toHex(row);


                const colHex =
                    toHex(col);


                const url =
                    ORTHO_URL_BASE +

                    "L" +
                    z +
                    "/" +

                    "R" +
                    rowHex +
                    "/" +

                    "C" +
                    colHex +
                    ".png";


                img.onload =
                    function() {


                        ctx.drawImage(
                            img,
                            0,
                            0,
                            size.x,
                            size.y
                        );


                        try {

                            const imageData =
                                ctx.getImageData(
                                    0,
                                    0,
                                    size.x,
                                    size.y
                                );


                            const data =
                                imageData.data;


                            for (
                                let i = 0;
                                i < data.length;
                                i += 4
                            ) {


                                const r =
                                    data[i];

                                const g =
                                    data[i + 1];

                                const b =
                                    data[i + 2];


                                if (
                                    r > 245 &&
                                    g > 245 &&
                                    b > 245
                                ) {

                                    data[i + 3] = 0;

                                }

                            }


                            ctx.putImageData(
                                imageData,
                                0,
                                0
                            );

                        }

                        catch(e) {

                            console.warn(
                                "Transparansi orthophoto:",
                                e
                            );

                        }


                        done(
                            null,
                            tile
                        );

                    };


                img.onerror =
                    function() {

                        console.warn(
                            "Tile orthophoto tidak ditemukan:",
                            url
                        );

                        done(
                            null,
                            tile
                        );

                    };


                img.src =
                    url;


                return tile;

            }

    });


/* =========================================================
   ORTHOPHOTO LAYER
========================================================= */

const ortho =
    new OrthoGridLayer({

        tileSize: 256,

        opacity: 0.80,

        zIndex: 500,

        noWrap: true,

        minZoom: 12,

        maxNativeZoom: 18,

        maxZoom: 24

    });


/* =========================================================
   CHECKBOX GARIS PANTAI
========================================================= */

document
    .getElementById(
        "coastlineCheck"
    )
    .addEventListener(
        "change",
        function() {


            if (
                this.checked
            ) {

                if (
                    coastlineLayer &&
                    !map.hasLayer(
                        coastlineLayer
                    )
                ) {

                    coastlineLayer.addTo(
                        map
                    );

                }

            }

            else {

                if (
                    coastlineLayer &&
                    map.hasLayer(
                        coastlineLayer
                    )
                ) {

                    map.removeLayer(
                        coastlineLayer
                    );

                }

            }

        }
    );


/* =========================================================
   CHECKBOX ORTHOPHOTO
========================================================= */

document
    .getElementById(
        "orthoCheck"
    )
    .addEventListener(
        "change",
        function() {


            if (
                this.checked
            ) {

                if (
                    !map.hasLayer(
                        ortho
                    )
                ) {

                    ortho.addTo(
                        map
                    );

                }

            }

            else {

                if (
                    map.hasLayer(
                        ortho
                    )
                ) {

                    map.removeLayer(
                        ortho
                    );

                }

            }

        }
    );


/* =========================================================
   BASEMAP IMAGERY
========================================================= */

document
    .getElementById(
        "imageryRadio"
    )
    .addEventListener(
        "change",
        function() {


            if (
                this.checked
            ) {

                if (
                    map.hasLayer(
                        esriStreet
                    )
                ) {

                    map.removeLayer(
                        esriStreet
                    );

                }


                if (
                    !map.hasLayer(
                        esriImagery
                    )
                ) {

                    esriImagery.addTo(
                        map
                    );

                }

            }

        }
    );


/* =========================================================
   BASEMAP STREET
========================================================= */

document
    .getElementById(
        "streetRadio"
    )
    .addEventListener(
        "change",
        function() {


            if (
                this.checked
            ) {

                if (
                    map.hasLayer(
                        esriImagery
                    )
                ) {

                    map.removeLayer(
                        esriImagery
                    );

                }


                if (
                    !map.hasLayer(
                        esriStreet
                    )
                ) {

                    esriStreet.addTo(
                        map
                    );

                }

            }

        }
    );


/* =========================================================
   AUTO ZOOM
========================================================= */

document
    .getElementById(
        "autoZoomBtn"
    )
    .addEventListener(
        "click",
        function() {


            if (
                coastlineLayer &&
                coastlineLayer.getBounds().isValid()
            ) {

                map.fitBounds(
                    coastlineLayer.getBounds(),
                    {
                        padding: [20,20]
                    }
                );

            }

        }
    );


/* =========================================================
   TOGGLE SIDEBAR
========================================================= */

const sidebar =
    document.getElementById(
        "sidebar"
    );


const toggleSidebar =
    document.getElementById(
        "toggleSidebar"
    );


toggleSidebar
    .addEventListener(
        "click",
        function() {


            sidebar.classList.toggle(
                "closed"
            );


            if (
                sidebar.classList.contains(
                    "closed"
                )
            ) {

                this.innerHTML =
                    "❯";

            }

            else {

                this.innerHTML =
                    "❮";

            }


            setTimeout(
                function() {

                    map.invalidateSize();

                },
                300
            );

        }
    );


/* =========================================================
   SCALE
========================================================= */

L.control.scale({

    imperial: false,

    metric: true

}).addTo(map);

</script>

</body>

</html>
