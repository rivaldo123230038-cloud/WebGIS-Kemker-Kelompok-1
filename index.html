<script>

/* =========================================================
   ORTHOPHOTO TMS
   ========================================================= */

/*
   Struktur yang diharapkan:

   WebGIS-Kemker-Kelompok-1/
   └── TML/
       └── L19/
           ├── ...
           └── ...

   HASIL EXPORT GLOBAL MAPPER:
   - PNG
   - Transparent Tiles
   - TMS
*/


const ORTHO_URL_BASE =
  "https://raw.githubusercontent.com/" +
  "rivaldo123230038-cloud/" +
  "WebGIS-Kemker-Kelompok-1/" +
  "main/" +
  "TML/";


/* =========================================================
   VARIABEL ORTHOPHOTO
   ========================================================= */

let orthophotoLayer = null;


/* =========================================================
   BUAT ORTHOPHOTO
   ========================================================= */

/*
   TMS Global Mapper menggunakan struktur tile TMS.

   Leaflet membutuhkan tms:true agar
   orientasi Y dibalik sesuai standar TMS.
*/

orthophotoLayer =
  L.tileLayer(

    ORTHO_URL_BASE +
    "{z}/{x}/{y}.png",

    {

      /*
         Zoom minimum.
      */

      minZoom: 11,


      /*
         Zoom maksimum tampilan.
      */

      maxZoom: 24,


      /*
         Tile asli terakhir adalah L19.

         Jadi ketika zoom:
         L20
         L21
         L22
         L23
         L24

         Leaflet tetap menggunakan
         resolusi tile L19 dan
         memperbesarnya.
      */

      maxNativeZoom: 19,


      /*
         Ukuran tile Global Mapper
      */

      tileSize: 256,


      /*
         Transparansi tile sudah dibuat
         saat export dari Global Mapper.
      */

      opacity: 1,


      /*
         TMS membutuhkan pembalikan Y.
      */

      tms: true,


      /*
         Jangan membuat tile yang kosong
         menjadi error besar.
      */

      errorTileUrl: "",


      /*
         Buffer tile di sekitar viewport.
      */

      keepBuffer: 4,


      /*
         Update saat zoom.
      */

      updateWhenZooming: true,


      updateWhenIdle: false,


      /*
         Mencegah tile berulang
         membungkus dunia.
      */

      noWrap: true,


      attribution:
        "Orthophoto"

    }

  );


/* =========================================================
   CHECKBOX ORTHOPHOTO
   ========================================================= */

document
  .getElementById("checkOrthophoto")
  .addEventListener(
    "change",
    function() {

      if (this.checked) {

        orthophotoLayer.addTo(map);

      }

      else {

        map.removeLayer(
          orthophotoLayer
        );

      }

    }
  );


/* =========================================================
   DEBUG
   ========================================================= */

console.log(
  "Orthophoto URL:",
  ORTHO_URL_BASE
);

console.log(
  "Orthophoto layer:",
  orthophotoLayer
);

</script>
