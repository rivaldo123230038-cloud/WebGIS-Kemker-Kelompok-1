<script>

/* ============================================================
   PENGATURAN UTAMA
============================================================ */

/*
   ZOOM DIPERJAUH:

   18  = tile asli terakhir
   19  = diperbesar
   20  = diperbesar
   21  = diperbesar
   22  = diperbesar
   23  = diperbesar
   24  = diperbesar

   Jadi user bisa melihat garis pantai
   jauh lebih dekat.
*/

const MAP_MAX_ZOOM = 24;


/*
   Orthophoto asli:
   L12 - L18
*/

const ORTHO_MIN_ZOOM = 12;

const ORTHO_NATIVE_ZOOM = 18;


/* ============================================================
   PROYEKSI UTM 48S
============================================================ */

proj4.defs(

    "EPSG:32748",

    "+proj=utm +zone=48 +south +datum=WGS84 +units=m +no_defs +type=crs"

);


/* ============================================================
   MAP
============================================================ */

const map = L.map(

    "map",

    {

        center: [
            -5.4,
            105.25
        ],

        zoom: 12,

        minZoom: 4,

        maxZoom: MAP_MAX_ZOOM,

        zoomControl: true,

        worldCopyJump: false

    }

);


/* ============================================================
   ESRI WORLD IMAGERY
============================================================ */

const esriImagery = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {

        attribution:
            "Tiles © Esri",

        minZoom: 0,

        /*
           SEKARANG BISA ZOOM SAMPAI 24
        */

        maxZoom: MAP_MAX_ZOOM,

        /*
           DATA NATIVE ESRI YANG DIPAKAI
           SAMPAI LEVEL 18.

           Setelah itu Leaflet memperbesar
           tile level 18.
        */

        maxNativeZoom: 18,

        tileSize: 256,

        detectRetina: false,

        noWrap: true,

        updateWhenZooming: false,

        updateWhenIdle: true,

        keepBuffer: 3

    }

);


/* ============================================================
   ESRI WORLD STREET MAP
============================================================ */

const esriStreet = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",

    {

        attribution:
            "Tiles © Esri",

        minZoom: 0,

        /*
           BISA ZOOM SAMPAI 24
        */

        maxZoom: MAP_MAX_ZOOM,

        /*
           NATIVE TILE SAMPAI 18
        */

        maxNativeZoom: 18,

        tileSize: 256,

        detectRetina: false,

        noWrap: true,

        updateWhenZooming: false,

        updateWhenIdle: true,

        keepBuffer: 3

    }

);


/* ============================================================
   BASEMAP DEFAULT
============================================================ */

esriImagery.addTo(map);


/* ============================================================
   KONVERSI NOMOR TILE KE HEX
============================================================ */

function toHex(value) {

    return Math.floor(value)
        .toString(16)
        .padStart(8, "0")
        .toLowerCase();

}


/* ============================================================
   HAPUS WHITE NO-DATA
============================================================ */

function removeWhiteEdge(canvas) {

    try {

        const ctx =
            canvas.getContext("2d");

        const width =
            canvas.width;

        const height =
            canvas.height;


        const imageData =
            ctx.getImageData(
                0,
                0,
                width,
                height
            );


        const data =
            imageData.data;


        const total =
            width * height;


        const visited =
            new Uint8Array(total);


        const queue =
            new Int32Array(total);


        let head = 0;

        let tail = 0;


        function isWhite(index) {

            const r =
                data[index];

            const g =
                data[index + 1];

            const b =
                data[index + 2];

            const a =
                data[index + 3];


            return (

                a > 0 &&

                r >= 245 &&
                g >= 245 &&
                b >= 245

            );

        }


        function addPixel(
            x,
            y
        ) {

            if (

                x < 0 ||
                x >= width ||
                y < 0 ||
                y >= height

            ) {

                return;

            }


            const pos =
                y * width + x;


            if (
                visited[pos]
            ) {

                return;

            }


            const index =
                pos * 4;


            if (
                !isWhite(index)
            ) {

                return;

            }


            visited[pos] = 1;

            queue[tail++] = pos;

        }


        /*
           Mulai dari semua pixel
           di tepi tile.
        */

        for (
            let x = 0;
            x < width;
            x++
        ) {

            addPixel(x, 0);

            addPixel(
                x,
                height - 1
            );

        }


        for (
            let y = 0;
            y < height;
            y++
        ) {

            addPixel(0, y);

            addPixel(
                width - 1,
                y
            );

        }


        /*
           Flood fill white
        */

        while (
            head < tail
        ) {

            const pos =
                queue[head++];


            const x =
                pos % width;


            const y =
                Math.floor(
                    pos / width
                );


            const index =
                pos * 4;


            /*
               Buat transparan
            */

            data[index + 3] = 0;


            addPixel(
                x + 1,
                y
            );

            addPixel(
                x - 1,
                y
            );

            addPixel(
                x,
                y + 1
            );

            addPixel(
                x,
                y - 1
            );

        }


        ctx.putImageData(
            imageData,
            0,
            0
        );

    }

    catch (error) {

        console.warn(
            "White edge tidak dapat diproses:",
            error
        );

    }

}


/* ============================================================
   CUSTOM ORTHOPHOTO
============================================================ */

const OrthophotoLayer =
    L.GridLayer.extend({

        options: {

            tileSize: 256,

            minZoom:
                ORTHO_MIN_ZOOM,

            /*
               Orthophoto dapat diperbesar
               sampai zoom 24.
            */

            maxZoom:
                MAP_MAX_ZOOM,

            /*
               Tile asli hanya sampai L18.
            */

            maxNativeZoom:
                ORTHO_NATIVE_ZOOM,

            noWrap: true,

            updateWhenZooming: false,

            updateWhenIdle: true,

            keepBuffer: 3

        },


        createTile:
            function(
                coords,
                done
            ) {


                const canvas =
                    document.createElement(
                        "canvas"
                    );


                canvas.width =
                    256;

                canvas.height =
                    256;


                const ctx =
                    canvas.getContext(
                        "2d"
                    );


                /*
                   Ketika zoom > 18,
                   Leaflet menggunakan tile
                   native L18 dan memperbesarnya.
                */

                const z =
                    coords.z;


                const row =
                    toHex(
                        coords.y
                    );


                const col =
                    toHex(
                        coords.x
                    );


                /*
                   Struktur GitHub:

                   Fix_Ortho_web
                   └── _alllayers
                       └── L18
                           └── Rxxxxxxxx
                               └── Cxxxxxxxx.png
                */

                const url =

                    "https://cdn.jsdelivr.net/gh/" +

                    "rivaldo123230038-cloud/" +

                    "WebGIS-Kemker-Kelompok-1" +

                    "@main/" +

                    "Fix_Ortho_web/" +

                    "_alllayers/" +

                    "L" + z + "/" +

                    "R" + row + "/" +

                    "C" + col +

                    ".png";


                const img =
                    new Image();


                img.crossOrigin =
                    "anonymous";


                img.onload =
                    function() {


                        try {

                            ctx.clearRect(
                                0,
                                0,
                                256,
                                256
                            );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                256,
                                256
                            );


                            /*
                               Hapus white
                               pada tepi tile.
                            */

                            removeWhiteEdge(
                                canvas
                            );

                        }

                        catch (error) {

                            console.warn(
                                "Canvas orthophoto error:",
                                error
                            );

                        }


                        done(
                            null,
                            canvas
                        );

                    };


                img.onerror =
                    function() {

                        /*
                           Jangan tampilkan
                           broken image.
                        */

                        ctx.clearRect(
                            0,
                            0,
                            256,
                            256
                        );


                        done(
                            null,
                            canvas
                        );

                    };


                img.src =
                    url;


                return canvas;

            }

    });


/* ============================================================
   ORTHOPHOTO INSTANCE
============================================================ */

const orthophoto =
    new OrthophotoLayer();


/* ============================================================
   ORTHOPHOTO DEFAULT ON
============================================================ */

orthophoto.addTo(
    map
);


/* ============================================================
   VARIABEL GARIS PANTAI
============================================================ */

let coastline = null;

let coastlineReady = false;


/* ============================================================
   CARI KOORDINAT PERTAMA
============================================================ */

function findFirstCoordinate(
    coords
) {

    if (

        Array.isArray(coords) &&

        coords.length >= 2 &&

        typeof coords[0] ===
            "number" &&

        typeof coords[1] ===
            "number"

    ) {

        return coords;

    }


    if (
        Array.isArray(coords)
    ) {

        for (
            const item
            of coords
        ) {

            const result =
                findFirstCoordinate(
                    item
                );


            if (result) {

                return result;

            }

        }

    }


    return null;

}


/* ============================================================
   TRANSFORM KOORDINAT
============================================================ */

function transformCoordinate(
    coord
) {

    const result =
        proj4(

            "EPSG:32748",

            "EPSG:4326",

            [
                coord[0],
                coord[1]
            ]

        );


    return [

        result[0],

        result[1]

    ];

}


/* ============================================================
   TRANSFORM RECURSIVE
============================================================ */

function transformCoordinatesRecursive(
    coords
) {

    if (

        Array.isArray(coords) &&

        coords.length >= 2 &&

        typeof coords[0] ===
            "number" &&

        typeof coords[1] ===
            "number"

    ) {

        return transformCoordinate(
            coords
        );

    }


    if (
        Array.isArray(coords)
    ) {

        return coords.map(
            transformCoordinatesRecursive
        );

    }


    return coords;

}


/* ============================================================
   TRANSFORM GEOMETRY
============================================================ */

function transformGeometry(
    geometry
) {

    if (!geometry) {

        return geometry;

    }


    return {

        ...geometry,

        coordinates:
            transformCoordinatesRecursive(
                geometry.coordinates
            )

    };

}


/* ============================================================
   TRANSFORM FEATURE
============================================================ */

function transformFeature(
    feature
) {

    return {

        ...feature,

        geometry:
            transformGeometry(
                feature.geometry
            )

    };

}


/* ============================================================
   TRANSFORM GEOJSON
============================================================ */

function convertGeoJSONToWGS84(
    geojson
) {

    const firstCoord =
        findFirstCoordinate(
            geojson
        );


    if (!firstCoord) {

        throw new Error(
            "Koordinat GeoJSON tidak ditemukan."
        );

    }


    /*
       Kalau nilainya seperti
       400000 / 9400000,
       berarti UTM.

       Kalau sekitar
       105 / -5,
       berarti sudah geographic.
    */

    const isUTM =

        Math.abs(
            firstCoord[0]
        ) > 180 ||

        Math.abs(
            firstCoord[1]
        ) > 90;


    if (!isUTM) {

        console.log(
            "GeoJSON sudah berupa geographic coordinate."
        );

        return geojson;

    }


    console.log(
        "Mengubah UTM 48S ke WGS84..."
    );


    if (

        geojson.type ===
            "FeatureCollection"

    ) {

        return {

            ...geojson,

            features:
                geojson.features.map(
                    transformFeature
                )

        };

    }


    if (
        geojson.type ===
            "Feature"
    ) {

        return transformFeature(
            geojson
        );

    }


    if (geojson.type) {

        return transformGeometry(
            geojson
        );

    }


    return geojson;

}


/* ============================================================
   POPUP
============================================================ */

function createPopupContent(
    properties
) {

    if (

        !properties ||

        Object.keys(
            properties
        ).length === 0

    ) {

        return `
            <div>
                Tidak ada atribut.
            </div>
        `;

    }


    let html =
        `<table class="popup-table">`;


    Object.entries(
        properties
    ).forEach(

        ([key, value]) => {

            html += `

                <tr>

                    <td class="popup-key">
                        ${key}
                    </td>

                    <td>
                        ${value ?? "-"}
                    </td>

                </tr>

            `;

        }

    );


    html +=
        `</table>`;


    return html;

}


/* ============================================================
   STYLE GARIS PANTAI
============================================================ */

function coastlineStyle() {

    return {

        color: "#00ffff",

        weight: 4,

        opacity: 0.95

    };

}


/* ============================================================
   HOVER
============================================================ */

function coastlineHover(
    e
) {

    const layer =
        e.target;


    layer.setStyle({

        color: "red",

        weight: 6,

        opacity: 1

    });

}


/* ============================================================
   MOUSE OUT
============================================================ */

function coastlineOut(
    e
) {

    coastline.resetStyle(
        e.target
    );

}


/* ============================================================
   LOAD GARIS PANTAI
============================================================ */

fetch(
    "Garis_Pantai_RTK.geojson"
)

.then(
    response => {

        if (!response.ok) {

            throw new Error(
                "Garis_Pantai_RTK.geojson tidak ditemukan."
            );

        }

        return response.json();

    }
)

.then(
    data => {


        /*
           UTM 48S → WGS84
        */

        const converted =
            convertGeoJSONToWGS84(
                data
            );


        /*
           Buat layer
        */

        coastline =
            L.geoJSON(

                converted,

                {

                    style:
                        coastlineStyle,


                    onEachFeature:
                        function(
                            feature,
                            layer
                        ) {


                            layer.bindPopup(

                                createPopupContent(
                                    feature.properties
                                )

                            );


                            layer.on({

                                mouseover:
                                    coastlineHover,

                                mouseout:
                                    coastlineOut

                            });

                        }

                }

            );


        coastline.addTo(
            map
        );


        coastlineReady =
            true;


        /*
           Auto zoom awal
        */

        setTimeout(

            function() {

                zoomToCoastline();

            },

            500

        );


    }
)

.catch(

    error => {

        console.error(
            "Gagal memuat garis pantai:",
            error
        );


        alert(

            "Garis Pantai RTK tidak dapat dimuat.\n\n" +

            "Pastikan file:\n" +

            "Garis_Pantai_RTK.geojson\n\n" +

            "berada di folder yang sama dengan index.html."

        );

    }

);


/* ============================================================
   AUTO ZOOM
============================================================ */

function zoomToCoastline() {

    if (

        !coastline ||

        !coastlineReady

    ) {

        return;

    }


    const bounds =
        coastline.getBounds();


    if (

        !bounds ||

        !bounds.isValid()

    ) {

        console.warn(
            "Bounds garis pantai tidak valid."
        );

        return;

    }


    /*
       Zoom awal tetap dibatasi
       agar seluruh garis pantai
       terlihat.

       Setelah itu user bisa
       zoom sampai level 24.
    */

    map.fitBounds(

        bounds,

        {

            paddingTopLeft:
                [30, 30],

            paddingBottomRight:
                [30, 30],

            maxZoom: 17,

            animate: true

        }

    );

}


/* ============================================================
   CHECKBOX GARIS PANTAI
============================================================ */

document
    .getElementById(
        "coastlineCheck"
    )
    .addEventListener(

        "change",

        function() {

            if (
                this.checked
            ) {

                if (
                    coastline
                ) {

                    coastline.addTo(
                        map
                    );

                }

            }

            else {

                if (
                    coastline
                ) {

                    map.removeLayer(
                        coastline
                    );

                }

            }

        }

    );


/* ============================================================
   CHECKBOX ORTHOPHOTO
============================================================ */

document
    .getElementById(
        "orthophotoCheck"
    )
    .addEventListener(

        "change",

        function() {

            if (
                this.checked
            ) {

                orthophoto.addTo(
                    map
                );

            }

            else {

                map.removeLayer(
                    orthophoto
                );

            }

        }

    );


/* ============================================================
   ESRI IMAGERY
============================================================ */

document
    .getElementById(
        "esriImagery"
    )
    .addEventListener(

        "change",

        function() {

            if (
                !this.checked
            ) {

                return;

            }


            if (
                map.hasLayer(
                    esriStreet
                )
            ) {

                map.removeLayer(
                    esriStreet
                );

            }


            if (
                !map.hasLayer(
                    esriImagery
                )
            ) {

                esriImagery.addTo(
                    map
                );

            }

        }

    );


/* ============================================================
   ESRI STREET
============================================================ */

document
    .getElementById(
        "esriStreet"
    )
    .addEventListener(

        "change",

        function() {

            if (
                !this.checked
            ) {

                return;

            }


            if (
                map.hasLayer(
                    esriImagery
                )
            ) {

                map.removeLayer(
                    esriImagery
                );

            }


            if (

                    esriStreet
                )
            ) {

                esriStreet.addTo(
                    map
                );

            }

        }

    );


/* ============================================================
   SIDEBAR TOGGLE
============================================================ */

const sidebar =
    document.getElementById(
        "sidebar"
    );


const sidebarToggle =
    document.getElementById(
        "sidebarToggle"
    );


sidebarToggle.addEventListener(

    "click",

    function() {

        sidebar.classList.toggle(
            "closed"
        );


        if (

            sidebar.classList.contains(
                "closed"
            )

        ) {

            sidebarToggle.innerHTML =
                "❯";

        }

        else {

            sidebarToggle.innerHTML =
                "❮";

        }


        setTimeout(

            function() {

                map.invalidateSize();

            },

            350

        );

    }

);


/* ============================================================
   KOORDINAT KURSOR
============================================================ */

map.on(

    "mousemove",

    function(e) {

        document
            .getElementById(
                "latValue"
            )
            .textContent =

            e.latlng.lat.toFixed(
                7
            );


        document
            .getElementById(
                "lngValue"
            )
            .textContent =

            e.latlng.lng.toFixed(
                7
            );

    }

);


/* ============================================================
   SCALE
============================================================ */

L.control.scale({

    imperial: false,

    metric: true,

    position:
        "bottomleft"

}).addTo(map);


/* ============================================================
   AUTO ZOOM CONTROL MAP
============================================================ */

const AutoZoomControl =
    L.Control.extend({

        options: {

            position:
                "topright"

        },


        onAdd:
            function() {

                const container =
                    L.DomUtil.create(
                        "div",
                        "autozoom-control"
                    );


                container.innerHTML =
                    "⌖";


                container.title =
                    "Zoom ke Garis Pantai RTK";


                L.DomEvent
                    .disableClickPropagation(
                        container
                    );


                L.DomEvent.on(

                    container,

                    "click",

                    function() {

                        zoomToCoastline();

                    }

                );


                return container;

            }

    });


new AutoZoomControl()
    .addTo(map);


/* ============================================================
   LEGEND
============================================================ */

const legend =
    L.control({

        position:
            "bottomright"

    });


legend.onAdd =
    function() {

        const div =
            L.DomUtil.create(
                "div",
                "legend"
            );


        div.innerHTML = `

            <div
                style="
                    font-weight:bold;
                    margin-bottom:6px;
                "
            >

                LEGEND

            </div>


            <div>

                <span
                    class="legend-line"
                ></span>

                Garis Pantai RTK

            </div>

        `;


        return div;

    };


legend.addTo(map);
