<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WEBGIS KELOMPOK 1</title>

    <!-- LEAFLET -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ======================================================
           MAP
        ====================================================== */

        #map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ======================================================
           SIDEBAR
        ====================================================== */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;

            width: 350px;
            height: 100vh;

            background: white;

            z-index: 1000;

            box-shadow: 3px 0 12px rgba(0,0,0,0.25);

            transition: transform 0.35s ease;

            overflow: visible;
        }

        .sidebar.collapsed {
            transform: translateX(-350px);
        }

        /* ======================================================
           LOGO AREA
        ====================================================== */

        .logo-section {
            position: relative;

            width: 350px;
            height: 108px;

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 10px 12px;

            z-index: 20;
        }

        .logo-section img {
            width: 72px;
            height: 72px;

            object-fit: contain;

            display: block;
        }

        /* ======================================================
           SIDEBAR BODY
        ====================================================== */

        .sidebar-body {
            position: relative;

            width: 350px;

            height: calc(100vh - 108px);

            overflow-y: auto;

            padding: 18px 18px 25px 18px;

            z-index: 10;
        }

        /* BACKGROUND FOTO */
        .sidebar-body::before {
            content: "";

            position: fixed;

            top: 108px;
            left: 0;

            width: 350px;
            height: calc(100vh - 108px);

            background-image: url("bcg1.jpeg");

            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;

            opacity: 0.20;

            z-index: -2;

            animation: backgroundSlide 18s infinite;
        }

        /* WHITE OVERLAY */
        .sidebar-body::after {
            content: "";

            position: fixed;

            top: 108px;
            left: 0;

            width: 350px;
            height: calc(100vh - 108px);

            background: rgba(255,255,255,0.78);

            z-index: -1;

            pointer-events: none;
        }

        @keyframes backgroundSlide {

            0% {
                background-image: url("bcg1.jpeg");
            }

            33% {
                background-image: url("bcg1.jpeg");
            }

            34% {
                background-image: url("bcg2.jpeg");
            }

            66% {
                background-image: url("bcg2.jpeg");
            }

            67% {
                background-image: url("bcg3.jpeg");
            }

            99% {
                background-image: url("bcg3.jpeg");
            }

            100% {
                background-image: url("bcg1.jpeg");
            }
        }

        /* ======================================================
           SIDEBAR TOGGLE
        ====================================================== */

        .sidebar-toggle {
            position: absolute;

            top: 50%;
            right: -34px;

            width: 34px;
            height: 70px;

            transform: translateY(-50%);

            background: white;

            border: none;

            border-radius: 0 8px 8px 0;

            box-shadow: 3px 0 8px rgba(0,0,0,0.20);

            cursor: pointer;

            font-size: 22px;
            font-weight: bold;

            z-index: 2000;
        }

        .sidebar-toggle:hover {
            background: #f0f0f0;
        }

        /* ======================================================
           JUDUL
        ====================================================== */

        .webgis-title {
            text-align: center;

            font-size: 22px;
            font-weight: bold;

            margin: 2px 0 20px 0;

            color: #111;
        }

        /* ======================================================
           SECTION
        ====================================================== */

        .section {
            background: rgba(255,255,255,0.88);

            border-radius: 8px;

            padding: 13px 14px;

            margin-bottom: 14px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .section-title {
            font-size: 15px;

            font-weight: bold;

            margin-bottom: 10px;

            color: #222;
        }

        /* ======================================================
           CHECKBOX / RADIO
        ====================================================== */

        .control-item {
            display: flex;

            align-items: center;

            gap: 8px;

            margin: 8px 0;

            font-size: 14px;

            cursor: pointer;
        }

        .control-item input {
            cursor: pointer;
        }

        /* ======================================================
           BUTTON
        ====================================================== */

        .zoom-button {
            width: 100%;

            padding: 10px;

            margin-top: 4px;

            border: none;

            border-radius: 6px;

            background: #198754;

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;
        }

        .zoom-button:hover {
            background: #146c43;
        }

        /* ======================================================
           KOORDINAT
        ====================================================== */

        .coordinate-box {
            background: rgba(245,245,245,0.95);

            border-radius: 5px;

            padding: 8px 10px;

            font-size: 13px;

            line-height: 1.6;
        }

        /* ======================================================
           FOOTER
        ====================================================== */

        .footer {
            margin-top: 18px;

            text-align: center;

            font-size: 11px;

            color: #444;

            line-height: 1.5;
        }

        /* ======================================================
           LEAFLET CUSTOM AUTO ZOOM
        ====================================================== */

        .auto-zoom-control {
            background: white;

            border-radius: 5px;

            box-shadow: 0 1px 5px rgba(0,0,0,0.4);

            overflow: hidden;
        }

        .auto-zoom-control button {
            width: 40px;
            height: 40px;

            border: none;

            background: white;

            cursor: pointer;

            font-size: 20px;
        }

        .auto-zoom-control button:hover {
            background: #f0f0f0;
        }

        /* ======================================================
           LEGEND
        ====================================================== */

        .legend {
            position: fixed;

            right: 20px;
            bottom: 25px;

            background: rgba(255,255,255,0.94);

            padding: 10px 13px;

            border-radius: 6px;

            box-shadow: 0 1px 6px rgba(0,0,0,0.25);

            font-size: 13px;

            z-index: 900;
        }

        .legend-title {
            font-weight: bold;

            margin-bottom: 7px;
        }

        .legend-line {
            display: flex;

            align-items: center;

            gap: 8px;
        }

        .legend-symbol {
            width: 35px;
            height: 4px;

            background: cyan;
        }

        /* ======================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 600px) {

            .sidebar {
                width: 310px;
            }

            .sidebar.collapsed {
                transform: translateX(-310px);
            }

            .sidebar-body,
            .logo-section {
                width: 310px;
            }

            .sidebar-body::before,
            .sidebar-body::after {
                width: 310px;
            }

            .sidebar-toggle {
                right: -32px;
                width: 32px;
            }

            .logo-section img {
                width: 62px;
                height: 62px;
            }
        }

    </style>
</head>

<body>

    <!-- ======================================================
         MAP
    ====================================================== -->

    <div id="map"></div>


    <!-- ======================================================
         SIDEBAR
    ====================================================== -->

    <div class="sidebar" id="sidebar">

        <!-- LOGOS -->
        <div class="logo-section">

            <img src="ITERA.png" alt="ITERA">

            <img src="Logo_GT.png" alt="Geomatika ITERA">

            <img src="LOGO_GT23.png" alt="Geomatika 2023">

            <img src="LOGO_KEMKER.png" alt="Kemah Kerja 2023">

        </div>


        <!-- BODY -->
        <div class="sidebar-body">

            <div class="webgis-title">
                WEBGIS KELOMPOK 1
            </div>


            <!-- ==================================================
                 GARIS PANTAI
            ================================================== -->

            <div class="section">

                <div class="section-title">
                    Data
                </div>

                <label class="control-item">

                    <input
                        type="checkbox"
                        id="coastlineCheck"
                        checked
                    >

                    Garis Pantai

                </label>

            </div>


            <!-- ==================================================
                 AUTO ZOOM
            ================================================== -->

            <div class="section">

                <div class="section-title">
                    Navigasi
                </div>

                <button
                    class="zoom-button"
                    id="zoomToLayerButton"
                >
                    Auto Zoom to Layer
                </button>

            </div>


            <!-- ==================================================
                 BASEMAP
            ================================================== -->

            <div class="section">

                <div class="section-title">
                    Base Map
                </div>


                <label class="control-item">

                    <input
                        type="radio"
                        name="basemap"
                        value="esri"
                        checked
                    >

                    Esri World Imagery

                </label>


                <label class="control-item">

                    <input
                        type="radio"
                        name="basemap"
                        value="google"
                    >

                    Google Satellite

                </label>


                <label class="control-item">

                    <input
                        type="radio"
                        name="basemap"
                        value="street"
                    >

                    Esri World Street Map

                </label>


                <label class="control-item">

                    <input
                        type="radio"
                        name="basemap"
                        value="ortho"
                    >

                    Orthophoto

                </label>

            </div>


            <!-- ==================================================
                 SISTEM KOORDINAT
            ================================================== -->

            <div class="section">

                <div class="section-title">
                    Sistem Koordinat
                </div>

                <div
                    style="
                    font-size:14px;
                    line-height:1.6;
                    "
                >
                    WGS 84<br>
                    Geographic Coordinate System<br>
                    EPSG:4326
                </div>

            </div>


            <!-- ==================================================
                 KOORDINAT KURSOR
            ================================================== -->

            <div class="section">

                <div class="section-title">
                    Koordinat Kursor
                </div>

                <div class="coordinate-box">

                    <div>
                        Latitude:
                        <span id="latValue">-</span>
                    </div>

                    <div>
                        Longitude:
                        <span id="lngValue">-</span>
                    </div>

                </div>

            </div>


            <!-- ==================================================
                 FOOTER
            ================================================== -->

            <div class="footer">

                WEBGIS Kelompok 1<br>
                Program Studi Teknik Geomatika<br>
                Institut Teknologi Sumatera

            </div>

        </div>


        <!-- SIDEBAR TOGGLE -->
        <button
            class="sidebar-toggle"
            id="sidebarToggle"
            title="Tutup/Buka Sidebar"
        >
            ◀
        </button>

    </div>


    <!-- ======================================================
         LEGEND
    ====================================================== -->

    <div class="legend">

        <div class="legend-title">
            Legenda
        </div>

        <div class="legend-line">

            <div class="legend-symbol"></div>

            <span>
                Garis Pantai
            </span>

        </div>

    </div>


    <!-- ======================================================
         LEAFLET
    ====================================================== -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <!-- ======================================================
         GOOGLE MUTANT
    ====================================================== -->

    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"></script>

    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@0.16.0/Leaflet.GoogleMutant.js"></script>


    <script>

        /* ======================================================
           MAP INITIALIZATION
        ====================================================== */

        const map = L.map("map", {

            center: [-5.4, 105.3],

            zoom: 10,

            minZoom: 0,

            maxZoom: 23,

            zoomControl: true

        });


        /* ======================================================
           BASEMAP 1
           ESRI WORLD IMAGERY
        ====================================================== */

        const esriImagery = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/" +
            "World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom: 19,
                attribution:
                    "Tiles &copy; Esri"
            }
        );


        /* ======================================================
           BASEMAP 2
           GOOGLE SATELLITE
        ====================================================== */

        const googleSatellite =
            L.gridLayer.googleMutant({

                type: "satellite",

                maxZoom: 23

            });


        /* ======================================================
           BASEMAP 3
           ESRI STREET
        ====================================================== */

        const esriStreet = L.tileLayer(

            "https://server.arcgisonline.com/ArcGIS/rest/services/" +
            "World_Street_Map/MapServer/tile/{z}/{y}/{x}",

            {
                maxZoom: 19,

                attribution:
                    "Tiles &copy; Esri"
            }

        );


        /* ======================================================
           ORTHOPHOTO
           
           ARC MAP EXPLODED CACHE
           
           TEST:
           L12
           L13
           L14
           L15
           L16
           L17
           
           Struktur:
           
           Fix_Ortho_web/
             _alllayers/
               L12/
                 Rxxxxxxxx/
                   Cxxxxxxxx.png
        ====================================================== */

        const orthoLayer = L.tileLayer(
            "Fix_Ortho_web/_alllayers/L{z}/R{y}/C{x}.png",
            {

                tileSize: 256,

                minZoom: 12,

                maxZoom: 17,

                minNativeZoom: 12,

                maxNativeZoom: 17,

                noWrap: true,

                opacity: 1,

                attribution:
                    "Orthophoto"

            }
        );


        /* ======================================================
           KUSTOM URL ORTHOPHOTO ARC GIS

           ArcMap menggunakan:
           R + ROW HEX
           C + COLUMN HEX

           Contoh:
           R0000083f
           C00000cad.png
        ====================================================== */

        orthoLayer.getTileUrl = function(coords) {

            const z = coords.z;

            const x = coords.x;

            const y = coords.y;


            /*
             * Hanya L12-L17
             */

            if (z < 12 || z > 17) {

                return "";

            }


            /*
             * Jangan izinkan koordinat negatif
             */

            if (x < 0 || y < 0) {

                return "";

            }


            /*
             * Konversi angka ke HEX
             *
             * ArcMap:
             * R0000083f
             * C00000cad
             */

            const rowHex =
                Math.floor(y)
                .toString(16)
                .padStart(8, "0")
                .toLowerCase();


            const colHex =
                Math.floor(x)
                .toString(16)
                .padStart(8, "0")
                .toLowerCase();


            return (

                "Fix_Ortho_web/" +
                "_alllayers/" +
                "L" + z + "/" +
                "R" + rowHex + "/" +
                "C" + colHex + ".png"

            );

        };


        /* ======================================================
           DEFAULT BASEMAP
        ====================================================== */

        esriImagery.addTo(map);


        /* ======================================================
           GARIS PANTAI
        ====================================================== */

        let coastlineLayer = L.layerGroup();

        let coastlineBounds = null;


        /* ======================================================
           LOAD GP_RT.JSON
        ====================================================== */

        fetch("GP_RT.json")

            .then(function(response) {

                if (!response.ok) {

                    throw new Error(
                        "GP_RT.json tidak ditemukan"
                    );

                }

                return response.json();

            })

            .then(function(data) {


                if (
                    !data ||
                    !data.features ||
                    data.features.length === 0
                ) {

                    console.warn(
                        "Tidak ada feature di GP_RT.json"
                    );

                    return;

                }


                data.features.forEach(function(feature) {

                    if (
                        !feature.geometry ||
                        !feature.geometry.paths
                    ) {

                        return;

                    }


                    feature.geometry.paths.forEach(function(path) {


                        /*
                         * ESRI JSON
                         * [X,Y]
                         *
                         * Leaflet:
                         * [LAT,LNG]
                         */

                        const latLngs =
                            path.map(function(point) {

                                return [
                                    point[1],
                                    point[0]
                                ];

                            });


                        const line =
                            L.polyline(
                                latLngs,
                                {

                                    color: "cyan",

                                    weight: 3,

                                    opacity: 1,

                                    smoothFactor: 1

                                }
                            );


                        /* ==================================================
                           POPUP
                        ================================================== */

                        let popupHTML =
                            "<div style='min-width:200px'>";

                        popupHTML +=
                            "<b>Garis Pantai</b><br><br>";


                        if (feature.attributes) {

                            Object.keys(
                                feature.attributes
                            ).forEach(function(key) {

                                const value =
                                    feature.attributes[key];

                                popupHTML +=
                                    "<b>" +
                                    key +
                                    ":</b> " +
                                    value +
                                    "<br>";

                            });

                        }


                        popupHTML += "</div>";


                        line.bindPopup(
                            popupHTML
                        );


                        /* ==================================================
                           HOVER
                        ================================================== */

                        line.on(
                            "mouseover",
                            function() {

                                this.setStyle({

                                    color: "red",

                                    weight: 6

                                });

                            }
                        );


                        line.on(
                            "mouseout",
                            function() {

                                this.setStyle({

                                    color: "cyan",

                                    weight: 3

                                });

                            }
                        );


                        coastlineLayer.addLayer(line);

                    });

                });


                coastlineLayer.addTo(map);


                /* ==================================================
                   GET BOUNDS
                ================================================== */

                coastlineBounds =
                    coastlineLayer.getBounds();


                if (
                    coastlineBounds &&
                    coastlineBounds.isValid()
                ) {

                    map.fitBounds(

                        coastlineBounds,

                        {
                            padding: [40, 40],

                            maxZoom: 16
                        }

                    );

                }

            })

            .catch(function(error) {

                console.error(
                    "Gagal membaca GP_RT.json:",
                    error
                );

            });


        /* ======================================================
           CHECKBOX GARIS PANTAI
        ====================================================== */

        document
            .getElementById("coastlineCheck")
            .addEventListener(
                "change",
                function() {

                    if (this.checked) {

                        if (
                            !map.hasLayer(
                                coastlineLayer
                            )
                        ) {

                            coastlineLayer.addTo(map);

                        }

                    }

                    else {

                        if (
                            map.hasLayer(
                                coastlineLayer
                            )
                        ) {

                            map.removeLayer(
                                coastlineLayer
                            );

                        }

                    }

                }
            );


        /* ======================================================
           AUTO ZOOM SIDEBAR
        ====================================================== */

        document
            .getElementById("zoomToLayerButton")
            .addEventListener(
                "click",
                function() {

                    if (
                        coastlineBounds &&
                        coastlineBounds.isValid()
                    ) {

                        map.fitBounds(

                            coastlineBounds,

                            {
                                padding: [40, 40],

                                maxZoom: 16
                            }

                        );

                    }

                }
            );


        /* ======================================================
           AUTO ZOOM MAP CONTROL
        ====================================================== */

        const AutoZoomControl =
            L.Control.extend({

                options: {

                    position: "topright"

                },


                onAdd: function() {

                    const container =
                        L.DomUtil.create(
                            "div",
                            "auto-zoom-control"
                        );


                    const button =
                        L.DomUtil.create(
                            "button",
                            "",
                            container
                        );


                    button.innerHTML = "⌖";

                    button.title =
                        "Zoom ke Garis Pantai";


                    L.DomEvent.disableClickPropagation(
                        container
                    );


                    L.DomEvent.on(
                        button,
                        "click",
                        function() {

                            if (
                                coastlineBounds &&
                                coastlineBounds.isValid()
                            ) {

                                map.fitBounds(

                                    coastlineBounds,

                                    {
                                        padding: [40, 40],

                                        maxZoom: 16
                                    }

                                );

                            }

                        }
                    );


                    return container;

                }

            });


        map.addControl(
            new AutoZoomControl()
        );


        /* ======================================================
           BASEMAP SWITCHING
        ====================================================== */

        const allBaseMaps = [

            esriImagery,

            googleSatellite,

            esriStreet,

            orthoLayer

        ];


        function removeAllBaseMaps() {

            allBaseMaps.forEach(
                function(layer) {

                    if (
                        map.hasLayer(layer)
                    ) {

                        map.removeLayer(layer);

                    }

                }
            );

        }


        document
            .querySelectorAll(
                'input[name="basemap"]'
            )
            .forEach(
                function(radio) {

                    radio.addEventListener(
                        "change",
                        function() {

                            if (!this.checked) {

                                return;

                            }


                            removeAllBaseMaps();


                            /* ==============================================
                               ESRI WORLD IMAGERY
                            ============================================== */

                            if (
                                this.value === "esri"
                            ) {

                                esriImagery.addTo(
                                    map
                                );

                            }


                            /* ==============================================
                               GOOGLE SATELLITE
                            ============================================== */

                            else if (
                                this.value === "google"
                            ) {

                                googleSatellite.addTo(
                                    map
                                );

                            }


                            /* ==============================================
                               ESRI STREET MAP
                            ============================================== */

                            else if (
                                this.value === "street"
                            ) {

                                esriStreet.addTo(
                                    map
                                );

                            }


                            /* ==============================================
                               ORTHOPHOTO
                            ============================================== */

                            else if (
                                this.value === "ortho"
                            ) {

                                orthoLayer.addTo(
                                    map
                                );


                                /*
                                 * Debug information
                                 */

                                console.log(
                                    "Orthophoto aktif - L12 sampai L17"
                                );

                            }

                        }
                    );

                }
            );


        /* ======================================================
           KOORDINAT KURSOR
        ====================================================== */

        map.on(
            "mousemove",
            function(e) {

                document
                    .getElementById("latValue")
                    .textContent =
                    e.latlng.lat.toFixed(6);


                document
                    .getElementById("lngValue")
                    .textContent =
                    e.latlng.lng.toFixed(6);

            }
        );


        /* ======================================================
           SIDEBAR TOGGLE
        ====================================================== */

        const sidebar =
            document.getElementById(
                "sidebar"
            );


        const sidebarToggle =
            document.getElementById(
                "sidebarToggle"
            );


        sidebarToggle.addEventListener(
            "click",
            function() {

                sidebar.classList.toggle(
                    "collapsed"
                );


                if (
                    sidebar.classList.contains(
                        "collapsed"
                    )
                ) {

                    sidebarToggle.innerHTML =
                        "▶";

                }

                else {

                    sidebarToggle.innerHTML =
                        "◀";

                }


                /*
                 * Beri waktu agar Leaflet
                 * menyesuaikan ukuran map
                 */

                setTimeout(
                    function() {

                        map.invalidateSize();

                    },
                    350
                );

            }
        );


        /* ======================================================
           DEBUG ORTHOPHOTO
        ====================================================== */

        orthoLayer.on(
            "tileerror",
            function(e) {

                console.warn(
                    "Tile Orthophoto tidak ditemukan:",
                    e.coords
                );

            }
        );


        orthoLayer.on(
            "tileload",
            function(e) {

                console.log(
                    "Tile Orthophoto berhasil:",
                    e.coords
                );

            }
        );

    </script>

</body>
</html>
