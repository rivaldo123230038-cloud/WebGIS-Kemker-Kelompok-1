<!-- =========================================================
     ORTHOPHOTO ARC GIS EXPLODED CACHE
========================================================= -->

<script>

/* =========================================================
   ORTHOPHOTO BASE URL
========================================================= */

const ORTHO_BASE_URL =
    'https://cdn.jsdelivr.net/gh/' +
    'rivaldo123230038-cloud/' +
    'WebGIS-Kemker-Kelompok-1@main/' +
    'Fix_Ortho_web/' +
    '_alllayers/';


/* =========================================================
   RESOLUSI ARC GIS CACHE
   SESUAI conf.xml
========================================================= */

const ORTHO_RESOLUTIONS = {

    12:
        38.21851414258813,

    13:
        19.109257071294063,

    14:
        9.554628535647032,

    15:
        4.777314267823516,

    16:
        2.388657133911758,

    17:
        1.194328566955879,

    18:
        0.5971642834779395

};


/* =========================================================
   ORIGIN ARC GIS WEB MERCATOR
========================================================= */

const ORTHO_ORIGIN_X =
    -20037508.342789244;

const ORTHO_ORIGIN_Y =
     20037508.342789244;


/* =========================================================
   TILE SIZE
========================================================= */

const ORTHO_TILE_SIZE = 256;


/* =========================================================
   KONVERSI LEAFLET TILE
   KE ARC GIS ROW / COLUMN
========================================================= */

function getArcGISTileName(coords){

    const z = coords.z;


    /*
       Orthophoto hanya tersedia
       pada level L12 sampai L18.
    */

    if(
        z < 12 ||
        z > 18
    ){

        return null;

    }


    const resolution =
        ORTHO_RESOLUTIONS[z];


    if(
        !resolution
    ){

        return null;

    }


    const worldTileSize =
        ORTHO_TILE_SIZE *
        resolution;


    /* =====================================================
       COLUMN
    ===================================================== */

    const col =
        Math.floor(

            (
                coords.x *
                ORTHO_TILE_SIZE *
                resolution -

                ORTHO_ORIGIN_X
            )
            /
            worldTileSize

        );


    /* =====================================================
       ROW
    ===================================================== */

    const row =
        Math.floor(

            (
                ORTHO_ORIGIN_Y -

                (
                    coords.y *
                    ORTHO_TILE_SIZE *
                    resolution
                )
            )
            /
            worldTileSize

        );


    if(
        col < 0 ||
        row < 0
    ){

        return null;

    }


    /* =====================================================
       UBAH KE HEXADECIMAL 8 DIGIT
    ===================================================== */

    const rowHex =
        row
        .toString(16)
        .padStart(
            8,
            '0'
        )
        .toLowerCase();


    const colHex =
        col
        .toString(16)
        .padStart(
            8,
            '0'
        )
        .toLowerCase();


    return {

        z:z,

        row:row,

        col:col,

        rowHex:rowHex,

        colHex:colHex

    };

}


/* =========================================================
   CUSTOM ORTHOPHOTO GRID LAYER
========================================================= */

const orthoLayer =
    L.gridLayer({

        tileSize:256,

        minZoom:12,

        maxZoom:18,

        minNativeZoom:12,

        maxNativeZoom:18,

        noWrap:true,

        opacity:1,

        updateWhenIdle:true,

        keepBuffer:2,

        attribution:
            'Orthophoto'

    });


/* =========================================================
   CREATE ORTHOPHOTO TILE
========================================================= */

orthoLayer.createTile =
    function(
        coords,
        done
    ){

        const tile =
            document.createElement(
                'img'
            );


        tile.width =
            256;

        tile.height =
            256;

        tile.alt =
            'Orthophoto';


        tile.setAttribute(
            'role',
            'presentation'
        );


        /* =================================================
           CARI ROW/COLUMN ARC GIS
        ================================================= */

        const tileInfo =
            getArcGISTileName(
                coords
            );


        /*
           Kalau zoom bukan L12-L18,
           jangan request tile.
        */

        if(
            !tileInfo
        ){

            setTimeout(
                function(){

                    done(
                        null,
                        tile
                    );

                },
                0
            );


            return tile;

        }


        /* =================================================
           BENTUK URL TILE
           
           L18/Rxxxxxxxx/Cxxxxxxxx.png
        ================================================= */

        const url =

            ORTHO_BASE_URL +

            'L' +
            tileInfo.z +
            '/' +

            'R' +
            tileInfo.rowHex +
            '/' +

            'C' +
            tileInfo.colHex +
            '.png';


        console.log(
            'ORTHO TILE:',
            url
        );


        /* =================================================
           TILE BERHASIL
        ================================================= */

        tile.onload =
            function(){

                done(
                    null,
                    tile
                );

            };


        /* =================================================
           TILE GAGAL
        ================================================= */

        tile.onerror =
            function(){

                console.warn(
                    'Tile Orthophoto tidak ditemukan:',
                    url
                );


                /*
                   Jangan tampilkan
                   kotak tile error.
                */

                tile.style.display =
                    'none';


                done(
                    null,
                    tile
                );

            };


        tile.src =
            url;


        return tile;

    };


/* =========================================================
   ORTHOPHOTO EVENT
========================================================= */

orthoLayer.on(
    'loading',
    function(){

        const loading =
            document.getElementById(
                'orthoLoading'
            );

        if(loading){

            loading.style.display =
                'block';

        }

    }
);


orthoLayer.on(
    'load',
    function(){

        const loading =
            document.getElementById(
                'orthoLoading'
            );

        if(loading){

            loading.style.display =
                'none';

        }

    }
);


/* =========================================================
   AKTIFKAN ORTHOPHOTO
========================================================= */

orthoLayer.addTo(
    map
);


/* =========================================================
   PASTIKAN GARIS PANTAI DI ATAS ORTHOPHOTO
========================================================= */

if(
    typeof coastline !== 'undefined' &&
    coastline
){

    coastline.bringToFront();

}

</script>
