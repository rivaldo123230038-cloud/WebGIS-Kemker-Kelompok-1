<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>WEBGIS KELOMPOK 1</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

#map {
  position: absolute;
  left: 350px;
  top: 0;
  width: calc(100% - 350px);
  height: 100vh;
  transition: left 0.3s ease, width 0.3s ease;
}

/* =====================================================
   SIDEBAR
   ===================================================== */

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 350px;
  height: 100vh;

  background: #ffffff;

  box-shadow:
    2px 0 12px rgba(0,0,0,0.18);

  z-index: 2000;

  overflow-y: auto;

  transition: transform 0.3s ease;
}

.sidebar.collapsed {
  transform: translateX(-350px);
}

/* =====================================================
   TOGGLE SIDEBAR
   ===================================================== */

.sidebar-toggle {

  position: fixed;

  top: 50%;
  left: 350px;

  width: 34px;
  height: 70px;

  transform: translateY(-50%);

  border: none;

  border-radius: 0 8px 8px 0;

  background: #17324d;

  color: white;

  z-index: 3000;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 22px;

  font-weight: bold;

  box-shadow:
    2px 0 8px rgba(0,0,0,0.25);

  transition:
    left 0.3s ease,
    background 0.2s ease;
}

.sidebar-toggle:hover {
  background: #244e73;
}

.sidebar-toggle.collapsed {
  left: 0;
}

/* =====================================================
   LOGO
   ===================================================== */

.logo-section {

  position: relative;

  z-index: 10;

  display: flex;

  flex-direction: row;

  justify-content: space-between;

  align-items: center;

  width: 100%;

  height: 108px;

  padding: 18px 10px;

  gap: 5px;

  background: #ffffff;

  border-bottom:
    1px solid #eeeeee;
}

.logo-item {

  flex: 1;

  min-width: 0;

  height: 72px;

  display: flex;

  align-items: center;

  justify-content: center;
}

.logo-item img {

  width: 100%;
  height: 100%;

  object-fit: contain;

  display: block;
}

/* =====================================================
   SIDEBAR BODY
   ===================================================== */

.sidebar-body {

  position: relative;

  min-height:
    calc(100vh - 108px);

  overflow-y: auto;

  overflow-x: hidden;
}

/* =====================================================
   BACKGROUND
   ===================================================== */

.sidebar-body::before {

  content: "";

  position: fixed;

  left: 0;

  top: 108px;

  width: 350px;

  height:
    calc(100vh - 108px);

  z-index: 0;

  background-color: #ffffff;

  background-image:
    url("bcg1.jpeg");

  background-repeat: no-repeat;

  background-position: center center;

  background-size: cover;

  opacity: 0.20;

  animation:
    backgroundSlide 18s infinite;

  pointer-events: none;
}

.sidebar-body::after {

  content: "";

  position: fixed;

  left: 0;

  top: 108px;

  width: 350px;

  height:
    calc(100vh - 108px);

  z-index: 1;

  background:
    rgba(255,255,255,0.18);

  pointer-events: none;
}

@keyframes backgroundSlide {

  0%, 28% {
    background-image: url("bcg1.jpeg");
    opacity: 0.20;
  }

  29%, 32% {
    background-image: url("bcg1.jpeg");
    opacity: 0;
  }

  33%, 61% {
    background-image: url("bcg2.jpeg");
    opacity: 0.20;
  }

  62%, 65% {
    background-image: url("bcg2.jpeg");
    opacity: 0;
  }

  66%, 94% {
    background-image: url("bcg3.jpeg");
    opacity: 0.20;
  }

  95%, 99% {
    background-image: url("bcg3.jpeg");
    opacity: 0;
  }

  100% {
    background-image: url("bcg1.jpeg");
    opacity: 0.20;
  }
}

/* =====================================================
   CONTENT
   ===================================================== */

.sidebar-content {
  position: relative;
  z-index: 2;
}

.title-section {

  padding:
    18px 20px 16px;

  text-align: center;

  background:
    rgba(255,255,255,0.72);

  border-bottom:
    1px solid rgba(238,238,238,0.9);
}

.title-section h1 {

  margin: 0;

  font-size: 22px;

  font-weight: 700;

  color: #17324d;

  letter-spacing: 0.5px;
}

.title-section p {

  margin:
    7px 0 0;

  font-size: 12px;

  line-height: 1.4;

  color: #555555;
}

/* =====================================================
   PANEL
   ===================================================== */

.panel-content {
  padding: 18px 20px;
}

.section-title {

  margin-top: 18px;

  margin-bottom: 10px;

  padding-bottom: 7px;

  border-bottom:
    2px solid #17324d;

  color: #17324d;

  font-size: 14px;

  font-weight: bold;

  text-transform: uppercase;
}

.section-title:first-child {
  margin-top: 0;
}

/* =====================================================
   LAYER BOX
   ===================================================== */

.layer-control-box {

  background:
    rgba(255,255,255,0.84);

  border-radius: 7px;

  padding: 10px;

  border:
    1px solid rgba(225,229,232,0.9);

  box-shadow:
    0 1px 4px rgba(0,0,0,0.08);
}

.layer-item {

  display: flex;

  align-items: center;

  gap: 8px;

  padding: 8px 5px;

  font-size: 13px;

  cursor: pointer;
}

.layer-item input {
  cursor: pointer;
}

/* =====================================================
   AUTO ZOOM
   ===================================================== */

.zoom-layer-button {

  width: 100%;

  margin-top: 10px;

  padding: 10px 12px;

  border: none;

  border-radius: 6px;

  background: #17324d;

  color: white;

  font-size: 13px;

  font-weight: bold;

  cursor: pointer;

  transition: 0.2s;
}

.zoom-layer-button:hover {
  background: #244e73;
}

.zoom-layer-button:active {
  transform: scale(0.98);
}

/* =====================================================
   KOORDINAT
   ===================================================== */

.coordinate-box {

  background:
    rgba(255,255,255,0.84);

  border:
    1px solid rgba(225,229,232,0.9);

  border-radius: 7px;

  padding: 12px;

  box-shadow:
    0 1px 4px rgba(0,0,0,0.08);
}

.coordinate-box .label {

  font-size: 11px;

  color: #666666;

  margin-bottom: 3px;
}

.coordinate-box .value {

  font-size: 14px;

  font-weight: bold;

  color: #17324d;

  margin-bottom: 10px;
}

/* =====================================================
   CURSOR
   ===================================================== */

.cursor-box {

  background:
    rgba(23,50,77,0.90);

  color: white;

  border-radius: 7px;

  padding: 10px;

  font-size: 11px;

  line-height: 1.6;
}

/* =====================================================
   FOOTER
   ===================================================== */

.sidebar-footer {

  margin-top: 25px;

  padding:
    15px 20px;

  border-top:
    1px solid rgba(238,238,238,0.9);

  text-align: center;

  font-size: 10px;

  color: #666666;

  line-height: 1.5;

  background:
    rgba(255,255,255,0.72);
}

/* =====================================================
   POPUP
   ===================================================== */

.popup-title {

  font-size: 14px;

  font-weight: bold;

  color: #17324d;

  margin-bottom: 7px;
}

/* =====================================================
   MAP ZOOM BUTTON
   ===================================================== */

.zoom-to-layer-control {
  margin-top: 10px;
}

.zoom-to-layer-button-map {

  width: 38px;
  height: 38px;

  background: white;

  border:
    2px solid rgba(0,0,0,0.2);

  border-radius: 4px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 19px;

  font-weight: bold;

  color: #17324d;

  cursor: pointer;

  box-shadow:
    0 1px 5px rgba(0,0,0,0.25);
}

/* =====================================================
   LEGEND
   ===================================================== */

.map-legend {

  background:
    rgba(255,255,255,0.95);

  padding:
    10px 12px;

  border-radius: 6px;

  border:
    1px solid #cccccc;

  box-shadow:
    0 1px 5px rgba(0,0,0,0.25);

  font-size: 12px;

  line-height: 1.5;

  color: #333333;

  min-width: 150px;

  margin-right: 10px;

  margin-bottom: 10px;
}

.map-legend-title {

  font-weight: bold;

  font-size: 13px;

  color: #17324d;

  margin-bottom: 7px;

  padding-bottom: 4px;

  border-bottom:
    1px solid #dddddd;
}

.legend-item {

  display: flex;

  align-items: center;

  gap: 8px;
}

.legend-line-coastline {

  width: 28px;

  height: 0;

  border-top:
    4px solid #00ffff;

  flex-shrink: 0;
}

/* =====================================================
   RESPONSIVE
   ===================================================== */

@media (max-width:800px) {

  .sidebar {
    width: 280px;
  }

  .sidebar.collapsed {
    transform:
      translateX(-280px);
  }

  #map {

    left: 280px;

    width:
      calc(100% - 280px);
  }

  .sidebar-toggle {
    left: 280px;
  }

  .sidebar-body::before,
  .sidebar-body::after {
    width: 280px;
  }

  .logo-section {

    padding:
      15px 6px;

    gap: 3px;
  }

  .logo-item {
    height: 58px;
  }

  .title-section h1 {
    font-size: 18px;
  }

  .map-legend {

    min-width: 135px;

    font-size: 11px;

    margin-right: 8px;

    margin-bottom: 8px;
  }
}

</style>

</head>

<body>

<!-- =====================================================

<div
  class="sidebar"
  id="sidebar">

  <div class="logo-section">

    <div class="logo-item">
      <img src="ITERA.png" alt="Logo ITERA">
    </div>

    <div class="logo-item">
      <img src="Logo_GT.png" alt="Logo Teknik Geomatika ITERA">
    </div>

    <div class="logo-item">
      <img src="LOGO_GT23.png" alt="Logo Teknik Geomatika 2023">
    </div>

    <div class="logo-item">
      <img src="LOGO_KEMKER.png" alt="Logo Kemah Kerja 2023">
    </div>

  </div>

  <div class="sidebar-body">

    <div class="sidebar-content">

      <div class="title-section">

        <h1>
          WEBGIS KELOMPOK 1
        </h1>

        <p>
          Pemetaan dan Visualisasi Garis Pantai
        </p>

      </div>

      <div class="panel-content">

        <!-- GARIS PANTAI -->

        <div class="section-title">

        </div>

        <div class="layer-control-box">

          <label class="layer-item">

            <input
              type="checkbox"
              id="coastlineCheck"
              checked>

            <span>

            </span>

          </label>

          <button
            type="button"

            class="zoom-layer-button">

          </button>

        </div>

          <label class="layer-item">

            <input
              type="radio"
              name="basemap"
              id="satelliteRadio"
              checked>

            <span>

            </span>

          </label>

          <label class="layer-item">

            <input
              type="radio"
              name="basemap"
              id="streetRadio">

            <span>
              Esri World Street Map
            </span>

          </label>

        </div>

        <!-- ORTHOPHOTO -->

        <div class="section-title">

        </div>

        <div class="layer-control-box">

          <label class="layer-item">

            <input
              type="checkbox"
              id="orthoCheck">

            <span>
              Orthophoto
            </span>

          </label>

        </div>

        <!-- SISTEM KOORDINAT -->

        <div class="section-title">

        </div>

        <div class="coordinate-box">

          <div class="label">

          </div>

          <div class="value">
            WGS 84
          </div>

          </div>

          </div>

          </div>

          </div>

        </div>

  </div>

</div>

<!-- SIDEBAR TOGGLE -->

<button
  id="sidebarToggle"
  class="sidebar-toggle"
  type="button"
  title="Minimize Panel"
  aria-label="Minimize Panel">

  ◀

</button>

<!-- MAP -->

<div id="map"></div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

/* =====================================================
   1. PENGATURAN
   ===================================================== */

const MAP_MAX_ZOOM = 24;

const ORTHO_NATIVE_ZOOM = 18;


/* =====================================================
   2. MAP
   ===================================================== */

const map = L.map(
  'map',
  {
    center: [-5.45,105.25],
    zoom: 10,
    minZoom: 0,
    maxZoom: MAP_MAX_ZOOM,
    zoomControl: true,
    scrollWheelZoom: true,
    doubleClickZoom: true,
    touchZoom: true,
    boxZoom: true
  }
);


/* =====================================================
   3. SIDEBAR
   ===================================================== */

const sidebar =
  document.getElementById('sidebar');

const sidebarToggle =
  document.getElementById('sidebarToggle');

let sidebarCollapsed = false;

sidebarToggle.addEventListener(
  'click',
  function() {

    sidebarCollapsed =
      !sidebarCollapsed;

    if (sidebarCollapsed) {

      sidebar.classList.add('collapsed');

      sidebarToggle.classList.add('collapsed');

      sidebarToggle.innerHTML = '▶';

      sidebarToggle.title =
        'Tampilkan Panel';

      sidebarToggle.setAttribute(
        'aria-label',
        'Tampilkan Panel'
      );

      document.getElementById('map')
        .style.left = '0';

      document.getElementById('map')
        .style.width = '100%';

    }

    else {

      sidebar.classList.remove('collapsed');

      sidebarToggle.classList.remove('collapsed');

      sidebarToggle.innerHTML = '◀';

      sidebarToggle.title =
        'Minimize Panel';

      sidebarToggle.setAttribute(
        'aria-label',
        'Minimize Panel'
      );

      const sidebarWidth =
        window.innerWidth <= 800
          ? '280px'
          : '350px';

      document.getElementById('map')
        .style.left = sidebarWidth;

      document.getElementById('map')
        .style.width =
        `calc(100% - ${sidebarWidth})`;
    }

    setTimeout(
      function() {
        map.invalidateSize();
      },
      320
    );

  }
);


/* =====================================================
   4. ESRI WORLD IMAGERY
   ===================================================== */

const satellite =
  L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

    {
      minZoom: 0,
      maxZoom: MAP_MAX_ZOOM,
      maxNativeZoom: 19,
      tileSize: 256,
      attribution: 'Tiles &copy; Esri'
    }

  );


/* =====================================================
   5. ESRI WORLD STREET MAP
   ===================================================== */

const street =
  L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',

    {
      minZoom: 0,
      maxZoom: MAP_MAX_ZOOM,
      maxNativeZoom: 19,
      tileSize: 256,
      attribution: 'Tiles &copy; Esri'
    }

  );


/* DEFAULT BASEMAP */

satellite.addTo(map);


/* =====================================================
   6. ORTHOPHOTO CUSTOM GRID LAYER
   ===================================================== */

/*
   INI BAGIAN YANG DIPERBAIKI.

   Struktur GitHub:

   Fix_Ortho_web/
      _alllayers/
         L12/
            Rxxxxxxxx/
               Cxxxxxxxx.png
         L13/
         L14/
         L15/
         L16/
         L17/
         L18/

   Contoh:

   L12/R0000083f/C00000cad.png

   Leaflet menghasilkan x/y angka.
   ArcMap membutuhkan hexadecimal 8 digit.
*/


function toArcGISHex(value) {

  return Math.floor(value)
    .toString(16)
    .padStart(8,'0')
    .toLowerCase();

}


const ORTHO_BASE_URL =
  'https://cdn.jsdelivr.net/gh/rivaldo123230038-cloud/WebGIS-Kemker-Kelompok-1@main/Fix_Ortho_web/_alllayers/';


const ortho =
  L.gridLayer({

    tileSize: 256,

    minZoom: 12,

    maxZoom: MAP_MAX_ZOOM,

    maxNativeZoom: ORTHO_NATIVE_ZOOM,

    noWrap: true,

    keepBuffer: 3,

    updateWhenZooming: false,

    updateWhenIdle: true,

    attribution: 'Orthophoto'

  });


ortho.createTile =
  function(coords, done) {

    const tile =
      document.createElement('img');

    tile.width = 256;

    tile.height = 256;

    tile.alt = '';

    tile.setAttribute(
      'role',
      'presentation'
    );

    tile.crossOrigin =
      'anonymous';


    const row =
      toArcGISHex(coords.y);

    const col =
      toArcGISHex(coords.x);

    const z =
      coords.z;


    const url =
      ORTHO_BASE_URL +
      'L' + z +
      '/R' + row +
      '/C' + col +
      '.png';


    tile.onload =
      function() {

        done(null,tile);

      };


    tile.onerror =
      function(error) {

        console.warn(
          'Tile Orthophoto tidak ditemukan:',
          url
        );

        done(error,tile);

      };


    tile.src = url;


    return tile;

  };


/* =====================================================
   7. STYLE GARIS PANTAI
   ===================================================== */

const coastlineStyle = {

  color: '#00ffff',

  weight: 4,

  opacity: 0.95

};


let coastline = null;

let coastlineReady = false;


/* =====================================================
   8. AUTO ZOOM
   ===================================================== */

function zoomToCoastline() {

  if (
    !coastline ||
    !coastlineReady
  ) {

    alert(
      'Garis Pantai RTK belum selesai dimuat.'
    );

    return;

  }


  const bounds =
    coastline.getBounds();


  if (!bounds.isValid()) {

    alert(
      'Batas Garis Pantai RTK tidak valid.'
    );

    return;

  }


  map.fitBounds(

    bounds,

    {
      padding: [40,40],

      maxZoom: 24,

      animate: true
    }

  );

}


/* =====================================================
   9. AUTO ZOOM SIDEBAR
   ===================================================== */

document
  .getElementById('zoomLayerButton')
  .addEventListener(
    'click',
    function() {

      zoomToCoastline();

    }
  );


/* =====================================================
   10. AUTO ZOOM CONTROL PETA
   ===================================================== */

const ZoomToLayerControl =
  L.Control.extend({

    options: {
      position: 'topright'
    },

    onAdd:
      function() {

        const container =
          L.DomUtil.create(
            'div',
            'leaflet-bar zoom-to-layer-control'
          );


        const button =
          L.DomUtil.create(
            'button',
            'zoom-to-layer-button-map',
            container
          );


        button.type =
          'button';

        button.innerHTML =
          '⌖';

        button.title =
          'Auto Zoom to Layer';


        L.DomEvent
          .disableClickPropagation(
            container
          );


        L.DomEvent.on(

          button,

          'click',

          function(e) {

            L.DomEvent
              .stopPropagation(e);

            zoomToCoastline();

          }

        );


        return container;

      }

  });


map.addControl(
  new ZoomToLayerControl()
);


/* =====================================================
   11. POPUP ATRIBUT
   ===================================================== */

function createPopup(properties) {

  let html =
    '<div class="popup-title">' +
    'Informasi Garis Pantai RTK' +
    '</div>';


  const keys =
    Object.keys(
      properties || {}
    );


  if (keys.length === 0) {

    html +=
      'Tidak terdapat atribut.';

  }

  else {

    keys.forEach(
      function(key) {

        let value =
          properties[key];


        if (
          value === null ||
          value === undefined ||
          value === ''
        ) {

          value = '-';

        }


        html +=
          '<b>' +
          key +
          '</b>: ' +
          value +
          '<br>';

      }
    );

  }


  return html;

}


/* =====================================================
   12. LOAD GEOJSON GARIS PANTAI
   ===================================================== */

/*
   PENTING:

   File ini adalah GEOJSON.

   BUKAN Esri JSON.

   Karena itu digunakan:
   L.geoJSON()

   bukan:
   geometry.paths
   feature.attributes
*/


fetch(
  'Garis_Pantai_RTK.geojson'
)

.then(
  function(response) {

    if (!response.ok) {

      throw new Error(
        'HTTP ' +
        response.status +
        ' - File GeoJSON tidak ditemukan.'
      );

    }

    return response.json();

  }
)

.then(
  function(data) {

    console.log(
      'GeoJSON berhasil dibaca:',
      data
    );


    /*
       Deteksi sederhana koordinat.

       Jika angka pertama > 180 atau
       angka kedua > 90, dianggap UTM.

       Jika sudah dalam rentang lon/lat,
       dianggap EPSG:4326.
    */


    function transformCoordinates(
      coordinates
    ) {

      if (
        !Array.isArray(coordinates)
      ) {

        return coordinates;

      }


      if (
        typeof coordinates[0] === 'number'
      ) {

        const x =
          coordinates[0];

        const y =
          coordinates[1];


        /*
           DATA UTM 48S

           EPSG:32748

           UTM Zone 48 South
        */

        if (
          Math.abs(x) > 180 ||
          Math.abs(y) > 90
        ) {

          /*
             Rumus UTM -> WGS84
             tanpa library tambahan.

             Zone = 48
             South hemisphere
          */

          const a = 6378137.0;

          const eccSquared =
            0.00669438;

          const k0 =
            0.9996;

          const e1 =
            (1 -
              Math.sqrt(
                1 - eccSquared
              )
            ) /
            (
              1 +
              Math.sqrt(
                1 - eccSquared
              )
            );


          const xUTM =
            x - 500000.0;

          const yUTM =
            y - 10000000.0;


          const M =
            yUTM / k0;


          const mu =
            M /
            (
              a *
              (
                1 -
                eccSquared / 4 -
                3 *
                eccSquared *
                eccSquared / 64 -
                5 *
                eccSquared *
                eccSquared *
                eccSquared / 256
              )
            );


          const phi1Rad =
            mu +
            (
              3 * e1 / 2 -
              27 *
              Math.pow(e1,3) / 32
            ) *
            Math.sin(2 * mu) +
            (
              21 *
              e1 *
              e1 / 16 -
              55 *
              Math.pow(e1,4) / 32
            ) *
            Math.sin(4 * mu) +
            (
              151 *
              Math.pow(e1,3) / 96
            ) *
            Math.sin(6 * mu) +
            (
              1097 *
              Math.pow(e1,4) / 512
            ) *
            Math.sin(8 * mu);


          const N1 =
            a /
            Math.sqrt(
              1 -
              eccSquared *
              Math.sin(phi1Rad) *
              Math.sin(phi1Rad)
            );


          const T1 =
            Math.tan(phi1Rad) *
            Math.tan(phi1Rad);


          const C1 =
            eccSquared /
            (
              1 - eccSquared
            ) *
            Math.cos(phi1Rad) *
            Math.cos(phi1Rad);


          const R1 =
            a *
            (
              1 - eccSquared
            ) /
            Math.pow(
              1 -
              eccSquared *
              Math.sin(phi1Rad) *
              Math.sin(phi1Rad),
              1.5
            );


          const D =
            xUTM /
            (N1 * k0);


          let lat =
            phi1Rad -
            (
              N1 *
              Math.tan(phi1Rad) /
              R1
            ) *
            (
              D * D / 2 -
              (
                5 +
                3*T1 +
                10*C1 -
                4*C1*C1 -
                9 *
                (
                  eccSquared /
                  (1-eccSquared)
                )
              ) *
              Math.pow(D,4) /
              24 +
              (
                61 +
                90*T1 +
                298*C1 +
                45*T1*T1 -
                252 *
                (
                  eccSquared /
                  (1-eccSquared)
                ) -
                3*C1*C1
              ) *
              Math.pow(D,6) /
              720
            );


          let lon =
            (
              D -
              (
                1 +
                2*T1 +
                C1
              ) *
              Math.pow(D,3) /
              6 +
              (
                5 -
                2*C1 +
                28*T1 -
                3*C1*C1 +
                8 *
                (
                  eccSquared /
                  (1-eccSquared)
                ) +
                24*T1*T1
              ) *
              Math.pow(D,5) /
              120
            ) /
            Math.cos(phi1Rad);


          lat =
            lat *
            180 /
            Math.PI;


          lon =
            48 * 6 -
            183 +
            lon *
            180 /
            Math.PI;


          return [
            lon,
            lat
          ];

        }


        /*
           Kalau sudah geographic:
           [longitude, latitude]
        */

        return [
          x,
          y
        ];

      }


      return coordinates.map(
        transformCoordinates
      );

    }


    /*
       Salin GeoJSON agar data asli
       tidak dirusak.
    */

    const convertedData =
      JSON.parse(
        JSON.stringify(data)
      );


    /*
       Transform geometry
    */

    if (
      convertedData.features
    ) {

      convertedData.features.forEach(
        function(feature) {

          if (
            feature.geometry &&
            feature.geometry.coordinates
          ) {

            feature.geometry.coordinates =
              transformCoordinates(
                feature.geometry.coordinates
              );

          }

        }
      );

    }


    /*
       Buat layer GeoJSON
    */

    coastline =
      L.geoJSON(
        convertedData,
        {

          style:
            function() {

              return coastlineStyle;

            },


          onEachFeature:
            function(
              feature,
              layer
            ) {

              layer.bindPopup(
                createPopup(
                  feature.properties
                )
              );


              layer.on(
                'mouseover',
                function() {

                  this.setStyle({

                    color:
                      '#ff0000',

                    weight:
                      6,

                    opacity:
                      1

                  });

                }
              );


              layer.on(
                'mouseout',
                function() {

                  this.setStyle(
                    coastlineStyle
                  );

                }
              );

            }

        }
      );


    coastlineReady =
      true;


    /*
       Tambahkan ke map
    */

    coastline.addTo(map);


    console.log(
      'Garis Pantai RTK berhasil ditambahkan.'
    );


    console.log(
      'Bounds:',
      coastline.getBounds()
    );


    /*
       Auto zoom setelah layer
       benar-benar tersedia.
    */

    setTimeout(
      function() {

        zoomToCoastline();

      },
      500
    );

  }
)

.catch(
  function(error) {

    console.error(
      'ERROR GARIS PANTAI:',
      error
    );


    alert(

      'Gagal membaca Garis_Pantai_RTK.geojson.\n\n' +

      error.message +

      '\n\n' +

      'Pastikan nama file tepat:\n' +

      'Garis_Pantai_RTK.geojson'

    );

  }
);


/* =====================================================
   13. CHECKBOX GARIS PANTAI
   ===================================================== */

document
  .getElementById('coastlineCheck')
  .addEventListener(
    'change',
    function() {

      if (!coastline) {
        return;
      }


      if (this.checked) {

        coastline.addTo(map);

      }

      else {

        map.removeLayer(
          coastline
        );

      }

    }
  );


/* =====================================================
   14. CHECKBOX ORTHOPHOTO
   ===================================================== */

document
  .getElementById('orthoCheck')
  .addEventListener(
    'change',
    function() {

      if (this.checked) {

        console.log(
          'Memuat Orthophoto...'
        );


        ortho.addTo(map);


        /*
           Pastikan orthophoto berada
           di bawah garis pantai.
        */

        if (coastline) {

          coastline.bringToFront();

        }

      }

      else {

        map.removeLayer(
          ortho
        );

      }

    }
  );


/* =====================================================
   15. ESRI SATELLITE
   ===================================================== */

document
  .getElementById('satelliteRadio')
  .addEventListener(
    'change',
    function() {

      if (this.checked) {

        if (
          map.hasLayer(street)
        ) {

          map.removeLayer(
            street
          );

        }


        satellite.addTo(map);

      }

    }
  );


/* =====================================================
   16. ESRI STREET
   ===================================================== */

document
  .getElementById('streetRadio')
  .addEventListener(
    'change',
    function() {

      if (this.checked) {

        if (
          map.hasLayer(satellite)
        ) {

          map.removeLayer(
            satellite
          );

        }


        street.addTo(map);

      }

    }
  );


/* =====================================================
   17. SCALE BAR
   ===================================================== */

L.control.scale({

  imperial: false,

  metric: true,

  position: 'bottomleft'

}).addTo(map);


/* =====================================================
   18. LEGEND
   ===================================================== */

const legend =
  L.control({

    position:
      'bottomright'

  });


legend.onAdd =
  function() {

    const div =
      L.DomUtil.create(
        'div',
        'map-legend'
      );


    div.innerHTML = `

      <div class="map-legend-title">
        Legenda
      </div>

      <div class="legend-item">

        <span
          class="legend-line-coastline">
        </span>

        <span>
          Garis Pantai RTK
        </span>

      </div>

    `;


    L.DomEvent
      .disableClickPropagation(
        div
      );


    return div;

  };


legend.addTo(map);


/* =====================================================
   19. KOORDINAT KURSOR
   ===================================================== */

map.on(
  'mousemove',
  function(e) {

    document
      .getElementById('latitude')
      .innerHTML =
      e.latlng.lat.toFixed(6);


    document
      .getElementById('longitude')
      .innerHTML =
      e.latlng.lng.toFixed(6);

  }
);


/* =====================================================
   20. DEBUG ZOOM
   ===================================================== */

map.on(
  'zoomend',
  function() {

    console.log(
      'Zoom level:',
      map.getZoom()
    );

  }
);

</script>
