<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>WEBGIS KELOMPOK 1</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

/* =========================================================
   DASAR
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#e9e9e6;

    color:#222;
}


/* =========================================================
   PETA
========================================================= */

#map{

    position:absolute;

    left:350px;
    top:0;

    width:calc(100% - 350px);
    height:100vh;

    transition:
        left .3s ease,
        width .3s ease;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    position:fixed;

    left:0;
    top:0;

    width:350px;
    height:100vh;

    background:#fff;

    box-shadow:
        2px 0 12px rgba(0,0,0,.18);

    z-index:2000;

    overflow:hidden;

    transition:
        transform .3s ease;
}


.sidebar.collapsed{

    transform:
        translateX(-350px);

}


/* =========================================================
   TOMBOL SIDEBAR
========================================================= */

.sidebar-toggle{

    position:fixed;

    top:50%;
    left:350px;

    width:34px;
    height:70px;

    transform:
        translateY(-50%);

    border:none;

    border-radius:
        0 8px 8px 0;

    background:#17324d;

    color:#fff;

    z-index:3000;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:22px;

    font-weight:bold;

    box-shadow:
        2px 0 8px rgba(0,0,0,.25);

    transition:
        left .3s ease,
        background .2s ease;
}


.sidebar-toggle:hover{

    background:#244e73;

}


.sidebar-toggle.collapsed{

    left:0;

}


/* =========================================================
   LOGO
========================================================= */

.logo-section{

    position:relative;

    z-index:10;

    display:flex;

    flex-direction:row;

    justify-content:space-between;

    align-items:center;

    width:100%;
    height:108px;

    padding:18px 10px;

    gap:5px;

    background:#fff;

    border-bottom:
        1px solid #eee;

    flex-shrink:0;
}


.logo-item{

    flex:1;

    min-width:0;

    height:72px;

    display:flex;

    align-items:center;

    justify-content:center;
}


.logo-item img{

    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

}


/* =========================================================
   SIDEBAR BODY
========================================================= */

.sidebar-body{

    position:relative;

    height:
        calc(100vh - 108px);

    min-height:0;

    overflow-y:auto;

    overflow-x:hidden;

    background:transparent;
}


/* =========================================================
   BACKGROUND 3 FOTO
========================================================= */

.background-slideshow{

    position:fixed;

    left:0;
    top:108px;

    width:350px;

    height:
        calc(100vh - 108px);

    overflow:hidden;

    z-index:0;

    pointer-events:none;
}


.bg-photo{

    position:absolute;

    left:0;

    width:100%;
    height:33.333333%;

    margin:0;
    padding:0;

    background-repeat:no-repeat;

    background-position:center center;

    background-size:cover;

    background-color:#fff;

    opacity:.16;

    transition:
        top 1.35s cubic-bezier(.4,0,.2,1),
        opacity .85s ease-in-out,
        filter .85s ease-in-out;
}


.bg-photo.pos-top{

    top:0;

}


.bg-photo.pos-middle{

    top:33.333333%;

}


.bg-photo.pos-bottom{

    top:66.666666%;

}


.background-slideshow.changing .bg-photo{

    opacity:.035;

    filter:
        brightness(1.08);

}


/* =========================================================
   SIDEBAR CONTENT
========================================================= */

.sidebar-content{

    position:relative;

    z-index:2;

    min-height:100%;
}


/* =========================================================
   JUDUL
========================================================= */

.title-section{

    padding:
        18px 20px 16px;

    text-align:center;

    background:
        rgba(255,255,255,.80);

    border-bottom:
        1px solid rgba(238,238,238,.9);
}


.title-section h1{

    margin:0;

    font-size:22px;

    font-weight:700;

    color:#17324d;

    letter-spacing:.5px;
}


.title-section p{

    margin:
        7px 0 0;

    font-size:12px;

    line-height:1.4;

    color:#555;
}


/* =========================================================
   PANEL
========================================================= */

.panel-content{

    padding:
        18px 20px;
}


/* =========================================================
   SECTION TITLE
========================================================= */

.section-title{

    margin-top:18px;

    margin-bottom:10px;

    padding-bottom:7px;

    border-bottom:
        2px solid #17324d;

    color:#17324d;

    font-size:14px;

    font-weight:bold;

    text-transform:uppercase;
}


.section-title:first-child{

    margin-top:0;

}


/* =========================================================
   KOTAK KONTROL
========================================================= */

.layer-control-box{

    background:
        rgba(255,255,255,.88);

    border-radius:6px;

    padding:10px;

    border:
        1px solid rgba(225,229,232,.95);

    box-shadow:
        0 1px 4px rgba(0,0,0,.08);
}


.layer-item{

    display:flex;

    align-items:center;

    gap:8px;

    padding:8px 5px;

    font-size:13px;

    cursor:pointer;
}


.layer-item input{

    cursor:pointer;

}


/* =========================================================
   AUTO ZOOM
========================================================= */

.zoom-layer-button{

    width:100%;

    margin-top:10px;

    padding:
        10px 12px;

    border:none;

    border-radius:5px;

    background:#17324d;

    color:#fff;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}


.zoom-layer-button:hover{

    background:#244e73;

}


.zoom-layer-button:active{

    transform:
        scale(.98);

}


/* =========================================================
   SISTEM KOORDINAT
========================================================= */

.coordinate-box{

    background:
        rgba(255,255,255,.88);

    border:
        1px solid rgba(225,229,232,.95);

    border-radius:6px;

    padding:12px;

    box-shadow:
        0 1px 4px rgba(0,0,0,.08);
}


.coordinate-box .label{

    font-size:11px;

    color:#666;

    margin-bottom:3px;
}


.coordinate-box .value{

    font-size:14px;

    font-weight:bold;

    color:#17324d;

    margin-bottom:10px;
}


/* =========================================================
   KOORDINAT KURSOR
========================================================= */

.cursor-box{

    background:
        rgba(23,50,77,.92);

    color:#fff;

    border-radius:6px;

    padding:10px;

    font-size:11px;

    line-height:1.6;
}


/* =========================================================
   FOOTER
========================================================= */

.sidebar-footer{

    margin-top:25px;

    padding:
        15px 20px;

    border-top:
        1px solid rgba(238,238,238,.9);

    text-align:center;

    font-size:10px;

    color:#666;

    line-height:1.5;

    background:
        rgba(255,255,255,.78);
}


/* =========================================================
   POPUP
========================================================= */

.popup-title{

    font-size:14px;

    font-weight:bold;

    color:#17324d;

    margin-bottom:7px;
}


/* =========================================================
   AUTO ZOOM MAP CONTROL
========================================================= */

.zoom-to-layer-control{

    margin-top:10px;

}


.zoom-to-layer-button-map{

    width:38px;
    height:38px;

    background:#fff;

    border:
        2px solid rgba(0,0,0,.2);

    border-radius:4px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:19px;

    font-weight:bold;

    color:#17324d;

    cursor:pointer;

    box-shadow:
        0 1px 5px rgba(0,0,0,.25);
}


.zoom-to-layer-button-map:hover{

    background:#f0f5f9;

}


/* =========================================================
   LEGENDA
========================================================= */

.map-legend{

    background:
        rgba(255,255,255,.95);

    padding:
        10px 12px;

    border-radius:6px;

    border:
        1px solid #ccc;

    box-shadow:
        0 1px 5px rgba(0,0,0,.25);

    font-size:12px;

    line-height:1.5;

    color:#333;

    min-width:165px;

    margin-right:10px;

    margin-bottom:10px;
}


.map-legend-title{

    font-weight:bold;

    font-size:13px;

    color:#17324d;

    margin-bottom:7px;

    padding-bottom:4px;

    border-bottom:
        1px solid #ddd;
}


.legend-item{

    display:flex;

    align-items:center;

    gap:8px;
}


.legend-line-coastline{

    width:28px;

    height:0;

    border-top:
        4px solid #00ffff;

    flex-shrink:0;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

    .sidebar{

        width:280px;

    }

    .sidebar.collapsed{

        transform:
            translateX(-280px);

    }

    #map{

        left:280px;

        width:
            calc(100% - 280px);

    }

    .sidebar-toggle{

        left:280px;

    }

    .background-slideshow{

        width:280px;

    }

    .logo-section{

        padding:
            15px 6px;

        gap:3px;

    }

    .logo-item{

        height:58px;

    }

    .title-section h1{

        font-size:18px;

    }

    .map-legend{

        min-width:145px;

        font-size:11px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div
    class="sidebar"
    id="sidebar"
>


    <!-- =================================================
         LOGO
    ================================================== -->

    <div class="logo-section">


        <div class="logo-item">

            <img
                src="ITERA.png"
                alt="Logo ITERA"
            >

        </div>


        <div class="logo-item">

            <img
                src="Logo_GT.png"
                alt="Logo Teknik Geomatika ITERA"
            >

        </div>


        <div class="logo-item">

            <img
                src="LOGO_GT23.png"
                alt="Logo Teknik Geomatika Angkatan 2023"
            >

        </div>


        <div class="logo-item">

            <img
                src="LOGO_KEMKER.png"
                alt="Logo Kemah Kerja 2023"
            >

        </div>


    </div>


    <!-- =================================================
         SIDEBAR BODY
    ================================================== -->

    <div class="sidebar-body">


        <!-- =================================================
             BACKGROUND
        ================================================== -->

        <div
            class="background-slideshow"
            id="backgroundSlideshow"
        >


            <div
                class="bg-photo pos-top"
                id="bgPhoto1"
                style="
                    background-image:
                    url('bcg1.jpeg')
                "
            ></div>


            <div
                class="bg-photo pos-middle"
                id="bgPhoto2"
                style="
                    background-image:
                    url('bcg2.jpeg')
                "
            ></div>


            <div
                class="bg-photo pos-bottom"
                id="bgPhoto3"
                style="
                    background-image:
                    url('bcg3.jpeg')
                "
            ></div>


        </div>


        <!-- =================================================
             CONTENT
        ================================================== -->

        <div class="sidebar-content">


            <!-- =============================================
                 JUDUL
            ============================================== -->

            <div class="title-section">

                <h1>
                    WEBGIS KELOMPOK 1
                </h1>

                <p>
                    Pemetaan dan Visualisasi Garis Pantai
                </p>

            </div>


            <!-- =============================================
                 PANEL
            ============================================== -->

            <div class="panel-content">


                <!-- =========================================
                     LAYER
                ========================================== -->

                <div class="section-title">

                </div>


                <div class="layer-control-box">


                    <!-- GARIS PANTAI RTK -->

                    <label class="layer-item">


                        <input
                            type="checkbox"
                            id="coastlineCheck"
                            checked
                        >


                        <span>

                        </span>


                    </label>


                    <!-- ORTHOPHOTO -->

                    <label class="layer-item">


                        <input
                            type="checkbox"
                            id="orthoCheck"
                        >


                        <span>
                            Orthophoto
                        </span>


                    </label>


                    <!-- AUTO ZOOM -->

                    <button
                        type="button"
                        id="zoomLayerButton"
                        class="zoom-layer-button"
                    >

                        ⌖ Auto Zoom to Layer

                    </button>


                </div>


                <!-- =========================================
                     BASE MAP
                ========================================== -->

                <div class="section-title">

                    Base Map

                </div>


                <div class="layer-control-box">


                    <!-- ESRI WORLD IMAGERY -->

                    <label class="layer-item">


                        <input
                            type="radio"
                            name="basemap"
                            id="satelliteRadio"
                            checked
                        >


                        <span>
                            Esri World Imagery
                        </span>


                    </label>


                    <!-- ESRI STREET -->

                    <label class="layer-item">


                        <input
                            type="radio"
                            name="basemap"
                            id="streetRadio"
                        >


                        <span>

                        </span>


                    </label>


                </div>


                <!-- =========================================

                ========================================== -->

                <div class="section-title">

                </div>


                <div class="coordinate-box">


                    <div class="label">

                    </div>


                    <div class="value">
                        WGS 84
                    </div>


                    <div class="label">

                    </div>


                    <div class="value">

                    </div>

                        EPSG
                    </div>


                    <div class="value">
                        EPSG:4326
                    </div>


                </div>

                     KOORDINAT KURSOR
                ========================================== -->

                            id="latitude"

                            -
                        </span>

                    </div>


                    <div>

                        Longitude:

                            -
                        </span>

                    </div>


                </div>

                <div class="sidebar-footer">

                    WEBGIS KELOMPOK 1

            </div>


        </div>


    </div>


</div>


<!-- =====================================================
     TOGGLE SIDEBAR
===================================================== -->

<button
    id="sidebarToggle"
    class="sidebar-toggle"
    type="button"
    title="Minimize Panel"
>

    ◀

</button>


<!-- =====================================================
     MAP
===================================================== -->

<div id="map"></div>


<!-- =====================================================
     LEAFLET
===================================================== -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
>
</script>


<script>

/* =========================================================
   INITIAL MAP
========================================================= */

const map =
    L.map(
        'map',
        {

            center:[
                -5.43,
                105.26
            ],

            zoom:10,

            minZoom:0,

            maxZoom:23,

            zoomControl:true,

            scrollWheelZoom:true,

            doubleClickZoom:true,

            touchZoom:true,

            boxZoom:true

        }
    );


/* =========================================================
   SIDEBAR
========================================================= */

const sidebar =
    document.getElementById(
        'sidebar'
    );


const sidebarToggle =
    document.getElementById(
        'sidebarToggle'
    );


let sidebarCollapsed =
    false;


sidebarToggle.addEventListener(
    'click',
    function(){

        sidebarCollapsed =
            !sidebarCollapsed;


        if(
            sidebarCollapsed
        ){

            sidebar.classList.add(
                'collapsed'
            );

            sidebarToggle.classList.add(
                'collapsed'
            );

            sidebarToggle.innerHTML =
                '▶';

            sidebarToggle.title =
                'Tampilkan Panel';


            document
                .getElementById('map')
                .style.left =
                '0';


            document
                .getElementById('map')
                .style.width =
                '100%';

        }

        else{

            sidebar.classList.remove(
                'collapsed'
            );

            sidebarToggle.classList.remove(
                'collapsed'
            );

            sidebarToggle.innerHTML =
                '◀';

            sidebarToggle.title =
                'Minimize Panel';


            const sidebarWidth =
                window.innerWidth <= 800
                    ? '280px'
                    : '350px';


            document
                .getElementById('map')
                .style.left =
                sidebarWidth;


            document
                .getElementById('map')
                .style.width =
                `calc(100% - ${sidebarWidth})`;

        }


        setTimeout(
            function(){

                map.invalidateSize();

            },
            320
        );

    }
);


/* =========================================================
   ESRI WORLD IMAGERY
========================================================= */

const satellite =
    L.tileLayer(

        'https://server.arcgisonline.com/' +
        'ArcGIS/rest/services/' +
        'World_Imagery/' +
        'MapServer/tile/{z}/{y}/{x}',

        {

            minZoom:0,

            maxZoom:19,

            attribution:
                'Tiles &copy; Esri'

        }

    );


/* =========================================================
   ESRI STREET
========================================================= */

const street =
    L.tileLayer(

        'https://server.arcgisonline.com/' +
        'ArcGIS/rest/services/' +
        'World_Street_Map/' +
        'MapServer/tile/{z}/{y}/{x}',

        {

            minZoom:0,

            maxZoom:19,

            attribution:
                'Tiles &copy; Esri'

        }

    );


/* DEFAULT */

satellite.addTo(
    map
);


/* =========================================================
   ORTHOPHOTO
   L12-L18
========================================================= */

const orthoLayer =
    L.tileLayer(
        '',
        {

            minZoom:12,

            maxZoom:18,

            minNativeZoom:12,

            maxNativeZoom:18,

            tileSize:256,

            noWrap:true,

            opacity:1,

            attribution:
                'Orthophoto'

        }
    );


/* =========================================================
   ORTHOPHOTO URL
========================================================= */

orthoLayer.getTileUrl =
    function(
        coords
    ){

        const z =
            coords.z;


        const x =
            coords.x;


        const y =
            coords.y;


        if(
            z < 12 ||
            z > 18 ||
            x < 0 ||
            y < 0
        ){

            return '';

        }


        const rowHex =

            Math
                .floor(y)
                .toString(16)
                .padStart(
                    8,
                    '0'
                )
                .toLowerCase();


        const colHex =

            Math
                .floor(x)
                .toString(16)
                .padStart(
                    8,
                    '0'
                )
                .toLowerCase();


        return

            'https://raw.githubusercontent.com/' +

            'rivaldo123230038-cloud/' +

            'WebGIS-Kemker-Kelompok-1/' +

            'main/' +

            'Fix_Ortho_web/' +

            '_alllayers/' +

            'L' + z +

            '/' +

            'R' + rowHex +

            '/' +

            'C' + colHex +

            '.png';

    };


/* =========================================================
   ORTHOPHOTO DEBUG
========================================================= */

orthoLayer.on(
    'tileload',
    function(e){

        console.log(
            'ORTHOPHOTO BERHASIL:',
            e.coords
        );

    }
);


orthoLayer.on(
    'tileerror',
    function(e){

        console.error(
            'ORTHOPHOTO GAGAL:',
            e.coords
        );

    }
);


/* =========================================================
   GARIS PANTAI RTK
========================================================= */

const coastlineStyle = {

    color:
        '#00ffff',

    weight:
        4,

    opacity:
        0.95,

    lineCap:
        'round',

    lineJoin:
        'round'

};


let coastline =
    null;


let coastlineReady =
    false;


/* =========================================================
   POPUP GARIS PANTAI RTK
========================================================= */

function createRTKPopup(
    properties
){

    let html =

        '<div style="' +
        'min-width:190px;' +
        'line-height:1.55;' +
        '">';


    html +=

        '<div class="popup-title">' +
        'Garis Pantai RTK' +
        '</div>';


    if(
        properties &&
        Object.keys(
            properties
        ).length > 0
    ){

        Object.keys(
            properties
        ).forEach(
            function(key){

                const value =
                    properties[key];


                const cleanValue =

                    value === null ||
                    value === undefined ||
                    value === ''

                        ? '-'

                        : value;


                html +=

                    '<b>' +
                    key +
                    '</b>: ' +
                    cleanValue +
                    '<br>';

            }
        );

    }

    else{

        html +=
            'Data atribut tidak tersedia.';

    }


    html +=
        '</div>';


    return html;

}


/* =========================================================
   LOAD FILE RTK
   FILE:
   Garis_Pantai_RTK.geojson
========================================================= */

fetch(
    'Garis_Pantai_RTK.geojson'
)

.then(
    function(response){

        if(
            !response.ok
        ){

            throw new Error(
                'Garis_Pantai_RTK.geojson tidak ditemukan.'
            );

        }


        return response.json();

    }
)

.then(
    function(data){

        coastline =

            L.geoJSON(
                data,
                {

                    style:
                        coastlineStyle,


                    onEachFeature:
                        function(
                            feature,
                            layer
                        ){

                            /* POPUP */

                            layer.bindPopup(

                                createRTKPopup(
                                    feature.properties
                                )

                            );


                            /* HOVER */

                            layer.on(
                                'mouseover',
                                function(){

                                    if(
                                        this.setStyle
                                    ){

                                        this.setStyle({

                                            color:
                                                '#ff0000',

                                            weight:
                                                6,

                                            opacity:
                                                1

                                        });

                                    }

                                }
                            );


                            /* HOVER KELUAR */

                            layer.on(
                                'mouseout',
                                function(){

                                    if(
                                        this.setStyle
                                    ){

                                        this.setStyle(
                                            coastlineStyle
                                        );

                                    }

                                }
                            );

                        }

                }
            );


        coastline.addTo(
            map
        );


        coastlineReady =
            true;


        zoomToCoastline();

    }
)

.catch(
    function(error){

        console.error(
            'Gagal membaca Garis_Pantai_RTK.geojson:',
            error
        );


        alert(

            'Garis Pantai RTK tidak dapat dimuat.\n\n' +

            'Pastikan file di GitHub bernama tepat:\n' +

            'Garis_Pantai_RTK.geojson'

        );

    }
);


/* =========================================================
   AUTO ZOOM
========================================================= */

function zoomToCoastline(){

    if(
        !coastline ||
        !coastlineReady ||
        coastline.getLayers().length === 0
    ){

        alert(
            'Layer Garis Pantai RTK belum tersedia.'
        );

        return;

    }


    const bounds =
        coastline.getBounds();


    if(
        !bounds.isValid()
    ){

        alert(
            'Extent Garis Pantai RTK tidak valid.'
        );

        return;

    }


    map.invalidateSize();


    map.fitBounds(
        bounds,
        {

            padding:[
                40,
                40
            ],

            maxZoom:
                16,

            animate:
                true,

            duration:
                1.1

        }
    );

}


/* =========================================================
   AUTO ZOOM SIDEBAR
========================================================= */

document
    .getElementById(
        'zoomLayerButton'
    )
    .addEventListener(
        'click',
        zoomToCoastline
    );


/* =========================================================
   AUTO ZOOM MAP
========================================================= */

const ZoomToLayerControl =
    L.Control.extend({

        options:{
            position:
                'topright'
        },


        onAdd:
            function(){

                const container =
                    L.DomUtil.create(
                        'div',
                        'leaflet-bar zoom-to-layer-control'
                    );


                const button =
                    L.DomUtil.create(
                        'button',
                        'zoom-to-layer-button-map',
                        container
                    );


                button.type =
                    'button';


                button.innerHTML =
                    '⌖';


                button.title =
                    'Auto Zoom ke Garis Pantai RTK';


                L.DomEvent
                    .disableClickPropagation(
                        container
                    );


                L.DomEvent.on(
                    button,
                    'click',
                    function(e){

                        L.DomEvent
                            .stopPropagation(e);


                        zoomToCoastline();

                    }
                );


                return container;

            }

    });


map.addControl(
    new ZoomToLayerControl()
);


/* =========================================================
   CHECKBOX GARIS PANTAI RTK
========================================================= */

document
    .getElementById(
        'coastlineCheck'
    )
    .addEventListener(
        'change',
        function(){

            if(
                !coastline
            ){

                return;

            }


            if(
                this.checked
            ){

                coastline.addTo(
                    map
                );

            }

            else{

                map.removeLayer(
                    coastline
                );

            }

        }
    );


/* =========================================================
   CHECKBOX ORTHOPHOTO
========================================================= */

document
    .getElementById(
        'orthoCheck'
    )
    .addEventListener(
        'change',
        function(){

            if(
                this.checked
            ){

                if(
                    map.getZoom() < 12
                ){

                    map.setZoom(
                        12
                    );

                }


                if(
                    map.getZoom() > 18
                ){

                    map.setZoom(
                        18
                    );

                }


                orthoLayer.addTo(
                    map
                );


                orthoLayer.bringToFront();

            }

            else{

                map.removeLayer(
                    orthoLayer
                );

            }

        }
    );


/* =========================================================
   BASEMAP
========================================================= */

function removeBaseMaps(){

    if(
        map.hasLayer(
            satellite
        )
    ){

        map.removeLayer(
            satellite
        );

    }


    if(
        map.hasLayer(
            street
        )
    ){

        map.removeLayer(
            street
        );

    }

}


/* =========================================================
   ESRI WORLD IMAGERY
========================================================= */

document
    .getElementById(
        'satelliteRadio'
    )
    .addEventListener(
        'change',
        function(){

            if(
                !this.checked
            ){

                return;

            }


            removeBaseMaps();


            satellite.addTo(
                map
            );

        }
    );


/* =========================================================
   ESRI WORLD STREET MAP
========================================================= */

document
    .getElementById(
        'streetRadio'
    )
    .addEventListener(
        'change',
        function(){

            if(
                !this.checked
            ){

                return;

            }


            removeBaseMaps();


            street.addTo(
                map
            );

        }
    );


/* =========================================================
   KOORDINAT KURSOR
========================================================= */

map.on(
    'mousemove',
    function(e){

        document
            .getElementById(
                'latitude'
            )
            .textContent =

            e.latlng.lat.toFixed(6);


        document
            .getElementById(
                'longitude'
            )
            .textContent =

            e.latlng.lng.toFixed(6);

    }
);


/* =========================================================
   SCALE
========================================================= */

L.control.scale({

    imperial:false,

    metric:true,

    position:
        'bottomleft'

}).addTo(
    map
);


/* =========================================================
   LEGENDA
========================================================= */

const legend =
    L.control({

        position:
            'bottomright'

    });


legend.onAdd =
    function(){

        const div =
            L.DomUtil.create(
                'div',
                'map-legend'
            );


        div.innerHTML =

            '<div class="map-legend-title">' +
            'Legenda' +
            '</div>' +

            '<div class="legend-item">' +

            '<span ' +
            'class="legend-line-coastline">' +
            '</span>' +

            '<span>' +
            'Garis Pantai RTK' +
            '</span>' +

            '</div>';


        L.DomEvent
            .disableClickPropagation(
                div
            );


        return div;

    };


legend.addTo(
    map
);


/* =========================================================
   BACKGROUND 3 FOTO
========================================================= */

const bgSlideshow =
    document.getElementById(
        'backgroundSlideshow'
    );


const bgPhoto1 =
    document.getElementById(
        'bgPhoto1'
    );


const bgPhoto2 =
    document.getElementById(
        'bgPhoto2'
    );


const bgPhoto3 =
    document.getElementById(
        'bgPhoto3'
    );


let bgStep =
    0;


function rotateBackgroundPhotos(){

    bgSlideshow.classList.add(
        'changing'
    );


    setTimeout(
        function(){

            bgStep++;


            if(
                bgStep === 1
            ){

                bgPhoto1.className =
                    'bg-photo pos-bottom';

                bgPhoto2.className =
                    'bg-photo pos-top';

                bgPhoto3.className =
                    'bg-photo pos-middle';

            }


            else if(
                bgStep === 2
            ){

                bgPhoto1.className =
                    'bg-photo pos-middle';

                bgPhoto2.className =
                    'bg-photo pos-bottom';

                bgPhoto3.className =
                    'bg-photo pos-top';

            }


            else{

                bgStep =
                    0;

                bgPhoto1.className =
                    'bg-photo pos-top';

                bgPhoto2.className =
                    'bg-photo pos-middle';

                bgPhoto3.className =
                    'bg-photo pos-bottom';

            }


            setTimeout(
                function(){

                    bgSlideshow.classList.remove(
                        'changing'
                    );

                },
                180
            );

        },
        550
    );

}


setInterval(
    rotateBackgroundPhotos,
    5000
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    'resize',
    function(){

        if(
            !sidebarCollapsed
        ){

            const sidebarWidth =
                window.innerWidth <= 800
                    ? '280px'
                    : '350px';


            document
                .getElementById('map')
                .style.left =
                sidebarWidth;


            document
                .getElementById('map')
                .style.width =
                `calc(100% - ${sidebarWidth})`;

        }


        map.invalidateSize();

    }
);

</script>
