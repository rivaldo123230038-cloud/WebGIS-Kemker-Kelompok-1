<script>

/* ============================================================
   PENGATURAN UTAMA
============================================================ */

/*
   MAP BISA ZOOM SAMPAI LEVEL 21.

   Orthophoto asli hanya tersedia:
   L12 - L18

   Pada zoom 19-21:
   Orthophoto akan menggunakan tile L18
   kemudian diperbesar oleh Leaflet.

   Basemap juga menggunakan native tile sampai L18
   kemudian di-upscale sampai zoom 21.
*/

const MAP_MAX_ZOOM = 21;

const ORTHO_MIN_ZOOM = 12;

const ORTHO_NATIVE_ZOOM = 18;


/* ============================================================
   DEFINISI PROYEKSI UTM 48S
============================================================ */

proj4.defs(
    "EPSG:32748",
    "+proj=utm +zone=48 +south +datum=WGS84 +units=m +no_defs +type=crs"
);


/* ============================================================
   INISIALISASI MAP
============================================================ */

const map = L.map("map", {

    center: [-5.4, 105.25],

    zoom: 12,

    minZoom: 4,

    maxZoom: MAP_MAX_ZOOM,

    zoomControl: true,

    worldCopyJump: false

});


/* ============================================================
   ESRI WORLD IMAGERY
============================================================ */

const esriImagery = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {

        attribution:
            "Tiles © Esri",

        minZoom: 0,

        maxZoom: MAP_MAX_ZOOM,

        /*
           TILE ASLI MAKSIMAL L18.

           Di atas L18 Leaflet memperbesar
           tile L18 sehingga tidak terus meminta
           tile yang belum tersedia.
        */

        maxNativeZoom: 18,

        tileSize: 256,

        detectRetina: false,

        noWrap: true,

        updateWhenZooming: false,

        updateWhenIdle: true,

        keepBuffer: 3

    }

);


/* ============================================================
   ESRI WORLD STREET MAP
============================================================ */

const esriStreet = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",

    {

        attribution:
            "Tiles © Esri",

        minZoom: 0,

        maxZoom: MAP_MAX_ZOOM,

        maxNativeZoom: 18,

        tileSize: 256,

        detectRetina: false,

        noWrap: true,

        updateWhenZooming: false,

        updateWhenIdle: true,

        keepBuffer: 3

    }

);


/* ============================================================
   BASEMAP DEFAULT
============================================================ */

esriImagery.addTo(map);


/* ============================================================
   FUNGSI NOMOR TILE ARCGIS
============================================================ */

function toHex(value) {

    return Math.floor(value)
        .toString(16)
        .padStart(8, "0")
        .toLowerCase();

}


/* ============================================================
   HAPUS WHITE NO-DATA DARI TEPI TILE
============================================================ */

function removeWhiteEdge(canvas) {

    try {

        const ctx = canvas.getContext("2d");

        const width = canvas.width;

        const height = canvas.height;


        const imageData =
            ctx.getImageData(
                0,
                0,
                width,
                height
            );


        const data =
            imageData.data;


        const total =
            width * height;


        const visited =
            new Uint8Array(total);


        const queue =
            new Int32Array(total);


        let head = 0;

        let tail = 0;


        function isWhite(index) {

            const r = data[index];

            const g = data[index + 1];

            const b = data[index + 2];

            const a = data[index + 3];


            return (

                a > 0 &&

                r >= 245 &&
                g >= 245 &&
                b >= 245

            );

        }


        function addPixel(x, y) {

            if (
                x < 0 ||
                x >= width ||
                y < 0 ||
                y >= height
            ) {

                return;

            }


            const pos =
                y * width + x;


            if (visited[pos]) {

                return;

            }


            const index =
                pos * 4;


            if (!isWhite(index)) {

                return;

            }


            visited[pos] = 1;

            queue[tail++] = pos;

        }


        /*
           Hanya mulai dari pinggir tile.

           Jadi warna putih yang memang
           merupakan objek di dalam foto
           tidak ikut dihapus.
        */

        for (let x = 0; x < width; x++) {

            addPixel(x, 0);

            addPixel(x, height - 1);

        }


        for (let y = 0; y < height; y++) {

            addPixel(0, y);

            addPixel(width - 1, y);

        }


        while (head < tail) {

            const pos =
                queue[head++];


            const x =
                pos % width;


            const y =
                Math.floor(pos / width);


            const index =
                pos * 4;


            /*
               Jadikan transparan
            */

            data[index + 3] = 0;


            addPixel(x + 1, y);

            addPixel(x - 1, y);

            addPixel(x, y + 1);

            addPixel(x, y - 1);

        }


        ctx.putImageData(
            imageData,
            0,
            0
        );

    }

    catch (error) {

        /*
           Kalau browser menolak akses canvas
           karena CORS, tile tetap ditampilkan
           normal.
        */

        console.warn(
            "White edge tidak dapat diproses:",
            error
        );

    }

}


/* ============================================================
   CUSTOM ORTHOPHOTO GRID LAYER
============================================================ */

const OrthophotoLayer =
    L.GridLayer.extend({

        options: {

            tileSize: 256,

            minZoom: ORTHO_MIN_ZOOM,

            maxZoom: MAP_MAX_ZOOM,

            /*
               Tile asli hanya sampai L18.
            */

            maxNativeZoom: ORTHO_NATIVE_ZOOM,

            noWrap: true,

            updateWhenZooming: false,

            updateWhenIdle: true,

            keepBuffer: 3

        },


        createTile: function(coords, done) {


            /*
               Canvas digunakan agar white no-data
               pada tepi orthophoto dapat dibuat
               transparan.
            */

            const canvas =
                document.createElement("canvas");


            canvas.width = 256;

            canvas.height = 256;


            const ctx =
                canvas.getContext("2d");


            /*
               Tile dari ArcMap Exploded Cache.

               GitHub -> jsDelivr

               Struktur:

               Fix_Ortho_web/
                 _alllayers/
                   L18/
                     Rxxxxxxxx/
                       Cxxxxxxxx.png
            */

            const z =
                coords.z;


            const row =
                toHex(coords.y);


            const col =
                toHex(coords.x);


            const url =
                "https://cdn.jsdelivr.net/gh/" +
                "rivaldo123230038-cloud/" +
                "WebGIS-Kemker-Kelompok-1" +
                "@main/Fix_Ortho_web/" +
                "_alllayers/" +
                "L" + z + "/" +
                "R" + row + "/" +
                "C" + col + ".png";


            const img =
                new Image();


            /*
               Penting untuk canvas
               dan CORS jsDelivr.
            */

            img.crossOrigin = "anonymous";


            img.onload = function() {

                try {

                    ctx.clearRect(
                        0,
                        0,
                        256,
                        256
                    );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        256,
                        256
                    );


                    /*
                       Hilangkan white no-data
                       yang tersambung ke tepi.
                    */

                    removeWhiteEdge(canvas);

                }

                catch (error) {

                    console.warn(
                        "Canvas orthophoto error:",
                        error
                    );

                }


                done(
                    null,
                    canvas
                );

            };


            img.onerror = function() {

                /*
                   Jangan munculkan broken image.

                   Tile kosong saja.
                */

                ctx.clearRect(
                    0,
                    0,
                    256,
                    256
                );


                done(
                    null,
                    canvas
                );

            };


            img.src = url;


            return canvas;

        }

    });


/* ============================================================
   INSTANCE ORTHOPHOTO
============================================================ */

const orthophoto =
    new OrthophotoLayer();


/* ============================================================
   TAMBAHKAN ORTHOPHOTO DEFAULT
============================================================ */

orthophoto.addTo(map);


/* ============================================================
   VARIABEL GARIS PANTAI
============================================================ */

let coastline = null;

let coastlineReady = false;


/* ============================================================
   FUNGSI MENCARI KOORDINAT PERTAMA
============================================================ */

function findFirstCoordinate(coords) {

    if (
        Array.isArray(coords) &&
        coords.length >= 2 &&
        typeof coords[0] === "number" &&
        typeof coords[1] === "number"
    ) {

        return coords;

    }


    if (Array.isArray(coords)) {

        for (const item of coords) {

            const result =
                findFirstCoordinate(item);


            if (result) {

                return result;

            }

        }

    }


    return null;

}


/* ============================================================
   TRANSFORMASI KOORDINAT
============================================================ */

function transformCoordinate(coord) {

    const result =
        proj4(
            "EPSG:32748",
            "EPSG:4326",
            [
                coord[0],
                coord[1]
            ]
        );


    return [
        result[0],
        result[1]
    ];

}


/* ============================================================
   TRANSFORMASI GEOJSON RECURSIVE
============================================================ */

function transformCoordinatesRecursive(
    coords
) {

    if (
        Array.isArray(coords) &&
        coords.length >= 2 &&
        typeof coords[0] === "number" &&
        typeof coords[1] === "number"
    ) {

        return transformCoordinate(coords);

    }


    if (Array.isArray(coords)) {

        return coords.map(
            transformCoordinatesRecursive
        );

    }


    return coords;

}


/* ============================================================
   TRANSFORMASI GEOMETRY
============================================================ */

function transformGeometry(
    geometry
) {

    if (!geometry) {

        return geometry;

    }


    return {

        ...geometry,

        coordinates:
            transformCoordinatesRecursive(
                geometry.coordinates
            )

    };

}


/* ============================================================
   TRANSFORMASI FEATURE
============================================================ */

function transformFeature(
    feature
) {

    return {

        ...feature,

        geometry:
            transformGeometry(
                feature.geometry
            )

    };

}


/* ============================================================
   TRANSFORMASI GEOJSON UTM 48S
============================================================ */

function convertGeoJSONToWGS84(
    geojson
) {

    const firstCoord =
        findFirstCoordinate(
            geojson
        );


    if (!firstCoord) {

        throw new Error(
            "Koordinat GeoJSON tidak ditemukan."
        );

    }


    /*
       Koordinat geografis biasanya:

       longitude = -180 sampai 180
       latitude  = -90 sampai 90

       Kalau nilainya seperti:

       400000
       9400000

       berarti UTM.
    */

    const isUTM =
        Math.abs(firstCoord[0]) > 180 ||
        Math.abs(firstCoord[1]) > 90;


    if (!isUTM) {

        console.log(
            "GeoJSON sudah berupa koordinat geografis."
        );

        return geojson;

    }


    console.log(
        "GeoJSON terdeteksi UTM. Mengubah EPSG:32748 -> EPSG:4326..."
    );


    if (
        geojson.type === "FeatureCollection"
    ) {

        return {

            ...geojson,

            features:
                geojson.features.map(
                    transformFeature
                )

        };

    }


    if (
        geojson.type === "Feature"
    ) {

        return transformFeature(
            geojson
        );

    }


    if (geojson.type) {

        return transformGeometry(
            geojson
        );

    }


    return geojson;

}


/* ============================================================
   POPUP ATRIBUT
============================================================ */

function createPopupContent(
    properties
) {

    if (
        !properties ||
        Object.keys(properties).length === 0
    ) {

        return `
            <div>
                Tidak ada atribut.
            </div>
        `;

    }


    let html =
        `<table class="popup-table">`;


    Object.entries(properties)
        .forEach(
            ([key, value]) => {

                html += `

                    <tr>

                        <td class="popup-key">
                            ${key}
                        </td>

                        <td>
                            ${value ?? "-"}
                        </td>

                    </tr>

                `;

            }
        );


    html += `</table>`;


    return html;

}


/* ============================================================
   STYLE GARIS PANTAI
============================================================ */

function coastlineStyle() {

    return {

        color: "#00ffff",

        weight: 4,

        opacity: 0.95

    };

}


/* ============================================================
   HOVER GARIS PANTAI
============================================================ */

function coastlineHover(e) {

    const layer =
        e.target;


    layer.setStyle({

        color: "red",

        weight: 6,

        opacity: 1

    });

}


/* ============================================================
   MOUSEOUT
============================================================ */

function coastlineOut(e) {

    coastline.resetStyle(
        e.target
    );

}


/* ============================================================
   LOAD GEOJSON
============================================================ */

fetch(
    "Garis_Pantai_RTK.geojson"
)

.then(
    response => {

        if (!response.ok) {

            throw new Error(
                "Garis_Pantai_RTK.geojson tidak ditemukan."
            );

        }

        return response.json();

    }
)

.then(
    data => {


        /*
           UTM 48S -> WGS84
        */

        const converted =
            convertGeoJSONToWGS84(
                data
            );


        /*
           Buat layer
        */

        coastline =
            L.geoJSON(
                converted,

                {

                    style:
                        coastlineStyle,


                    onEachFeature:
                        function(
                            feature,
                            layer
                        ) {


                            /*
                               Popup atribut
                            */

                            layer.bindPopup(
                                createPopupContent(
                                    feature.properties
                                )
                            );


                            /*
                               Hover
                            */

                            layer.on({

                                mouseover:
                                    coastlineHover,

                                mouseout:
                                    coastlineOut

                            });

                        }

                }

            );


        coastline.addTo(map);


        coastlineReady = true;


        /*
           Auto zoom pertama
        */

        setTimeout(
            function() {

                zoomToCoastline();

            },
            500
        );


    }
)

.catch(
    error => {

        console.error(
            "Gagal memuat garis pantai:",
            error
        );

        alert(
            "Garis Pantai RTK tidak dapat dimuat.\n\n" +
            "Pastikan file:\n" +
            "Garis_Pantai_RTK.geojson\n\n" +
            "berada di folder yang sama dengan index.html."
        );

    }
);


/* ============================================================
   AUTO ZOOM GARIS PANTAI
============================================================ */

function zoomToCoastline() {

    if (
        !coastline ||
        !coastlineReady
    ) {

        return;

    }


    const bounds =
        coastline.getBounds();


    if (
        !bounds ||
        !bounds.isValid()
    ) {

        console.warn(
            "Bounds garis pantai tidak valid."
        );

        return;

    }


    /*
       Batasi zoom awal supaya tidak
       terlalu dekat.

       Setelah itu user masih bisa
       zoom sampai level 21.
    */

    map.fitBounds(
        bounds,
        {

            paddingTopLeft:
                [30, 30],

            paddingBottomRight:
                [30, 30],

            maxZoom: 17,

            animate: true

        }
    );

}


/* ============================================================
   CHECKBOX GARIS PANTAI
============================================================ */

document
    .getElementById(
        "coastlineCheck"
    )
    .addEventListener(
        "change",
        function() {

            if (this.checked) {

                if (coastline) {

                    coastline.addTo(map);

                }

            }

            else {

                if (coastline) {

                    map.removeLayer(
                        coastline
                    );

                }

            }

        }
    );


/* ============================================================
   CHECKBOX ORTHOPHOTO
============================================================ */

document
    .getElementById(
        "orthophotoCheck"
    )
    .addEventListener(
        "change",
        function() {

            if (this.checked) {

                orthophoto.addTo(map);

            }

            else {

                map.removeLayer(
                    orthophoto
                );

            }

        }
    );


/* ============================================================
   SWITCH ESRI WORLD IMAGERY
============================================================ */

document
    .getElementById(
        "esriImagery"
    )
    .addEventListener(
        "change",
        function() {

            if (!this.checked) {

                return;

            }


            if (
                map.hasLayer(
                    esriStreet
                )
            ) {

                map.removeLayer(
                    esriStreet
                );

            }


            if (
                !map.hasLayer(
                    esriImagery
                )
            ) {

                esriImagery.addTo(
                    map
                );

            }

        }
    );


/* ============================================================
   SWITCH ESRI STREET
============================================================ */

document
    .getElementById(
        "esriStreet"
    )
    .addEventListener(
        "change",
        function() {

            if (!this.checked) {

                return;

            }


            if (
                map.hasLayer(
                    esriImagery
                )
            ) {

                map.removeLayer(
                    esriImagery
                );

            }


            if (
                !map.hasLayer(
                    esriStreet
                )
            ) {

                esriStreet.addTo(
                    map
                );

            }

        }
    );


/* ============================================================
   SIDEBAR TOGGLE
============================================================ */

const sidebar =
    document.getElementById(
        "sidebar"
    );


const sidebarToggle =
    document.getElementById(
        "sidebarToggle"
    );


sidebarToggle.addEventListener(
    "click",
    function() {

        sidebar.classList.toggle(
            "closed"
        );


        if (
            sidebar.classList.contains(
                "closed"
            )
        ) {

            sidebarToggle.innerHTML =
                "❯";

        }

        else {

            sidebarToggle.innerHTML =
                "❮";

        }


        setTimeout(
            function() {

                map.invalidateSize();

            },
            350
        );

    }
);


/* ============================================================
   KOORDINAT KURSOR
============================================================ */

map.on(
    "mousemove",
    function(e) {

        document
            .getElementById(
                "latValue"
            )
            .textContent =
            e.latlng.lat.toFixed(7);


        document
            .getElementById(
                "lngValue"
            )
            .textContent =
            e.latlng.lng.toFixed(7);

    }
);


/* ============================================================
   SCALE
============================================================ */

L.control.scale({

    imperial: false,

    metric: true,

    position: "bottomleft"

}).addTo(map);


/* ============================================================
   CUSTOM AUTO ZOOM CONTROL
============================================================ */

const AutoZoomControl =
    L.Control.extend({

        options: {

            position: "topright"

        },


        onAdd: function() {

            const container =
                L.DomUtil.create(
                    "div",
                    "autozoom-control"
                );


            container.innerHTML =
                "⌖";


            container.title =
                "Zoom ke Garis Pantai RTK";


            L.DomEvent.disableClickPropagation(
                container
            );


            L.DomEvent.on(
                container,
                "click",
                function() {

                    zoomToCoastline();

                }
            );


            return container;

        }

    });


new AutoZoomControl()
    .addTo(map);


/* ============================================================
   LEGEND
============================================================ */

const legend =
    L.control({
        position: "bottomright"
    });


legend.onAdd =
    function() {

        const div =
            L.DomUtil.create(
                "div",
                "legend"
            );


        div.innerHTML = `

            <div style="font-weight:bold;margin-bottom:6px;">
                LEGEND
            </div>

            <div>
                <span class="legend-line"></span>
                Garis Pantai RTK
            </div>

        `;


        return div;

    };


legend.addTo(map);

);

console.log(
    "Orthophoto native zoom:",

);
