<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>WEBGIS KELOMPOK 1</title>

  <!-- LEAFLET CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    /* =====================================================
       DASAR
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      font-family: Arial, Helvetica, sans-serif;

    }


    /* =====================================================
       PETA
       ===================================================== */

    #map {

      position: absolute;

      left: 350px;
      top: 0;

      width: calc(100% - 350px);
      height: 100vh;

    }


    /* =====================================================
       SIDEBAR
       ===================================================== */

    .sidebar {

      position: fixed;

      left: 0;
      top: 0;

      width: 350px;
      height: 100vh;

      background: #ffffff;

      box-shadow:
        2px 0 12px rgba(0,0,0,0.18);

      z-index: 2000;

      overflow-y: auto;

    }


    /* =====================================================
       BAGIAN LOGO
       ===================================================== */

    .logo-section {

      display: grid;

      grid-template-columns: repeat(2, 1fr);

      justify-items: center;
      align-items: center;

      gap: 10px;

      padding: 20px 30px 16px;

      border-bottom: 1px solid #eeeeee;

    }


    .logo-item {

      width: 105px;
      height: 80px;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

    }


    .logo-item img {

      width: 100%;
      height: 100%;

      object-fit: contain;

    }


    /* =====================================================
       JUDUL
       ===================================================== */

    .title-section {

      padding: 18px 20px 16px;

      text-align: center;

      border-bottom: 1px solid #eeeeee;

    }


    .title-section h1 {

      margin: 0;

      font-size: 22px;

      font-weight: 700;

      color: #17324d;

      letter-spacing: 0.5px;

    }


    .title-section p {

      margin: 7px 0 0;

      font-size: 12px;

      line-height: 1.4;

      color: #666666;

    }


    /* =====================================================
       PANEL CONTENT
       ===================================================== */

    .panel-content {

      padding: 18px 20px;

    }


    /* =====================================================
       JUDUL BAGIAN
       ===================================================== */

    .section-title {

      margin-top: 18px;

      margin-bottom: 10px;

      padding-bottom: 7px;

      border-bottom: 2px solid #17324d;

      color: #17324d;

      font-size: 14px;

      font-weight: bold;

      text-transform: uppercase;

    }


    .section-title:first-child {

      margin-top: 0;

    }


    /* =====================================================
       KOTAK KONTROL
       ===================================================== */

    .layer-control-box {

      background: #f7f9fb;

      border-radius: 7px;

      padding: 10px;

      border: 1px solid #e1e5e8;

    }


    .layer-item {

      display: flex;

      align-items: center;

      gap: 8px;

      padding: 8px 5px;

      font-size: 13px;

      cursor: pointer;

    }


    .layer-item input {

      cursor: pointer;

    }


    /* =====================================================
       SISTEM KOORDINAT
       ===================================================== */

    .coordinate-box {

      background: #f7f9fb;

      border: 1px solid #e1e5e8;

      border-radius: 7px;

      padding: 12px;

    }


    .coordinate-box .label {

      font-size: 11px;

      color: #777777;

      margin-bottom: 3px;

    }


    .coordinate-box .value {

      font-size: 14px;

      font-weight: bold;

      color: #17324d;

      margin-bottom: 10px;

    }


    /* =====================================================
       KOORDINAT KURSOR
       ===================================================== */

    .cursor-box {

      background: #17324d;

      color: white;

      border-radius: 7px;

      padding: 10px;

      font-size: 11px;

      line-height: 1.6;

    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .sidebar-footer {

      margin-top: 25px;

      padding: 15px 20px;

      border-top: 1px solid #eeeeee;

      text-align: center;

      font-size: 10px;

      color: #777777;

      line-height: 1.5;

    }


    /* =====================================================
       POPUP
       ===================================================== */

    .popup-title {

      font-size: 14px;

      font-weight: bold;

      color: #17324d;

      margin-bottom: 7px;

    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 800px) {

      .sidebar {

        width: 280px;

      }

      #map {

        left: 280px;

        width: calc(100% - 280px);

      }

      .logo-section {

        padding: 15px 20px;

        gap: 8px;

      }

      .logo-item {

        width: 85px;
        height: 70px;

      }

      .title-section h1 {

        font-size: 18px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       SIDEBAR
       ===================================================== -->

  <div class="sidebar">


    <!-- ===================================================
         4 LOGO
         =================================================== -->

    <div class="logo-section">


      <!-- LOGO ITERA -->

      <div class="logo-item">

        <img
          src="ITERA.jpeg"
          alt="Logo ITERA"
        >

      </div>


      <!-- LOGO TEKNIK GEOMATIKA ANGKATAN 2023 -->

      <div class="logo-item">

        <img
          src="LOGO_GT23.png"
          alt="Logo Teknik Geomatika Angkatan 2023"
        >

      </div>


      <!-- LOGO KEMAH KERJA -->

      <div class="logo-item">

        <img
          src="LOGO_KEMKER.png"
          alt="Logo Kemah Kerja"
        >

      </div>


      <!-- LOGO TEKNIK GEOMATIKA -->

      <div class="logo-item">

        <img
          src="Logo_GT.png"
          alt="Logo Teknik Geomatika"
        >

      </div>


    </div>


    <!-- ===================================================
         JUDUL
         =================================================== -->

    <div class="title-section">

      <h1>
        WEBGIS KELOMPOK 1
      </h1>

      <p>
        Pemetaan dan Visualisasi Garis Pantai
      </p>

    </div>


    <!-- ===================================================
         PANEL KONTROL
         =================================================== -->

    <div class="panel-content">


      <!-- =================================================
           GARIS PANTAI
           ================================================= -->

      <div class="section-title">

        Garis Pantai

      </div>


      <div class="layer-control-box">

        <label class="layer-item">

          <input
            type="checkbox"
            id="coastlineCheck"
            checked
          >

          <span>
            Garis Pantai
          </span>

        </label>

      </div>


      <!-- =================================================
           BASE MAP
           ================================================= -->

      <div class="section-title">

        Base Map

      </div>


      <div class="layer-control-box">


        <!-- WORLD IMAGERY -->

        <label class="layer-item">

          <input
            type="radio"
            name="basemap"
            id="satelliteRadio"
            checked
          >

          <span>
            Esri World Imagery
          </span>

        </label>


        <!-- WORLD STREET MAP -->

        <label class="layer-item">

          <input
            type="radio"
            name="basemap"
            id="streetRadio"
          >

          <span>
            Esri World Street Map
          </span>

        </label>


      </div>


      <!-- =================================================
           SISTEM KOORDINAT
           ================================================= -->

      <div class="section-title">

        Sistem Koordinat

      </div>


      <div class="coordinate-box">


        <div class="label">

          Datum

        </div>


        <div class="value">

          WGS 84

        </div>


        <div class="label">

          Sistem Koordinat

        </div>


        <div class="value">

          Geographic Coordinate System

        </div>


        <div class="label">

          EPSG

        </div>


        <div class="value">

          EPSG:4326

        </div>


      </div>


      <!-- =================================================
           KOORDINAT KURSOR
           ================================================= -->

      <div class="section-title">

        Koordinat Kursor

      </div>


      <div class="cursor-box">


        <div>

          Latitude:

          <span id="latitude">
            -
          </span>

        </div>


        <div>

          Longitude:

          <span id="longitude">
            -
          </span>

        </div>


      </div>


    </div>


    <!-- ===================================================
         FOOTER
         =================================================== -->

    <div class="sidebar-footer">

      WEBGIS KELOMPOK 1
      <br>

      Teknik Geomatika ITERA
      <br>

      Kemah Kerja 2026

    </div>


  </div>


  <!-- =====================================================
       MAP
       ===================================================== -->

  <div id="map"></div>


  <!-- =====================================================
       LEAFLET JS
       ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>


    /* =====================================================
       1. INISIALISASI PETA
       ===================================================== */

    const map = L.map('map', {

      center: [-5.45, 105.25],

      zoom: 10,

      zoomControl: true

    });


    /* =====================================================
       2. ESRI WORLD IMAGERY
       ===================================================== */

    const satellite = L.tileLayer(

      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

      {

        maxZoom: 19,

        attribution:
          'Tiles &copy; Esri'

      }

    );


    /* =====================================================
       3. ESRI WORLD STREET MAP
       ===================================================== */

    const street = L.tileLayer(

      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',

      {

        maxZoom: 19,

        attribution:
          'Tiles &copy; Esri'

      }

    );


    /* =====================================================
       4. BASEMAP DEFAULT
       ===================================================== */

    satellite.addTo(map);


    /* =====================================================
       5. STYLE GARIS PANTAI
       ===================================================== */

    const coastlineStyle = {

      color: '#00ffff',

      weight: 4,

      opacity: 0.95

    };


    /* =====================================================
       6. KONVERSI ESRI JSON
       ===================================================== */

    function convertEsriJSON(data) {


      const coastlineGroup =
        L.featureGroup();


      /* ---------------------------------------------------
         CEK FEATURES
         --------------------------------------------------- */

      if (!data.features) {

        console.error(
          'GP_RT.json tidak memiliki features.'
        );

        return coastlineGroup;

      }


      /* ---------------------------------------------------
         LOOP FEATURES
         --------------------------------------------------- */

      data.features.forEach(

        function(feature) {


          const geometry =
            feature.geometry || {};


          const attributes =
            feature.attributes || {};


          /* ------------------------------------------------
             CEK PATH
             ------------------------------------------------ */

          if (!geometry.paths) {

            return;

          }


          /* ------------------------------------------------
             LOOP PATH
             ------------------------------------------------ */

          geometry.paths.forEach(

            function(path) {


              /* ==========================================
                 KONVERSI KOORDINAT
                 ==========================================

                 ESRI JSON:

                 [X,Y]

                 X = Longitude
                 Y = Latitude

                 Leaflet:

                 [Latitude,Longitude]
              ========================================== */

              const latLngs =

                path.map(

                  function(point) {

                    return [

                      point[1],

                      point[0]

                    ];

                  }

                );


              /* ==========================================
                 BUAT GARIS
                 ========================================== */

              const line =

                L.polyline(

                  latLngs,

                  coastlineStyle

                );


              /* ==========================================
                 POPUP
                 ========================================== */

              let html =

                '<div>' +

                '<div class="popup-title">' +

                'Informasi Garis Pantai' +

                '</div>';


              const keys =

                Object.keys(attributes);


              if (keys.length === 0) {


                html +=

                  'Tidak terdapat atribut.';


              }

              else {


                keys.forEach(

                  function(key) {


                    let value =
                      attributes[key];


                    if (

                      value === null ||

                      value === undefined ||

                      value === ''

                    ) {

                      value = '-';

                    }


                    html +=

                      '<b>' +

                      key +

                      '</b>: ' +

                      value +

                      '<br>';

                  }

                );

              }


              html +=

                '</div>';


              line.bindPopup(html);


              /* ==========================================
                 HOVER GARIS
                 ========================================== */

              line.on(

                'mouseover',

                function() {


                  this.setStyle({

                    color: '#ff0000',

                    weight: 6

                  });


                }

              );


              line.on(

                'mouseout',

                function() {


                  this.setStyle(

                    coastlineStyle

                  );


                }

              );


              /* ==========================================
                 TAMBAHKAN KE GROUP
                 ========================================== */

              coastlineGroup.addLayer(line);


            }

          );


        }

      );


      return coastlineGroup;

    }


    /* =====================================================
       7. LOAD GP_RT.JSON
       ===================================================== */

    fetch('GP_RT.json')


      .then(

        function(response) {


          /* -----------------------------------------------
             CEK FILE
             ----------------------------------------------- */

          if (!response.ok) {

            throw new Error(

              'GP_RT.json tidak ditemukan.'

            );

          }


          return response.json();


        }

      )


      .then(

        function(data) {


          console.log(

            'GP_RT.json berhasil dimuat:',

            data

          );


          /* -----------------------------------------------
             KONVERSI DATA
             ----------------------------------------------- */

          const coastline =

            convertEsriJSON(data);


          /* -----------------------------------------------
             TAMBAHKAN KE PETA
             ----------------------------------------------- */

          coastline.addTo(map);


          /* -----------------------------------------------
             ZOOM OTOMATIS
             ----------------------------------------------- */

          if (

            coastline.getLayers().length > 0

          ) {


            const bounds =

              coastline.getBounds();


            if (bounds.isValid()) {


              map.fitBounds(

                bounds,

                {

                  padding: [

                    30,

                    30

                  ]

                }

              );


            }


          }


          /* -----------------------------------------------
             CHECKBOX GARIS PANTAI
             ----------------------------------------------- */

          document

            .getElementById(

              'coastlineCheck'

            )

            .addEventListener(

              'change',

              function() {


                if (this.checked) {


                  coastline.addTo(map);


                }

                else {


                  map.removeLayer(

                    coastline

                  );


                }


              }

            );


        }

      )


      .catch(

        function(error) {


          console.error(error);


          alert(

            'Gagal membaca GP_RT.json.\n\n' +

            'Pastikan file GP_RT.json berada ' +

            'satu folder dengan index.html.'

          );


        }

      );


    /* =====================================================
       8. GANTI KE WORLD IMAGERY
       ===================================================== */

    document

      .getElementById(

        'satelliteRadio'

      )

      .addEventListener(

        'change',

        function() {


          if (this.checked) {


            map.removeLayer(

              street

            );


            satellite.addTo(map);


          }


        }

      );


    /* =====================================================
       9. GANTI KE WORLD STREET MAP
       ===================================================== */

    document

      .getElementById(

        'streetRadio'

      )

      .addEventListener(

        'change',

        function() {


          if (this.checked) {


            map.removeLayer(

              satellite

            );


            street.addTo(map);


          }


        }

      );


    /* =====================================================
       10. SCALE BAR
       ===================================================== */

    L.control.scale({

      imperial: false,

      metric: true,

      position: 'bottomleft'

    }).addTo(map);


    /* =====================================================
       11. KOORDINAT KURSOR
       ===================================================== */

    map.on(

      'mousemove',

      function(e) {


        document

          .getElementById(

            'latitude'

          )

          .innerHTML =

          e.latlng.lat.toFixed(6);


        document

          .getElementById(

            'longitude'

          )

          .innerHTML =

          e.latlng.lng.toFixed(6);


      }

    );


  </script>


</body>

</html>
