<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>WEBGIS KELOMPOK 1</title>


  <!-- =====================================================
       LEAFLET CSS
       ===================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    /* =====================================================
       DASAR
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      font-family: Arial, Helvetica, sans-serif;

      overflow: hidden;
    }


    /* =====================================================
       PETA
       ===================================================== */

    #map {

      position: absolute;

      left: 350px;
      top: 0;

      width: calc(100% - 350px);
      height: 100vh;

      transition:
        left 0.3s ease,
        width 0.3s ease;
    }


    /*
     * Warna dasar peta ketika Orthophoto aktif
     * tetapi tile belum tersedia.
     */
    .leaflet-container {

      background:
        #e5e5e5;
    }


    /* =====================================================
       SIDEBAR
       ===================================================== */

    .sidebar {

      position: fixed;

      left: 0;
      top: 0;

      width: 350px;
      height: 100vh;

      background: #ffffff;

      box-shadow:
        2px 0 12px rgba(0, 0, 0, 0.18);

      z-index: 2000;

      overflow-y: auto;

      transition:
        transform 0.3s ease;
    }


    /* =====================================================
       SIDEBAR MINIMIZE
       ===================================================== */

    .sidebar.collapsed {

      transform:
        translateX(-350px);
    }


    /* =====================================================
       TOMBOL PANAH SIDEBAR
       ===================================================== */

    .sidebar-toggle {

      position: fixed;

      top: 50%;
      left: 350px;

      width: 34px;
      height: 70px;

      transform:
        translateY(-50%);

      border: none;

      border-radius:
        0 8px 8px 0;

      background: #17324d;

      color: white;

      z-index: 3000;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 22px;

      font-weight: bold;

      box-shadow:
        2px 0 8px rgba(0, 0, 0, 0.25);

      transition:
        left 0.3s ease,
        background 0.2s ease;
    }


    .sidebar-toggle:hover {

      background: #244e73;
    }


    .sidebar-toggle.collapsed {

      left: 0;

      border-radius:
        0 8px 8px 0;
    }


    /* =====================================================
       4 LOGO SEJAJAR
       ===================================================== */

    .logo-section {

      position: relative;

      z-index: 10;

      display: flex;

      flex-direction: row;

      justify-content: space-between;

      align-items: center;

      width: 100%;

      height: 108px;

      padding: 18px 10px;

      gap: 5px;

      background: #ffffff;

      border-bottom:
        1px solid #eeeeee;
    }


    .logo-item {

      flex: 1;

      min-width: 0;

      height: 72px;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    .logo-item img {

      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;
    }


    /* =====================================================
       SIDEBAR BODY
       ===================================================== */

    .sidebar-body {

      position: relative;

      min-height:
        calc(100vh - 108px);

      overflow-y: auto;

      overflow-x: hidden;

      background:
        #ffffff;
    }


    /* =====================================================
       BACKGROUND 3 FOTO

       SEMUA FOTO TAMPIL BERSAMAAN

       AWAL:
       FOTO 1 = ATAS
       FOTO 2 = TENGAH
       FOTO 3 = BAWAH

       LALU BERPUTAR
       ===================================================== */

    .background-slideshow {

      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      z-index: 0;

      pointer-events: none;
    }


    .bg-photo {

      position: absolute;

      left: 0;

      width: 100%;

      height: 33.333333%;

      background-repeat:
        no-repeat;

      background-position:
        center center;

      background-size:
        contain;

      background-color:
        #ffffff;

      opacity:
        0.20;

      filter:
        brightness(1);

      transition:
        top 1.35s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.9s ease-in-out,
        filter 0.9s ease-in-out;
    }


    /* =====================================================
       POSISI ATAS
       ===================================================== */

    .bg-photo.pos-top {

      top: 0;
    }


    /* =====================================================
       POSISI TENGAH
       ===================================================== */

    .bg-photo.pos-middle {

      top: 33.333333%;
    }


    /* =====================================================
       POSISI BAWAH
       ===================================================== */

    .bg-photo.pos-bottom {

      top: 66.666666%;
    }


    /* =====================================================
       EFEK BERKEDIP / FADE SMOOTH
       ===================================================== */

    .background-slideshow.changing
    .bg-photo {

      opacity:
        0.035;

      filter:
        brightness(1.12);
    }


    /* =====================================================
       ISI SIDEBAR DI ATAS FOTO
       ===================================================== */

    .sidebar-content {

      position: relative;

      z-index: 2;
    }


    /* =====================================================
       JUDUL
       ===================================================== */

    .title-section {

      padding:
        18px 20px 16px;

      text-align: center;

      background:
        rgba(255, 255, 255, 0.72);

      border-bottom:
        1px solid rgba(238, 238, 238, 0.9);
    }


    .title-section h1 {

      margin: 0;

      font-size: 22px;

      font-weight: 700;

      color: #17324d;

      letter-spacing: 0.5px;
    }


    .title-section p {

      margin:
        7px 0 0;

      font-size: 12px;

      line-height: 1.4;

      color: #555555;
    }


    /* =====================================================
       PANEL
       ===================================================== */

    .panel-content {

      padding:
        18px 20px;
    }


    /* =====================================================
       JUDUL BAGIAN
       ===================================================== */

    .section-title {

      margin-top: 18px;

      margin-bottom: 10px;

      padding-bottom: 7px;

      border-bottom:
        2px solid #17324d;

      color: #17324d;

      font-size: 14px;

      font-weight: bold;

      text-transform: uppercase;
    }


    .section-title:first-child {

      margin-top: 0;
    }


    /* =====================================================
       KOTAK KONTROL
       ===================================================== */

    .layer-control-box {

      background:
        rgba(255, 255, 255, 0.84);

      border-radius: 7px;

      padding: 10px;

      border:
        1px solid rgba(225, 229, 232, 0.9);

      box-shadow:
        0 1px 4px rgba(0, 0, 0, 0.08);
    }


    .layer-item {

      display: flex;

      align-items: center;

      gap: 8px;

      padding: 8px 5px;

      font-size: 13px;

      cursor: pointer;
    }


    .layer-item input {

      cursor: pointer;
    }


    /* =====================================================
       TOMBOL AUTO ZOOM
       ===================================================== */

    .zoom-layer-button {

      width: 100%;

      margin-top: 10px;

      padding: 10px 12px;

      border: none;

      border-radius: 6px;

      background: #17324d;

      color: white;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }


    .zoom-layer-button:hover {

      background: #244e73;
    }


    .zoom-layer-button:active {

      transform:
        scale(0.98);
    }


    /* =====================================================
       SISTEM KOORDINAT
       ===================================================== */

    .coordinate-box {

      background:
        rgba(255, 255, 255, 0.84);

      border:
        1px solid rgba(225, 229, 232, 0.9);

      border-radius: 7px;

      padding: 12px;

      box-shadow:
        0 1px 4px rgba(0, 0, 0, 0.08);
    }


    .coordinate-box .label {

      font-size: 11px;

      color: #666666;

      margin-bottom: 3px;
    }


    .coordinate-box .value {

      font-size: 14px;

      font-weight: bold;

      color: #17324d;

      margin-bottom: 10px;
    }


    /* =====================================================
       KOORDINAT KURSOR
       ===================================================== */

    .cursor-box {

      background:
        rgba(23, 50, 77, 0.90);

      color: white;

      border-radius: 7px;

      padding: 10px;

      font-size: 11px;

      line-height: 1.6;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .sidebar-footer {

      margin-top: 25px;

      padding:
        15px 20px;

      border-top:
        1px solid rgba(238, 238, 238, 0.9);

      text-align: center;

      font-size: 10px;

      color: #666666;

      line-height: 1.5;

      background:
        rgba(255, 255, 255, 0.72);
    }


    /* =====================================================
       POPUP
       ===================================================== */

    .popup-title {

      font-size: 14px;

      font-weight: bold;

      color: #17324d;

      margin-bottom: 7px;
    }


    /* =====================================================
       AUTO ZOOM CONTROL DI PETA
       ===================================================== */

    .zoom-to-layer-control {

      margin-top: 10px;
    }


    .zoom-to-layer-button-map {

      width: 38px;
      height: 38px;

      background: white;

      border:
        2px solid rgba(0, 0, 0, 0.2);

      border-radius: 4px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 19px;

      font-weight: bold;

      color: #17324d;

      cursor: pointer;

      box-shadow:
        0 1px 5px rgba(0, 0, 0, 0.25);

      transition:
        0.2s;
    }


    .zoom-to-layer-button-map:hover {

      background:
        #f0f5f9;
    }


    /* =====================================================
       LEGENDA KANAN BAWAH
       ===================================================== */

    .map-legend {

      background:
        rgba(255, 255, 255, 0.95);

      padding:
        10px 12px;

      border-radius: 6px;

      border:
        1px solid #cccccc;

      box-shadow:
        0 1px 5px rgba(0, 0, 0, 0.25);

      font-size: 12px;

      line-height: 1.5;

      color: #333333;

      min-width: 150px;

      margin-right: 10px;

      margin-bottom: 10px;
    }


    .map-legend-title {

      font-weight: bold;

      font-size: 13px;

      color: #17324d;

      margin-bottom: 7px;

      padding-bottom: 4px;

      border-bottom:
        1px solid #dddddd;
    }


    .legend-item {

      display: flex;

      gap: 8px;
    }


    .legend-line-coastline {

      width: 28px;

    /* =====================================================
       RESPONSIVE
       ===================================================== */

      .sidebar {

      .sidebar.collapsed {

        transform:

      #map {

      }


      .map-legend {

        min-width: 135px;

        font-size: 11px;

        margin-right: 8px;

        margin-bottom: 8px;
      }

    }

  </style>

</head>

  <!-- =====================================================

       GANTI API KEY

    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&v=weekly">

  <!-- =====================================================
       GOOGLE MUTANT
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/leaflet.gridlayer.googlemutant@0.16.0/dist/Leaflet.GoogleMutant.js">
  </script>


  <script>


    /* =====================================================
       1. INISIALISASI PETA
       ===================================================== */

    const map = L.map(
      'map',
      {

        center:
          [-5.45, 105.25],

        zoom:
          10,

        minZoom:
          0,

        maxZoom:
          23,

        zoomControl:
          true,

        scrollWheelZoom:
          true,

        doubleClickZoom:
          true,

        touchZoom:
          true,

        boxZoom:
          true

      }
    );


    /* =====================================================
       2. SIDEBAR TOGGLE
       ===================================================== */

    const sidebar =
      document.getElementById(
        'sidebar'
      );


    const sidebarToggle =
      document.getElementById(
        'sidebarToggle'
      );


    let sidebarCollapsed =
      false;


    sidebarToggle.addEventListener(

      'click',

      function() {


        sidebarCollapsed =
          !sidebarCollapsed;


        if (sidebarCollapsed) {


          sidebar.classList.add(
            'collapsed'
          );


          sidebarToggle.classList.add(
            'collapsed'
          );


          sidebarToggle.innerHTML =
            '▶';


          sidebarToggle.title =
            'Tampilkan Panel';


          sidebarToggle.setAttribute(
            'aria-label',
            'Tampilkan Panel'
          );


          document
            .getElementById('map')
            .style.left =
            '0';


          document
            .getElementById('map')
            .style.width =
            '100%';

        }


        else {


          sidebar.classList.remove(
            'collapsed'
          );


          sidebarToggle.classList.remove(
            'collapsed'
          );


          sidebarToggle.innerHTML =
            '◀';


          sidebarToggle.title =
            'Minimize Panel';


          sidebarToggle.setAttribute(
            'aria-label',
            'Minimize Panel'
          );


          const sidebarWidth =
            window.innerWidth <= 800
              ? '280px'
              : '350px';


          document
            .getElementById('map')
            .style.left =
            sidebarWidth;


          document
            .getElementById('map')
            .style.width =
            `calc(100% - ${sidebarWidth})`;

        }


        setTimeout(

          function() {

            map.invalidateSize();

          },

          320

        );

      }

    );


    /* =====================================================
       3. ESRI WORLD IMAGERY
       ===================================================== */

    const satellite =
      L.tileLayer(

        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

        {

          minZoom:
            0,

          maxZoom:
            19,

          attribution:
            'Tiles &copy; Esri'

        }

      );


    /* =====================================================
       4. ESRI WORLD STREET MAP
       ===================================================== */

    const street =
      L.tileLayer(

        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',

        {

          minZoom:
            0,

          maxZoom:
            19,

          attribution:
            'Tiles &copy; Esri'

        }

      );


    /* =====================================================
       5. GOOGLE SATELLITE
       ===================================================== */

    const googleSatellite =
      L.gridLayer.googleMutant({

        type:
          'satellite',

        minZoom:
          0,

        maxZoom:
          23

      });


    /* =====================================================
       6. ORTHOPHOTO ARCMAP EXPLODED CACHE

       HANYA:
       L12 - L17

       TIDAK ADA ESRI FALLBACK.

       STRUKTUR:
       Fix_Ortho_web/
       └── _alllayers/
           ├── L12/
           │   └── Rxxxxxxxx/
           │       └── Cxxxxxxxx.png
           ├── L13/
           ├── L14/
           ├── L15/
           ├── L16/
           └── L17/
       ===================================================== */

    let orthoErrorCount = 0;


    const orthoLayer =
      L.tileLayer(
        '',
        {

          minZoom:
            12,

          maxZoom:
            17,

          minNativeZoom:
            12,

          maxNativeZoom:
            17,

          tileSize:
            256,

          noWrap:
            true,

          opacity:
            1,

          attribution:
            'Orthophoto'

        }
      );


    /* =====================================================
       7. URL TILE ORTHOPHOTO
       ===================================================== */

    orthoLayer.getTileUrl =
      function(coords) {


        const z =
          coords.z;


        const x =
          coords.x;


        const y =
          coords.y;


        /*
         * HANYA LEVEL L12-L17
         */

        if (
          z < 12 ||
          z > 17
        ) {

          return '';

        }


        /*
         * TIDAK BOLEH NEGATIF
         */

        if (
          x < 0 ||
          y < 0
        ) {

          return '';

        }


        /*
         * ROW ARCMAP
         */

        const rowHex =
          Math.floor(y)
            .toString(16)
            .padStart(
              8,
              '0'
            )
            .toLowerCase();


        /*
         * COLUMN ARCMAP
         */

        const colHex =
          Math.floor(x)
            .toString(16)
            .padStart(
              8,
              '0'
            )
            .toLowerCase();


        /*
         * URL FINAL
         */

        const url =

          'Fix_Ortho_web/' +
          '_alllayers/' +
          'L' + z +
          '/' +
          'R' + rowHex +
          '/' +
          'C' + colHex +
          '.png';


        console.log(
          'ORTHOPHOTO REQUEST:',
          url
        );


        return url;

      };


    /* =====================================================
       8. BASEMAP DEFAULT
       ===================================================== */

    satellite.addTo(map);


    /* =====================================================
       9. STYLE GARIS PANTAI
       ===================================================== */

    const coastlineStyle = {

      color:
        '#00ffff',

      weight:
        4,

      opacity:
        0.95

    };


    /* =====================================================
       10. VARIABEL GARIS PANTAI
       ===================================================== */

    let coastline =
      null;


    /* =====================================================
       11. AUTO ZOOM
       ===================================================== */

    function zoomToCoastline() {


      if (

        coastline &&

        coastline.getLayers().length > 0

      ) {


        const bounds =
          coastline.getBounds();


        if (bounds.isValid()) {


          map.fitBounds(

            bounds,

            {

              padding:
                [40, 40],

              maxZoom:
                16

            }

          );


        }

      }

      else {


        alert(
          'Layer garis pantai belum tersedia.'
        );


      }

    }


    /* =====================================================
       12. AUTO ZOOM SIDEBAR
       ===================================================== */

    document

      .getElementById(
        'zoomLayerButton'
      )

      .addEventListener(

        'click',

        function() {

          zoomToCoastline();

        }

      );


    /* =====================================================
       13. AUTO ZOOM MAP
       ===================================================== */

    const ZoomToLayerControl =
      L.Control.extend({

        options: {

          position:
            'topright'

        },


        onAdd:
          function() {


            const container =
              L.DomUtil.create(

                'div',

                'leaflet-bar zoom-to-layer-control'

              );


            const button =
              L.DomUtil.create(

                'button',

                'zoom-to-layer-button-map',

                container

              );


            button.type =
              'button';


            button.innerHTML =
              '⌖';


            button.title =
              'Auto Zoom to Layer';


            button.setAttribute(

              'aria-label',

              'Auto Zoom to Layer'

            );


            L.DomEvent.disableClickPropagation(
              container
            );


            L.DomEvent.on(

              button,

              'click',

              function(e) {


                L.DomEvent.stopPropagation(e);


                zoomToCoastline();


              }

            );


            return container;

          }

      });


    map.addControl(

      new ZoomToLayerControl()

    );


    /* =====================================================
       14. KONVERSI ESRI JSON
       ===================================================== */

    function convertEsriJSON(data) {


      const coastlineGroup =
        L.featureGroup();


      if (!data.features) {


        console.error(
          'GP_RT.json tidak memiliki features.'
        );


        return coastlineGroup;

      }


      data.features.forEach(

        function(feature) {


          const geometry =
            feature.geometry || {};


          const attributes =
            feature.attributes || {};


          if (!geometry.paths) {


            return;

          }


          geometry.paths.forEach(

            function(path) {


              const latLngs =
                path.map(

                  function(point) {

                    return [

                      point[1],

                      point[0]

                    ];

                  }

                );


              const line =
                L.polyline(

                  latLngs,

                  coastlineStyle

                );


              let html =

                '<div>' +

                '<div class="popup-title">' +

                'Informasi Garis Pantai' +

                '</div>';


              const keys =
                Object.keys(
                  attributes
                );


              if (keys.length === 0) {


                html +=
                  'Tidak terdapat atribut.';


              }

              else {


                keys.forEach(

                  function(key) {


                    let value =
                      attributes[key];


                    if (

                      value === null ||

                      value === undefined ||

                      value === ''

                    ) {

                      value = '-';

                    }


                    html +=

                      '<b>' +

                      key +

                      '</b>: ' +

                      value +

                      '<br>';

                  }

                );


              }


              html +=
                '</div>';


              line.bindPopup(
                html
              );


              /*
               * HOVER
               */

              line.on(

                'mouseover',

                function() {


                  this.setStyle({

                    color:
                      '#ff0000',

                    weight:
                      6

                  });


                }

              );


              line.on(

                'mouseout',

                function() {


                  this.setStyle(

                    coastlineStyle

                  );


                }

              );


              coastlineGroup.addLayer(
                line
              );


            }

          );


        }

      );


      return coastlineGroup;

    }


    /* =====================================================
       15. LOAD GP_RT.JSON
       ===================================================== */

    fetch('GP_RT.json')


      .then(

        function(response) {


          if (!response.ok) {


            throw new Error(
              'GP_RT.json tidak ditemukan.'
            );


          }


          return response.json();


        }

      )


      .then(

        function(data) {


          console.log(

            'GP_RT.json berhasil dimuat:',

            data

          );


          coastline =
            convertEsriJSON(
              data
            );


          coastline.addTo(
            map
          );


          zoomToCoastline();


          /*
           * CHECKBOX GARIS PANTAI
           */

          document

            .getElementById(
              'coastlineCheck'
            )

            .addEventListener(

              'change',

              function() {


                if (this.checked) {


                  coastline.addTo(
                    map
                  );


                  zoomToCoastline();


                }

                else {


                  map.removeLayer(
                    coastline
                  );


                }


              }

            );


        }

      )


      .catch(

        function(error) {


          console.error(
            error
          );


          alert(

            'Gagal membaca GP_RT.json.\n\n' +

            'Pastikan GP_RT.json berada ' +

            'satu folder dengan index.html.'

          );


        }

      );


    /* =====================================================
       16. HAPUS SEMUA BASEMAP
       ===================================================== */

    function removeBasemaps() {


      if (
        map.hasLayer(satellite)
      ) {

        map.removeLayer(
          satellite
        );

      }


      if (
        map.hasLayer(googleSatellite)
      ) {

        map.removeLayer(
          googleSatellite
        );

      }


      if (
        map.hasLayer(street)
      ) {

        map.removeLayer(
          street
        );

      }


      if (
        map.hasLayer(orthoLayer)
      ) {

        map.removeLayer(
          orthoLayer
        );

      }

    }


    /* =====================================================
       17. ESRI WORLD IMAGERY
       ===================================================== */

    document

      .getElementById(
        'satelliteRadio'
      )

      .addEventListener(

        'change',

        function() {


          if (this.checked) {


            removeBasemaps();


            satellite.addTo(
              map
            );


          }

        }

      );


    /* =====================================================
       18. GOOGLE SATELLITE
       ===================================================== */

    document

      .getElementById(
        'googleRadio'
      )

      .addEventListener(

        'change',

        function() {


          if (this.checked) {


            removeBasemaps();


            googleSatellite.addTo(
              map
            );


          }

        }

      );


    /* =====================================================
       19. ESRI WORLD STREET MAP
       ===================================================== */

    document

      .getElementById(
        'streetRadio'
      )

      .addEventListener(

        'change',

        function() {


          if (this.checked) {


            removeBasemaps();


            street.addTo(
              map
            );


          }

        }

      );


    /* =====================================================
       20. ORTHOPHOTO

       PENTING:
       TIDAK ADA ESRI DI SINI.

       YANG AKTIF HANYA:
       orthoLayer

       KALAU TILE TIDAK ADA:
       PETA KOSONG/ABU-ABU,
       BUKAN ESRI.
       ===================================================== */

    document

      .getElementById(
        'orthoRadio'
      )

      .addEventListener(

        'change',

        function() {


          if (!this.checked) {

            return;

          }


          /*
           * RESET ERROR
           */

          orthoErrorCount =
            0;


          /*
           * HAPUS SELURUH BASEMAP
           *
           * TERMASUK ESRI
           */

          removeBasemaps();


          /*
           * ORTHOPHOTO SAJA
           */

          orthoLayer.addTo(
            map
          );


          orthoLayer.bringToFront();


          /*
           * Kalau sedang zoom < L12,
           * naikkan ke L12 supaya cache
           * mulai bisa dibaca.
           */

          if (
            map.getZoom() < 12
          ) {

            map.setZoom(
              12
            );

          }


          /*
           * Kalau lebih tinggi dari L17,
           * turunkan ke L17.
           */

          if (
            map.getZoom() > 17
          ) {

            map.setZoom(
              17
            );

          }


          console.log(
            '--------------------------------'
          );


          console.log(
            'ORTHOPHOTO SAJA'
          );


          console.log(
            'Cache: Fix_Ortho_web'
          );


          console.log(
            'Level: L12-L17'
          );


          console.log(
            '--------------------------------'
          );


        }

      );


    /* =====================================================
       21. ORTHOPHOTO TILE BERHASIL
       ===================================================== */

    orthoLayer.on(

      'tileload',

      function(e) {


        console.log(

          'ORTHOPHOTO TILE BERHASIL:',

          e.coords

        );


      }

    );


    /* =====================================================
       22. ORTHOPHOTO TILE ERROR
       ===================================================== */

    orthoLayer.on(

      'tileerror',

      function(e) {


        orthoErrorCount++;


        console.error(

          'ORTHOPHOTO TILE GAGAL:',

          e.coords

        );


        /*
         * Tampilkan URL yang sedang dicari
         */

        if (e.coords) {


          const rowHex =
            Math.floor(
              e.coords.y
            )
            .toString(16)
            .padStart(
              8,
              '0'
            )
            .toLowerCase();


          const colHex =
            Math.floor(
              e.coords.x
            )
            .toString(16)
            .padStart(
              8,
              '0'
            )
            .toLowerCase();


          console.error(

            'URL YANG DICARI:',

            'Fix_Ortho_web/' +
            '_alllayers/' +
            'L' +
            e.coords.z +
            '/' +
            'R' +
            rowHex +
            '/' +
            'C' +
            colHex +
            '.png'

          );

        }


        console.error(

          'TOTAL TILE ERROR:',

          orthoErrorCount

        );

      }

    );


    /* =====================================================
       23. SCALE BAR
       ===================================================== */

    L.control.scale({

      imperial:
        false,

      metric:
        true,

      position:
        'bottomleft'

    }).addTo(map);


    /* =====================================================
       24. LEGENDA
       ===================================================== */

    const legend =
      L.control({

        position:
          'bottomright'

      });


    legend.onAdd =
      function(map) {


        const div =
          L.DomUtil.create(

            'div',

            'map-legend'

          );


        div.innerHTML = `

          <div class="map-legend-title">
            Legenda
          </div>

          <div class="legend-item">

            <span
              class="legend-line-coastline">
            </span>

            <span>
              Garis Pantai
            </span>

          </div>

        `;


        L.DomEvent
          .disableClickPropagation(
            div
          );


        return div;

      };


    legend.addTo(map);


    /* =====================================================
       25. KOORDINAT KURSOR
       ===================================================== */

    map.on(

      'mousemove',

      function(e) {


        document

          .getElementById(
            'latitude'
          )

          .innerHTML =

          e.latlng
            .lat
            .toFixed(6);


        document

          .getElementById(
            'longitude'
          )

          .innerHTML =

          e.latlng
            .lng
            .toFixed(6);


      }

    );


    /* =====================================================
       26. ROTASI 3 FOTO BACKGROUND
       
       AWAL:
       bcg1 = ATAS
       bcg2 = TENGAH
       bcg3 = BAWAH

       PUTARAN 1:
       bcg2 = ATAS
       bcg3 = TENGAH
       bcg1 = BAWAH

       PUTARAN 2:
       bcg3 = ATAS
       bcg1 = TENGAH
       bcg2 = BAWAH

       PUTARAN 3:
       kembali awal
       ===================================================== */

    const bgSlideshow =
      document.getElementById(
        'backgroundSlideshow'
      );


    const bgPhoto1 =
      document.getElementById(
        'bgPhoto1'
      );


    const bgPhoto2 =
      document.getElementById(
        'bgPhoto2'
      );


    const bgPhoto3 =
      document.getElementById(
        'bgPhoto3'
      );


    let bgStep =
      0;


    /* =====================================================
       27. FUNGSI ROTASI BACKGROUND
       ===================================================== */

    function rotateBackgroundPhotos() {


      /*
       * KEDIP / FADE OUT
       */

      bgSlideshow.classList.add(
        'changing'
      );


      /*
       * TUNGGU
       */

      setTimeout(

        function() {


          bgStep++;


          /*
           * PUTARAN 1
           */

          if (bgStep === 1) {


            bgPhoto1.className =
              'bg-photo pos-bottom';


            bgPhoto2.className =
              'bg-photo pos-top';


            bgPhoto3.className =
              'bg-photo pos-middle';


          }


          /*
           * PUTARAN 2
           */

          else if (bgStep === 2) {


            bgPhoto1.className =
              'bg-photo pos-middle';


            bgPhoto2.className =
              'bg-photo pos-bottom';


            bgPhoto3.className =
              'bg-photo pos-top';


          }


          /*
           * PUTARAN 3
           */

          else {


            bgStep =
              0;


            bgPhoto1.className =
              'bg-photo pos-top';


            bgPhoto2.className =
              'bg-photo pos-middle';


            bgPhoto3.className =
              'bg-photo pos-bottom';


          }


          /*
           * FADE IN
           */

          setTimeout(

            function() {


              bgSlideshow.classList.remove(
                'changing'
              );


            },

            180

          );


        },

        550

      );

    }


    /* =====================================================
       28. ROTASI SETIAP 5 DETIK
       ===================================================== */

    setInterval(

      rotateBackgroundPhotos,

      5000

    );


  </script>

</body>

</html>
