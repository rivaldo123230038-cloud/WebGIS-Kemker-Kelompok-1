<script>

/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {

  center: [-5.4, 105.25],

  zoom: 12,

  minZoom: 3,

  maxZoom: 24,

  zoomControl: true

});


/* =========================================================
   BASEMAP
========================================================= */

const esriImagery = L.tileLayer(

  "https://server.arcgisonline.com/ArcGIS/rest/services/" +
  "World_Imagery/MapServer/tile/{z}/{y}/{x}",

  {
    maxZoom: 24,
    maxNativeZoom: 19,
    attribution: "Esri"
  }

);


const esriStreet = L.tileLayer(

  "https://server.arcgisonline.com/ArcGIS/rest/services/" +
  "World_Street_Map/MapServer/tile/{z}/{y}/{x}",

  {
    maxZoom: 24,
    maxNativeZoom: 19,
    attribution: "Esri"
  }

);


esriImagery.addTo(map);


/* =========================================================
   PROJ UTM 48S
========================================================= */

proj4.defs(
  "EPSG:32748",

  "+proj=utm " +
  "+zone=48 " +
  "+south " +
  "+datum=WGS84 " +
  "+units=m " +
  "+no_defs"
);


/* =========================================================
   UTM 48S -> WGS84
========================================================= */

function UTM48SToWGS84(
  easting,
  northing
) {

  const result =
    proj4(
      "EPSG:32748",
      "EPSG:4326",
      [easting, northing]
    );

  return [
    result[1],
    result[0]
  ];

}


/* =========================================================
   GET FIRST COORDINATE
========================================================= */

function getFirstCoordinate(coords) {

  if (!Array.isArray(coords)) {
    return null;
  }


  if (
    coords.length >= 2 &&
    typeof coords[0] === "number" &&
    typeof coords[1] === "number"
  ) {

    return [
      coords[0],
      coords[1]
    ];

  }


  for (
    let i = 0;
    i < coords.length;
    i++
  ) {

    const result =
      getFirstCoordinate(
        coords[i]
      );

    if (result) {
      return result;
    }

  }


  return null;

}


/* =========================================================
   DETEKSI CRS DARI METADATA
========================================================= */

function detectCRSFromGeoJSON(
  geojson
) {

  if (
    !geojson ||
    !geojson.crs ||
    !geojson.crs.properties
  ) {

    return null;

  }


  const properties =
    geojson.crs.properties;


  const name =
    String(
      properties.name ||
      properties.href ||
      ""
    ).toUpperCase();


  if (
    name.includes("4326") ||
    name.includes("WGS84") ||
    name.includes("WGS 84")
  ) {

    return "EPSG:4326";

  }


  if (
    name.includes("32748")
  ) {

    return "EPSG:32748";

  }


  return null;

}


/* =========================================================
   DETEKSI CRS DARI NILAI
========================================================= */

function detectCRSFromCoordinates(
  geojson
) {

  if (
    !geojson ||
    !geojson.features ||
    geojson.features.length === 0
  ) {

    return null;

  }


  const feature =
    geojson.features[0];


  if (
    !feature.geometry ||
    !feature.geometry.coordinates
  ) {

    return null;

  }


  const coordinate =
    getFirstCoordinate(
      feature.geometry.coordinates
    );


  if (!coordinate) {
    return null;
  }


  const x = coordinate[0];
  const y = coordinate[1];


  /* WGS84 */

  if (
    x >= -180 &&
    x <= 180 &&
    y >= -90 &&
    y <= 90
  ) {

    return "EPSG:4326";

  }


  /* UTM 48S */

  if (
    x >= 100000 &&
    x <= 900000 &&
    y >= 0 &&
    y <= 10000000
  ) {

    return "EPSG:32748";

  }


  return null;

}


/* =========================================================
   CRS UTAMA
========================================================= */

function detectGeoJSONCRS(
  geojson
) {

  const metadata =
    detectCRSFromGeoJSON(
      geojson
    );


  if (metadata) {
    return metadata;
  }


  return detectCRSFromCoordinates(
    geojson
  );

}


/* =========================================================
   CONVERT COORDINATES
========================================================= */

function convertCoordinates(
  coords,
  sourceCRS
) {

  if (!Array.isArray(coords)) {
    return coords;
  }


  if (
    coords.length >= 2 &&
    typeof coords[0] === "number" &&
    typeof coords[1] === "number"
  ) {


    if (
      sourceCRS === "EPSG:4326"
    ) {

      return [
        coords[0],
        coords[1]
      ];

    }


    if (
      sourceCRS === "EPSG:32748"
    ) {

      return UTM48SToWGS84(
        coords[0],
        coords[1]
      );

    }


    return [
      coords[0],
      coords[1]
    ];

  }


  return coords.map(
    function(item) {

      return convertCoordinates(
        item,
        sourceCRS
      );

    }
  );

}


/* =========================================================
   CONVERT GEOJSON
========================================================= */

function convertGeoJSONToWGS84(
  geojson
) {

  const copy =
    JSON.parse(
      JSON.stringify(geojson)
    );


  const sourceCRS =
    detectGeoJSONCRS(copy);


  console.log(
    "CRS terdeteksi:",
    sourceCRS
  );


  if (!sourceCRS) {

    console.warn(
      "CRS tidak terdeteksi. " +
      "Koordinat tidak diubah."
    );

    return copy;

  }


  if (
    sourceCRS === "EPSG:4326"
  ) {

    return copy;

  }


  if (
    sourceCRS === "EPSG:32748"
  ) {

    copy.features.forEach(
      function(feature) {

        if (
          feature.geometry &&
          feature.geometry.coordinates
        ) {

          feature.geometry.coordinates =
            convertCoordinates(
              feature.geometry.coordinates,
              sourceCRS
            );

        }

      }
    );

  }


  return copy;

}


/* =========================================================
   STYLE
========================================================= */

function styleRTK() {

  return {
    color: "cyan",
    weight: 3,
    opacity: 1
  };

}


function stylePantai() {

  return {
    color: "#ffd700",
    weight: 3,
    opacity: 1
  };

}


function styleDigitasi() {

  return {
    color: "red",
    weight: 3,
    opacity: 1
  };

}


/* =========================================================
   HOVER
========================================================= */

function addHover(
  layer,
  originalStyle
) {

  layer.on({

    mouseover:
      function(e) {

        e.target.setStyle({

          color: "orange",

          weight: 4

        });

      },


    mouseout:
      function(e) {

        e.target.setStyle(
          originalStyle
        );

      }

  });

}


/* =========================================================
   RTK
========================================================= */

let rtkLayer = null;


fetch(
  "Garis_Pantai_RTK.geojson"
)

.then(
  response => {

    if (!response.ok) {

      throw new Error(
        "Garis_Pantai_RTK.geojson tidak ditemukan"
      );

    }

    return response.json();

  }
)

.then(
  data => {

    const converted =
      convertGeoJSONToWGS84(
        data
      );


    rtkLayer =
      L.geoJSON(
        converted,
        {
          style: styleRTK
        }
      );


    rtkLayer.eachLayer(
      function(layer) {

        addHover(
          layer,
          styleRTK()
        );

      }
    );


    rtkLayer.addTo(map);

  }
)

.catch(
  error => {

    console.error(
      "RTK ERROR:",
      error
    );

  }
);


/* =========================================================
   GARIS PANTAI
========================================================= */

========================================================= */

    if (!response.ok) {

/* =========================================================
   ORTHOPHOTO
========================================================= */

const ORTHO_URL_BASE =
  "https://raw.githubusercontent.com/" +
  "rivaldo123230038-cloud/" +
  "WebGIS-Kemker-Kelompok-1/" +
  "main/" +
  "Fix_Ortho_web/" +
  "_alllayers/";


function toHex(num) {

  return num
    .toString(16)
    .toLowerCase()
    .padStart(8, "0");

}


const OrthoGridLayer =
  L.GridLayer.extend({

    createTile:
      function(coords, done) {

        const tile =
          document.createElement(
            "canvas"
          );


        const size =
          this.getTileSize();


        tile.width =
          size.x;

        tile.height =
          size.y;


        const ctx =
          tile.getContext("2d");


        const nativeZoom = 18;


        const sourceZoom =
          Math.min(
            coords.z,
            nativeZoom
          );


        let sourceX =
          coords.x;

        let sourceY =
          coords.y;


        if (
          coords.z > nativeZoom
        ) {

          const factor =
            Math.pow(
              2,
              coords.z - nativeZoom
            );


          sourceX =
            Math.floor(
              coords.x / factor
            );


          sourceY =
            Math.floor(
              coords.y / factor
            );

        }


        const rowHex =
          toHex(sourceY);


        const colHex =
          toHex(sourceX);


        const url =
          ORTHO_URL_BASE +
          "L" +
          sourceZoom +
          "/" +
          "R" +
          rowHex +
          "/" +
          "C" +
          colHex +
          ".png";


        const img =
          new Image();


        img.crossOrigin =
          "anonymous";


        img.onload =
          function() {

            ctx.drawImage(
              img,
              0,
              0,
              size.x,
              size.y
            );


            done(
              null,
              tile
            );

          };


        img.onerror =
          function() {

            console.warn(
              "ORTHO 404:",
              url
            );


            done(
              null,
              tile
            );

          };


        img.src = url;


        return tile;

      }

  });


const ortho =
  new OrthoGridLayer({

    tileSize: 256,

    opacity: 0.80,

    zIndex: 500,

    noWrap: true,

    minZoom: 11,

    maxNativeZoom: 18,

    maxZoom: 24

  });


/* =========================================================
   AUTO ZOOM YANG AMAN
========================================================= */

function updateAutoZoom() {

  let bounds = null;


  function addBounds(layer) {

    if (
      !layer ||
      !map.hasLayer(layer)
    ) {

      return;

    }


    const layerBounds =
      layer.getBounds();


    if (
      !layerBounds ||
      !layerBounds.isValid()
    ) {

      return;

    }


    if (!bounds) {

      bounds =
        L.latLngBounds(
          layerBounds
        );

    } else {

      bounds.extend(
        layerBounds
      );

    }

  }


  addBounds(rtkLayer);

  addBounds(pantaiLayer);

  addBounds(digitasiLayer);


  if (!bounds) {

    return;

  }


  const southWest =
    bounds.getSouthWest();

  const northEast =
    bounds.getNorthEast();


  /* Pastikan bounds masih berupa
     koordinat geografis yang masuk akal */

  if (
    Math.abs(southWest.lat) > 90 ||
    Math.abs(northEast.lat) > 90 ||
    Math.abs(southWest.lng) > 180 ||
    Math.abs(northEast.lng) > 180
  ) {

    console.warn(
      "Auto Zoom dibatalkan: koordinat layer tidak valid."
    );

    return;

  }


  map.fitBounds(
    bounds,
    {

      paddingTopLeft: [
        370,
        30
      ],

      paddingBottomRight: [
        30,
        30
      ],

      maxZoom: 24,

      animate: true

    }
  );

}

/* =========================================================
   BACKGROUND ROTATION
========================================================= */

const backgroundGallery =
  document.querySelector(
    ".background-gallery"
  );


let photoOrder = [
  "photo-1",
  "photo-2",
  "photo-3"
];


function rotateBackgroundPhotos() {

  photoOrder.unshift(
    photoOrder.pop()
  );


  const photos =
    backgroundGallery.querySelectorAll(
      ".background-photo"
    );


  photos.forEach(
    function(photo) {

      const className =
        Array.from(
          photo.classList
        ).find(
          function(c) {

            return c.indexOf(
              "photo-"
            ) === 0;

          }
        );


      photo.style.order =
        photoOrder.indexOf(
          className
        );

    }
  );

}


setInterval(
  rotateBackgroundPhotos,
  4000
);


/* =========================================================
   MAP RESIZE
========================================================= */

setTimeout(
  function() {

    map.invalidateSize();

  },
  500
);


/* =========================================================
   AUTO ZOOM AWAL
   Tunggu seluruh GeoJSON selesai dimuat
========================================================= */

let autoZoomReadyCount = 0;


function tryInitialAutoZoom() {

  autoZoomReadyCount++;


  if (
    autoZoomReadyCount >= 3
  ) {

    setTimeout(
      function() {

        updateAutoZoom();

      },
      300
    );

  }

}


/* Tambahkan listener load secara aman */

if (rtkLayer) {
  tryInitialAutoZoom();
}
