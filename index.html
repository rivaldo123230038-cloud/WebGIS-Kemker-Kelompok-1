<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>WEBGIS KELOMPOK 1</title>


  <!-- =====================================================
       LEAFLET CSS
       ===================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    /* =====================================================
       DASAR
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow: hidden;
    }


    /* =====================================================
       MAP
       ===================================================== */

    #map {

      position: absolute;

      left: 350px;
      top: 0;

      width:
        calc(100% - 350px);

      height:
        100vh;

      transition:
        left 0.3s ease,
        width 0.3s ease;
    }


    /* =====================================================
       SIDEBAR
       ===================================================== */

    .sidebar {

      position: fixed;

      left: 0;
      top: 0;

      width: 350px;
      height: 100vh;

      background:
        #ffffff;

      box-shadow:
        2px 0 12px
        rgba(0,0,0,0.18);

      z-index: 2000;

      overflow: hidden;

      transition:
        transform 0.3s ease;
    }


    .sidebar.collapsed {

      transform:
        translateX(-350px);
    }


    /* =====================================================
       TOMBOL SIDEBAR
       ===================================================== */

    .sidebar-toggle {

      position: fixed;

      top: 50%;
      left: 350px;

      width: 34px;
      height: 70px;

      transform:
        translateY(-50%);

      border: none;

      border-radius:
        0 8px 8px 0;

      background:
        #17324d;

      color: white;

      z-index: 3000;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 22px;

      font-weight: bold;

      box-shadow:
        2px 0 8px
        rgba(0,0,0,0.25);
    }


    .sidebar-toggle:hover {

      background:
        #244e73;
    }


    .sidebar-toggle.collapsed {

      left: 0;
    }


    /* =====================================================
       LOGO
       PUTIH POLOS
       ===================================================== */

    .logo-section {

      position: relative;

      z-index: 100;

      display: flex;

      flex-direction: row;

      justify-content: space-between;

      align-items: center;

      width: 100%;

      height: 108px;

      padding: 12px 10px;

      gap: 5px;

      background:
        #ffffff !important;

      border: none !important;

      flex-shrink: 0;
    }


    .logo-item {

      flex: 1;

      min-width: 0;

      height: 82px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 0;

      margin: 0;

      background: transparent;

      border: none !important;

      border-radius: 0;

      box-shadow: none;
    }


    .logo-item img {

      width: 100%;

      height: 100%;

      object-fit: contain;

      display: block;
    }


    /* =====================================================
       SIDEBAR BODY
       ===================================================== */

    .sidebar-body {

      position: relative;

      height:
        calc(100vh - 108px);

      overflow-y: auto;

      overflow-x: hidden;

      scrollbar-width: thin;
    }


    /* =====================================================
       3 FOTO BACKGROUND
       ===================================================== */

    .background-slideshow {

      position: fixed;

      left: 0;

      top: 108px;

      width: 350px;

      height:
        calc(100vh - 108px);

      overflow: hidden;

      z-index: 0;

      pointer-events: none;
    }


    .bg-photo {

      position: absolute;

      left: 0;

      width: 100%;

      height: 33.333333%;

      background-repeat: no-repeat;

      background-position: center center;

      background-size: cover;

      opacity: 0.20;

      transition:

        top 1.35s
        cubic-bezier(0.4,0,0.2,1),

        opacity 0.85s
        ease-in-out;
    }


    .bg-photo.pos-top {
      top: 0;
    }


    .bg-photo.pos-middle {
      top: 33.333333%;
    }


    .bg-photo.pos-bottom {
      top: 66.666666%;
    }


    .background-slideshow.changing
    .bg-photo {

      opacity: 0.035;
    }


    /* =====================================================
       SIDEBAR CONTENT
       ===================================================== */

    .sidebar-content {

      position: relative;

      z-index: 2;

      min-height: 100%;
    }


    /* =====================================================
       TITLE ORANGE BATA
       ===================================================== */

    .title-section {

      padding:
        18px 20px 17px;

      text-align:
        center;

      background:
        #B65F3A !important;

      color:
        white;

      border-top:
        2px solid #111111;

      border-bottom:
        2px solid #111111;
    }


    .title-section h1 {

      margin:
        0;

      font-size:
        22px;

      font-weight:
        700;

      color:
        white;

      letter-spacing:
        0.5px;
    }


    .title-section p {

      margin:
        7px 0 0;

      font-size:
        12px;

      line-height:
        1.4;

      color:
        white;
    }


    /* =====================================================
       PANEL
       ===================================================== */

    .panel-content {

      padding:
        18px 20px;
    }


    .section-title {

      margin-top:
        18px;

      margin-bottom:
        10px;

      padding-bottom:
        7px;

      border-bottom:
        2px solid #17324d;

      color:

      font-size:
        14px;

      font-weight:
        bold;

      text-transform:

    }


    .section-title:first-child {

    /* =====================================================
       CONTROL BOX
       ===================================================== */

    .layer-control-box {

        rgba(255,255,255,0.84);

        7px;

      padding:

  <!-- =====================================================

       ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>


    /* =====================================================
       1. MAP
       ===================================================== */

    const map =
      L.map(
        'map',
        {

          center:
            [-5.45,105.25],

          zoom:
            10,

          minZoom:
            0,

          maxZoom:
            23,

          zoomControl:
            true,

          scrollWheelZoom:
            true,

          doubleClickZoom:
            true,

          touchZoom:
            true,

          boxZoom:
            true

        }
      );


    /* =====================================================
       2. SIDEBAR
       ===================================================== */

    const sidebar =
      document.getElementById(
        'sidebar'
      );


    const sidebarToggle =
      document.getElementById(
        'sidebarToggle'
      );


    let sidebarCollapsed =
      false;


    sidebarToggle.addEventListener(

      'click',

      function() {


        sidebarCollapsed =
          !sidebarCollapsed;


        if (
          sidebarCollapsed
        ) {


          sidebar.classList.add(
            'collapsed'
          );


          sidebarToggle.classList.add(
            'collapsed'
          );


          sidebarToggle.innerHTML =
            '▶';


          sidebarToggle.title =
            'Tampilkan Panel';


          map.getContainer().style.left =
            '0';


          map.getContainer().style.width =
            '100%';

        }

        else {


          sidebar.classList.remove(
            'collapsed'
          );


          sidebarToggle.classList.remove(
            'collapsed'
          );


          sidebarToggle.innerHTML =
            '◀';


          sidebarToggle.title =
            'Minimize Panel';


          map.getContainer().style.left =
            '350px';


          map.getContainer().style.width =
            'calc(100% - 350px)';

        }


        setTimeout(

          function() {

            map.invalidateSize();

          },

          350

        );

      }

    );


    /* =====================================================
       3. BASEMAP
       ===================================================== */

    const satellite =
      L.tileLayer(

        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

        {

          minZoom:
            0,

          maxZoom:
            19,

          attribution:
            'Tiles &copy; Esri'

        }

      );


    const street =
      L.tileLayer(

        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',

        {

          minZoom:
            0,

          maxZoom:
            19,

          attribution:
            'Tiles &copy; Esri'

        }

      );


    /* =====================================================
       4. ORTHOPHOTO
       =====================================================

       L12 - L18

       PUTIH/HITAM YANG TERHUBUNG KE TEPI
       DIBUAT TRANSPARAN.

       METODE:
       IMAGE -> CANVAS -> FLOOD FILL
       ===================================================== */

    const ORTHO_URL_BASE =

      'https://raw.githubusercontent.com/' +

      'rivaldo123230038-cloud/' +

      'WebGIS-Kemker-Kelompok-1/' +

      'main/' +

      'Fix_Ortho_web/' +

      '_alllayers/';


    const orthoLayer =
      L.GridLayer.extend({

        options: {

          minZoom:
            12,

          maxZoom:
            18,

          minNativeZoom:
            12,

          maxNativeZoom:
            18,

          tileSize:
            256,

          noWrap:
            true,

          opacity:
            0.80,

          zIndex:
            500

        },


        createTile:
          function(
            coords,
            done
          ) {


            const canvas =
              document.createElement(
                'canvas'
              );


            canvas.width =
              256;


            canvas.height =
              256;


            const ctx =
              canvas.getContext(
                '2d',
                {
                  willReadFrequently:
                    true
                }
              );


            /* -------------------------------------------
               CEK LEVEL
               ------------------------------------------- */

            if (

              coords.z < 12 ||
              coords.z > 18 ||
              coords.x < 0 ||
              coords.y < 0

            ) {


              done(
                new Error(
                  'Tile di luar level L12-L18'
                ),
                canvas
              );


              return canvas;

            }


            /* -------------------------------------------
               ROW / COLUMN HEX
               ------------------------------------------- */

            const rowHex =
              Math.floor(coords.y)
                .toString(16)
                .padStart(
                  8,
                  '0'
                )
                .toLowerCase();


            const colHex =
              Math.floor(coords.x)
                .toString(16)
                .padStart(
                  8,
                  '0'
                )
                .toLowerCase();


            /* -------------------------------------------
               URL
               ------------------------------------------- */

            const url =

              ORTHO_URL_BASE +

              'L' +
              coords.z +

              '/' +

              'R' +
              rowHex +

              '/' +

              'C' +
              colHex +

              '.png';


            console.log(
              'ORTHOPHOTO:',
              url
            );


            /* -------------------------------------------
               LOAD IMAGE
               ------------------------------------------- */

            const img =
              new Image();


            img.crossOrigin =
              'anonymous';


            img.onload =
              function() {


                try {


                  /* =====================================
                     GAMBAR KE CANVAS
                     ===================================== */

                  ctx.clearRect(
                    0,
                    0,
                    256,
                    256
                  );


                  ctx.drawImage(

                    img,

                    0,
                    0,

                    256,
                    256

                  );


                  /* =====================================
                     BACA PIXEL
                     ===================================== */

                  const imageData =
                    ctx.getImageData(

                      0,
                      0,

                      256,
                      256

                    );


                  const data =
                    imageData.data;


                  const width =
                    256;

                  const height =
                    256;


                  /*
                   * Flood fill menggunakan array
                   * visited.
                   */

                  const visited =
                    new Uint8Array(

                      width *
                      height

                    );


                  const queueX =
                    new Int32Array(
                      width *
                      height
                    );


                  const queueY =
                    new Int32Array(
                      width *
                      height
                    );


                  let queueStart =
                    0;


                  let queueEnd =
                    0;


                  /* =====================================
                     FUNGSI CEK BACKGROUND
                     ===================================== */

                  function isBackground(
                    x,
                    y
                  ) {


                    const index =
                      (
                        y *
                        width +
                        x
                      ) * 4;


                    const r =
                      data[index];


                    const g =
                      data[index + 1];


                    const b =
                      data[index + 2];


                    const a =
                      data[index + 3];


                    if (
                      a === 0
                    ) {

                      return true;

                    }


                    const maxRGB =
                      Math.max(
                        r,
                        g,
                        b
                      );


                    const minRGB =
                      Math.min(
                        r,
                        g,
                        b
                      );


                    const chroma =
                      maxRGB -
                      minRGB;


                    const brightness =

                      0.299 * r +
                      0.587 * g +
                      0.114 * b;


                    /*
                     * PUTIH / ABU-ABU TERANG
                     */

                    const white =

                      brightness >= 235 &&
                      chroma <= 35;


                    /*
                     * HITAM / ABU-ABU GELAP
                     */

                    const black =

                      brightness <= 25 &&
                      chroma <= 30;


                    return (
                      white ||
                      black
                    );

                  }


                  /* =====================================
                     FUNGSI MASUKKAN QUEUE
                     ===================================== */

                  function addPixel(
                    x,
                    y
                  ) {


                    if (
                      x < 0 ||
                      x >= width ||
                      y < 0 ||
                      y >= height
                    ) {

                      return;

                    }


                    const index =
                      y *
                      width +
                      x;


                    if (
                      visited[index]
                    ) {

                      return;

                    }


                    if (
                      !isBackground(
                        x,
                        y
                      )
                    ) {

                      return;

                    }


                    visited[index] =
                      1;


                    queueX[queueEnd] =
                      x;


                    queueY[queueEnd] =
                      y;


                    queueEnd++;

                  }


                  /* =====================================
                     AMBIL BACKGROUND DARI SEMUA TEPI
                     ===================================== */

                  for (
                    let x = 0;
                    x < width;
                    x++
                  ) {


                    addPixel(
                      x,
                      0
                    );


                    addPixel(
                      x,
                      height - 1
                    );

                  }


                  for (
                    let y = 0;
                    y < height;
                    y++
                  ) {


                    addPixel(
                      0,
                      y
                    );


                    addPixel(
                      width - 1,
                      y
                    );

                  }


                  /* =====================================
                     FLOOD FILL
                     ===================================== */

                  while (
                    queueStart <
                    queueEnd
                  ) {


                    const x =
                      queueX[
                        queueStart
                      ];


                    const y =
                      queueY[
                        queueStart
                      ];


                    queueStart++;


                    const pixelIndex =
                      (
                        y *
                        width +
                        x
                      ) * 4;


                    /*
                     * Jadikan transparan
                     */

                    data[
                      pixelIndex + 3
                    ] = 0;


                    /*
                     * ATAS
                     */

                    addPixel(
                      x,
                      y - 1
                    );


                    /*
                     * BAWAH
                     */

                    addPixel(
                      x,
                      y + 1
                    );


                    /*
                     * KIRI
                     */

                    addPixel(
                      x - 1,
                      y
                    );


                    /*
                     * KANAN
                     */

                    addPixel(
                      x + 1,
                      y
                    );

                  }


                  /* =====================================
                     SIMPAN HASIL
                     ===================================== */

                  ctx.putImageData(

                    imageData,

                    0,
                    0

                  );


                  /* =====================================
                     TILE SELESAI
                     ===================================== */

                  done(
                    null,
                    canvas
                  );


                }

                catch (
                  error
                ) {


                  console.error(

                    'Gagal memproses tile:',
                    error

                  );


                  /*
                   * Kalau Canvas gagal,
                   * tetap tampilkan tile asli.
                   */

                  ctx.clearRect(
                    0,
                    0,
                    256,
                    256
                  );


                  ctx.drawImage(

                    img,

                    0,
                    0,

                    256,
                    256

                  );


                  done(
                    null,
                    canvas
                  );

                }

              };


            /* -------------------------------------------
               ERROR IMAGE
               ------------------------------------------- */

            img.onerror =
              function(error) {


                console.error(

                  'Tile Orthophoto gagal:',

                  url,

                  error

                );


                done(
                  error,
                  canvas
                );

              };


            /* -------------------------------------------
               MULAI DOWNLOAD
               ------------------------------------------- */

            img.src =
              url;


            return canvas;

          }

      });


    /* =====================================================
       5. DEFAULT BASEMAP
       ===================================================== */

    satellite.addTo(
      map
    );


    /* =====================================================
       6. ORTHOPHOTO DEFAULT ON
       ===================================================== */

    const ortho =
      new orthoLayer();


    ortho.addTo(
      map
    );


    /* =====================================================
       7. GARIS PANTAI
       ===================================================== */

    const coastlineStyle = {

      color:
        '#00ffff',

      weight:
        4,

      opacity:
        0.95

    };


    let coastline =
      null;


    let coastlineReady =
      false;


    /* =====================================================
       8. AUTO ZOOM
       ===================================================== */

    function zoomToCoastline() {


      if (
        !coastline ||
        !coastlineReady
      ) {


        alert(
          'Garis pantai masih dimuat. Tunggu sebentar.'
        );


        return;

      }


      const bounds =
        coastline.getBounds();


      if (
        !bounds.isValid()
      ) {


        alert(
          'Extent garis pantai tidak valid.'
        );


        return;

      }


      map.invalidateSize();


      map.fitBounds(

        bounds,

        {

          paddingTopLeft:
            [60,60],

          paddingBottomRight:
            [60,60],

          maxZoom:
            17,

          animate:
            true,

          duration:
            1.2

        }

      );

    }


    /* =====================================================
       9. AUTO ZOOM SIDEBAR
       ===================================================== */

    document

      .getElementById(
        'zoomLayerButton'
      )

      .addEventListener(

        'click',

        function() {

          zoomToCoastline();

        }

      );


    /* =====================================================
       10. AUTO ZOOM MAP
       ===================================================== */

    const ZoomToLayerControl =
      L.Control.extend({

        options: {

          position:
            'topright'

        },


        onAdd:
          function() {


            const container =
              L.DomUtil.create(

                'div',

                'leaflet-bar zoom-to-layer-control'

              );


            const button =
              L.DomUtil.create(

                'button',

                'zoom-to-layer-button-map',

                container

              );


            button.type =
              'button';


            button.innerHTML =
              '⌖';


            button.title =
              'Auto Zoom to Layer';


            L.DomEvent
              .disableClickPropagation(
                container
              );


            L.DomEvent.on(

              button,

              'click',

              function(e) {


                L.DomEvent.stopPropagation(
                  e
                );


                zoomToCoastline();

              }

            );


            return container;

          }

      });


    map.addControl(
      new ZoomToLayerControl()
    );


    /* =====================================================
       11. KONVERSI GP_RT.JSON
       ===================================================== */

    function convertEsriJSON(
      data
    ) {


      const group =
        L.featureGroup();


      if (
        !data ||
        !data.features
      ) {

        return group;

      }


      data.features.forEach(

        function(feature) {


          const geometry =
            feature.geometry || {};


          const attributes =
            feature.attributes || {};


          if (
            !geometry.paths
          ) {

            return;

          }


          geometry.paths.forEach(

            function(path) {


              const latLngs =
                path.map(

                  function(point) {

                    return [

                      point[1],

                      point[0]

                    ];

                  }

                );


              const line =
                L.polyline(

                  latLngs,

                  coastlineStyle

                );


              let html =

                '<div>' +

                '<div class="popup-title">' +

                'Informasi Garis Pantai' +

                '</div>';


              const keys =
                Object.keys(
                  attributes
                );


              if (
                keys.length === 0
              ) {


                html +=
                  'Tidak terdapat atribut.';

              }


              else {


                keys.forEach(

                  function(key) {


                    let value =
                      attributes[key];


                    if (

                      value === null ||
                      value === undefined ||
                      value === ''

                    ) {

                      value =
                        '-';

                    }


                    html +=

                      '<b>' +
                      key +
                      '</b>: ' +
                      value +
                      '<br>';

                  }

                );

              }


              html +=
                '</div>';


              line.bindPopup(
                html
              );


              line.on(

                'mouseover',

                function() {

                  this.setStyle({

                    color:
                      '#ff0000',

                    weight:
                      6

                  });

                }

              );


              line.on(

                'mouseout',

                function() {

                  this.setStyle(
                    coastlineStyle
                  );

                }

              );


              group.addLayer(
                line
              );

            }

          );

        }

      );


      return group;

    }


    /* =====================================================
       12. LOAD GP_RT.JSON
       ===================================================== */

    fetch(
      'GP_RT.json'
    )

      .then(

        function(response) {


          if (
            !response.ok
          ) {

            throw new Error(
              'GP_RT.json HTTP ' +
              response.status
            );

          }


          return response.json();

        }

      )

      .then(

        function(data) {


          coastline =
            convertEsriJSON(
              data
            );


          coastline.addTo(
            map
          );


          coastlineReady =
            true;


          setTimeout(

            function() {

              zoomToCoastline();

            },

            300

          );

        }

      )

      .catch(

        function(error) {


          console.error(
            error
          );


          coastlineReady =
            false;


          alert(
            'GP_RT.json gagal dimuat.'
          );

        }

      );


    /* =====================================================
       13. CHECKBOX GARIS PANTAI
       ===================================================== */

    document

      .getElementById(
        'coastlineCheck'
      )

      .addEventListener(

        'change',

        function() {


          if (
            this.checked
          ) {


            coastline.addTo(
              map
            );

          }

          else {


            map.removeLayer(
              coastline
            );

          }

        }

      );


    /* =====================================================
       14. BASEMAP SWITCHER
       ===================================================== */

    function removeBasemaps() {


      if (
        map.hasLayer(
          satellite
        )
      ) {

        map.removeLayer(
          satellite
        );

      }


      if (
        map.hasLayer(
          street
        )
      ) {

        map.removeLayer(
          street
        );

      }

    }


    document

      .getElementById(
        'satelliteRadio'
      )

      .addEventListener(

        'change',

        function() {


          if (
            this.checked
          ) {


            removeBasemaps();


            satellite.addTo(
              map
            );


            if (
              document
                .getElementById(
                  'orthoCheck'
                )
                .checked
            ) {


              ortho.bringToFront();

            }

          }

        }

      );


    document

      .getElementById(
        'streetRadio'
      )

      .addEventListener(

        'change',

        function() {


          if (
            this.checked
          ) {


            removeBasemaps();


            street.addTo(
              map
            );


            if (
              document
                .getElementById(
                  'orthoCheck'
                )
                .checked
            ) {


              ortho.bringToFront();

            }

          }

        }

      );


    /* =====================================================
       15. ORTHOPHOTO CHECKBOX
       ===================================================== */

    document

      .getElementById(
        'orthoCheck'
      )

      .addEventListener(

        'change',

        function() {


          if (
            this.checked
          ) {


            ortho.addTo(
              map
            );


            ortho.bringToFront();

          }

          else {


            map.removeLayer(
              ortho
            );

          }

        }

      );


    /* =====================================================
       16. SCALE
       ===================================================== */

    L.control.scale({

      imperial:
        false,

      metric:
        true,

      position:
        'bottomleft'

    }).addTo(
      map
    );


    /* =====================================================
       17. LEGEND
       ===================================================== */

    const legend =
      L.control({

        position:
          'bottomright'

      });


    legend.onAdd =
      function() {


        const div =
          L.DomUtil.create(

            'div',

            'map-legend'

          );


        div.innerHTML = `

          <div class="map-legend-title">
            Legenda
          </div>

          <div class="legend-item">

            <span
              class="legend-line-coastline">
            </span>

            <span>
              Garis Pantai
            </span>

          </div>

        `;


        L.DomEvent
          .disableClickPropagation(
            div
          );


        return div;

      };


    legend.addTo(
      map
    );


    /* =====================================================
       18. KOORDINAT KURSOR
       ===================================================== */

    map.on(

      'mousemove',

      function(e) {


        document
          .getElementById(
            'latitude'
          )
          .innerHTML =
          e.latlng.lat.toFixed(6);


        document
          .getElementById(
            'longitude'
          )
          .innerHTML =
          e.latlng.lng.toFixed(6);

      }

    );


    /* =====================================================
       19. BACKGROUND SLIDESHOW
       ===================================================== */

    const bgSlideshow =
      document.getElementById(
        'backgroundSlideshow'
      );


    const bgPhoto1 =
      document.getElementById(
        'bgPhoto1'
      );


    const bgPhoto2 =
      document.getElementById(
        'bgPhoto2'
      );


    const bgPhoto3 =
      document.getElementById(
        'bgPhoto3'
      );


    let bgStep =
      0;


    function rotateBackgroundPhotos() {


      bgSlideshow.classList.add(
        'changing'
      );


      setTimeout(

        function() {


          bgStep++;


          if (
            bgStep === 1
          ) {


            bgPhoto1.className =
              'bg-photo pos-bottom';


            bgPhoto2.className =
              'bg-photo pos-top';


            bgPhoto3.className =
              'bg-photo pos-middle';

          }


          else if (
            bgStep === 2
          ) {


            bgPhoto1.className =
              'bg-photo pos-middle';


            bgPhoto2.className =
              'bg-photo pos-bottom';


            bgPhoto3.className =
              'bg-photo pos-top';

          }


          else {


            bgStep =
              0;


            bgPhoto1.className =
              'bg-photo pos-top';


            bgPhoto2.className =
              'bg-photo pos-middle';


            bgPhoto3.className =
              'bg-photo pos-bottom';

          }


          setTimeout(

            function() {

              bgSlideshow.classList.remove(
                'changing'
              );

            },

            180

          );


        },

        550

      );

    }


    setInterval(

      rotateBackgroundPhotos,

      5000

    );

  </script>

</body>
