<script>

/* =========================================================
   PROJ4
   UTM ZONE 48 SOUTH
   EPSG:32748 -> EPSG:4326
========================================================= */

proj4.defs(
  "EPSG:32748",
  "+proj=utm +zone=48 +south +datum=WGS84 +units=m +no_defs"
);


/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {

  center: [-5.4, 105.25],

  zoom: 13,

  maxZoom: 24,

  minZoom: 3

});


/* =========================================================
   BASEMAP ESRI IMAGERY
========================================================= */

const esriImagery = L.tileLayer(

  "https://server.arcgisonline.com/ArcGIS/rest/services/" +
  "World_Imagery/MapServer/tile/{z}/{y}/{x}",

  {

    attribution:
      "Tiles &copy; Esri",

    maxZoom: 24,

    maxNativeZoom: 23

  }

);


/* =========================================================
   BASEMAP ESRI STREET
========================================================= */

const esriStreet = L.tileLayer(

  "https://server.arcgisonline.com/ArcGIS/rest/services/" +
  "World_Street_Map/MapServer/tile/{z}/{y}/{x}",

  {

    attribution:
      "Tiles &copy; Esri",

    maxZoom: 24,

    maxNativeZoom: 20

  }

);


/* =========================================================
   DEFAULT BASEMAP
========================================================= */

esriImagery.addTo(map);


/* =========================================================
   BASEMAP CONTROL
========================================================= */

const baseMaps = {

  "Esri World Imagery":
    esriImagery,

  "Esri World Street Map":
    esriStreet

};


/* =========================================================
   LAYER VARIABLES
========================================================= */

let rtkLayer = null;

let pantaiLayer = null;

let digitasiLayer = null;


/* =========================================================
   STYLE RTK
========================================================= */

function styleRTK(feature) {

  return {

    color: "#00ffff",

    weight: 3,

    opacity: 1

  };

}


/* =========================================================
   STYLE GARIS PANTAI
========================================================= */

function stylePantai(feature) {

  return {

    color: "#ffd700",

    weight: 3,

    opacity: 1

  };

}


/* =========================================================
   STYLE DIGITASI
========================================================= */

function styleDigitasi(feature) {

  return {

    color: "red",

    weight: 3,

    opacity: 1

  };

}


/* =========================================================
   HOVER RTK
========================================================= */

function onEachRTK(feature, layer) {

  layer.on({

    mouseover: function(e) {

      e.target.setStyle({

        color: "orange",

        weight: 4

      });

    },

    mouseout: function(e) {

      if (rtkLayer) {

        rtkLayer.resetStyle(e.target);

      }

    }

  });

}


/* =========================================================
   HOVER PANTAI
========================================================= */

function onEachPantai(feature, layer) {

  layer.on({

    mouseover: function(e) {

      e.target.setStyle({

        color: "orange",

        weight: 4

      });

    },

    mouseout: function(e) {

      if (pantaiLayer) {

        pantaiLayer.resetStyle(e.target);

      }

    }

  });

}


/* =========================================================
   HOVER DIGITASI
========================================================= */

function onEachDigitasi(feature, layer) {

  layer.on({

    mouseover: function(e) {

      e.target.setStyle({

        color: "orange",

        weight: 4

      });

    },

    mouseout: function(e) {

      if (digitasiLayer) {

        digitasiLayer.resetStyle(e.target);

      }

    }

  });

}


/* =========================================================
   GET FIRST COORDINATE
========================================================= */

function getFirstCoordinate(coords) {

  if (!Array.isArray(coords)) {

    return null;

  }

  if (
    coords.length >= 2 &&
    typeof coords[0] === "number" &&
    typeof coords[1] === "number"
  ) {

    return coords;

  }

  for (let i = 0; i < coords.length; i++) {

    const result =
      getFirstCoordinate(coords[i]);

    if (result) {

      return result;

    }

  }

  return null;

}


/* =========================================================
   DETECT CRS FROM GEOJSON
========================================================= */

function detectCRSFromGeoJSON(data) {

  if (
    data &&
    data.crs &&
    data.crs.properties
  ) {

    const props =
      data.crs.properties;


    if (
      props.name &&
      typeof props.name === "string"
    ) {

      const name =
        props.name.toUpperCase();


      if (
        name.includes("EPSG:32748") ||
        name.includes("32748")
      ) {

        return "EPSG:32748";

      }


      if (
        name.includes("EPSG:4326") ||
        name.includes("4326")
      ) {

        return "EPSG:4326";

      }

    }


    if (
      props.code === 32748 ||
      props.code === "32748"
    ) {

      return "EPSG:32748";

    }


    if (
      props.code === 4326 ||
      props.code === "4326"
    ) {

      return "EPSG:4326";

    }

  }


  return null;

}


/* =========================================================
   DETECT CRS FROM COORDINATES
========================================================= */

function detectCRSFromCoordinates(data) {

  const coordinate =
    getFirstCoordinate(
      data.coordinates ||
      (
        data.features &&
        data.features[0] &&
        data.features[0].geometry
          ? data.features[0].geometry.coordinates
          : null
      )
    );


  if (!coordinate) {

    return null;

  }


  const x = coordinate[0];

  const y = coordinate[1];


  /*
     UTM 48S biasanya:

     X = ratusan ribu meter
     Y = jutaan meter

     Sedangkan WGS84:

     longitude = sekitar 100 - 110
     latitude  = sekitar -10 - 10
  */

  if (
    Math.abs(x) > 180 ||
    Math.abs(y) > 90
  ) {

    return "EPSG:32748";

  }


  return "EPSG:4326";

}


/* =========================================================
   DETECT GEOJSON CRS
========================================================= */

function detectGeoJSONCRS(data) {

  const crsFromMetadata =
    detectCRSFromGeoJSON(data);


  if (crsFromMetadata) {

    return crsFromMetadata;

  }


  return detectCRSFromCoordinates(data);

}


/* =========================================================
   CONVERT COORDINATES
========================================================= */

function convertCoordinates(
  coordinates,
  sourceCRS
) {

  if (!Array.isArray(coordinates)) {

    return coordinates;

  }


  /*
     Koordinat akhir GeoJSON:

     [longitude, latitude]
  */

  if (
    coordinates.length >= 2 &&
    typeof coordinates[0] === "number" &&
    typeof coordinates[1] === "number"
  ) {

    if (
      sourceCRS === "EPSG:4326"
    ) {

      return [

        coordinates[0],

        coordinates[1]

      ];

    }


    if (
      sourceCRS === "EPSG:32748"
    ) {

      const result =
        proj4(
          "EPSG:32748",
          "EPSG:4326",
          [
            coordinates[0],
            coordinates[1]
          ]
        );


      return [

        result[0],

        result[1]

      ];

    }

  }


  return coordinates.map(

    function(item) {

      return convertCoordinates(
        item,
        sourceCRS
      );

    }

  );

}


/* =========================================================
   CONVERT GEOJSON
========================================================= */

function convertGeoJSONToWGS84(data) {

  const sourceCRS =
    detectGeoJSONCRS(data);


  console.log(
    "CRS terdeteksi:",
    sourceCRS
  );


  if (
    !sourceCRS ||
    sourceCRS === "EPSG:4326"
  ) {

    return data;

  }


  const converted =
    JSON.parse(
      JSON.stringify(data)
    );


  if (
    converted.type ===
    "FeatureCollection"
  ) {

    converted.features.forEach(

      function(feature) {

        if (
          feature.geometry &&
          feature.geometry.coordinates
        ) {

          feature.geometry.coordinates =
            convertCoordinates(
              feature.geometry.coordinates,
              sourceCRS
            );

        }

      }

    );

  }


  else if (
    converted.type === "Feature"
  ) {

    if (
      converted.geometry &&
      converted.geometry.coordinates
    ) {

      converted.geometry.coordinates =
        convertCoordinates(
          converted.geometry.coordinates,
          sourceCRS
        );

    }

  }


  else if (
    converted.coordinates
  ) {

    converted.coordinates =
      convertCoordinates(
        converted.coordinates,
        sourceCRS
      );

  }


  return converted;

}


/* =========================================================
   KHUSUS RTK
   ASUMSI DATA:
   EPSG:32748 / UTM ZONE 48S

   Ini sengaja tidak menggunakan deteksi CRS otomatis,
   karena file RTK dapat tidak memiliki metadata CRS.
========================================================= */

function convertRTKGeoJSONToWGS84(data) {

  const converted =
    JSON.parse(
      JSON.stringify(data)
    );


  function convertGeometry(
    geometry
  ) {

    if (!geometry) {

      return;

    }


    if (geometry.coordinates) {

      geometry.coordinates =
        convertCoordinates(
          geometry.coordinates,
          "EPSG:32748"
        );

    }

  }


  if (
    converted.type ===
    "FeatureCollection"
  ) {

    converted.features.forEach(

      function(feature) {

        if (feature.geometry) {

          convertGeometry(
            feature.geometry
          );

        }

      }

    );

  }


  else if (
    converted.type === "Feature"
  ) {

    convertGeometry(
      converted.geometry
    );

  }


  else if (
    converted.coordinates
  ) {

    converted.coordinates =
      convertCoordinates(
        converted.coordinates,
        "EPSG:32748"
      );

  }


  return converted;

}


/* =========================================================
   LOAD RTK
========================================================= */

fetch(
  "Garis_Pantai_RTK.geojson"
)

.then(

  function(response) {

    if (!response.ok) {

      throw new Error(
        "Garis_Pantai_RTK.geojson tidak ditemukan"
      );

    }

    return response.json();

  }

)

.then(

  function(data) {

    console.log(
      "Data RTK asli:",
      data
    );


    /*
       RTK dipastikan berasal dari:

       EPSG:32748
       UTM Zone 48 South

       lalu dikonversi menjadi:

       EPSG:4326
    */

    const converted =
      convertRTKGeoJSONToWGS84(data);


    console.log(
      "Data RTK setelah konversi ke WGS84:",
      converted
    );


    rtkLayer =
      L.geoJSON(

        converted,

        {

          style:
            styleRTK,

          onEachFeature:
            onEachRTK

        }

      );


    /*
       RTK tidak otomatis di-zoom.
       Layer hanya dimasukkan ke peta.
    */

    if (
      document.getElementById(
        "checkRTK"
      ).checked
    ) {

      rtkLayer.addTo(map);

    }


    console.log(
      "Garis Pantai RTK berhasil dimuat."
    );


    /*
       Cek bounds RTK
    */

    const bounds =
      rtkLayer.getBounds();


    if (
      bounds &&
      bounds.isValid()
    ) {

      console.log(
        "Bounds RTK:",
        bounds.toBBoxString()
      );

    }

  }

)

.catch(

  function(error) {

    console.error(
      "Error RTK:",
      error
    );

  }

);


/* =========================================================
   LOAD GARIS PANTAI
========================================================= */

fetch(
  "Garis_Pantai.geojson"
)

.then(

  function(response) {

    if (!response.ok) {

      throw new Error(
        "Garis_Pantai.geojson tidak ditemukan"
      );

    }

    return response.json();

  }

)

.then(

  function(data) {

    const converted =
      convertGeoJSONToWGS84(data);


    pantaiLayer =
      L.geoJSON(

        converted,

        {

          style:
            stylePantai,

          onEachFeature:
            onEachPantai

        }

      );


    if (
      document.getElementById(
        "checkPantai"
      ).checked
    ) {

      pantaiLayer.addTo(map);

    }


    console.log(
      "Garis Pantai berhasil dimuat."
    );

  }

)

.catch(

  function(error) {

    console.error(
      "Error Garis Pantai:",
      error
    );

  }

);


/* =========================================================
   LOAD GARIS PANTAI DIGITASI
========================================================= */

fetch(
  "Garis_Pantai_Digitasi.geojson"
)

.then(

  function(response) {

    if (!response.ok) {

      throw new Error(
        "Garis_Pantai_Digitasi.geojson tidak ditemukan"
      );

    }

    return response.json();

  }

)

.then(

  function(data) {

    const converted =
      convertGeoJSONToWGS84(data);


    digitasiLayer =
      L.geoJSON(

        converted,

        {

          style:
            styleDigitasi,

          onEachFeature:
            onEachDigitasi

        }

      );


    if (
      document.getElementById(
        "checkDigitasi"
      ).checked
    ) {

      digitasiLayer.addTo(map);

    }


    console.log(
      "Garis Pantai Digitasi berhasil dimuat."
    );

  }

)

.catch(

  function(error) {

    console.error(
      "Error Digitasi:",
      error
    );

  }

);


/* =========================================================
   ORTHOPHOTO
========================================================= */

const ORTHO_URL_BASE =

  "https://raw.githubusercontent.com/" +

  "rivaldo123230038-cloud/" +

  "WebGIS-Kemker-Kelompok-1/" +

  "main/" +

  "Fix_Ortho_web/" +

  "_alllayers/";


/*
   Orthophoto tersedia sampai L19.

   L20-L24 tetap dapat melakukan zoom menggunakan
   tile L19 sebagai sumber, sehingga tidak blank.

   Catatan:
   L20-L24 bukan data resolusi baru.
   Detail asli maksimum tetap L19.
*/

const ORTHO_NATIVE_ZOOM = 19;


/* =========================================================
   HEX CONVERTER
========================================================= */

function toHex(num) {

  return num
    .toString(16)
    .toLowerCase()
    .padStart(8, "0");

}


/* =========================================================
   ORTHOPHOTO GRID LAYER
========================================================= */

const orthophotoLayer =
  L.GridLayer.extend({

    createTile:
      function(coords, done) {

        const tile =
          document.createElement(
            "canvas"
          );


        const tileSize =
          this.getTileSize();


        tile.width =
          tileSize.x;

        tile.height =
          tileSize.y;


        const ctx =
          tile.getContext("2d");


        /*
           ==================================================
           ZOOM <= L19
           ==================================================
        */

        if (
          coords.z <=
          ORTHO_NATIVE_ZOOM
        ) {

          const img =
            new Image();


          img.crossOrigin =
            "anonymous";


          const rowHex =
            toHex(coords.y);


          const colHex =
            toHex(coords.x);


          const url =

            ORTHO_URL_BASE +

            "L" +

            coords.z +

            "/R" +

            rowHex +

            "/C" +

            colHex +

            ".png";


          img.onload =
            function() {

              ctx.clearRect(
                0,
                0,
                tileSize.x,
                tileSize.y
              );


              ctx.drawImage(

                img,

                0,
                0,

                tileSize.x,
                tileSize.y

              );


              done(
                null,
                tile
              );

            };


          img.onerror =
            function() {

              console.warn(
                "Tile orthophoto tidak ditemukan:",
                url
              );


              done(
                null,
                tile
              );

            };


          img.src =
            url;


          return tile;

        }


        /*
           ==================================================
           ZOOM > L19
           ==================================================
        */

        const zoomDifference =
          coords.z -
          ORTHO_NATIVE_ZOOM;


        const factor =
          Math.pow(
            2,
            zoomDifference
          );


        const parentX =
          Math.floor(
            coords.x / factor
          );


        const parentY =
          Math.floor(
            coords.y / factor
          );


        const localX =
          coords.x -
          parentX * factor;


        const localY =
          coords.y -
          parentY * factor;


        const rowHex =
          toHex(parentY);


        const colHex =
          toHex(parentX);


        const url =

          ORTHO_URL_BASE +

          "L" +

          ORTHO_NATIVE_ZOOM +

          "/R" +

          rowHex +

          "/C" +

          colHex +

          ".png";


        const img =
          new Image();


        img.crossOrigin =
          "anonymous";


        img.onload =
          function() {

            const sourceWidth =
              img.width / factor;


            const sourceHeight =
              img.height / factor;


            const sourceX =
              localX * sourceWidth;


            const sourceY =
              localY * sourceHeight;


            ctx.clearRect(

              0,
              0,
              tileSize.x,
              tileSize.y

            );


            ctx.imageSmoothingEnabled =
              true;


            ctx.imageSmoothingQuality =
              "high";


            ctx.drawImage(

              img,

              sourceX,
              sourceY,

              sourceWidth,
              sourceHeight,

              0,
              0,

              tileSize.x,
              tileSize.y

            );


            done(
              null,
              tile
            );

          };


        img.onerror =
          function() {

            console.warn(
              "Tile L19 orthophoto tidak ditemukan:",
              url
            );


            done(
              null,
              tile
            );

          };


        img.src =
          url;


        return tile;

      }

  });


/* =========================================================
   ORTHOPHOTO INSTANCE
========================================================= */

const orthophotoLayerInstance =

  new orthophotoLayer({

    tileSize: 256,

    minZoom: 11,

    maxZoom: 24,

    opacity: 1,

    updateWhenIdle: false,

    updateWhenZooming: true,

    keepBuffer: 4

  });


/* =========================================================
   LAYER CHECKBOX RTK
========================================================= */

document
  .getElementById("checkRTK")
  .addEventListener(

    "change",

    function() {

      if (!rtkLayer) {

        return;

      }


      if (this.checked) {

        rtkLayer.addTo(map);

      }

      else {

        map.removeLayer(
          rtkLayer
        );

      }

    }

  );


/* =========================================================
   LAYER CHECKBOX PANTAI
========================================================= */

document
  .getElementById("checkPantai")
  .addEventListener(

    "change",

    function() {

      if (!pantaiLayer) {

        return;

      }


      if (this.checked) {

        pantaiLayer.addTo(map);

      }

      else {

        map.removeLayer(
          pantaiLayer
        );

      }

    }

  );


/* =========================================================
   LAYER CHECKBOX DIGITASI
========================================================= */

document
  .getElementById("checkDigitasi")
  .addEventListener(

    "change",

    function() {

      if (!digitasiLayer) {

        return;

      }


      if (this.checked) {

        digitasiLayer.addTo(map);

      }

      else {

        );

      }

/* =========================================================
   LAYER CHECKBOX ORTHOPHOTO
========================================================= */

document
  .getElementById("checkOrtho")
  .addEventListener(

    "change",

    function() {

      if (this.checked) {

        orthophotoLayerInstance
          .addTo(map);

      }

      else {

        map.removeLayer(
          orthophotoLayerInstance
        );

      }

    }

  );


/* =========================================================
   SIDEBAR TOGGLE
========================================================= */

function toggleSidebar() {

  const sidebar =
    document.getElementById(
      "sidebar"
    );


  const button =
    document.getElementById(
      "sidebarToggle"
    );


  sidebar.classList.toggle(
    "closed"
  );


  if (
    sidebar.classList.contains(
      "closed"
    )
  ) {

    button.innerHTML =
      "❯";

  }

  else {

    button.innerHTML =
      "❮";

  }


  setTimeout(

    function() {

      map.invalidateSize();

    },

    350

  );

}


/* =========================================================
   AUTO ZOOM YANG SUDAH DIPERBAIKI
========================================================= */

/*
   PRIORITAS:

   1. RTK jika aktif dan valid
   2. Garis Pantai jika RTK tidak tersedia
   3. Digitasi jika dua layer di atas tidak tersedia

   Orthophoto TIDAK digunakan sebagai bounds.

   Ini mencegah Auto Zoom menjadi sangat jauh/ngawur
   hanya karena ukuran tile orthophoto.
*/

function updateAutoZoom() {

  let targetLayer = null;

  let targetName = "";


  /*
     -------------------------------------------------------
     PRIORITAS 1: RTK
     -------------------------------------------------------
  */

  if (
    rtkLayer &&
    map.hasLayer(rtkLayer)
  ) {

    const rtkBounds =
      rtkLayer.getBounds();


    if (
      rtkBounds &&
      rtkBounds.isValid()
    ) {

      targetLayer =
        rtkLayer;

      targetName =
        "Garis Pantai RTK";

    }

  }


  /*
     -------------------------------------------------------
     PRIORITAS 2: GARIS PANTAI
     -------------------------------------------------------
  */

  if (
    !targetLayer &&
    pantaiLayer &&
    map.hasLayer(pantaiLayer)
  ) {

    const pantaiBounds =
      pantaiLayer.getBounds();


    if (
      pantaiBounds &&
      pantaiBounds.isValid()
    ) {

      targetLayer =
        pantaiLayer;

      targetName =
        "Garis Pantai";

    }

  }


  /*
     -------------------------------------------------------
     PRIORITAS 3: DIGITASI
     -------------------------------------------------------
  */

  if (
    !targetLayer &&
    digitasiLayer &&
    map.hasLayer(digitasiLayer)
  ) {

    const digitasiBounds =
      digitasiLayer.getBounds();


    if (
      digitasiBounds &&
      digitasiBounds.isValid()
    ) {

      targetLayer =
        digitasiLayer;

      targetName =
        "Garis Pantai Digitasi";

    }

  }


  /*
     -------------------------------------------------------
     TIDAK ADA LAYER VALID
     -------------------------------------------------------
  */

  if (!targetLayer) {

    alert(
      "Tidak ada layer garis pantai yang aktif atau bounds layer tidak valid."
    );

    return;

  }


  const bounds =
    targetLayer.getBounds();


  if (
    !bounds ||
    !bounds.isValid()
  ) {

    alert(
      "Bounds layer tidak valid."
    );

    return;

  }


  /*
     -------------------------------------------------------
     SIDEBAR
     -------------------------------------------------------
  */

  const sidebar =
    document.getElementById(
      "sidebar"
    );


  const sidebarOpen =
    !sidebar.classList.contains(
      "closed"
    );


  /*
     -------------------------------------------------------
     FIT BOUNDS
     -------------------------------------------------------

     maxZoom sengaja tidak 24.

     Kalau 24 digunakan, garis yang hanya memiliki
     rentang pendek bisa membuat kamera terlalu dekat.

     18 cukup untuk masuk ke area garis pantai
     tanpa zoom berlebihan.
  */

  map.fitBounds(

    bounds,

    {

      paddingTopLeft:

        sidebarOpen
          ? [370, 40]
          : [40, 40],

      paddingBottomRight:
        [40, 40],

      maxZoom: 18,

      animate: true,

      duration: 0.8

    }

  );


  console.log(
    "Auto Zoom:",
    targetName
  );

}


/* =========================================================
   CURSOR COORDINATE
   WGS84 / EPSG:4326
========================================================= */

map.on(

  "mousemove",

  function(e) {

    const lat =
      e.latlng.lat
        .toFixed(7);


    const lng =
      e.latlng.lng
        .toFixed(7);


    document
      .getElementById(
        "latitude"
      )
      .textContent =
      lat;


    document
      .getElementById(
        "longitude"
      )
      .textContent =
      lng;

  }

);


/* =========================================================
   BASEMAP CONTROL
========================================================= */

L.control.layers(

  baseMaps,

  null,

  {

    position:
      "topright",

    collapsed:
      true

  }

).addTo(map);


/* =========================================================
   BACKGROUND GALLERY
========================================================= */

const backgroundGallery =
  document.querySelector(
    ".background-gallery"
  );


let photoOrder = [

  "photo-1",

  "photo-2",

  "photo-3"

];


function rotateBackgroundPhotos() {

  photoOrder.unshift(
    photoOrder.pop()
  );


  const photos =
    backgroundGallery
      .querySelectorAll(
        ".background-photo"
      );


  photos.forEach(

    function(photo) {

      const className =
        Array.from(
          photo.classList
        ).find(

          function(c) {

            return c.indexOf(
              "photo-"
            ) === 0;

          }

        );


      photo.style.order =
        photoOrder.indexOf(
          className
        );

    }

  );

}


/*
   Background berganti posisi
   setiap 4 detik.
*/

setInterval(
  rotateBackgroundPhotos,
  4000
);


/* =========================================================
   SET INITIAL MAP SIZE
========================================================= */

setTimeout(

  function() {

    map.invalidateSize();

  },

  500

);

</script>
