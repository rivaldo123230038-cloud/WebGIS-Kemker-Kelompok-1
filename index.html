<style>

<!-- =========================================================
     MAP
========================================================= -->

<div id="map"></div>


<script>

/* =========================================================
   1. KONFIGURASI DASAR
========================================================= */

const MAP_MIN_ZOOM = 4;

/*
   Basemap dibatasi sampai zoom 19.
   Ini mencegah Leaflet meminta tile terlalu jauh
   yang kemudian menghasilkan "Map data not yet available".
*/
const MAP_MAX_ZOOM = 19;


/* =========================================================
   2. MAP
========================================================= */

const map = L.map('map', {

    center: [-5.43, 105.26],

    zoom: 10,

    minZoom: MAP_MIN_ZOOM,

    maxZoom: MAP_MAX_ZOOM,

    zoomControl: true,

    worldCopyJump: false

});


/* =========================================================
   3. BASEMAP ESRI WORLD IMAGERY
========================================================= */

const esriImagery = L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

    {

        attribution:
            'Tiles © Esri, Maxar, Earthstar Geographics, and the GIS User Community',

        minZoom: 4,

        maxZoom: 19,

        maxNativeZoom: 19,

        tileSize: 256,

        noWrap: true,

        updateWhenIdle: false,

        updateWhenZooming: true,

        keepBuffer: 3,

        detectRetina: false

    }

).addTo(map);


/* =========================================================
   4. BASEMAP ESRI WORLD STREET MAP
========================================================= */

const esriStreet = L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',

    {

        attribution:
            'Tiles © Esri',

        minZoom: 4,

        maxZoom: 19,

        maxNativeZoom: 19,

        tileSize: 256,

        noWrap: true,

        updateWhenIdle: false,

        updateWhenZooming: true,

        keepBuffer: 3,

        detectRetina: false

    }

);


/* =========================================================
   5. ORTHOPHOTO ARC MAP TILE CACHE
=========================================================

   Struktur GitHub:

   Fix_Ortho_web/
       _alllayers/
           L12/
               Rxxxxxxxx/
                   Cxxxxxxxx.png

   L12 sampai L18 digunakan.

========================================================= */

const orthoLayer = L.tileLayer(

    '',

    {

        minZoom: 12,

        maxZoom: 18,

        minNativeZoom: 12,

        maxNativeZoom: 18,

        tileSize: 256,

        noWrap: true,

        opacity: 1,

        updateWhenIdle: false,

        updateWhenZooming: true,

        keepBuffer: 2,

        attribution: 'Orthophoto'

    }

);


/* =========================================================
   CUSTOM ORTHOPHOTO TILE URL
========================================================= */

orthoLayer.getTileUrl = function(coords) {

    const z = coords.z;

    const x = coords.x;

    const y = coords.y;


    /*
       Orthophoto hanya tersedia L12-L18.
    */

    if (z < 12 || z > 18) {

        return '';

    }


    if (x < 0 || y < 0) {

        return '';

    }


    /*
       ArcGIS exploded cache:

       R + 8 digit hexadecimal row
       C + 8 digit hexadecimal column
    */

    const rowHex =
        Math.floor(y)
        .toString(16)
        .padStart(8, '0')
        .toLowerCase();


    const colHex =
        Math.floor(x)
        .toString(16)
        .padStart(8, '0')
        .toLowerCase();


    return (

        'https://raw.githubusercontent.com/' +

        'rivaldo123230038-cloud/' +

        'WebGIS-Kemker-Kelompok-1/' +

        'main/' +

        'Fix_Ortho_web/' +

        '_alllayers/' +

        'L' + z + '/' +

        'R' + rowHex + '/' +

        'C' + colHex + '.png'

    );

};


/* =========================================================
   6. GARIS PANTAI RTK
========================================================= */

let coastline = null;

let coastlineReady = false;


/* =========================================================
   7. FUNGSI KONVERSI UTM 48S -> WGS84
========================================================= */

const utm48s =
    '+proj=utm +zone=48 +south +datum=WGS84 +units=m +no_defs';

const wgs84 =
    '+proj=longlat +datum=WGS84 +no_defs';


/* =========================================================
   8. KONVERSI KOORDINAT
========================================================= */

function convertCoordinate(coord) {

    if (!Array.isArray(coord)) {

        return coord;

    }


    /*
       Jika koordinat masih UTM:

       X biasanya sekitar ratusan ribu meter
       Y sekitar jutaan meter

       Contoh:
       [500000, 9400000]

       Maka dikonversi ke:

       [longitude, latitude]
    */

    if (

        coord.length >= 2 &&

        Math.abs(coord[0]) > 180 &&

        Math.abs(coord[1]) > 90

    ) {

        const result = proj4(

            utm48s,

            wgs84,

            [
                Number(coord[0]),
                Number(coord[1])
            ]

        );


        return [

            result[0],
            result[1]

        ];

    }


    /*
       Kalau ternyata file sudah EPSG:4326,
       jangan dikonversi lagi.
    */

    return coord;

}


/* =========================================================
   9. KONVERSI GEOMETRY GEOJSON
========================================================= */

function convertGeometry(geometry) {

    if (!geometry) {

        return geometry;

    }


    if (geometry.type === 'Point') {

        geometry.coordinates =
            convertCoordinate(
                geometry.coordinates
            );

    }


    else if (
        geometry.type === 'MultiPoint' ||
        geometry.type === 'LineString'
    ) {

        geometry.coordinates =
            geometry.coordinates.map(
                convertCoordinate
            );

    }


    else if (
        geometry.type === 'MultiLineString' ||
        geometry.type === 'Polygon'
    ) {

        geometry.coordinates =
            geometry.coordinates.map(
                part =>
                    part.map(
                        convertCoordinate
                    )
            );

    }


    else if (
        geometry.type === 'MultiPolygon'
    ) {

        geometry.coordinates =
            geometry.coordinates.map(
                polygon =>
                    polygon.map(
                        ring =>
                            ring.map(
                                convertCoordinate
                            )
                    )
            );

    }


    else if (
        geometry.type === 'GeometryCollection'
    ) {

        geometry.geometries =
            geometry.geometries.map(
                convertGeometry
            );

    }


    return geometry;

}


/* =========================================================
   10. KONVERSI SELURUH GEOJSON
========================================================= */

function convertGeoJSON(data) {

    if (!data) {

        return data;

    }


    if (data.type === 'FeatureCollection') {

        data.features =
            data.features.map(feature => {

                if (feature.geometry) {

                    feature.geometry =
                        convertGeometry(
                            feature.geometry
                        );

                }

                return feature;

            });

    }


    else if (data.type === 'Feature') {

        if (data.geometry) {

            data.geometry =
                convertGeometry(
                    data.geometry
                );

        }

    }


    else if (data.type) {

        convertGeometry(data);

    }


    return data;

}


/* =========================================================
   11. POPUP GARIS PANTAI
========================================================= */

function createRTKPopup(properties) {

    if (!properties) {

        return '<b>Garis Pantai RTK</b>';

    }


    let html =
        '<div style="min-width:180px;">' +

        '<b style="color:#17324d;">Garis Pantai RTK</b>' +

        '<hr style="margin:7px 0;">';


    Object.keys(properties).forEach(key => {

        let value = properties[key];


        if (
            value === null ||
            value === undefined ||
            value === ''
        ) {

            value = '-';

        }


        html +=

            '<div style="margin-bottom:4px;">' +

            '<b>' +
            key +
            ':</b> ' +

            value +

            '</div>';

    });


    html += '</div>';


    return html;

}


/* =========================================================
   12. LOAD GARIS PANTAI
========================================================= */

fetch('Garis_Pantai_RTK.geojson')

    .then(response => {

        if (!response.ok) {

            throw new Error(
                'File Garis_Pantai_RTK.geojson tidak ditemukan.'
            );

        }

        return response.json();

    })

    .then(data => {

        /*
           KONVERSI:

           UTM 48S
           EPSG:32748

           menjadi:

           WGS84 Geographic
           EPSG:4326
        */

        data = convertGeoJSON(data);


        coastline = L.geoJSON(

            data,

            {

                style: function() {

                    return {

                        color: '#00ffff',

                        weight: 4,

                        opacity: 0.95,

                        lineCap: 'round',

                        lineJoin: 'round'

                    };

                },


                onEachFeature:
                    function(feature, layer) {

                        layer.bindPopup(

                            createRTKPopup(
                                feature.properties
                            )

                        );


                        layer.on({

                            mouseover:
                                function(e) {

                                    e.target.setStyle({

                                        color: '#ff0000',

                                        weight: 6

                                    });

                                },


                            mouseout:
                                function(e) {

                                    coastline.resetStyle(
                                        e.target
                                    );

                                }

                        });

                    }

            }

        );


        coastlineReady = true;


        /*
           LANGSUNG FIT KE GARIS PANTAI
           SETELAH DATA SELESAI DIMUAT.
        */

        setTimeout(function() {

            zoomToCoastline();

        }, 300);

    })

    .catch(error => {

        console.error(
            'Gagal memuat garis pantai:',
            error
        );

    });


/* =========================================================
   13. FUNGSI AUTO ZOOM GARIS PANTAI
========================================================= */

function zoomToCoastline() {

    if (!coastlineReady || !coastline) {

        alert(
            'Garis Pantai RTK belum selesai dimuat.'
        );

        return;

    }


    const bounds =
        coastline.getBounds();


    if (!bounds.isValid()) {

        alert(
            'Extent Garis Pantai RTK tidak valid.'
        );

        return;

    }


    /*
       FIT BOUNDS DENGAN PADDING
       supaya garis tidak terlalu mepet
       dengan sidebar.
    */

    map.fitBounds(

        bounds,

        {

            paddingTopLeft: [50, 50],

            paddingBottomRight: [50, 50],

            maxZoom: 16,

            animate: true

        }

    );

}


/* =========================================================
   14. CHECKBOX GARIS PANTAI
========================================================= */

document
    .getElementById('coastlineCheck')
    .addEventListener(
        'change',
        function() {

            if (!coastline) {

                this.checked = false;

                alert(
                    'Garis Pantai RTK belum selesai dimuat.'
                );

                return;

            }


            if (this.checked) {

                coastline.addTo(map);

            }

            else {

                map.removeLayer(coastline);

            }

        }
    );


/* =========================================================
   15. CHECKBOX ORTHOPHOTO
========================================================= */

document
    .getElementById('orthoCheck')
    .addEventListener(
        'change',
        function() {

            if (this.checked) {

                orthoLayer.addTo(map);

            }

            else {

                map.removeLayer(orthoLayer);

            }

        }
    );


/* =========================================================
   16. TOMBOL AUTO ZOOM
========================================================= */

document
    .getElementById('autoZoomBtn')
    .addEventListener(
        'click',
        function() {

            zoomToCoastline();

        }
    );


/* =========================================================
   17. BASEMAP RADIO
========================================================= */

document
    .getElementById('imageryRadio')
    .addEventListener(
        'change',
        function() {

            if (!this.checked) {

                return;

            }


            if (map.hasLayer(esriStreet)) {

                map.removeLayer(
                    esriStreet
                );

            }


            if (!map.hasLayer(esriImagery)) {

                esriImagery.addTo(map);

            }

        }
    );


document
    .getElementById('streetRadio')
    .addEventListener(
        'change',
        function() {

            if (!this.checked) {

                return;

            }


            if (map.hasLayer(esriImagery)) {

                map.removeLayer(
                    esriImagery
                );

            }


            if (!map.hasLayer(esriStreet)) {

                esriStreet.addTo(map);

            }

        }
    );


/* =========================================================
   18. KOORDINAT KURSOR
========================================================= */

map.on(
    'mousemove',
    function(e) {

        document
            .getElementById('latValue')
            .textContent =
            e.latlng.lat.toFixed(6);


        document
            .getElementById('lngValue')
            .textContent =
            e.latlng.lng.toFixed(6);

    }
);


/* =========================================================
   19. CUSTOM BUTTON AUTO ZOOM MAP
========================================================= */

const zoomControl =
    L.control({
        position: 'topright'
    });


zoomControl.onAdd =
    function() {

        const div =
            L.DomUtil.create(
                'div',
                'zoom-layer-control'
            );


        const button =
            L.DomUtil.create(
                'button',
                '',
                div
            );


        button.innerHTML = '⌖';

        button.title =
            'Zoom ke Garis Pantai RTK';


        L.DomEvent.disableClickPropagation(
            div
        );


        L.DomEvent.on(
            button,
            'click',
            function() {

                zoomToCoastline();

            }
        );


        return div;

    };


zoomControl.addTo(map);


/* =========================================================
   20. SCALE
========================================================= */

L.control.scale({

    imperial: false,

    metric: true,

    position: 'bottomleft'

}).addTo(map);


/* =========================================================
   21. LEGEND
========================================================= */

const legend =
    L.control({
        position: 'bottomright'
    });


legend.onAdd =
    function() {

        const div =
            L.DomUtil.create(
                'div',
                'legend'
            );


        div.innerHTML =

            '<div class="legend-title">' +
            'Legenda' +
            '</div>' +

            '<div>' +

            '<span class="legend-line"></span>' +

            'Garis Pantai RTK' +

            '</div>';


        return div;

    };


legend.addTo(map);


/* =========================================================
   22. SIDEBAR TOGGLE
========================================================= */

const sidebar =
    document.getElementById(
        'sidebar'
    );


const sidebarToggle =
    document.getElementById(
        'sidebarToggle'
    );


sidebarToggle.addEventListener(
    'click',
    function() {

        sidebar.classList.toggle(
            'collapsed'
        );


        document.body.classList.toggle(
            'sidebar-collapsed'
        );


        if (
            sidebar.classList.contains(
                'collapsed'
            )
        ) {

            sidebarToggle.innerHTML =
                '❯';

        }

        else {

            sidebarToggle.innerHTML =
                '❮';

        }


        setTimeout(
            function() {

                map.invalidateSize();

            },

            380

        );

    }
);


/* =========================================================
   23. BACKGROUND SLIDESHOW
========================================================= */

const bgPhotos =
    document.querySelectorAll(
        '.bg-photo'
    );


let bgIndex = 0;


setInterval(
    function() {

        const positions = [
            'bg1',
            'bg2',
            'bg3'
        ];


        bgIndex =
            (bgIndex + 1) % 3;


        bgPhotos.forEach(
            function(img, i) {

                img.classList.remove(
                    'bg1',
                    'bg2',
                    'bg3'
                );


                const position =
                    (i - bgIndex + 3) % 3;


                img.classList.add(
                    positions[position]
                );

            }
        );

    },

    5000
);


/* =========================================================
   24. ORTHOPHOTO AWAL
========================================================= */

/*
   Orthophoto TIDAK langsung dipakai
   sebagai pengatur extent peta.

   Ini penting supaya halaman tidak
   tiba-tiba zoom ke dunia / lokasi lain.
*/

orthoLayer.on(
    'tileerror',
    function(e) {

        console.warn(
            'Tile Orthophoto tidak tersedia:',
            e.coords
        );

    }
);


/* =========================================================
   25. MAP RESIZE
========================================================= */

window.addEventListener(
    'resize',
    function() {

        map.invalidateSize();

    }
);


/* =========================================================
   26. JIKA ORTHOPHOTO DI-CHECK,
       TETAP PADA POSISI GARIS PANTAI
========================================================= */

document
    .getElementById('orthoCheck')
    .addEventListener(
        'change',
        function() {

            setTimeout(
                function() {

                    map.invalidateSize();

                },

                100

            );

        }
    );


/* =========================================================
   27. KONDISI AWAL
========================================================= */

/*
   Garis pantai awal TIDAK ditampilkan
   agar tampilan awal tetap bersih.

   Orthophoto aktif.
*/

if (map.hasLayer(coastline)) {

    map.removeLayer(coastline);

}


/* =========================================================
   SELESAI
========================================================= */

console.log(
    'WEBGIS KELOMPOK 1 berhasil dijalankan.'
);

console.log(
    'RTK: UTM Zone 48S -> WGS84 EPSG:4326'
);

console.log(
    'Basemap: Esri World Imagery / Street Map'
);

console.log(
    'Orthophoto: L12-L18'
);

</script>

</body>
</html>
