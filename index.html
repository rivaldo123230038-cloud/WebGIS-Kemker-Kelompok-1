<script>

/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {

  center: [-5.45, 105.30],

  zoom: 12,

  minZoom: 3,

  maxZoom: 24,

  zoomControl: true,

  attributionControl: true

});


/* =========================================================
   BASEMAP
========================================================= */

const esriImagery =
  L.tileLayer(

    "https://server.arcgisonline.com/" +
    "ArcGIS/rest/services/" +
    "World_Imagery/MapServer/tile/" +
    "{z}/{y}/{x}",

    {

      maxZoom: 24,

      maxNativeZoom: 23,

      attribution:
        "Tiles &copy; Esri"

    }

  );


const esriStreet =
  L.tileLayer(

    "https://server.arcgisonline.com/" +
    "ArcGIS/rest/services/" +
    "World_Street_Map/MapServer/tile/" +
    "{z}/{y}/{x}",

    {

      maxZoom: 24,

      maxNativeZoom: 20,

      attribution:
        "Tiles &copy; Esri"

    }

  );


/* BASEMAP AWAL */

esriImagery.addTo(map);


/* =========================================================
   BASEMAP SELECTOR
========================================================= */

document
  .getElementById("basemapSelect")
  .addEventListener("change", function() {

    const selected = this.value;


    if (selected === "imagery") {

      if (map.hasLayer(esriStreet)) {

        map.removeLayer(esriStreet);

      }

      if (!map.hasLayer(esriImagery)) {

        esriImagery.addTo(map);

      }

    }


    if (selected === "street") {

      if (map.hasLayer(esriImagery)) {

        map.removeLayer(esriImagery);

      }

      if (!map.hasLayer(esriStreet)) {

        esriStreet.addTo(map);

      }

    }

  });


/* =========================================================
   STYLE GARIS PANTAI
========================================================= */

function styleRTK(feature) {

  return {

    color: "#00ffff",

    weight: 3,

    opacity: 1

  };

}


function stylePantai(feature) {

  return {

    color: "#ffd700",

    weight: 3,

    opacity: 1

  };

}


function styleDigitasi(feature) {

  return {

    color: "red",

    weight: 3,

    opacity: 1

  };

}


/* =========================================================
   HOVER
========================================================= */

function highlightFeature(e) {

  const layer = e.target;

  layer.setStyle({

    weight: 4,

    color: "orange"

  });


  if (!L.Browser.ie &&
      !L.Browser.opera &&
      !L.Browser.edge) {

    layer.bringToFront();

  }

}


function resetHighlight(e) {

  const layer = e.target;


  if (layer._layerType === "RTK") {

    layer.setStyle(styleRTK());

  }


  if (layer._layerType === "PANTAI") {

    layer.setStyle(stylePantai());

  }


  if (layer._layerType === "DIGITASI") {

    layer.setStyle(styleDigitasi());

  }

}


/* =========================================================
   ON EACH FEATURE
========================================================= */

function onEachRTK(feature, layer) {

  layer._layerType = "RTK";

  layer.on({

    mouseover: highlightFeature,

    mouseout: resetHighlight

  });

}


function onEachPantai(feature, layer) {

  layer._layerType = "PANTAI";

  layer.on({

    mouseover: highlightFeature,

    mouseout: resetHighlight

  });

}


function onEachDigitasi(feature, layer) {

  layer._layerType = "DIGITASI";

  layer.on({

    mouseover: highlightFeature,

    mouseout: resetHighlight

  });

}


/* =========================================================
   VARIABLE LAYER
========================================================= */

let rtkLayer = null;

let pantaiLayer = null;

let digitasiLayer = null;

let orthophotoLayer = null;


/* =========================================================
   PROJ4 UTM 48S
========================================================= */

proj4.defs(

  "EPSG:32748",

  "+proj=utm " +
  "+zone=48 " +
  "+south " +
  "+datum=WGS84 " +
  "+units=m " +
  "+no_defs"

);


/* =========================================================
   AMBIL KOORDINAT PERTAMA
========================================================= */

function getFirstCoordinate(geojson) {

  let result = null;


  function searchCoordinates(coords) {

    if (!Array.isArray(coords)) {

      return;

    }


    if (
      coords.length >= 2 &&
      typeof coords[0] === "number" &&
      typeof coords[1] === "number"
    ) {

      result = coords;

      return;

    }


    for (let i = 0; i < coords.length; i++) {

      if (result) {

        return;

      }

      searchCoordinates(coords[i]);

    }

  }


  if (geojson.type === "FeatureCollection") {

    for (
      let i = 0;
      i < geojson.features.length;
      i++
    ) {

      if (result) {

        break;

      }

      if (
        geojson.features[i].geometry
      ) {

        searchCoordinates(
          geojson.features[i]
            .geometry
            .coordinates
        );

      }

    }

  }

  else if (
    geojson.type === "Feature"
  ) {

    searchCoordinates(
      geojson.geometry.coordinates
    );

  }

  else if (
    geojson.coordinates
  ) {

    searchCoordinates(
      geojson.coordinates
    );

  }


  return result;

}


/* =========================================================
   DETEKSI CRS DARI KOORDINAT
========================================================= */

function detectCRSFromCoordinates(geojson) {

  const coord =
    getFirstCoordinate(geojson);


  if (!coord) {

    return "UNKNOWN";

  }


  const x = coord[0];

  const y = coord[1];


  /*
   UTM 48S:
   Easting sekitar 100000 - 900000
   Northing sekitar 0 - 10000000

   WGS84 geografis:
   longitude sekitar -180 sampai 180
   latitude sekitar -90 sampai 90
  */

  if (
    Math.abs(x) > 180 ||
    Math.abs(y) > 90
  ) {

    return "EPSG:32748";

  }


  return "EPSG:4326";

}


/* =========================================================
   DETEKSI CRS
========================================================= */

function detectGeoJSONCRS(geojson) {

  if (
    geojson.crs &&
    geojson.crs.properties
  ) {

    const name =
      geojson.crs.properties.name ||
      geojson.crs.properties.href ||
      "";


    if (
      name.includes("32748") ||
      name.includes("UTM")
    ) {

      return "EPSG:32748";

    }

  }


  return detectCRSFromCoordinates(geojson);

}


/* =========================================================
   KONVERSI KOORDINAT
========================================================= */

function convertCoordinates(
  coordinates,
  sourceCRS
) {

  if (!Array.isArray(coordinates)) {

    return coordinates;

  }


  if (
    coordinates.length >= 2 &&
    typeof coordinates[0] === "number" &&
    typeof coordinates[1] === "number"
  ) {

    if (
      sourceCRS === "EPSG:32748"
    ) {

      const converted =
        proj4(
          "EPSG:32748",
          "EPSG:4326",
          [
            coordinates[0],
            coordinates[1]
          ]
        );


      if (coordinates.length > 2) {

        return [
          converted[0],
          converted[1],
          coordinates[2]
        ];

      }


      return converted;

    }


    return coordinates;

  }


  return coordinates.map(
    function(item) {

      return convertCoordinates(
        item,
        sourceCRS
      );

    }
  );

}


/* =========================================================
   KONVERSI GEOJSON
========================================================= */

function convertGeoJSONToWGS84(
  geojson,
  sourceCRS
) {

  const copy =
    JSON.parse(
      JSON.stringify(geojson)
    );


  function processGeometry(
    geometry
  ) {

    if (!geometry) {

      return;

    }


    if (geometry.coordinates) {

      geometry.coordinates =
        convertCoordinates(
          geometry.coordinates,
          sourceCRS
        );

    }

  }


  if (
    copy.type === "FeatureCollection"
  ) {

    copy.features.forEach(
      function(feature) {

        processGeometry(
          feature.geometry
        );

      }
    );

  }

  else if (
    copy.type === "Feature"
  ) {

    processGeometry(
      copy.geometry
    );

  }

  else {

    processGeometry(copy);

  }


  return copy;

}


/* =========================================================
   KHUSUS RTK
   RTK DIPASTIKAN UTM 48S
========================================================= */

function convertRTKGeoJSONToWGS84(
  geojson
) {

  return convertGeoJSONToWGS84(
    geojson,
    "EPSG:32748"
  );

}


/* =========================================================
   LOAD RTK
========================================================= */

fetch(
  "Garis_Pantai_RTK.geojson"
)

.then(
  function(response) {

    if (!response.ok) {

      throw new Error(
        "Garis_Pantai_RTK.geojson tidak ditemukan"
      );

    }

    return response.json();

  }
)

.then(
  function(data) {

    const converted =
      convertRTKGeoJSONToWGS84(
        data
      );


    rtkLayer =
      L.geoJSON(

        converted,

        {

          style: styleRTK,

          onEachFeature: onEachRTK

        }

      );


    if (
      document
        .getElementById("checkRTK")
        .checked
    ) {

      rtkLayer.addTo(map);

    }

  }
)

.catch(
  function(error) {

    console.error(
      "Error RTK:",
      error
    );

  }
);


/* =========================================================
   LOAD GARIS PANTAI
========================================================= */

fetch(
  "Garis_Pantai.geojson"
)

.then(
  function(response) {

    if (!response.ok) {

      throw new Error(
        "Garis_Pantai.geojson tidak ditemukan"
      );

    }

    return response.json();

  }
)

.then(
  function(data) {

    const sourceCRS =
      detectGeoJSONCRS(data);


    const converted =
      convertGeoJSONToWGS84(
        data,
        sourceCRS
      );


    pantaiLayer =
      L.geoJSON(

        converted,

        {

          style: stylePantai,

          onEachFeature:
            onEachPantai

        }

      );


    if (
      document
        .getElementById("checkPantai")
        .checked
    ) {

      pantaiLayer.addTo(map);

    }

  }
)

.catch(
  function(error) {

    console.error(
      "Error Garis Pantai:",
      error
    );

  }
);


/* =========================================================
   LOAD DIGITASI
========================================================= */

fetch(
  "Garis_Pantai_Digitasi.geojson"
)

.then(
  function(response) {

    if (!response.ok) {

      throw new Error(
        "Garis_Pantai_Digitasi.geojson tidak ditemukan"
      );

    }

    return response.json();

  }
)

.then(
  function(data) {

    const sourceCRS =
      detectGeoJSONCRS(data);


    const converted =
      convertGeoJSONToWGS84(
        data,
        sourceCRS
      );


    digitasiLayer =
      L.geoJSON(

        converted,

        {

          style: styleDigitasi,

          onEachFeature:
            onEachDigitasi

        }

      );


    if (
      document
        .getElementById("checkDigitasi")
        .checked
    ) {

      digitasiLayer.addTo(map);

    }

  }
)

.catch(
  function(error) {

    console.error(
      "Error Digitasi:",
      error
    );

  }
);


/* =========================================================
   ORTHOPHOTO - TMS GLOBAL MAPPER
========================================================= */

/*
   HASIL EXPORT GLOBAL MAPPER:

   TML/
      15/
         X/
            Y.png

   Saat ini baru level 15 yang tersedia.

   PENTING:
   - Global Mapper TMS default menggunakan format:
       %z\%x\%y.png
   - Leaflet memakai tms:true karena TMS menggunakan orientasi Y terbalik.
   - Ketika hanya L15 yang tersedia, orthophoto mulai tampil pada zoom 15.
   - Zoom 16-24 tetap menggunakan tile L15 dan diperbesar oleh Leaflet.

   Setelah L16-L19 juga diupload, cukup ubah:
       ORTHO_NATIVE_ZOOM = 19

   Level 15-19 kemudian akan dipakai sesuai zoom masing-masing.
*/

const ORTHO_URL_BASE =
  "https://raw.githubusercontent.com/" +
  "rivaldo123230038-cloud/" +
  "WebGIS-Kemker-Kelompok-1/" +
  "main/" +
  "TML/";


/* =========================================================
   LEVEL YANG SAAT INI TERSEDIA
========================================================= */

const ORTHO_MIN_NATIVE_ZOOM = 15;
const ORTHO_NATIVE_ZOOM = 15;


/* =========================================================
   BUAT ORTHOPHOTO TMS
========================================================= */

orthophotoLayer =
  L.tileLayer(

    ORTHO_URL_BASE +
    "{z}/{x}/{y}.png",

    {

      /*
         Karena saat ini baru level 15 tersedia,
         jangan minta tile level 11-14 yang belum ada.
      */

      minZoom:
        ORTHO_MIN_NATIVE_ZOOM,


      /*
         Zoom maksimum tampilan WebGIS.
      */

      maxZoom: 24,


      /*
         Tile asli saat ini = L15.

         Jadi pada L16-L24 Leaflet akan tetap memakai
         tile L15 dan melakukan pembesaran.
      */

      maxNativeZoom:
        ORTHO_NATIVE_ZOOM,


      tileSize: 256,


      opacity: 1,


      /*
         Global Mapper TMS menggunakan orientasi TMS.
      */

      tms: true,


      updateWhenIdle: false,

      updateWhenZooming: true,

      keepBuffer: 4,

      noWrap: true,


      attribution:
        "Orthophoto"

    }

  );

/* =========================================================
   AUTO ZOOM
========================================================= */

function updateAutoZoom() {

  let targetLayer = null;

  let targetName = "";


  /*
     PRIORITAS 1
     RTK
  */

  if (
    rtkLayer &&
    map.hasLayer(rtkLayer)
  ) {

    const bounds =
      rtkLayer.getBounds();


    if (
      bounds &&
      bounds.isValid()
    ) {

      targetLayer =
        rtkLayer;

      targetName =
        "Garis Pantai RTK";

    }

  }


  /*
     PRIORITAS 2
     GARIS PANTAI
  */

  if (!targetLayer) {

    if (
      pantaiLayer &&
      map.hasLayer(pantaiLayer)
    ) {

      const bounds =
        pantaiLayer.getBounds();


      if (
        bounds &&
        bounds.isValid()
      ) {

        targetLayer =
          pantaiLayer;

        targetName =
          "Garis Pantai";

      }

    }

  }


  /*
     PRIORITAS 3
     DIGITASI
  */

  if (!targetLayer) {

    if (
      digitasiLayer &&
      map.hasLayer(digitasiLayer)
    ) {

      const bounds =
        digitasiLayer.getBounds();


      if (
        bounds &&
        bounds.isValid()
      ) {

        targetLayer =
          digitasiLayer;

        targetName =
          "Garis Pantai Digitasi";

      }

    }

  }


  if (!targetLayer) {

    alert(
      "Tidak ada layer garis pantai yang aktif."
    );

    return;

  }


  const bounds =
    targetLayer.getBounds();


  /*
     Cek apakah sidebar sedang terbuka
  */

  const sidebar =
    document.getElementById(
      "sidebar"
    );


  const sidebarOpen =
    !sidebar.classList.contains(
      "closed"
    );


  /*
     Fit bounds.

     Orthophoto TIDAK digunakan
     untuk menentukan bounds.
  */

  map.fitBounds(

    bounds,

    {

      paddingTopLeft:
        sidebarOpen
          ? [370, 40]
          : [40, 40],

      paddingBottomRight:
        [40, 40],

      maxZoom: 18,

      animate: true,

      duration: 0.8

    }

  );

}

/* =========================================================

========================================================= */

const sidebar =
  document.getElementById(
    "sidebar"
  );


const sidebarToggle =
  document.getElementById(
    "sidebarToggle"
  );


sidebarToggle.addEventListener(
  "click",
  function() {

    sidebar.classList.toggle(
      "closed"
    );


    if (
      sidebar.classList.contains(
        "closed"
      )
    ) {

      sidebarToggle.textContent =
        "›";

    }

    else {

      sidebarToggle.textContent =
        "‹";

    }


    setTimeout(
      function() {

        map.invalidateSize();

      },
      350
    );

  }
);


/* =========================================================
   BACKGROUND GALLERY
========================================================= */

const backgroundGallery =
  document.querySelector(
    ".background-gallery"
  );


let photoOrder = [
  "photo-1",
  "photo-2",
  "photo-3"
];


function rotateBackgroundPhotos() {

  photoOrder.unshift(
    photoOrder.pop()
  );


  const photos =
    backgroundGallery
      .querySelectorAll(
        ".background-photo"
      );


  photos.forEach(
    function(photo) {

      const className =
        Array
          .from(
            photo.classList
          )
          .find(
            function(c) {

              return c.indexOf(
                "photo-"
              ) === 0;

            }
          );


      photo.style.order =
        photoOrder.indexOf(
          className
        );

    }
  );

}


setInterval(
  rotateBackgroundPhotos,
  4000
);
