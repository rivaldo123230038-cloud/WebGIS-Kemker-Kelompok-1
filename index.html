<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>WEBGIS KELOMPOK 1</title>


  <!-- =====================================================
       LEAFLET CSS
       ===================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    /* =====================================================
       DASAR
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      font-family: Arial, Helvetica, sans-serif;

      overflow: hidden;
    }


    /* =====================================================
       PETA
       ===================================================== */

    #map {

      position: absolute;

      left: 350px;
      top: 0;

      width: calc(100% - 350px);
      height: 100vh;

      transition:
        left 0.3s ease,
        width 0.3s ease;
    }


    /* =====================================================
       SIDEBAR
       ===================================================== */

    .sidebar {

      position: fixed;

      left: 0;
      top: 0;

      width: 350px;
      height: 100vh;

      background: #ffffff;

      box-shadow:
        2px 0 12px rgba(0, 0, 0, 0.18);

      z-index: 2000;

      overflow-y: auto;

      transition:
        transform 0.3s ease;
    }


    /* =====================================================
       SIDEBAR MINIMIZE
       ===================================================== */

    .sidebar.collapsed {

      transform:
        translateX(-350px);
    }


    /* =====================================================
       TOMBOL PANAH SIDEBAR
       ===================================================== */

    .sidebar-toggle {

      position: fixed;

      top: 50%;
      left: 350px;

      width: 34px;
      height: 70px;

      transform:
        translateY(-50%);

      border: none;

      border-radius:
        0 8px 8px 0;

      background: #17324d;

      color: white;

      z-index: 3000;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 22px;

      font-weight: bold;

      box-shadow:
        2px 0 8px rgba(0, 0, 0, 0.25);

      transition:
        left 0.3s ease,
        background 0.2s ease;
    }


    .sidebar-toggle:hover {

      background: #244e73;
    }


    .sidebar-toggle.collapsed {

      left: 0;

      border-radius:
        0 8px 8px 0;
    }


    /* =====================================================
       4 LOGO SEJAJAR
       URUTAN:
       1. ITERA
       2. GEOMATIKA ITERA
       3. GEOMATIKA 2023
       4. KEMAH KERJA 2023

       BAGIAN LOGO TIDAK TERKENA BACKGROUND FOTO
       ===================================================== */

    .logo-section {

      position: relative;

      z-index: 10;

      display: flex;

      flex-direction: row;

      justify-content: space-between;

      align-items: center;

      width: 100%;

      height: 108px;

      padding: 18px 10px;

      gap: 5px;

      background: #ffffff;

      border-bottom:
        1px solid #eeeeee;
    }


    .logo-item {

      flex: 1;

      min-width: 0;

      height: 72px;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    .logo-item img {

      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;
    }


    /* =====================================================
       BAGIAN SIDEBAR YANG MEMAKAI BACKGROUND FOTO
       ===================================================== */

    .sidebar-body {

      position: relative;

      min-height:
        calc(100vh - 108px);

      overflow-y: auto;

      overflow-x: hidden;
    }


    /* =====================================================
       BACKGROUND FOTO

       FOTO:
       bcg1.jpeg
       bcg2.jpeg
       bcg3.jpeg

       TAMPIL UTUH DENGAN contain
       ===================================================== */

    .sidebar-body::before {

      content: "";

      position: fixed;

      left: 0;
      top: 108px;

      width: 350px;

      height:
        calc(100vh - 108px);

      z-index: 0;

      background-color:
        #ffffff;

      background-image:
        url("bcg1.jpeg");

      background-repeat:
        no-repeat;

      background-position:
        center center;

      background-size:
        contain;

      opacity:
        0.20;

      animation:
        backgroundSlide 18s infinite;

      pointer-events: none;
    }


    /* =====================================================
       OVERLAY AGAR BACKGROUND TIDAK TERLALU KUAT
       ===================================================== */

    .sidebar-body::after {

      content: "";

      position: fixed;

      left: 0;
      top: 108px;

      width: 350px;

      height:
        calc(100vh - 108px);

      z-index: 1;

      background:
        rgba(255, 255, 255, 0.18);

      pointer-events: none;
    }


    /* =====================================================
       ANIMASI GANTI FOTO
       ===================================================== */

    @keyframes backgroundSlide {

      0%,
      28% {

        background-image:
          url("bcg1.jpeg");
      }


      33%,
      61% {

        background-image:
          url("bcg2.jpeg");
      }


      66%,
      94% {

        background-image:
          url("bcg3.jpeg");
      }


      100% {

        background-image:
          url("bcg1.jpeg");
      }

    }


    /* =====================================================
       ISI SIDEBAR DI ATAS BACKGROUND
       ===================================================== */

    .sidebar-content {

      position: relative;

      z-index: 2;
    }


    /* =====================================================
       JUDUL
       ===================================================== */

    .title-section {

      padding:
        18px 20px 16px;

      text-align: center;

      background:
        rgba(255, 255, 255, 0.72);

      border-bottom:
        1px solid rgba(238, 238, 238, 0.9);
    }


    .title-section h1 {

      margin: 0;

      font-size: 22px;

      font-weight: 700;

      color: #17324d;

      letter-spacing: 0.5px;
    }


    .title-section p {

      margin:
        7px 0 0;

      font-size: 12px;

      line-height: 1.4;

      color: #555555;
    }


    /* =====================================================
       PANEL
       ===================================================== */

    .panel-content {

      padding:
        18px 20px;
    }


    /* =====================================================
       JUDUL BAGIAN
       ===================================================== */

    .section-title {

      margin-top: 18px;

      margin-bottom: 10px;

      padding-bottom: 7px;

      border-bottom:
        2px solid #17324d;

      color: #17324d;

      font-size: 14px;

      font-weight: bold;

      text-transform: uppercase;
    }


    .section-title:first-child {

      margin-top: 0;
    }


    /* =====================================================
       KOTAK KONTROL
       ===================================================== */

    .layer-control-box {

      background:
        rgba(255, 255, 255, 0.84);

      border-radius: 7px;

      padding: 10px;

      border:
        1px solid rgba(225, 229, 232, 0.9);

      box-shadow:
        0 1px 4px rgba(0, 0, 0, 0.08);
    }


    .layer-item {

      display: flex;

      align-items: center;

      gap: 8px;

      padding: 8px 5px;

      font-size: 13px;

      cursor: pointer;
    }


    .layer-item input {

      cursor: pointer;
    }


    /* =====================================================
       TOMBOL AUTO ZOOM
       ===================================================== */

    .zoom-layer-button {

      width: 100%;

      margin-top: 10px;

      padding: 10px 12px;

      border: none;

      border-radius: 6px;

      background: #17324d;

      color: white;

      font-size: 13px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }


    .zoom-layer-button:hover {

      background: #244e73;
    }


    .zoom-layer-button:active {

      transform:
        scale(0.98);
    }


    /* =====================================================
       SISTEM KOORDINAT
       ===================================================== */

    .coordinate-box {

      background:
        rgba(255, 255, 255, 0.84);

      border:
        1px solid rgba(225, 229, 232, 0.9);

      border-radius: 7px;

      padding: 12px;

      box-shadow:
        0 1px 4px rgba(0, 0, 0, 0.08);
    }


    .coordinate-box .label {

      font-size: 11px;

      color: #666666;

      margin-bottom: 3px;
    }


    .coordinate-box .value {

      font-size: 14px;

      font-weight: bold;

      color: #17324d;

      margin-bottom: 10px;
    }


    /* =====================================================
       KOORDINAT KURSOR
       ===================================================== */

    .cursor-box {

      background:
        rgba(23, 50, 77, 0.90);

      color: white;

      border-radius: 7px;

      padding: 10px;

      font-size: 11px;

      line-height: 1.6;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .sidebar-footer {

      margin-top: 25px;

      padding:
        15px 20px;

      border-top:
        1px solid rgba(238, 238, 238, 0.9);

      text-align: center;

      font-size: 10px;

      color: #666666;

      line-height: 1.5;

      background:
        rgba(255, 255, 255, 0.72);
    }


    /* =====================================================
       POPUP
       ===================================================== */

    .popup-title {

      font-size: 14px;

      font-weight: bold;

      color: #17324d;

      margin-bottom: 7px;
    }


    /* =====================================================
       AUTO ZOOM CONTROL DI PETA
       ===================================================== */

    .zoom-to-layer-control {

      margin-top: 10px;
    }


    .zoom-to-layer-button-map {

      width: 38px;
      height: 38px;

      background: white;

      border:
        2px solid rgba(0, 0, 0, 0.2);

      border-radius: 4px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 19px;

      font-weight: bold;

      color: #17324d;

      cursor: pointer;

      box-shadow:
        0 1px 5px rgba(0, 0, 0, 0.25);

      transition:
        0.2s;
    }


    .zoom-to-layer-button-map:hover {

      background:
        #f0f5f9;
    }


    /* =====================================================
       LEGENDA KANAN BAWAH
       ===================================================== */

    .map-legend {

      background:
        rgba(255, 255, 255, 0.95);

      padding:
        10px 12px;

      border-radius: 6px;

      border:
        1px solid #cccccc;

      box-shadow:
        0 1px 5px rgba(0, 0, 0, 0.25);

      font-size: 12px;

      line-height: 1.5;

      color: #333333;

      min-width: 150px;

      margin-right: 10px;

      margin-bottom: 10px;
    }


    .map-legend-title {

      font-weight: bold;

      font-size: 13px;

      color: #17324d;

      margin-bottom: 7px;

      padding-bottom: 4px;

      border-bottom:
        1px solid #dddddd;
    }


    .legend-item {

      display: flex;

      align-items: center;

      gap: 8px;
    }


    .legend-line-coastline {

      width: 28px;

      height: 0;

      border-top:
        4px solid #00ffff;

      flex-shrink: 0;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 800px) {

      .sidebar {

        width: 280px;
      }


      .sidebar.collapsed {

        transform:
          translateX(-280px);
      }


      #map {

        left: 280px;

        width:
          calc(100% - 280px);
      }


      .sidebar-toggle {

        left: 280px;
      }


      .sidebar-body::before {

        width: 280px;
      }


      .sidebar-body::after {

        width: 280px;
      }


      .logo-section {

        padding:
          15px 6px;

        gap: 3px;
      }


      .logo-item {

        height: 58px;
      }


      .title-section h1 {

        font-size: 18px;
      }


      .map-legend {

        min-width: 135px;

        font-size: 11px;

        margin-right: 8px;

        margin-bottom: 8px;
      }

    }

  </style>

</head>


<body>

  <!-- =====================================================

       ===================================================== -->

  <button
    id="sidebarToggle"
    class="sidebar-toggle"
    type="button"
    title="Minimize Panel"
    aria-label="Minimize Panel"
  >

    ◀

  </button>


  <!-- =====================================================
       PETA
       ===================================================== -->

  <div id="map"></div>


  <!-- =====================================================
       LEAFLET JS
       ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <!-- =====================================================
       GOOGLE MAPS JAVASCRIPT API
       GANTI API KEY
       ===================================================== -->

  <script
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&v=weekly">
  </script>


  <!-- =====================================================
       GOOGLE MUTANT
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/leaflet.gridlayer.googlemutant@0.16.0/dist/Leaflet.GoogleMutant.js">
  </script>


  <script>


    /* =====================================================
       1. INISIALISASI PETA
       ===================================================== */

    const map = L.map(
      'map',
      {

        center:
          [-5.45, 105.25],

        zoom:
          10,

        minZoom:
          0,

        maxZoom:
          23,

        zoomControl:
          true,

        scrollWheelZoom:
          true,

        doubleClickZoom:
          true,

        touchZoom:
          true,

        boxZoom:
          true

      }
    );


    /* =====================================================
       2. SIDEBAR TOGGLE
       ===================================================== */

    const sidebar =
      document.getElementById(
        'sidebar'
      );


    const sidebarToggle =
      document.getElementById(
        'sidebarToggle'
      );


    let sidebarCollapsed =
      false;


    sidebarToggle.addEventListener(

      'click',

      function() {


        sidebarCollapsed =
          !sidebarCollapsed;


        if (sidebarCollapsed) {


          /* MINIMIZE */

          sidebar.classList.add(
            'collapsed'
          );


          sidebarToggle.classList.add(
            'collapsed'
          );


          sidebarToggle.innerHTML =
            '▶';


          sidebarToggle.title =
            'Tampilkan Panel';


          sidebarToggle.setAttribute(
            'aria-label',
            'Tampilkan Panel'
          );


          document
            .getElementById('map')
            .style.left =
            '0';


          document
            .getElementById('map')
            .style.width =
            '100%';

        }


        else {


          /* TAMPILKAN */

          sidebar.classList.remove(
            'collapsed'
          );


          sidebarToggle.classList.remove(
            'collapsed'
          );


          sidebarToggle.innerHTML =
            '◀';


          sidebarToggle.title =
            'Minimize Panel';


          sidebarToggle.setAttribute(
            'aria-label',
            'Minimize Panel'
          );


          const sidebarWidth =
            window.innerWidth <= 800
              ? '280px'
              : '350px';


          document
            .getElementById('map')
            .style.left =
            sidebarWidth;


          document
            .getElementById('map')
            .style.width =
            `calc(100% - ${sidebarWidth})`;

        }


        setTimeout(

          function() {

            map.invalidateSize();

          },

          320

        );

      }

    );


    /* =====================================================
       3. ESRI WORLD IMAGERY
       ===================================================== */

    const satellite =
      L.tileLayer(

        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

        {

          minZoom:
            0,

          maxZoom:
            19,

          attribution:
            'Tiles &copy; Esri'

        }

      );


    /* =====================================================
       4. ESRI WORLD STREET MAP
       ===================================================== */

    const street =
      L.tileLayer(

        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',

        {

          minZoom:
            0,

          maxZoom:
            19,

          attribution:
            'Tiles &copy; Esri'

        }

      );


    /* =====================================================
       5. GOOGLE SATELLITE
       ===================================================== */

    const googleSatellite =
      L.gridLayer.googleMutant({

        type:
          'satellite',

        minZoom:
          0,

        maxZoom:
          23

      });


    /* =====================================================
       6. ORTHOPHOTO ARCMAP EXPLODED TILE CACHE

       SUMBER:
       Fix_Ortho_web

       STRUKTUR:

       Fix_Ortho_web/
       └── _alllayers/
           ├── L12/
           │   └── Rxxxxxxxx/
           │       └── Cxxxxxxxx.png
           ├── L13/
           ├── L14/
           ├── L15/
           ├── L16/
           └── L17/

       CONTOH:
       L12/R0000083f/C00000cad.png

       TEST LEVEL:
       L12 - L17
       ===================================================== */

    let orthoLoaded =
      false;


    let orthoErrorCount =
      0;


    const orthoLayer =
      L.tileLayer(

        '',

        {

          minZoom:
            12,

          maxZoom:
            17,

          minNativeZoom:
            12,

          maxNativeZoom:
            17,

          tileSize:
            256,

          noWrap:
            true,

          opacity:
            1,

          attribution:
            'Orthophoto'

        }

      );


    /* =====================================================
       7. CUSTOM URL TILE ORTHOPHOTO

       LEAFLET:
       x = kolom
       y = baris

       ARCMAP:
       C + HEX COLUMN
       R + HEX ROW
       ===================================================== */

    orthoLayer.getTileUrl =
      function(coords) {


        const z =
          coords.z;


        const x =
          coords.x;


        const y =
          coords.y;


        /* ================================================
           HANYA L12 - L17
           ================================================ */

        if (
          z < 12 ||
          z > 17
        ) {

          return '';

        }


        /* ================================================
           CEGAH NILAI NEGATIF
           ================================================ */

        if (
          x < 0 ||
          y < 0
        ) {

          return '';

        }


        /* ================================================
           KONVERSI ROW KE HEX

           CONTOH:
           2111 decimal
           ->
           83f hex
           ->
           0000083f
           ================================================ */

        const rowHex =
          Math.floor(y)
            .toString(16)
            .padStart(
              8,
              '0'
            )
            .toLowerCase();


        /* ================================================
           KONVERSI COLUMN KE HEX

           CONTOH:
           3245 decimal
           ->
           cad hex
           ->
           00000cad
           ================================================ */

        const colHex =
          Math.floor(x)
            .toString(16)
            .padStart(
              8,
              '0'
            )
            .toLowerCase();


        /* ================================================
           URL FINAL
           ================================================ */

        const url =

          'Fix_Ortho_web/' +
          '_alllayers/' +
          'L' + z +
          '/' +
          'R' + rowHex +
          '/' +
          'C' + colHex +
          '.png';


        console.log(
          'ORTHOPHOTO TILE:',
          url
        );


        return url;

      };


    /* =====================================================
       8. BASEMAP DEFAULT
       ===================================================== */

    satellite.addTo(map);


    /* =====================================================
       9. STYLE GARIS PANTAI
       ===================================================== */

    const coastlineStyle = {

      color:
        '#00ffff',

      weight:
        4,

      opacity:
        0.95

    };


    /* =====================================================
       10. VARIABEL GARIS PANTAI
       ===================================================== */

    let coastline =
      null;


    /* =====================================================
       11. AUTO ZOOM TO LAYER
       ===================================================== */

    function zoomToCoastline() {


      if (

        coastline &&

        coastline.getLayers().length > 0

      ) {


        const bounds =
          coastline.getBounds();


        if (bounds.isValid()) {


          map.fitBounds(

            bounds,

            {

              padding:
                [40, 40],

              maxZoom:
                16

            }

          );


        }

      }

      else {


        alert(
          'Layer garis pantai belum tersedia.'
        );


      }

    }


    /* =====================================================
       12. AUTO ZOOM SIDEBAR
       ===================================================== */

    document

      .getElementById(
        'zoomLayerButton'
      )

      .addEventListener(

        'click',

        function() {

          zoomToCoastline();

        }

      );


    /* =====================================================
       13. CUSTOM AUTO ZOOM CONTROL
       ===================================================== */

    const ZoomToLayerControl =
      L.Control.extend({

        options: {

          position:
            'topright'

        },


        onAdd:
          function() {


            const container =
              L.DomUtil.create(

                'div',

                'leaflet-bar zoom-to-layer-control'

              );


            const button =
              L.DomUtil.create(

                'button',

                'zoom-to-layer-button-map',

                container

              );


            button.type =
              'button';


            button.innerHTML =
              '⌖';


            button.title =
              'Auto Zoom to Layer';


            button.setAttribute(

              'aria-label',

              'Auto Zoom to Layer'

            );


            L.DomEvent.disableClickPropagation(
              container
            );


            L.DomEvent.on(

              button,

              'click',

              function(e) {


                L.DomEvent.stopPropagation(e);


                zoomToCoastline();


              }

            );


            return container;

          }

      });


    /* =====================================================
       14. TAMBAHKAN AUTO ZOOM CONTROL
       ===================================================== */

    map.addControl(

      new ZoomToLayerControl()

    );


    /* =====================================================
       15. KONVERSI ESRI JSON
       ===================================================== */

    function convertEsriJSON(data) {


      const coastlineGroup =
        L.featureGroup();


      if (!data.features) {


        console.error(
          'GP_RT.json tidak memiliki features.'
        );


        return coastlineGroup;

      }


      data.features.forEach(

        function(feature) {


          const geometry =
            feature.geometry || {};


          const attributes =
            feature.attributes || {};


          if (!geometry.paths) {


            return;

          }


          geometry.paths.forEach(

            function(path) {


              /*
                ESRI JSON:
                [X,Y]

                X = Longitude
                Y = Latitude

                Leaflet:
                [Latitude,Longitude]
              */


              const latLngs =
                path.map(

                  function(point) {

                    return [

                      point[1],

                      point[0]

                    ];

                  }

                );


              /* ==========================================
                 BUAT GARIS
                 ========================================== */

              const line =
                L.polyline(

                  latLngs,

                  coastlineStyle

                );


              /* ==========================================
                 POPUP
                 ========================================== */

              let html =

                '<div>' +

                '<div class="popup-title">' +

                'Informasi Garis Pantai' +

                '</div>';


              const keys =
                Object.keys(
                  attributes
                );


              if (keys.length === 0) {


                html +=
                  'Tidak terdapat atribut.';


              }

              else {


                keys.forEach(

                  function(key) {


                    let value =
                      attributes[key];


                    if (

                      value === null ||

                      value === undefined ||

                      value === ''

                    ) {

                      value = '-';

                    }


                    html +=

                      '<b>' +

                      key +

                      '</b>: ' +

                      value +

                      '<br>';

                  }

                );


              }


              html +=
                '</div>';


              line.bindPopup(
                html
              );


              /* ==========================================
                 HOVER
                 ========================================== */

              line.on(

                'mouseover',

                function() {


                  this.setStyle({

                    color:
                      '#ff0000',

                    weight:
                      6

                  });


                }

              );


              line.on(

                'mouseout',

                function() {


                  this.setStyle(

                    coastlineStyle

                  );


                }

              );


              coastlineGroup.addLayer(
                line
              );


            }

          );


        }

      );


      return coastlineGroup;

    }


    /* =====================================================
       16. LOAD GP_RT.JSON
       ===================================================== */

    fetch('GP_RT.json')


      .then(

        function(response) {


          if (!response.ok) {


            throw new Error(
              'GP_RT.json tidak ditemukan.'
            );


          }


          return response.json();


        }

      )


      .then(

        function(data) {


          console.log(

            'GP_RT.json berhasil dimuat:',

            data

          );


          coastline =
            convertEsriJSON(
              data
            );


          coastline.addTo(
            map
          );


          zoomToCoastline();


          /* =============================================
             CHECKBOX GARIS PANTAI
             ============================================= */

          document

            .getElementById(
              'coastlineCheck'
            )

            .addEventListener(

              'change',

              function() {


                if (this.checked) {


                  coastline.addTo(
                    map
                  );


                  zoomToCoastline();


                }

                else {


                  map.removeLayer(
                    coastline
                  );


                }


              }

            );


        }

      )


      .catch(

        function(error) {


          console.error(
            error
          );


          alert(

            'Gagal membaca GP_RT.json.\n\n' +

            'Pastikan GP_RT.json berada ' +

            'satu folder dengan index.html.'

          );


        }

      );


    /* =====================================================
       17. FUNGSI HAPUS BASEMAP
       ===================================================== */

    function removeBasemaps() {


      if (map.hasLayer(satellite)) {

        map.removeLayer(
          satellite
        );

      }


      if (map.hasLayer(googleSatellite)) {

        map.removeLayer(
          googleSatellite
        );

      }


      if (map.hasLayer(street)) {

        map.removeLayer(
          street
        );

      }


      if (map.hasLayer(orthoLayer)) {

        map.removeLayer(
          orthoLayer
        );

      }

    }


    /* =====================================================
       18. ESRI WORLD IMAGERY
       ===================================================== */

    document

      .getElementById(
        'satelliteRadio'
      )

      .addEventListener(

        'change',

        function() {


          if (this.checked) {


            removeBasemaps();


            satellite.addTo(
              map
            );


          }

        }

      );


    /* =====================================================
       19. GOOGLE SATELLITE
       ===================================================== */

    document

      .getElementById(
        'googleRadio'
      )

      .addEventListener(

        'change',

        function() {


          if (this.checked) {


            removeBasemaps();


            googleSatellite.addTo(
              map
            );


          }

        }

      );


    /* =====================================================
       20. ESRI WORLD STREET MAP
       ===================================================== */

    document

      .getElementById(
        'streetRadio'
      )

      .addEventListener(

        'change',

        function() {


          if (this.checked) {


            removeBasemaps();


            street.addTo(
              map
            );


          }

        }

      );


    /* =====================================================
       21. ORTHOPHOTO
       
       SATELLITE DIPAKAI SEBAGAI FALLBACK

       Jadi:
       Orthophoto ada  -> Orthophoto terlihat
       Orthophoto gagal -> Satellite tetap terlihat

       Ini mencegah peta menjadi abu-abu.
       ===================================================== */

    document

      .getElementById(
        'orthoRadio'
      )

      .addEventListener(

        'change',

        function() {


          if (!this.checked) {

            return;

          }


          /* ----------------------------------------------
             RESET STATUS
             ---------------------------------------------- */

          orthoLoaded =
            false;


          orthoErrorCount =
            0;


          /* ----------------------------------------------
             HAPUS BASEMAP LAIN
             ---------------------------------------------- */

          removeBasemaps();


          /* ----------------------------------------------
             ESRI SEBAGAI BACKGROUND

             Orthophoto akan berada di atasnya.
             ---------------------------------------------- */

          satellite.addTo(
            map
          );


          /* ----------------------------------------------
             ORTHOPHOTO DI ATAS SATELLITE
             ---------------------------------------------- */

          orthoLayer.addTo(
            map
          );


          orthoLayer.bringToFront();


          console.log(
            '==================================='
          );


          console.log(
            'ORTHOPHOTO AKTIF'
          );


          console.log(
            'CACHE: Fix_Ortho_web'
          );


          console.log(
            'LEVEL: L12 - L17'
          );


          console.log(
            '==================================='
          );


        }

      );


    /* =====================================================
       22. ORTHOPHOTO TILE BERHASIL
       ===================================================== */

    orthoLayer.on(

      'tileload',

      function(e) {


        console.log(
          'ORTHOPHOTO TILE BERHASIL:',
          e.coords
        );


        orthoLoaded =
          true;


      }

    );


    /* =====================================================
       23. ORTHOPHOTO TILE ERROR
       ===================================================== */

    orthoLayer.on(

      'tileerror',

      function(e) {


        orthoErrorCount++;


        console.error(

          'ORTHOPHOTO TILE GAGAL:',

          e.coords

        );


        console.error(

          'URL TILE DIDUGA:',

          'L' +
          e.coords.z +
          '/R' +
          Math.floor(e.coords.y)
            .toString(16)
            .padStart(8, '0')
            .toLowerCase() +
          '/C' +
          Math.floor(e.coords.x)
            .toString(16)
            .padStart(8, '0')
            .toLowerCase() +
          '.png'

        );


        console.error(

          'Jumlah tile gagal:',

          orthoErrorCount

        );


        /*
         * SATELLITE DIBIARKAN SEBAGAI FALLBACK.
         */

      }

    );


    /* =====================================================
       24. SCALE BAR
       ===================================================== */

    L.control.scale({

      imperial:
        false,

      metric:
        true,

      position:
        'bottomleft'

    }).addTo(map);


    /* =====================================================
       25. LEGENDA KANAN BAWAH
       ===================================================== */

    const legend =
      L.control({

        position:
          'bottomright'

      });


    legend.onAdd =
      function(map) {


        const div =
          L.DomUtil.create(

            'div',

            'map-legend'

          );


        div.innerHTML = `

          <div class="map-legend-title">
            Legenda
          </div>

          <div class="legend-item">

            <span
              class="legend-line-coastline">
            </span>

            <span>
              Garis Pantai
            </span>

          </div>

        `;


        L.DomEvent
          .disableClickPropagation(
            div
          );


        return div;

      };


    legend.addTo(map);


    /* =====================================================
       26. KOORDINAT KURSOR
       ===================================================== */

    map.on(

      'mousemove',

      function(e) {


        document

          .getElementById(
            'latitude'
          )

          .innerHTML =

          e.latlng
            .lat
            .toFixed(6);


        document

          .getElementById(
            'longitude'
          )

          .innerHTML =

          e.latlng
            .lng
            .toFixed(6);


      }

    );


  </script>

</body>

</html>
