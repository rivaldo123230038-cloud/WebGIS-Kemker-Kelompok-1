<script>

/* =========================================================
   INITIAL MAP
   ========================================================= */

const map = L.map("map", {

    zoomControl:true,

    maxZoom:24

});


map.setView(
    [-5.4,105.3],
    12
);


/* =========================================================
   BASEMAP
   ========================================================= */

const esriImagery = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/" +
    "World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {

        maxZoom:24,

        attribution:
        "Tiles &copy; Esri"

    }

);


const esriStreet = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/" +
    "World_Street_Map/MapServer/tile/{z}/{y}/{x}",

    {

        maxZoom:24,

        attribution:
        "Tiles &copy; Esri"

    }

);


esriImagery.addTo(map);


/* =========================================================
   PROJ4
   ========================================================= */

proj4.defs(

    "EPSG:32748",

    "+proj=utm " +
    "+zone=48 " +
    "+south " +
    "+datum=WGS84 " +
    "+units=m " +
    "+no_defs"

);


/* =========================================================
   UTM 48S -> WGS84
   ========================================================= */

function UTM48SToWGS84(

    easting,
    northing

) {

    const result = proj4(

        "EPSG:32748",

        "EPSG:4326",

        [
            easting,
            northing
        ]

    );

    return [

        result[1],
        result[0]

    ];

}


/* =========================================================
   GET FIRST COORDINATE
   ========================================================= */

function getFirstCoordinate(coords) {

    if (!Array.isArray(coords)) {

        return null;

    }


    if (

        coords.length >= 2 &&
        typeof coords[0] === "number" &&
        typeof coords[1] === "number"

    ) {

        return [

            coords[0],
            coords[1]

        ];

    }


    for (

        let i = 0;
        i < coords.length;
        i++

    ) {

        const result =
            getFirstCoordinate(coords[i]);

        if (result) {

            return result;

        }

    }


    return null;

}


/* =========================================================
   DETECT CRS DARI METADATA
   ========================================================= */

function detectCRSFromGeoJSON(geojson) {

    try {

        if (

            geojson.crs &&
            geojson.crs.properties

        ) {

            const properties =
                geojson.crs.properties;


            const name =
                properties.name ||
                properties.href ||
                "";


            const nameUpper =
                String(name).toUpperCase();


            if (

                nameUpper.includes("4326") ||
                nameUpper.includes("WGS84") ||
                nameUpper.includes("WGS 84")

            ) {

                return "EPSG:4326";

            }


            if (

                nameUpper.includes("32748")

            ) {

                return "EPSG:32748";

            }

        }

    }

    catch(error) {

        console.warn(
            "CRS metadata tidak dapat dibaca:",
            error
        );

    }


    return null;

}


/* =========================================================
   DETECT CRS DARI NILAI KOORDINAT
   ========================================================= */

function detectCRSFromCoordinates(geojson) {

    const first =
        getFirstCoordinate(
            geojson.features &&
            geojson.features.length > 0
                ? geojson.features[0].geometry.coordinates
                : null
        );


    if (!first) {

        return null;

    }


    const x = first[0];

    const y = first[1];


    /* WGS84 */

    if (

        x >= -180 &&
        x <= 180 &&
        y >= -90 &&
        y <= 90

    ) {

        return "EPSG:4326";

    }


    /* UTM 48S */

    if (

        x >= 100000 &&
        x <= 900000 &&
        y >= 0 &&
        y <= 10000000

    ) {

        return "EPSG:32748";

    }


    return null;

}


/* =========================================================
   DETECT GEOJSON CRS
   ========================================================= */

function detectGeoJSONCRS(geojson) {

    const metadataCRS =
        detectCRSFromGeoJSON(geojson);


    if (metadataCRS) {

        return metadataCRS;

    }


    return detectCRSFromCoordinates(geojson);

}


/* =========================================================
   CONVERT COORDINATES
   ========================================================= */

function convertCoordinates(

    coords,
    sourceCRS

) {

    if (

        !Array.isArray(coords)

    ) {

        return coords;

    }


    if (

        coords.length >= 2 &&
        typeof coords[0] === "number" &&
        typeof coords[1] === "number"

    ) {

        if (

            sourceCRS === "EPSG:32748"

        ) {

            return UTM48SToWGS84(

                coords[0],
                coords[1]

            );

        }


        return coords;

    }


    return coords.map(

        function(item) {

            return convertCoordinates(

                item,
                sourceCRS

            );

        }

    );

}


/* =========================================================
   CONVERT GEOJSON -> WGS84
   ========================================================= */

function convertGeoJSONToWGS84(

    geojson

) {

    const converted =
        JSON.parse(
            JSON.stringify(geojson)
        );


    const sourceCRS =
        detectGeoJSONCRS(converted);


    console.log(
        "CRS GeoJSON:",
        sourceCRS
    );


    if (

        !sourceCRS

    ) {

        console.warn(
            "CRS tidak terdeteksi. Data tidak dikonversi."
        );

        return converted;

    }


    if (

        sourceCRS === "EPSG:4326"

    ) {

        return converted;

    }


    converted.features.forEach(

        function(feature) {

            if (

                feature.geometry &&
                feature.geometry.coordinates

            ) {

                feature.geometry.coordinates =
                    convertCoordinates(

                        feature.geometry.coordinates,
                        sourceCRS

                    );

            }

        }

    );


    return converted;

}


/* =========================================================
   STYLE
   ========================================================= */

function styleRTK() {

    return {

        color:"cyan",

        weight:3,

        opacity:1

    };

}


function stylePantai() {

    return {

        color:"#ffd700",

        weight:3,

        opacity:1

    };

}


function styleDigitasi() {

    return {

        color:"red",

        weight:3,

        opacity:1

    };

}


/* =========================================================
   HOVER
   ========================================================= */

function onEachRTK(

    feature,
    layer

) {

    layer.on({

        mouseover:function(e) {

            e.target.setStyle({

                color:"orange",

                weight:4

            });

        },

        mouseout:function(e) {

            e.target.setStyle(
                styleRTK()
            );

        }

    });

}


function onEachPantai(

    feature,
    layer

) {

    layer.on({

        mouseover:function(e) {

            e.target.setStyle({

                color:"orange",

                weight:4

            });

        },

        mouseout:function(e) {

            e.target.setStyle(
                stylePantai()
            );

        }

    });

}


function onEachDigitasi(

    feature,
    layer

) {

    layer.on({

        mouseover:function(e) {

            e.target.setStyle({

                color:"orange",

                weight:4

            });

        },

        mouseout:function(e) {

            e.target.setStyle(
                styleDigitasi()
            );

        }

    });

}


/* =========================================================
   LAYER VARIABLES
   ========================================================= */

let rtkLayer = null;

let pantaiLayer = null;

let digitasiLayer = null;


/* =========================================================
   LOAD RTK
   ========================================================= */

fetch(
    "Garis_Pantai_RTK.geojson"
)

.then(

    response => {

        if (!response.ok) {

            throw new Error(
                "Garis_Pantai_RTK.geojson tidak ditemukan"
            );

        }

        return response.json();

    }

)

.then(

    data => {

        const converted =
            convertGeoJSONToWGS84(data);


        rtkLayer =
            L.geoJSON(

                converted,

                {

                    style:styleRTK,

                    onEachFeature:onEachRTK

                }

            );


        rtkLayer.addTo(map);


        console.log(
            "RTK berhasil dimuat."
        );

    }

)

.catch(

    error => {

        console.error(
            "Error RTK:",
            error
        );

    }

);


/* =========================================================
   LOAD GARIS PANTAI
   ========================================================= */

fetch(
    "Garis_Pantai.geojson"
)

.then(

    response => {

        if (!response.ok) {

            throw new Error(
                "Garis_Pantai.geojson tidak ditemukan"
            );

        }

        return response.json();

    }

)

.then(

    data => {

        const converted =
            convertGeoJSONToWGS84(data);


        pantaiLayer =
            L.geoJSON(

                converted,

                {

                    style:stylePantai,

                    onEachFeature:onEachPantai

                }

            );


        pantaiLayer.addTo(map);


        console.log(
            "Garis Pantai berhasil dimuat."
        );

    }

)

.catch(

    error => {

        console.error(
            "Error Garis Pantai:",
            error
        );

    }

);


/* =========================================================
   LOAD GARIS PANTAI DIGITASI
   ========================================================= */

fetch(
    "Garis_Pantai_Digitasi.geojson"
)

.then(

    response => {

        if (!response.ok) {

            throw new Error(
                "Garis_Pantai_Digitasi.geojson tidak ditemukan"
            );

        }

        return response.json();

    }

)

.then(

    data => {

        const converted =
            convertGeoJSONToWGS84(data);


        digitasiLayer =
            L.geoJSON(

                converted,

                {

                    style:styleDigitasi,

                    onEachFeature:onEachDigitasi

                }

            );


        digitasiLayer.addTo(map);


        console.log(
            "Garis Pantai Digitasi berhasil dimuat."
        );

    }

)

.catch(

    error => {

        console.error(
            "Error Digitasi:",
            error
        );

    }

);


/* =========================================================
   ORTHOPHOTO
   ========================================================= */

const ORTHO_URL_BASE =

    "https://raw.githubusercontent.com/" +

    "rivaldo123230038-cloud/" +

    "WebGIS-Kemker-Kelompok-1/" +

    "main/" +

    "Fix_Ortho_web/" +

    "_alllayers/";


/* =========================================================
   NATIVE ZOOM ORTHOPHOTO
   ========================================================= */

const ORTHO_NATIVE_ZOOM = 19;


/* =========================================================
   HEX CONVERTER
   ========================================================= */

function toHex(num) {

    return num
        .toString(16)
        .toLowerCase()
        .padStart(8,"0");

}


/* =========================================================
   CUSTOM ORTHOPHOTO GRID LAYER

   L11 - L19 = TILE ASLI

   Z20 - Z24 = MENGAMBIL BAGIAN DARI TILE L19

   Jadi orthophoto tidak hilang ketika zoom.
   ========================================================= */

const orthophotoLayer = L.GridLayer.extend({

    createTile:function(

        coords,
        done

    ) {

        const tile =
            document.createElement("canvas");


        const tileSize =
            this.getTileSize();


        tile.width =
            tileSize.x;

        tile.height =
            tileSize.y;


        const ctx =
            tile.getContext("2d");


        /*
         * =================================================
         * ZOOM <= L19
         * =================================================
         */

        if (

            coords.z <= ORTHO_NATIVE_ZOOM

        ) {

            const img =
                new Image();


            img.crossOrigin =
                "anonymous";


            const rowHex =
                toHex(coords.y);


            const colHex =
                toHex(coords.x);


            const url =

                ORTHO_URL_BASE +

                "L" +
                coords.z +
                "/" +

                "R" +
                rowHex +
                "/" +

                "C" +
                colHex +
                ".png";


            img.onload = function() {

                ctx.clearRect(

                    0,
                    0,
                    tileSize.x,
                    tileSize.y

                );


                ctx.drawImage(

                    img,

                    0,
                    0,
                    tileSize.x,
                    tileSize.y

                );


                done(
                    null,
                    tile
                );

            };


            img.onerror = function() {

                console.warn(
                    "Tile orthophoto tidak ditemukan:",
                    url
                );


                done(
                    null,
                    tile
                );

            };


            img.src = url;


            return tile;

        }


        /*
         * =================================================
         * ZOOM > L19
         *
         * Ambil parent tile L19.
         * =================================================
         */

        const zoomDifference =
            coords.z -
            ORTHO_NATIVE_ZOOM;


        const factor =
            Math.pow(
                2,
                zoomDifference
            );


        /*
         * Parent tile L19
         */

        const parentX =
            Math.floor(
                coords.x / factor
            );


        const parentY =
            Math.floor(
                coords.y / factor
            );


        /*
         * Posisi tile sekarang
         * terhadap tile L19.
         */

        const localX =
            coords.x -
            parentX * factor;


        const localY =
            coords.y -
            parentY * factor;


        /*
         * URL L19
         */

        const rowHex =
            toHex(parentY);


        const colHex =
            toHex(parentX);


        const url =

            ORTHO_URL_BASE +

            "L" +
            ORTHO_NATIVE_ZOOM +
            "/" +

            "R" +
            rowHex +
            "/" +

            "C" +
            colHex +
            ".png";


        const img =
            new Image();


        img.crossOrigin =
            "anonymous";


        img.onload = function() {

            /*
             * Ukuran bagian L19
             * yang harus diambil.
             */

            const sourceWidth =
                img.width /
                factor;


            const sourceHeight =
                img.height /
                factor;


            /*
             * Posisi bagian yang
             * harus diambil.
             */

            const sourceX =
                localX *
                sourceWidth;


            const sourceY =
                localY *
                sourceHeight;


            /*
             * Ambil bagian kecil
             * dari tile L19 lalu
             * diperbesar ke 256x256.
             */

            ctx.clearRect(

                0,
                0,
                tileSize.x,
                tileSize.y

            );


            ctx.imageSmoothingEnabled =
                true;


            ctx.imageSmoothingQuality =
                "high";


            ctx.drawImage(

                img,

                sourceX,
                sourceY,

                sourceWidth,
                sourceHeight,

                0,
                0,

                tileSize.x,
                tileSize.y

            );


            done(

                null,
                tile

            );

        };


        img.onerror = function() {

            console.warn(
                "Tile L19 orthophoto tidak ditemukan:",
                url
            );


            done(

                null,
                tile

            );

        };


        img.src = url;


        return tile;

    }

});


const orthophotoLayerInstance =
    new orthophotoLayer({

        tileSize:256,

        minZoom:11,

        maxZoom:24,

/* =========================================================
   AUTO ZOOM
   ========================================================= */

function updateAutoZoom() {

    const activeLayers = [];


    if (

        rtkLayer &&
        map.hasLayer(rtkLayer)

    ) {

        activeLayers.push(
            rtkLayer
        );

    }


    if (

        pantaiLayer &&
        map.hasLayer(pantaiLayer)

    ) {

        activeLayers.push(
            pantaiLayer
        );

    }


    if (

        digitasiLayer &&
        map.hasLayer(digitasiLayer)

    ) {

        activeLayers.push(
            digitasiLayer
        );

    }


    if (

        activeLayers.length === 0

    ) {

        alert(
            "Tidak ada layer garis pantai yang aktif."
        );

        return;

    }


    let bounds = null;


    activeLayers.forEach(

        function(layer) {

            const layerBounds =
                layer.getBounds();


            if (

                !layerBounds ||
                !layerBounds.isValid()

            ) {

                return;

            }


            if (

                bounds === null

            ) {

                bounds =
                    L.latLngBounds(

                        layerBounds.getSouthWest(),

                        layerBounds.getNorthEast()

                    );

            }

            else {

                bounds.extend(
                    layerBounds
                );

            }

        }

    );


    if (

        !bounds ||
        !bounds.isValid()

    ) {

        alert(
            "Bounds layer tidak valid."
        );

        console.error(
            "Bounds:",
            bounds
        );

        return;

    }


    console.log(
        "AUTO ZOOM BOUNDS:",
        bounds
    );


    const sidebar =
        document.getElementById(
            "sidebar"
        );


    const sidebarOpen =
        !sidebar.classList.contains(
            "closed"
        );


    map.fitBounds(

        bounds,

        {

            paddingTopLeft:
                sidebarOpen
                    ? [370,40]
                    : [40,40],

            paddingBottomRight:
                [40,40],

            maxZoom:24,

            animate:true

        }

    );

}

/* =========================================================
   BACKGROUND PHOTO ROTATION
   ========================================================= */

const backgroundGallery =
    document.querySelector(
        ".background-gallery"
    );


let photoOrder = [

    "photo-1",
    "photo-2",
    "photo-3"

];


function rotateBackgroundPhotos() {

    photoOrder.unshift(
        photoOrder.pop()
    );


    const photos =
        backgroundGallery.querySelectorAll(
            ".background-photo"
        );


    photos.forEach(

        function(photo) {

            const className =
                Array.from(
                    photo.classList
                )
                .find(

                    function(c) {

                        return c.indexOf(
                            "photo-"
                        ) === 0;

                    }

                );


            photo.style.order =
                photoOrder.indexOf(
                    className
                );

        }

    );

}


setInterval(

    rotateBackgroundPhotos,

    4000

);
