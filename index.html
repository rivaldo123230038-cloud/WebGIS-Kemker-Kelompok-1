<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>WEBGIS KELOMPOK 1</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}


/* =====================================================
   PETA
   ===================================================== */

#map {
  position: absolute;
  left: 350px;
  top: 0;
  width: calc(100% - 350px);
  height: 100vh;
  transition: left 0.3s ease, width 0.3s ease;
}


/* =====================================================
   SIDEBAR
   ===================================================== */

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 350px;
  height: 100vh;

  background: #ffffff;

  box-shadow:
    2px 0 12px rgba(0,0,0,0.18);

  z-index: 2000;

  overflow-y: auto;

  transition:
    transform 0.3s ease;
}

.sidebar.collapsed {
  transform: translateX(-350px);
}


/* =====================================================
   TOGGLE SIDEBAR
   ===================================================== */

.sidebar-toggle {

  position: fixed;

  top: 50%;
  left: 350px;

  width: 34px;
  height: 70px;

  transform: translateY(-50%);

  border: none;

  border-radius: 0 8px 8px 0;

  background: #17324d;

  color: white;

  z-index: 3000;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 22px;

  font-weight: bold;

  box-shadow:
    2px 0 8px rgba(0,0,0,0.25);

  transition:
    left 0.3s ease,
    background 0.2s ease;
}

.sidebar-toggle:hover {
  background: #244e73;
}

.sidebar-toggle.collapsed {
  left: 0;
}


/* =====================================================
   LOGO
   ===================================================== */

.logo-section {

  position: relative;

  z-index: 10;

  display: flex;

  flex-direction: row;

  justify-content: space-between;

  align-items: center;

  width: 100%;

  height: 108px;

  padding: 18px 10px;

  gap: 5px;

  background: #ffffff;

  border-bottom:
    1px solid #eeeeee;
}

.logo-item {

  flex: 1;

  min-width: 0;

  height: 72px;

  display: flex;

  align-items: center;

  justify-content: center;
}

.logo-item img {

  width: 100%;
  height: 100%;

  object-fit: contain;

  display: block;
}


/* =====================================================
   SIDEBAR BODY
   ===================================================== */

.sidebar-body {

  position: relative;

  min-height:
    calc(100vh - 108px);

  overflow-y: auto;

  overflow-x: hidden;
}


/* =====================================================
   BACKGROUND 3 FOTO
   ===================================================== */

.sidebar-body::before {

  content: "";

  position: fixed;

  left: 0;

  top: 108px;

  width: 350px;

  height:
    calc(100vh - 108px);

  z-index: 0;

  background-color: #ffffff;

  background-image:
    url("bcg1.jpeg");

  background-repeat: no-repeat;

  background-position: center center;

  background-size: cover;

  opacity: 0.20;

  animation:
    backgroundSlide 18s infinite;

  pointer-events: none;
}

.sidebar-body::after {

  content: "";

  position: fixed;

  left: 0;

  top: 108px;

  width: 350px;

  height:
    calc(100vh - 108px);

  z-index: 1;

  background:
    rgba(255,255,255,0.18);

  pointer-events: none;
}


/* =====================================================
   ANIMASI BACKGROUND
   ===================================================== */

@keyframes backgroundSlide {

  0%,
  28% {

    background-image:
      url("bcg1.jpeg");

    opacity: 0.20;
  }

  29%,
  32% {

    background-image:
      url("bcg1.jpeg");

    opacity: 0;
  }

  33%,
  61% {

    background-image:
      url("bcg2.jpeg");

    opacity: 0.20;
  }

  62%,
  65% {

    background-image:
      url("bcg2.jpeg");

    opacity: 0;
  }

  66%,
  94% {

    background-image:
      url("bcg3.jpeg");

    opacity: 0.20;
  }

  95%,
  99% {

    background-image:
      url("bcg3.jpeg");

    opacity: 0;
  }

  100% {

    background-image:
      url("bcg1.jpeg");

    opacity: 0.20;
  }
}


/* =====================================================
   CONTENT
   ===================================================== */

.sidebar-content {

  position: relative;

  z-index: 2;
}


/* =====================================================
   TITLE
   ===================================================== */

.title-section {

  padding:
    18px 20px 16px;

  text-align: center;

  background:
    rgba(255,255,255,0.72);

  border-bottom:
    1px solid rgba(238,238,238,0.9);
}

.title-section h1 {

  margin: 0;

  font-size: 22px;

  font-weight: 700;

  color: #17324d;

  letter-spacing: 0.5px;
}

.title-section p {

  margin:
    7px 0 0;

  font-size: 12px;

  line-height: 1.4;

  color: #555555;
}


/* =====================================================
   PANEL
   ===================================================== */

.panel-content {

  padding:
    18px 20px;
}

.section-title {

  margin-top: 18px;

  margin-bottom: 10px;

  padding-bottom: 7px;

  border-bottom:
    2px solid #17324d;

  color: #17324d;

  font-size: 14px;

  font-weight: bold;

  text-transform: uppercase;
}

.section-title:first-child {
  margin-top: 0;
}


/* =====================================================
   LAYER BOX
   ===================================================== */

.layer-control-box {

  background:
    rgba(255,255,255,0.84);

  border-radius: 7px;

  padding: 10px;

  border:
    1px solid rgba(225,229,232,0.9);

  box-shadow:
    0 1px 4px rgba(0,0,0,0.08);
}

.layer-item {

  display: flex;

  align-items: center;

  gap: 8px;

  padding: 8px 5px;

  font-size: 13px;

  cursor: pointer;
}

.layer-item input {
  cursor: pointer;
}


/* =====================================================
   AUTO ZOOM
   ===================================================== */

.zoom-layer-button {

  width: 100%;

  margin-top: 10px;

  padding: 10px 12px;

  border: none;

  border-radius: 6px;

  background: #17324d;

  color: white;

  font-size: 13px;

  font-weight: bold;

  cursor: pointer;

  transition: 0.2s;
}

.zoom-layer-button:hover {
  background: #244e73;
}

.zoom-layer-button:active {
  transform: scale(0.98);
}


/* =====================================================
   KOORDINAT
   ===================================================== */

.coordinate-box {

  background:
    rgba(255,255,255,0.84);

  border:
    1px solid rgba(225,229,232,0.9);

  border-radius: 7px;

  padding: 12px;

  box-shadow:
    0 1px 4px rgba(0,0,0,0.08);
}

.coordinate-box .label {

  font-size: 11px;

  color: #666666;

  margin-bottom: 3px;
}

.coordinate-box .value {

  font-size: 14px;

  font-weight: bold;

  color: #17324d;

  margin-bottom: 10px;
}


/* =====================================================
   CURSOR
   ===================================================== */

.cursor-box {

  background:
    rgba(23,50,77,0.90);

  color: white;

  border-radius: 7px;

  padding: 10px;

  font-size: 11px;

  line-height: 1.6;
}


/* =====================================================
   FOOTER
   ===================================================== */

.sidebar-footer {

  margin-top: 25px;

  padding:
    15px 20px;

  border-top:
    1px solid rgba(238,238,238,0.9);

  text-align: center;

  font-size: 10px;

  color: #666666;

  line-height: 1.5;

  background:
    rgba(255,255,255,0.72);
}


/* =====================================================
   POPUP
   ===================================================== */

.popup-title {

  font-size: 14px;

  font-weight: bold;

  color: #17324d;

  margin-bottom: 7px;
}


/* =====================================================
   MAP ZOOM BUTTON
   ===================================================== */

.zoom-to-layer-control {
  margin-top: 10px;
}

.zoom-to-layer-button-map {

  width: 38px;
  height: 38px;

  background: white;

  border:
    2px solid rgba(0,0,0,0.2);

  border-radius: 4px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 19px;

  font-weight: bold;

  color: #17324d;

  cursor: pointer;

  box-shadow:
    0 1px 5px rgba(0,0,0,0.25);
}


/* =====================================================
   LEGEND
   ===================================================== */

.map-legend {

  background:
    rgba(255,255,255,0.95);

  padding:
    10px 12px;

  border-radius: 6px;

  border:
    1px solid #cccccc;

  box-shadow:
    0 1px 5px rgba(0,0,0,0.25);

  font-size: 12px;

  line-height: 1.5;

  color: #333333;

  min-width: 150px;

  margin-right: 10px;

  margin-bottom: 10px;
}

.map-legend-title {

  font-weight: bold;

  font-size: 13px;

  color: #17324d;

  margin-bottom: 7px;

  padding-bottom: 4px;

  border-bottom:
    1px solid #dddddd;
}

.legend-item {

  display: flex;

  align-items: center;

  gap: 8px;
}

.legend-line-coastline {

  width: 28px;

  height: 0;

  border-top:
    4px solid #00ffff;

  flex-shrink: 0;
}


/* =====================================================
   RESPONSIVE
   ===================================================== */

@media (max-width:800px) {

  .sidebar {
    width: 280px;
  }

  .sidebar.collapsed {
    transform:
      translateX(-280px);
  }

  #map {

    left: 280px;

    width:
      calc(100% - 280px);
  }

  .sidebar-toggle {
    left: 280px;
  }

  .sidebar-body::before,
  .sidebar-body::after {
    width: 280px;
  }

  .logo-section {

    padding:
      15px 6px;

    gap: 3px;
  }

  .logo-item {
    height: 58px;
  }

  .title-section h1 {
    font-size: 18px;
  }

  .map-legend {

    min-width: 135px;

    font-size: 11px;

    margin-right: 8px;

    margin-bottom: 8px;
  }
}

</style>

</head>

<body>

     ===================================================== -->

<div
  class="sidebar"
  id="sidebar"
>

  <div class="logo-section">

    <div class="logo-item">
      <img
        src="ITERA.png"
        alt="Logo ITERA">
    </div>

    <div class="logo-item">
      <img
        src="Logo_GT.png"
        alt="Logo Teknik Geomatika ITERA">
    </div>

    <div class="logo-item">
      <img
        src="LOGO_GT23.png"
        alt="Logo Teknik Geomatika 2023">
    </div>

    <div class="logo-item">
      <img
        src="LOGO_KEMKER.png"

        <!-- =================================================

             ================================================= -->

      </div>

    </div>

  </div>

</div>


<!-- =====================================================
     SIDEBAR TOGGLE
     ===================================================== -->

<button
  id="sidebarToggle"
  class="sidebar-toggle"
  type="button"
  title="Minimize Panel"
  aria-label="Minimize Panel">

  ◀

</button>


<!-- =====================================================
     MAP
     ===================================================== -->

<div id="map"></div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   1. PENGATURAN ZOOM
   ===================================================== */

const MAP_MAX_ZOOM = 24;

const ORTHO_NATIVE_ZOOM = 18;


/* =====================================================
   2. INISIALISASI MAP
   ===================================================== */

const map = L.map(
  'map',
  {

    center:
      [-5.45,105.25],

    zoom:
      10,

    minZoom:
      0,

    maxZoom:
      MAP_MAX_ZOOM,

    zoomControl:
      true,

    scrollWheelZoom:
      true,

    doubleClickZoom:
      true,

    touchZoom:
      true,

    boxZoom:
      true

  }
);


/* =====================================================
   3. SIDEBAR
   ===================================================== */

const sidebar =
  document.getElementById(
    'sidebar'
  );

const sidebarToggle =
  document.getElementById(
    'sidebarToggle'
  );

let sidebarCollapsed =
  false;


sidebarToggle.addEventListener(
  'click',
  function() {

    sidebarCollapsed =
      !sidebarCollapsed;

    if (sidebarCollapsed) {

      sidebar.classList.add(
        'collapsed'
      );

      sidebarToggle.classList.add(
        'collapsed'
      );

      sidebarToggle.innerHTML =
        '▶';

      sidebarToggle.title =
        'Tampilkan Panel';

      sidebarToggle.setAttribute(
        'aria-label',
        'Tampilkan Panel'
      );

      document
        .getElementById('map')
        .style.left =
        '0';

      document
        .getElementById('map')
        .style.width =
        '100%';

    }

    else {

      sidebar.classList.remove(
        'collapsed'
      );

      sidebarToggle.classList.remove(
        'collapsed'
      );

      sidebarToggle.innerHTML =
        '◀';

      sidebarToggle.title =
        'Minimize Panel';

      sidebarToggle.setAttribute(
        'aria-label',
        'Minimize Panel'
      );

      const sidebarWidth =
        window.innerWidth <= 800
          ? '280px'
          : '350px';

      document
        .getElementById('map')
        .style.left =
        sidebarWidth;

      document
        .getElementById('map')
        .style.width =
        `calc(100% - ${sidebarWidth})`;
    }

    setTimeout(
      function() {

        map.invalidateSize();

      },
      320
    );

  }
);


/* =====================================================
   4. ESRI WORLD IMAGERY
   ===================================================== */

const satellite =
  L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

    {

      minZoom:
        0,

      /*
       * BOLEH ZOOM SAMPAI 24
       * DATA ASLI ESRI BERHENTI DI LEVEL 19
       * TILE AKAN DIPERBESAR SETELAH LEVEL ASLI
       */

      maxZoom:
        MAP_MAX_ZOOM,

      maxNativeZoom:
        19,

      tileSize:
        256,

      attribution:
        'Tiles &copy; Esri'

    }

  );


/* =====================================================
   5. ESRI WORLD STREET MAP
   ===================================================== */

const street =
  L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',

    {

      minZoom:
        0,

      maxZoom:
        MAP_MAX_ZOOM,

      maxNativeZoom:
        19,

      tileSize:
        256,

      attribution:
        'Tiles &copy; Esri'

    }

  );


/* =====================================================
   6. DEFAULT BASEMAP
   ===================================================== */

satellite.addTo(map);


/* =====================================================
   7. ORTHOPHOTO
   ===================================================== */

/*
   STRUKTUR FILE:

   Fix_Ortho_web/
      _alllayers/
         L12/
         L13/
         L14/
         L15/
         L16/
         L17/
         L18/

   FORMAT TILE:

   L{z}/R{rowHex}/C{colHex}.png
*/


function decimalToHex(value) {

  return Math.floor(value)
    .toString(16)
    .padStart(8,'0')
    .toUpperCase();

}


const ortho =
  L.tileLayer(

    'Fix_Ortho_web/_alllayers/L{z}/R{y}/C{x}.png',

    {

      minZoom:
        12,

      maxZoom:
        MAP_MAX_ZOOM,

      maxNativeZoom:
        ORTHO_NATIVE_ZOOM,

      tileSize:
        256,

      opacity:
        1.0,

      tms:
        false,

      noWrap:
        true,

      attribution:
        'Orthophoto'

    }

  );


/* =====================================================
   8. STYLE GARIS PANTAI RTK
   ===================================================== */

const coastlineStyle = {

  color:
    '#00ffff',

  weight:
    4,

  opacity:
    0.95

};


let coastline =
  null;


/* =====================================================
   9. AUTO ZOOM GARIS PANTAI
   ===================================================== */

function zoomToCoastline() {

  if (

    coastline &&

    coastline.getLayers().length > 0

  ) {

    const bounds =
      coastline.getBounds();

    if (bounds.isValid()) {

      map.fitBounds(

        bounds,

        {

          padding:
            [40,40],

          maxZoom:
            20

        }

      );

    }

  }

  else {

    alert(
      'Layer Garis Pantai RTK belum tersedia.'
    );

  }

}


/* =====================================================
   10. AUTO ZOOM SIDEBAR
   ===================================================== */

document
  .getElementById(
    'zoomLayerButton'
  )
  .addEventListener(
    'click',
    function() {

      zoomToCoastline();

    }
  );


/* =====================================================
   11. AUTO ZOOM CONTROL PETA
   ===================================================== */

const ZoomToLayerControl =
  L.Control.extend({

    options: {

      position:
        'topright'

    },

    onAdd:
      function() {

        const container =
          L.DomUtil.create(
            'div',
            'leaflet-bar zoom-to-layer-control'
          );

        const button =
          L.DomUtil.create(
            'button',
            'zoom-to-layer-button-map',
            container
          );

        button.type =
          'button';

        button.innerHTML =
          '⌖';

        button.title =
          'Auto Zoom to Layer';

        button.setAttribute(
          'aria-label',
          'Auto Zoom to Layer'
        );

        L.DomEvent
          .disableClickPropagation(
            container
          );

        L.DomEvent.on(
          button,
          'click',
          function(e) {

            L.DomEvent
              .stopPropagation(e);

            zoomToCoastline();

          }
        );

        return container;

      }

  });


map.addControl(
  new ZoomToLayerControl()
);


/* =====================================================
   12. KONVERSI ESRI JSON
   ===================================================== */

function convertEsriJSON(data) {

  const coastlineGroup =
    L.featureGroup();

  if (!data.features) {

    console.error(
      'Garis_Pantai_RTK tidak memiliki features.'
    );

    return coastlineGroup;

  }


  data.features.forEach(
    function(feature) {

      const geometry =
        feature.geometry || {};

      const attributes =
        feature.attributes || {};


      if (!geometry.paths) {
        return;
      }


      geometry.paths.forEach(
        function(path) {

          const latLngs =
            path.map(
              function(point) {

                return [

                  point[1],

                  point[0]

                ];

              }
            );


          const line =
            L.polyline(
              latLngs,
              coastlineStyle
            );


          let html =
            '<div>' +

            '<div class="popup-title">' +

            'Informasi Garis Pantai RTK' +

            '</div>';


          const keys =
            Object.keys(attributes);


          if (keys.length === 0) {

            html +=
              'Tidak terdapat atribut.';

          }

          else {

            keys.forEach(
              function(key) {

                let value =
                  attributes[key];

                if (

                  value === null ||

                  value === undefined ||

                  value === ''

                ) {

                  value = '-';

                }

                html +=

                  '<b>' +

                  key +

                  '</b>: ' +

                  value +

                  '<br>';

              }
            );

          }


          html +=
            '</div>';


          line.bindPopup(html);


          line.on(
            'mouseover',
            function() {

              this.setStyle({

                color:
                  '#ff0000',

                weight:
                  6

              });

            }
          );


          line.on(
            'mouseout',
            function() {

              this.setStyle(
                coastlineStyle
              );

            }
          );


          coastlineGroup.addLayer(
            line
          );

        }
      );

    }
  );


  return coastlineGroup;

}


/* =====================================================
   13. LOAD GARIS PANTAI RTK
   ===================================================== */

fetch(
  'Garis_Pantai_RTK.geojson'
)

.then(
  function(response) {

    if (!response.ok) {

      throw new Error(
        'Garis_Pantai_RTK.geojson tidak ditemukan.'
      );

    }

    return response.json();

  }
)

.then(
  function(data) {

    console.log(
      'Garis_Pantai_RTK.geojson berhasil dimuat:',
      data
    );


    /*
     * DATA GARIS PANTAI RTK
     * HARUS SUDAH DALAM WGS84 / EPSG:4326
     */

    coastline =
      convertEsriJSON(data);


    coastline.addTo(map);


    zoomToCoastline();


    document
      .getElementById(
        'coastlineCheck'
      )
      .addEventListener(
        'change',
        function() {

          if (this.checked) {

            coastline.addTo(map);

          }

          else {

            map.removeLayer(
              coastline
            );

          }

        }
      );

  }
)

.catch(
  function(error) {

    console.error(error);

    alert(

      'Gagal membaca Garis_Pantai_RTK.geojson.\n\n' +

      'Pastikan file berada satu folder dengan index.html.'

    );

  }
);

   14. ORTHOPHOTO CHECKBOX

document
  .getElementById(

  )
  .addEventListener(
    'change',
    function() {

      }

          ortho
        );

      }

    }
  );

document

/* =====================================================
   17. SCALE BAR
   ===================================================== */

L.control.scale({

  imperial:
    false,

  metric:
    true,

  position:
    'bottomleft'

}).addTo(map);


/* =====================================================
   18. LEGEND
   ===================================================== */

const legend =
  L.control({

    position:
      'bottomright'

  });


legend.onAdd =
  function() {

    const div =
      L.DomUtil.create(
        'div',
        'map-legend'
      );


    div.innerHTML = `

      <div class="map-legend-title">
        Legenda
      </div>

      <div class="legend-item">

        <span
          class="legend-line-coastline">
        </span>

        <span>
          Garis Pantai RTK
        </span>

      </div>

    `;


    L.DomEvent
      .disableClickPropagation(
        div
      );


    return div;

  };


legend.addTo(map);


/* =====================================================
   19. KOORDINAT KURSOR
   ===================================================== */

map.on(
  'mousemove',
  function(e) {

    document
      .getElementById(
        'latitude'
      )
      .innerHTML =
      e.latlng.lat.toFixed(6);


    document
      .getElementById(
        'longitude'
      )
      .innerHTML =
      e.latlng.lng.toFixed(6);

  }
);


/* =====================================================
   20. LOG ZOOM
   ===================================================== */

map.on(
  'zoomend',
  function() {

    console.log(
      'Zoom level:',
      map.getZoom()
    );

  }
);

</script>
