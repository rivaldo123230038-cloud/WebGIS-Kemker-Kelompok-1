<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>WEBGIS KELOMPOK 1</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================================================
   MAP
========================================================= */

#map {
    position: absolute;
    left: 350px;
    top: 0;

    width: calc(100% - 350px);
    height: 100vh;

    transition: all 0.3s ease;

    z-index: 1;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    position: fixed;

    left: 0;
    top: 0;

    width: 350px;
    height: 100vh;

    background: white;

    z-index: 2000;

    transition: transform 0.3s ease;

    box-shadow: 2px 0 8px rgba(0,0,0,0.25);
}


.sidebar.collapsed {

    transform: translateX(-350px);

}


/* =========================================================
   SIDEBAR BODY
========================================================= */

.sidebar-body {

    position: relative;

    width: 100%;

    height: calc(100vh - 108px);

    overflow-y: auto;

    overflow-x: hidden;
}


/* =========================================================
   LOGO
========================================================= */

.logo-section {

    height: 108px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: space-around;

    border-bottom: 1px solid #ddd;

    position: relative;

    z-index: 10;
}


.logo-item {

    width: 25%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 5px;

    box-sizing: border-box;
}


.logo-item img {

    max-width: 100%;

    max-height: 90px;

    object-fit: contain;
}


/* =========================================================
   BACKGROUND SLIDESHOW
========================================================= */

.background-slideshow {

    position: absolute;

    left: 0;
    top: 0;

    width: 350px;
    height: 100%;

    overflow: hidden;

    z-index: 0;
}


.background-slideshow img {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    opacity: 0;

    animation: backgroundSlide 18s infinite;

}


.background-slideshow img:nth-child(1) {

    animation-delay: 0s;

}


.background-slideshow img:nth-child(2) {

    animation-delay: 6s;

}


.background-slideshow img:nth-child(3) {

    animation-delay: 12s;

}


@keyframes backgroundSlide {

    0% {
        opacity: 0;
    }

    10% {
        opacity: 0.20;
    }

    30% {
        opacity: 0.20;
    }

    40% {
        opacity: 0;
    }

    100% {
        opacity: 0;
    }

}


/* =========================================================
   SIDEBAR CONTENT
========================================================= */

.sidebar-content {

    position: relative;

    z-index: 5;

    padding-bottom: 20px;
}


/* =========================================================
   TITLE
========================================================= */

.title-section {

    background: #B65F3A;

    color: white;

    text-align: center;

    padding: 15px 10px;

}


.title-section h1 {

    font-size: 23px;

    margin: 0 0 5px 0;

}


.title-section p {

    margin: 0;

    font-size: 13px;

}


/* =========================================================
   PANEL
========================================================= */

.panel {

    margin: 12px;

    padding: 12px;

    background: rgba(255,255,255,0.92);

    border-radius: 8px;

    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
}


.panel-title {

    font-weight: bold;

    margin-bottom: 8px;

    color: #333;

}


/* =========================================================
   CHECKBOX / RADIO
========================================================= */

.layer-option {

    display: flex;

    align-items: center;

    gap: 7px;

    margin: 8px 0;

    font-size: 14px;
}


.layer-option input {

    cursor: pointer;

}


/* =========================================================
   BUTTON
========================================================= */

.zoom-button {

    width: 100%;

    padding: 10px;

    border: none;

    border-radius: 6px;

    background: #B65F3A;

    color: white;

    font-weight: bold;

    cursor: pointer;

}


.zoom-button:hover {

    background: #914b2f;

}


/* =========================================================
   COORDINATE BOX
========================================================= */

.coordinate-box {

    background: rgba(245,245,245,0.95);

    border-radius: 6px;

    padding: 8px;

    margin-top: 8px;

    font-size: 12px;

    word-break: break-word;
}


/* =========================================================
   LEGEND
========================================================= */

.legend-line {

    display: inline-block;

    width: 30px;

    height: 4px;

    background: cyan;

    margin-right: 7px;

    vertical-align: middle;

}


/* =========================================================
   SIDEBAR TOGGLE
========================================================= */

.sidebar-toggle {

    position: fixed;

    left: 350px;

    top: 50%;

    transform: translateY(-50%);

    width: 32px;

    height: 55px;

    border: none;

    border-radius: 0 8px 8px 0;

    background: #B65F3A;

    color: white;

    font-size: 18px;

    cursor: pointer;

    z-index: 3000;

    transition: left 0.3s ease;
}


.sidebar-toggle.collapsed {

    left: 0;

}


/* =========================================================
   LEAFLET
========================================================= */

.leaflet-control-layers {

    font-size: 13px;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 800px) {

    .sidebar {

        width: 280px;

    }

    .sidebar.collapsed {

        transform: translateX(-280px);

    }

    .background-slideshow {

        width: 280px;

    }

    #map {

        left: 280px;

        width: calc(100% - 280px);

    }

    .sidebar-toggle {

        left: 280px;

    }

    .sidebar-toggle.collapsed {

        left: 0;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div class="sidebar" id="sidebar">


    <!-- LOGO -->

    <div class="logo-section">

        <div class="logo-item">

            <img src="ITERA.png" alt="ITERA">

        </div>


        <div class="logo-item">

            <img src="Logo_GT.png" alt="Geomatics">

        </div>


        <div class="logo-item">

            <img src="LOGO_GT23.png" alt="GT23">

        </div>


        <div class="logo-item">

            <img src="LOGO_KEMKER.png" alt="Kemah Kerja">

        </div>

    </div>


    <!-- SIDEBAR BODY -->

    <div class="sidebar-body">


        <!-- BACKGROUND -->

        <div
            class="background-slideshow"
            id="backgroundSlideshow"
        >

            <img src="bcg1.jpeg">

            <img src="bcg2.jpeg">

            <img src="bcg3.jpeg">

        </div>


        <!-- CONTENT -->

        <div class="sidebar-content">


            <!-- TITLE -->

            <div class="title-section">

                <h1>
                    WEBGIS KELOMPOK 1
                </h1>

                <p>
                    Pemetaan dan Visualisasi Garis Pantai
                </p>

            </div>


            <!-- LAYER -->

            <div class="panel">

                <div class="panel-title">

                    Layer

                </div>


                <label class="layer-option">

                    <input
                        type="checkbox"
                        id="coastlineToggle"
                        checked
                    >

                    Garis Pantai RTK

                </label>


                <label class="layer-option">

                    <input
                        type="checkbox"
                        id="orthoToggle"
                        checked
                    >

                    Orthophoto

                </label>

            </div>


            <!-- BASEMAP -->

            <div class="panel">

                <div class="panel-title">

                    Basemap

                </div>


                <label class="layer-option">

                    <input
                        type="radio"
                        name="basemap"
                        value="satellite"
                        checked
                    >

                    Esri World Imagery

                </label>


                <label class="layer-option">

                    <input
                        type="radio"
                        name="basemap"
                        value="street"
                    >

                    Esri World Street Map

                </label>

            </div>


            <!-- ZOOM -->

            <div class="panel">

                <div class="panel-title">

                    Navigasi

                </div>


                <button
                    class="zoom-button"
                    id="zoomToLayer"
                >

                    🔍 Zoom ke Garis Pantai

                </button>

            </div>


            <!-- COORDINATE -->

            <div class="panel">

                <div class="panel-title">

                    Sistem Koordinat

                </div>


                <div class="coordinate-box">

                    <b>Datum:</b> WGS 84

                </div>


                <div class="coordinate-box">

                    <b>Sistem:</b>
                    Geographic Coordinate System

                </div>


                <div class="coordinate-box">

                    <b>EPSG:</b> 4326

                </div>


                <div
                    class="coordinate-box"
                    id="cursorCoordinate"
                >

                    Lat: -
                    <br>
                    Lon: -

                </div>

            </div>


            <!-- LEGEND -->

            <div class="panel">

                <div class="panel-title">

                    Legenda

                </div>


                <div>

                    <span class="legend-line"></span>

                    Garis Pantai RTK

                </div>

            </div>


        </div>

    </div>

</div>


<!-- =====================================================
     SIDEBAR TOGGLE
===================================================== -->

<button
    id="sidebarToggle"
    class="sidebar-toggle"
>

    ◀

</button>


<!-- =====================================================
     MAP
===================================================== -->

<div id="map"></div>


<!-- =====================================================
     LEAFLET
===================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- =====================================================
     PROJ4
===================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>


<script>


/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {

    center: [-5.45, 105.25],

    zoom: 10,

    minZoom: 0,

    maxZoom: 23,

    zoomControl: true

});


/* =========================================================
   BASEMAP
   TIDAK DIBATASI ZOOM IN
========================================================= */

const satellite = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/" +
    "World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {

        attribution:
        "Tiles © Esri",

        minZoom: 0,

        maxZoom: 23,

        maxNativeZoom: 23,

        noWrap: true

    }

);


const street = L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/" +
    "World_Street_Map/MapServer/tile/{z}/{y}/{x}",

    {

        attribution:
        "Tiles © Esri",

        minZoom: 0,

        maxZoom: 23,

        maxNativeZoom: 23,

        noWrap: true

    }

);


/* =========================================================
   BASEMAP DEFAULT
========================================================= */

satellite.addTo(map);


/* =========================================================
   ORTHOPHOTO CUSTOM GRID LAYER
========================================================= */

const ORTHO_URL_BASE =

    "https://raw.githubusercontent.com/" +

    "rivaldo123230038-cloud/" +

    "WebGIS-Kemker-Kelompok-1/" +

    "main/" +

    "Fix_Ortho_web/" +

    "_alllayers/";


function toHex(num) {

    return num
        .toString(16)
        .toUpperCase()
        .padStart(8, "0");

}


const OrthoGridLayer = L.GridLayer.extend({

    createTile: function(coords, done) {


        const tile = document.createElement("canvas");

        const size = this.getTileSize();

        tile.width = size.x;

        tile.height = size.y;


        const ctx = tile.getContext("2d");


        const img = new Image();

        img.crossOrigin = "anonymous";


        const z = coords.z;

        const row = coords.y;

        const col = coords.x;


        const rowHex = toHex(row);

        const colHex = toHex(col);


        const url =

            ORTHO_URL_BASE +

            "L" + z + "/" +

            "R" + rowHex + "/" +

            "C" + colHex + ".png";


        img.onload = function() {


            ctx.drawImage(

                img,

                0,
                0,
                size.x,
                size.y

            );


            /*
             * Membuat bagian putih / hitam
             * di luar orthophoto menjadi transparan.
             */

            try {


                const imageData =

                    ctx.getImageData(

                        0,
                        0,
                        size.x,
                        size.y

                    );


                const data = imageData.data;


                for (

                    let i = 0;

                    i < data.length;

                    i += 4

                ) {


                    const r = data[i];

                    const g = data[i + 1];

                    const b = data[i + 2];


                    /*
                     * Transparankan warna putih
                     */

                    if (

                        r > 245 &&
                        g > 245 &&
                        b > 245

                    ) {

                        data[i + 3] = 0;

                    }


                    /*
                     * Transparankan warna hitam
                     * hanya jika benar-benar gelap.
                     */

                    else if (

                        r < 5 &&
                        g < 5 &&
                        b < 5

                    ) {

                        data[i + 3] = 0;

                    }

                }


                ctx.putImageData(

                    imageData,

                    0,
                    0

                );


            } catch (e) {

                console.warn(

                    "Canvas orthophoto:",
                    e

                );

            }


            done(null, tile);

        };


        img.onerror = function() {


            console.warn(

                "Tile orthophoto tidak ditemukan:",

                url

            );


            done(null, tile);

        };


        img.src = url;


        return tile;

    }

});


/*
 * Orthophoto memiliki tile native L12 sampai L18.
 *
 * maxNativeZoom = 18:
 * setelah L18, Leaflet akan menggunakan
 * tile L18 untuk zoom lebih tinggi.
 *
 * maxZoom = 23:
 * user tetap bisa zoom sampai level 23.
 */

const ortho =

    new OrthoGridLayer({

        tileSize: 256,

        opacity: 0.80,

        zIndex: 500,

        noWrap: true,

        minZoom: 12,

        maxNativeZoom: 18,

        maxZoom: 23

    });


ortho.addTo(map);


/* =========================================================
   PROJ4
   UTM ZONE 48S -> WGS84 GCS
========================================================= */

proj4.defs(

    "EPSG:32748",

    "+proj=utm " +
    "+zone=48 " +
    "+south " +
    "+datum=WGS84 " +
    "+units=m " +
    "+no_defs"

);


function UTM48SToWGS84(

    easting,
    northing

) {

    return proj4(

        "EPSG:32748",

        "EPSG:4326",

        [
            easting,
            northing
        ]

    );

}


/* =========================================================
   CONVERT GEOJSON COORDINATE
========================================================= */

function convertCoordinates(

    coordinates

) {


    if (

        typeof coordinates[0] === "number"

    ) {


        const result =

            UTM48SToWGS84(

                coordinates[0],

                coordinates[1]

            );


        return [

            result[0],
            result[1]

        ];

    }


    return coordinates.map(

        convertCoordinates

    );

}


/* =========================================================
   GARIS PANTAI
========================================================= */

let coastlineLayer = null;


fetch("Garis_Pantai_RTK.geojson")

    .then(function(response) {


        if (!response.ok) {

            throw new Error(

                "File Garis_Pantai_RTK.geojson tidak ditemukan."

            );

        }


        return response.json();

    })


    .then(function(data) {


        /*
         * Hanya Garis Pantai RTK yang
         * dikonversi dari UTM 48S
         * menjadi GCS WGS84.
         */

        data.features.forEach(

            function(feature) {


                if (

                    feature.geometry &&
                    feature.geometry.coordinates

                ) {


                    feature.geometry.coordinates =

                        convertCoordinates(

                            feature.geometry.coordinates

                        );

                }

            }

        );


        coastlineLayer =

            L.geoJSON(

                data,

                {


                    style: {

                        color: "cyan",

                        weight: 4,

                        opacity: 1

                    },


                    onEachFeature:

                        function(

                            feature,
                            layer

                        ) {


                            let popup = "";


                            if (

                                feature.properties

                            ) {


                                Object.keys(

                                    feature.properties

                                ).forEach(

                                    function(key) {


                                        popup +=

                                            "<b>" +

                                            key +

                                            "</b>: " +

                                            feature.properties[key] +

                                            "<br>";

                                    }

                                );

                            }


                            if (popup !== "") {

                                layer.bindPopup(popup);

                            }


                            layer.on({

                                mouseover:

                                    function(e) {


                                        e.target.setStyle({

                                            color: "red",

                                            weight: 6

                                        });

                                    },


                                mouseout:

                                    function(e) {


                                        e.target.setStyle({

                                            color: "cyan",

                                            weight: 4

                                        });

                                    }

                            });


                        }

                }

            );


        coastlineLayer.addTo(map);


        /*
         * Zoom otomatis ke garis pantai.
         *
         * maxZoom 18 supaya orthophoto
         * level L18 dapat langsung digunakan.
         */

        if (

            coastlineLayer.getBounds().isValid()

        ) {


            map.fitBounds(

                coastlineLayer.getBounds(),

                {

                    padding: [20, 20],

                    maxZoom: 18

                }

            );

        }


    })


    .catch(function(error) {


        console.error(

            "Gagal memuat garis pantai:",

            error

        );


        alert(

            "Garis Pantai RTK gagal dimuat.\n\n" +

            "Pastikan file berikut berada satu folder " +

            "dengan index.html:\n\n" +

            "Garis_Pantai_RTK.geojson"

        );

    });


/* =========================================================
   CHECKBOX GARIS PANTAI
========================================================= */

document

    .getElementById("coastlineToggle")

    .addEventListener(

        "change",

        function(e) {


            if (!coastlineLayer) {

                return;

            }


            if (e.target.checked) {

                coastlineLayer.addTo(map);

            }

            else {

                map.removeLayer(

                    coastlineLayer

                );

            }

        }

    );


/* =========================================================
   CHECKBOX ORTHOPHOTO
========================================================= */

document

    .getElementById("orthoToggle")

    .addEventListener(

        "change",

        function(e) {


            if (e.target.checked) {

                ortho.addTo(map);

            }

            else {

                map.removeLayer(ortho);

            }

        }

    );


/* =========================================================
   BASEMAP SWITCH
========================================================= */

document

    .querySelectorAll(

        'input[name="basemap"]'

    )

    .forEach(

        function(input) {


            input.addEventListener(

                "change",

                function(e) {


                    if (

                        !e.target.checked

                    ) {

                        return;

                    }


                    /*
                     * Hapus basemap lama
                     */

                    if (

                        map.hasLayer(

                            satellite

                        )

                    ) {

                        map.removeLayer(

                            satellite

                        );

                    }


                    if (

                        map.hasLayer(

                            street

                        )

                    ) {

                        map.removeLayer(

                            street

                        );

                    }


                    /*
                     * Tambahkan basemap baru
                     */

                    if (

                        e.target.value ===

                        "satellite"

                    ) {


                        satellite.addTo(map);

                    }


                    else if (

                        e.target.value ===

                        "street"

                    ) {


                        street.addTo(map);

                    }

                }

            );

        }

    );


/* =========================================================
   ZOOM TO GARIS PANTAI
========================================================= */

document

    .getElementById("zoomToLayer")

    .addEventListener(

        "click",

        function() {


            if (

                coastlineLayer &&

                coastlineLayer.getBounds().isValid()

            ) {


                map.fitBounds(

                    coastlineLayer.getBounds(),

                    {

                        padding: [20, 20],

                        maxZoom: 18

                    }

                );

            }


            else {


                alert(

                    "Garis Pantai RTK belum tersedia."

                );

            }

        }

    );


/* =========================================================
   CURSOR COORDINATE
========================================================= */

map.on(

    "mousemove",

    function(e) {


        const lat =

            e.latlng.lat.toFixed(6);


        const lon =

            e.latlng.lng.toFixed(6);


        document

            .getElementById(

                "cursorCoordinate"

            )

            .innerHTML =

                "<b>Latitude:</b> " +

                lat +

                "<br>" +

                "<b>Longitude:</b> " +

                lon;

    }

);


/* =========================================================
   SIDEBAR TOGGLE
========================================================= */

const sidebar =

    document.getElementById(

        "sidebar"

    );


const sidebarToggle =

    document.getElementById(

        "sidebarToggle"

    );


sidebarToggle.addEventListener(

    "click",

    function() {


        sidebar.classList.toggle(

            "collapsed"

        );


        sidebarToggle.classList.toggle(

            "collapsed"

        );


        if (

            sidebar.classList.contains(

                "collapsed"

            )

        ) {


            document

                .getElementById("map")

                .style.left = "0";


            document

                .getElementById("map")

                .style.width = "100%";


            sidebarToggle.innerHTML = "▶";

        }


        else {


            document

                .getElementById("map")

                .style.left = "350px";


            document

                .getElementById("map")

                .style.width =

                    "calc(100% - 350px)";


            sidebarToggle.innerHTML = "◀";

        }


        setTimeout(

            function() {

                map.invalidateSize();

            },

            350

        );

    }

);


/* =========================================================
   SCALE
========================================================= */

L.control.scale({

    imperial: false,

    metric: true

}).addTo(map);


/* =========================================================
   SELESAI
========================================================= */

console.log(

    "WEBGIS KELOMPOK 1 berhasil dijalankan."

);

console.log(

    "Basemap max zoom : 23"

);

console.log(

    "Orthophoto native : L12 - L18"

);

console.log(

    "Orthophoto max zoom : 23"

);

console.log(

    "Garis Pantai : UTM 48S -> WGS84 EPSG:4326"

);

</script>

</body>

</html>
