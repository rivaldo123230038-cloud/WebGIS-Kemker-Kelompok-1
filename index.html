<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WEBGIS KELOMPOK 1</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   MAP
========================================================= */

#map {
    position: fixed;

    top: 0;
    right: 0;
    bottom: 0;
    left: 350px;

    z-index: 1;

    background: #d9d9d9;

    transition: left 0.35s ease;
}


/* =========================================================
   SIDEBAR
========================================================= */

#sidebar {

    position: fixed;

    top: 0;
    left: 0;

    width: 350px;
    height: 100vh;

    background: #ffffff;

    z-index: 1000;

    overflow-y: auto;
    overflow-x: hidden;

    box-shadow: 2px 0 8px rgba(0,0,0,0.15);

    transition: transform 0.35s ease;
}


#sidebar::-webkit-scrollbar {
    width: 8px;
}

#sidebar::-webkit-scrollbar-track {
    background: #eeeeee;
}

#sidebar::-webkit-scrollbar-thumb {
    background: #888888;
    border-radius: 4px;
}


#sidebar.collapsed {
    transform: translateX(-350px);
}


/* =========================================================
   SIDEBAR TOGGLE
========================================================= */

#sidebarToggle {

    position: fixed;

    left: 350px;
    top: 50%;

    transform: translateY(-50%);

    width: 38px;
    height: 76px;

    border: none;

    border-radius: 0 10px 10px 0;

    background: #173b5e;

    color: white;

    font-size: 28px;
    font-weight: bold;

    cursor: pointer;

    z-index: 1100;

    transition: left 0.35s ease;
}


/* =========================================================
   LOGO
========================================================= */

.logo-area {

    height: 210px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 13px;

    background: white;

    padding: 20px 10px;

    position: relative;

    z-index: 10;
}


.logo-area img {

    width: 70px;
    height: 70px;

    object-fit: contain;

    border: none;
    outline: none;

    background: transparent;
}


/* =========================================================
   BACKGROUND SIDEBAR
========================================================= */

.background-slideshow {

    position: fixed;

    top: 210px;
    left: 0;

    width: 350px;

    height: calc(100vh - 210px);

    overflow: hidden;

    z-index: 0;

    pointer-events: none;
}


.bg-photo {

    position: absolute;

    left: 0;

    width: 100%;
    height: 33.3333%;

    object-fit: cover;

    opacity: 0.16;

    transition:
        top 1.35s ease,
        opacity 1.35s ease;
}


.bg1 {
    top: 0;
}

.bg2 {
    top: 33.3333%;
}

.bg3 {
    top: 66.6666%;
}


/* =========================================================
   TITLE
========================================================= */

.title-area {

    position: relative;

    z-index: 5;

    padding: 18px 15px 15px;

    text-align: center;

    background: rgba(255,255,255,0.94);

    border-bottom: 1px solid #dddddd;
}

    margin: 0;

    color: #173b5e;

    font-size: 25px;

    font-weight: 700;
}


.title-area p {

    color: #555555;

    font-size: 14px;
}


/* =========================================================
   CONTENT
========================================================= */

    z-index: 5;

    padding: 15px 12px 30px;

/* =========================================================
   SECTION TITLE
========================================================= */

    padding-bottom: 7px;

    font-size: 15px;

    font-weight: 700;

   PANEL
========================================================= */

.panel {

    background: rgba(255,255,255,0.94);

    border-radius: 7px;

    padding: 12px;

    margin-bottom: 18px;

    box-shadow:
        0 1px 5px rgba(0,0,0,0.10);

/* =========================================================
   CONTROL
========================================================= */

.control-row {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 8px 4px;

    color: #333333;

    font-size: 14px;
}


.control-row input {

    width: 15px;
    height: 15px;

    accent-color: #087cff;
}


.control-row label {

    cursor: pointer;
}


/* =========================================================
   BUTTON
========================================================= */

.zoom-button {

    margin-top: 8px;

    padding: 11px 10px;

    border-radius: 6px;

    background: #173b5e;

    font-size: 14px;

}

   COORDINATE
========================================================= */

.coordinate-box {

.coordinate-label {

    margin-bottom: 3px;

    font-size: 14px;

    font-weight: 700;

    margin-bottom: 10px;

/* =========================================================
   FOOTER
========================================================= */

    padding: 15px;

    text-align: center;

    color: #666666;

    font-size: 11px;

    background: rgba(255,255,255,0.90);

/* =========================================================
   LEGEND
========================================================= */

.legend {

    box-shadow:

/* =========================================================
   CUSTOM ZOOM
========================================================= */

.custom-zoom {

    height: 42px;

    border-radius: 5px;

    box-shadow:

    color: #173b5e;

    background: #f0f0f0;
}


/* =========================================================
   LEAFLET
========================================================= */

.leaflet-control-attribution {

    font-size: 10px;
}


.leaflet-control-scale-line {

    background: rgba(255,255,255,0.85);

/* =========================================================
   ORTHOPHOTO TILE
========================================================= */

/*
   TILE ORTHOPHOTO DIPROSES MELALUI CANVAS.

   AREA PUTIH YANG TERHUBUNG DENGAN TEPI TILE
   AKAN DIBUAT TRANSPARAN.

   FOTO ASLI TETAP DIPERTAHANKAN.
*/

.ortho-clean-tile {

    background: transparent !important;

    border: none !important;

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    #sidebar {

        width: 300px;
    }

    }

    }


    .background-slideshow {

        width: 300px;
    }


    .logo-area img {

        width: 58px;
        height: 58px;
    }

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   MAP
========================================================= */

const map = L.map('map', {

    center: [-5.43, 105.26],

    zoom: 10,

    minZoom: 3,

    maxZoom: 23,

    zoomControl: true,

    worldCopyJump: false

});


/* =========================================================
   ESRI WORLD IMAGERY
========================================================= */

const esriImagery = L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

    {

        minZoom: 3,

        maxZoom: 23,

        minNativeZoom: 3,

        maxNativeZoom: 19,

        tileSize: 256,

        noWrap: true,

        keepBuffer: 5,

        updateWhenZooming: false,

        updateWhenIdle: true,

        attribution:
            'Tiles © Esri, Maxar, Earthstar Geographics, and the GIS User Community'

    }

).addTo(map);


/* =========================================================
   ESRI STREET MAP
========================================================= */

const esriStreet = L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',

    {

        minZoom: 3,

        maxZoom: 23,

        minNativeZoom: 3,

        maxNativeZoom: 19,

        tileSize: 256,

        noWrap: true,

        keepBuffer: 5,

        updateWhenZooming: false,

        updateWhenIdle: true,

        attribution:
            'Tiles © Esri'

    }

);


/* =========================================================
   ORTHOPHOTO CUSTOM GRID LAYER
========================================================= */

/*

   KENAPA TIDAK PAKAI L.tileLayer BIASA?

   Karena PNG Orthophoto memiliki bagian putih/no-data.

   Dengan GridLayer custom:

   1. Tile dimuat sebagai Image.
   2. Image dimasukkan ke Canvas.
   3. Pixel putih yang terhubung ke tepi tile dicari.
   4. Pixel tersebut dibuat alpha = 0.
   5. Canvas ditampilkan sebagai tile transparan.

*/


const OrthoCleanLayer =
    L.GridLayer.extend({

        createTile: function(coords, done) {


            /* ---------------------------------------------
               CANVAS
            --------------------------------------------- */

            const canvas =
                document.createElement('canvas');


            canvas.width = 256;

            canvas.height = 256;


            canvas.className =
                'ortho-clean-tile';


            const ctx =
                canvas.getContext(
                    '2d',
                    {
                        willReadFrequently: true
                    }
                );


            /* ---------------------------------------------
               IMAGE
            --------------------------------------------- */

            const img =
                new Image();


            /*
               WAJIB UNTUK CANVAS + CDN
            */

            img.crossOrigin = 'anonymous';


            /* ---------------------------------------------
               TILE COORDINATE
            --------------------------------------------- */

            const z = coords.z;

            const x = coords.x;

            const y = coords.y;


            if (

                z < 12 ||

                z > 18 ||

                x < 0 ||

                y < 0

            ) {

                setTimeout(function() {

                    done(
                        null,
                        canvas
                    );

                }, 0);

                return canvas;

            }


            /* ---------------------------------------------
               HEX ROW
            --------------------------------------------- */

            const rowHex =

                Math.floor(y)
                .toString(16)
                .padStart(8, '0')
                .toLowerCase();


            /* ---------------------------------------------
               HEX COLUMN
            --------------------------------------------- */

            const colHex =

                Math.floor(x)
                .toString(16)
                .padStart(8, '0')
                .toLowerCase();


            /* ---------------------------------------------
               JSDELIVR

               ORIGINAL ARC MAP CACHE STRUCTURE
            --------------------------------------------- */

            const tileURL =

                'https://cdn.jsdelivr.net/gh/' +

                'rivaldo123230038-cloud/' +

                'WebGIS-Kemker-Kelompok-1@main/' +

                'Fix_Ortho_web/' +

                '_alllayers/' +

                'L' + z + '/' +

                'R' + rowHex + '/' +

                'C' + colHex + '.png';


            console.log(
                'Orthophoto:',
                tileURL
            );


            /* ---------------------------------------------
               IMAGE LOAD
            --------------------------------------------- */

            img.onload = function() {


                try {


                    /* -------------------------------------
                       DRAW ORIGINAL TILE
                    ------------------------------------- */

                    ctx.clearRect(
                        0,
                        0,
                        256,
                        256
                    );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        256,
                        256
                    );


                    /* -------------------------------------
                       AMBIL PIXEL
                    ------------------------------------- */

                    const imageData =
                        ctx.getImageData(
                            0,
                            0,
                            256,
                            256
                        );


                    const data =
                        imageData.data;


                    const width = 256;

                    const height = 256;


                    /* -------------------------------------
                       FUNGSI CEK PUTIH
                    ------------------------------------- */

                    function isWhite(
                        index
                    ) {

                        const r =
                            data[index];

                        const g =
                            data[index + 1];

                        const b =
                            data[index + 2];

                        const a =
                            data[index + 3];


                        /*
                           THRESHOLD PUTIH

                           Semakin kecil:
                           hanya putih murni yang dihapus.

                           Semakin besar:
                           putih/abu-abu muda ikut dihapus.
                        */

                        return (

                            a > 0 &&

                            r >= 242 &&

                            g >= 242 &&

                            b >= 242

                        );

                    }


                    /* -------------------------------------
                       FLOOD FILL DARI TEPI
                    ------------------------------------- */

                    const visited =
                        new Uint8Array(
                            width * height
                        );


                    const queue = [];


                    function addPixel(
                        x,
                        y
                    ) {

                        if (

                            x < 0 ||

                            x >= width ||

                            y < 0 ||

                            y >= height

                        ) {

                            return;

                        }


                        const pos =
                            y * width + x;


                        if (
                            visited[pos]
                        ) {

                            return;

                        }


                        const index =
                            pos * 4;


                        if (
                            !isWhite(index)
                        ) {

                            return;

                        }


                        visited[pos] = 1;

                        queue.push(pos);

                    }


                    /* -------------------------------------
                       MASUKKAN SEMUA PIXEL TEPI
                    ------------------------------------- */

                    for (
                        let x = 0;
                        x < width;
                        x++
                    ) {

                        addPixel(
                            x,
                            0
                        );


                        addPixel(
                            x,
                            height - 1
                        );

                    }


                    for (
                        let y = 0;
                        y < height;
                        y++
                    ) {

                        addPixel(
                            0,
                            y
                        );


                        addPixel(
                            width - 1,
                            y
                        );

                    }


                    /* -------------------------------------
                       FLOOD FILL
                    ------------------------------------- */

                    let queueIndex = 0;


                    while (
                        queueIndex <
                        queue.length
                    ) {


                        const pos =
                            queue[
                                queueIndex++
                            ];


                        const px =
                            pos % width;


                        const py =
                            Math.floor(
                                pos / width
                            );


                        const index =
                            pos * 4;


                        /*
                           PUTIH DIJADIKAN TRANSPARAN
                        */

                        data[index + 3] = 0;


                        /* ATAS */

                        if (py > 0) {

                            addPixel(
                                px,
                                py - 1
                            );

                        }


                        /* BAWAH */

                        if (
                            py <
                            height - 1
                        ) {

                            addPixel(
                                px,
                                py + 1
                            );

                        }


                        /* KIRI */

                        if (px > 0) {

                            addPixel(
                                px - 1,
                                py
                            );

                        }


                        /* KANAN */

                        if (
                            px <
                            width - 1
                        ) {

                            addPixel(
                                px + 1,
                                py
                            );

                        }

                    }


                    /* -------------------------------------
                       KEMBALIKAN HASIL KE CANVAS
                    ------------------------------------- */

                    ctx.putImageData(
                        imageData,
                        0,
                        0
                    );


                    done(
                        null,
                        canvas
                    );


                }

                catch (error) {

                    console.error(
                        'Gagal memproses tile Orthophoto:',
                        error
                    );


                    /*
                       JIKA PROCESSING GAGAL,
                       TILE TETAP DITAMPILKAN NORMAL
                    */

                    ctx.clearRect(
                        0,
                        0,
                        256,
                        256
                    );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        256,
                        256
                    );


                    done(
                        null,
                        canvas
                    );

                }

            };


            /* ---------------------------------------------
               IMAGE ERROR
            --------------------------------------------- */

            img.onerror = function() {

                console.warn(
                    'Tile Orthophoto tidak ditemukan:',
                    tileURL
                );


                /*
                   Canvas transparan jika tile tidak ada
                */

                ctx.clearRect(
                    0,
                    0,
                    256,
                    256
                );


                done(
                    null,
                    canvas
                );

            };


            /* ---------------------------------------------
               LOAD TILE
            --------------------------------------------- */

            img.src = tileURL;


            return canvas;

        }

    });


/* =========================================================
   INSTANCE ORTHOPHOTO
========================================================= */

const orthoLayer =
    new OrthoCleanLayer({

        minZoom: 12,

        maxZoom: 18,

        minNativeZoom: 12,

        maxNativeZoom: 18,

        tileSize: 256,

        noWrap: true,

        opacity: 1,

        keepBuffer: 3,

        updateWhenIdle: true,

        updateWhenZooming: false

    });


/* =========================================================
   GARIS PANTAI RTK
========================================================= */

let coastline = null;

let coastlineReady = false;


/* =========================================================
   POPUP
========================================================= */

function createRTKPopup(
    properties
) {


    if (!properties) {

        return '<b>Garis Pantai RTK</b>';

    }


    let html =
        '<b>Garis Pantai RTK</b><br><br>';


    Object.keys(
        properties
    ).forEach(function(key) {


        const value =
            properties[key];


        if (

            value !== null &&

            value !== undefined &&

            value !== ''

        ) {


            html +=

                '<b>' +

                key +

                ':</b> ' +

                value +

                '<br>';

        }

    });


    return html;

}


/* =========================================================
   LOAD GARIS PANTAI
========================================================= */

fetch(
    'Garis_Pantai_RTK.geojson'
)

.then(function(response) {


    if (!response.ok) {

        throw new Error(
            'Garis_Pantai_RTK.geojson tidak ditemukan.'
        );

    }


    return response.json();

})

.then(function(data) {


    coastline =
        L.geoJSON(
            data,
            {


                style: {


                    color: '#00ffff',

                    weight: 4,

                    opacity: 0.95

                },


                onEachFeature:
                    function(
                        feature,
                        layer
                    ) {


                        layer.bindPopup(

                            createRTKPopup(
                                feature.properties
                            )

                        );


                        layer.on({


                            mouseover:
                                function(e) {


                                    e.target.setStyle({

                                        color: '#ff0000',

                                        weight: 6,

                                        opacity: 1

                                    });

                                },


                            mouseout:
                                function(e) {


                                    e.target.setStyle({

                                        color: '#00ffff',

                                        weight: 4,

                                        opacity: 0.95

                                    });

                                }

                        });

                    }

            }

        );


    coastlineReady = true;


    console.log(
        'Garis Pantai RTK berhasil dimuat.'
    );


})

.catch(function(error) {


    console.error(
        'Gagal memuat Garis_Pantai_RTK.geojson:',
        error
    );

});


/* =========================================================
   CHECKBOX GARIS PANTAI
========================================================= */

document
    .getElementById(
        'coastlineCheck'
    )
    .addEventListener(
        'change',
        function() {


            if (!coastlineReady) {


                this.checked = false;


                alert(
                    'Garis Pantai RTK belum selesai dimuat.'
                );


                return;

            }


            if (this.checked) {

                coastline.addTo(map);

            }

            else {

                map.removeLayer(
                    coastline
                );

            }

        }
    );


/* =========================================================
   CHECKBOX ORTHOPHOTO
========================================================= */

document
    .getElementById(
        'orthoCheck'
    )
    .addEventListener(
        'change',
        function() {


            if (this.checked) {

                orthoLayer.addTo(map);

            }

            else {

                map.removeLayer(
                    orthoLayer
                );

            }

        }
    );


/* =========================================================
   BASEMAP IMAGERY
========================================================= */

document
    .getElementById(
        'imageryRadio'
    )
    .addEventListener(
        'change',
        function() {


            if (this.checked) {


                if (
                    map.hasLayer(
                        esriStreet
                    )
                ) {

                    map.removeLayer(
                        esriStreet
                    );

                }


                if (
                    !map.hasLayer(
                        esriImagery
                    )
                ) {

                    esriImagery.addTo(
                        map
                    );

                }

            }

        }
    );


/* =========================================================
   BASEMAP STREET
========================================================= */

document
    .getElementById(
        'streetRadio'
    )
    .addEventListener(
        'change',
        function() {


            if (this.checked) {


                if (
                    map.hasLayer(
                        esriImagery
                    )
                ) {

                    map.removeLayer(
                        esriImagery
                    );

                }


                if (
                    !map.hasLayer(
                        esriStreet
                    )
                ) {

                    esriStreet.addTo(
                        map
                    );

                }

            }

        }
    );


/* =========================================================
   AUTO ZOOM
========================================================= */

function zoomToCoastline() {


    if (

        !coastlineReady ||

        !coastline

    ) {


        alert(
            'Garis Pantai RTK belum tersedia.'
        );


        return;

    }


    const bounds =
        coastline.getBounds();


    if (
        bounds.isValid()
    ) {


        map.fitBounds(

            bounds,

            {

                padding: [
                    30,
                    30
                ],

                maxZoom: 18,

                animate: true

            }

        );

    }

}


/* =========================================================
   AUTO ZOOM BUTTON
========================================================= */

document
    .getElementById(
        'zoomButton'
    )
    .addEventListener(
        'click',
        zoomToCoastline
    );


/* =========================================================
   MAP AUTO ZOOM CONTROL
========================================================= */

const customZoomControl =
    L.control({

        position:
            'topright'

    });


customZoomControl.onAdd =
    function() {


        const div =
            L.DomUtil.create(
                'div',
                'custom-zoom'
            );


        div.innerHTML = '⌖';


        div.title =
            'Auto Zoom ke Garis Pantai RTK';


        L.DomEvent
            .disableClickPropagation(
                div
            );


        div.addEventListener(
            'click',
            zoomToCoastline
        );


        return div;

    };


customZoomControl.addTo(
    map
);


/* =========================================================
   KOORDINAT KURSOR
========================================================= */

map.on(
    'mousemove',
    function(e) {


        document
            .getElementById(
                'latitude'
            )
            .textContent =
            e.latlng.lat.toFixed(7);


        document
            .getElementById(
                'longitude'
            )
            .textContent =
            e.latlng.lng.toFixed(7);

    }
);


/* =========================================================
   SCALE
========================================================= */

L.control.scale({

    imperial: false,

    metric: true,

    position: 'bottomleft',

    maxWidth: 120

}).addTo(map);


/* =========================================================
   LEGEND
========================================================= */

const legend =
    L.control({

        position:
            'bottomright'

    });


legend.onAdd =
    function() {


        const div =
            L.DomUtil.create(
                'div',
                'legend'
            );


        div.innerHTML =

            '<div class="legend-title">' +

            'Legenda' +

            '</div>' +


            '<div>' +

            '<span class="legend-line"></span>' +

            'Garis Pantai RTK' +

            '</div>';


        return div;

    };


legend.addTo(map);


/* =========================================================
   SIDEBAR TOGGLE
========================================================= */

const sidebar =
    document.getElementById(
        'sidebar'
    );


const sidebarToggle =
    document.getElementById(
        'sidebarToggle'
    );


sidebarToggle.addEventListener(
    'click',
    function() {


        sidebar.classList.toggle(
            'collapsed'
        );


        if (
            sidebar.classList.contains(
                'collapsed'
            )
        ) {


            sidebarToggle.innerHTML =
                '›';


            map.getContainer()
                .style.left =
                '0px';

        }

        else {


            sidebarToggle.innerHTML =
                '‹';


            map.getContainer()
                .style.left =

                window.innerWidth <= 700

                    ? '300px'

                    : '350px';

        }


        setTimeout(
            function() {

                map.invalidateSize();

            },
            400
        );

    }
);


/* =========================================================
   RESPONSIVE
========================================================= */

window.addEventListener(
    'resize',
    function() {


        if (
            sidebar.classList.contains(
                'collapsed'
            )
        ) {


            map.getContainer()
                .style.left =
                '0px';

        }

        else {


            map.getContainer()
                .style.left =

                window.innerWidth <= 700

                    ? '300px'

                    : '350px';

        }


        map.invalidateSize();

    }
);


/* =========================================================
   BACKGROUND SLIDESHOW
========================================================= */

const bgPhotos =
    document.querySelectorAll(
        '.bg-photo'
    );


let bgIndex = 0;


function updateBackground() {


    bgPhotos.forEach(
        function(
            photo,
            index
        ) {


            photo.style.opacity =
                '0';


            photo.style.top =

                (
                    (
                        index -
                        bgIndex +
                        3
                    ) % 3
                )
                *
                33.3333
                +
                '%';

        }
    );


    setTimeout(
        function() {


            bgPhotos.forEach(
                function(photo) {


                    photo.style.opacity =
                        '0.16';

                }
            );


        },
        100
    );

}


setInterval(

    function() {


        bgIndex =
            (
                bgIndex + 1
            ) % 3;


        updateBackground();


    },

    5000

);

orthoLayer.addTo(map);
