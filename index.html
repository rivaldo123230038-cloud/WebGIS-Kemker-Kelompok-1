<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WEBGIS KELOMPOK 1</title>

  <!-- LEAFLET CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    /* =====================================================
       DASAR
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =====================================================
       PETA
       ===================================================== */

    #map {
      position: absolute;
      left: 350px;
      top: 0;
      width: calc(100% - 350px);
      height: 100vh;
    }


    /* =====================================================
       SIDEBAR
       ===================================================== */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;

      width: 350px;
      height: 100vh;

      background: #ffffff;

      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.18);

      z-index: 2000;

      overflow-y: auto;
    }


    /* =====================================================
       4 LOGO SEJAJAR
       ===================================================== */

    .logo-section {
      display: flex;
      flex-direction: row;

      justify-content: space-between;
      align-items: center;

      width: 100%;

      padding: 18px 10px;

      gap: 5px;

      border-bottom: 1px solid #eeeeee;
    }


    .logo-item {
      flex: 1;

      min-width: 0;

      height: 72px;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    .logo-item img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;
    }


    /* =====================================================
       JUDUL
       ===================================================== */

    .title-section {
      padding: 18px 20px 16px;

      text-align: center;

      border-bottom: 1px solid #eeeeee;
    }


    .title-section h1 {
      margin: 0;

      font-size: 22px;

      font-weight: 700;

      color: #17324d;

      letter-spacing: 0.5px;
    }


    .title-section p {
      margin: 7px 0 0;

      font-size: 12px;

      line-height: 1.4;

      color: #666666;
    }


    /* =====================================================
       PANEL
       ===================================================== */

    .panel-content {
      padding: 18px 20px;
    }


    /* =====================================================
       JUDUL BAGIAN
       ===================================================== */

    .section-title {
      margin-top: 18px;

      margin-bottom: 10px;

      padding-bottom: 7px;

      border-bottom: 2px solid #17324d;

      color: #17324d;

      font-size: 14px;

      font-weight: bold;

      text-transform: uppercase;
    }


    .section-title:first-child {
      margin-top: 0;
    }


    /* =====================================================
       KOTAK KONTROL
       ===================================================== */

    .layer-control-box {
      background: #f7f9fb;

      border-radius: 7px;

      padding: 10px;

      border: 1px solid #e1e5e8;
    }


    .layer-item {
      display: flex;

      align-items: center;

      gap: 8px;

      padding: 8px 5px;

      font-size: 13px;

      cursor: pointer;
    }


    .layer-item input {
      cursor: pointer;
    }


    /* =====================================================
       TOMBOL AUTO ZOOM DI SIDEBAR
       ===================================================== */

    .zoom-layer-button {
      width: 100%;

      margin-top: 10px;

      padding: 10px 12px;

      border: none;

      border-radius: 6px;

      background: #17324d;

      color: white;

      font-size: 13px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }


    .zoom-layer-button:hover {
      background: #244e73;
    }


    .zoom-layer-button:active {
      transform: scale(0.98);
    }


    /* =====================================================
       SISTEM KOORDINAT
       ===================================================== */

    .coordinate-box {
      background: #f7f9fb;

      border: 1px solid #e1e5e8;

      border-radius: 7px;

      padding: 12px;
    }


    .coordinate-box .label {
      font-size: 11px;

      color: #777777;

      margin-bottom: 3px;
    }


    .coordinate-box .value {
      font-size: 14px;

      font-weight: bold;

      color: #17324d;

      margin-bottom: 10px;
    }


    /* =====================================================
       KOORDINAT KURSOR
       ===================================================== */

    .cursor-box {
      background: #17324d;

      color: white;

      border-radius: 7px;

      padding: 10px;

      font-size: 11px;

      line-height: 1.6;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .sidebar-footer {
      margin-top: 25px;

      padding: 15px 20px;

      border-top: 1px solid #eeeeee;

      text-align: center;

      font-size: 10px;

      color: #777777;

      line-height: 1.5;
    }


    /* =====================================================
       POPUP
       ===================================================== */

    .popup-title {
      font-size: 14px;

      font-weight: bold;

      color: #17324d;

      margin-bottom: 7px;
    }


    /* =====================================================
       CUSTOM CONTROL AUTO ZOOM
       ===================================================== */

    .zoom-to-layer-control {
      margin-top: 10px;
    }


    .zoom-to-layer-button-map {
      width: 38px;
      height: 38px;

      background: white;

      border: 2px solid rgba(0, 0, 0, 0.2);

      border-radius: 4px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 19px;

      font-weight: bold;

      color: #17324d;

      cursor: pointer;

      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);

      transition: 0.2s;
    }


    .zoom-to-layer-button-map:hover {
      background: #f0f5f9;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 800px) {

      .sidebar {
        width: 280px;
      }

      #map {
        left: 280px;
        width: calc(100% - 280px);
      }

      .logo-section {
        padding: 15px 6px;
        gap: 3px;
      }

      .logo-item {
        height: 58px;
      }

      .title-section h1 {
        font-size: 18px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       SIDEBAR
       ===================================================== -->

  <div class="sidebar">


    <!-- ===================================================
         LOGO
         =================================================== -->

    <div class="logo-section">


      <!-- LOGO ITERA -->

      <div class="logo-item">

        <img
          src="ITERA.jpeg"
          alt="Logo ITERA"
        >

      </div>


      <!-- LOGO TEKNIK GEOMATIKA -->

      <div class="logo-item">

        <img
          src="Logo_GT.png"
          alt="Logo Teknik Geomatika"
        >

      </div>


      <!-- LOGO KEMAH KERJA -->

      <div class="logo-item">

        <img
          src="LOGO_KEMKER.png"
          alt="Logo Kemah Kerja"
        >

      </div>


      <!-- LOGO TEKNIK GEOMATIKA 2023 -->

      <div class="logo-item">

        <img
          src="LOGO_GT23.png"
          alt="Logo Teknik Geomatika Angkatan 2023"
        >

      </div>


    </div>


    <!-- ===================================================
         JUDUL
         =================================================== -->

    <div class="title-section">

      <h1>
        WEBGIS KELOMPOK 1
      </h1>

      <p>
        Pemetaan dan Visualisasi Garis Pantai
      </p>

    </div>


    <!-- ===================================================
         PANEL
         =================================================== -->

    <div class="panel-content">


      <!-- =================================================
           GARIS PANTAI
           ================================================= -->

      <div class="section-title">
        Garis Pantai
      </div>


      <div class="layer-control-box">


        <label class="layer-item">

          <input
            type="checkbox"
            id="coastlineCheck"
            checked
          >

          <span>
            Garis Pantai
          </span>

        </label>


        <!-- TOMBOL AUTO ZOOM -->

        <button
          type="button"
          id="zoomLayerButton"
          class="zoom-layer-button"
        >
          ⌖ Auto Zoom to Layer
        </button>


      </div>


      <!-- =================================================
           BASE MAP
           ================================================= -->

      <div class="section-title">
        Base Map
      </div>


      <div class="layer-control-box">


        <!-- ESRI WORLD IMAGERY -->

        <label class="layer-item">

          <input
            type="radio"
            name="basemap"
            id="satelliteRadio"
            checked
          >

          <span>
            Esri World Imagery
          </span>

        </label>


        <!-- ESRI WORLD STREET MAP -->

        <label class="layer-item">

          <input
            type="radio"
            name="basemap"
            id="streetRadio"
          >

          <span>
            Esri World Street Map
          </span>

        </label>


      </div>


      <!-- =================================================
           SISTEM KOORDINAT
           ================================================= -->

      <div class="section-title">
        Sistem Koordinat
      </div>


      <div class="coordinate-box">


        <div class="label">
          Datum
        </div>

        <div class="value">
          WGS 84
        </div>


        <div class="label">
          Sistem Koordinat
        </div>

        <div class="value">
          Geographic Coordinate System
        </div>


        <div class="label">
          EPSG
        </div>

        <div class="value">
          EPSG:4326
        </div>


      </div>


      <!-- =================================================
           KOORDINAT KURSOR
           ================================================= -->

      <div class="section-title">
        Koordinat Kursor
      </div>


      <div class="cursor-box">


        <div>
          Latitude:
          <span id="latitude">-</span>
        </div>


        <div>
          Longitude:
          <span id="longitude">-</span>
        </div>


      </div>


    </div>


    <!-- ===================================================
         FOOTER
         =================================================== -->

    <div class="sidebar-footer">

      WEBGIS KELOMPOK 1
      <br>

      Teknik Geomatika ITERA
      <br>

      Kemah Kerja 2026

    </div>


  </div>


  <!-- =====================================================
       PETA
       ===================================================== -->

  <div id="map"></div>


  <!-- =====================================================
       LEAFLET JS
       ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>


    /* =====================================================
       1. INISIALISASI PETA
       ===================================================== */

    const map = L.map('map', {

      center: [-5.45, 105.25],

      zoom: 10,

      zoomControl: true

    });


    /* =====================================================
       2. BASEMAP ESRI WORLD IMAGERY
       ===================================================== */

    const satellite = L.tileLayer(

      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

      {
        maxZoom: 19,

        attribution:
          'Tiles &copy; Esri'
      }

    );


    /* =====================================================
       3. BASEMAP ESRI WORLD STREET MAP
       ===================================================== */

    const street = L.tileLayer(

      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',

      {
        maxZoom: 19,

        attribution:
          'Tiles &copy; Esri'
      }

    );


    /* =====================================================
       4. BASEMAP DEFAULT
       ===================================================== */

    satellite.addTo(map);


    /* =====================================================
       5. STYLE GARIS PANTAI
       ===================================================== */

    const coastlineStyle = {

      color: '#00ffff',

      weight: 4,

      opacity: 0.95

    };


    /* =====================================================
       6. VARIABEL GLOBAL GARIS PANTAI
       ===================================================== */

    let coastline = null;


    /* =====================================================
       7. FUNGSI AUTO ZOOM TO LAYER
       ===================================================== */

    function zoomToCoastline() {

      if (
        coastline &&
        coastline.getLayers().length > 0
      ) {

        const bounds =
          coastline.getBounds();


        if (bounds.isValid()) {

          map.fitBounds(
            bounds,
            {
              padding: [40, 40],
              maxZoom: 16
            }
          );

        }

      }

      else {

        alert(
          'Layer garis pantai belum tersedia.'
        );

      }

    }


    /* =====================================================
       8. TOMBOL AUTO ZOOM DI SIDEBAR
       ===================================================== */

    document

      .getElementById(
        'zoomLayerButton'
      )

      .addEventListener(

        'click',

        function() {

          zoomToCoastline();

        }

      );


    /* =====================================================
       9. CUSTOM LEAFLET CONTROL
       TOMBOL AUTO ZOOM DI PETA
       ===================================================== */

    const ZoomToLayerControl =
      L.Control.extend({

        options: {
          position: 'topright'
        },


        onAdd: function(map) {


          const container =
            L.DomUtil.create(
              'div',
              'leaflet-bar zoom-to-layer-control'
            );


          const button =
            L.DomUtil.create(
              'button',
              'zoom-to-layer-button-map',
              container
            );


          button.type = 'button';


          button.innerHTML = '⌖';


          button.title =
            'Auto Zoom to Layer';


          button.setAttribute(
            'aria-label',
            'Auto Zoom to Layer'
          );


          /* ---------------------------------------------
             Cegah klik tombol mengganggu peta
             --------------------------------------------- */

          L.DomEvent.disableClickPropagation(
            container
          );


          L.DomEvent.on(

            button,

            'click',

            function(e) {

              L.DomEvent.stopPropagation(e);

              zoomToCoastline();

            }

          );


          return container;

        }

      });


    /* =====================================================
       10. TAMBAHKAN TOOL KE PETA
       ===================================================== */

    map.addControl(
      new ZoomToLayerControl()
    );


    /* =====================================================
       11. KONVERSI ESRI JSON
       ===================================================== */

    function convertEsriJSON(data) {


      const coastlineGroup =
        L.featureGroup();


      /* -----------------------------------------------
         CEK FEATURES
         ----------------------------------------------- */

      if (!data.features) {

        console.error(
          'GP_RT.json tidak memiliki features.'
        );

        return coastlineGroup;

      }


      /* -----------------------------------------------
         LOOP FEATURES
         ----------------------------------------------- */

      data.features.forEach(

        function(feature) {


          const geometry =
            feature.geometry || {};


          const attributes =
            feature.attributes || {};


          /* ---------------------------------------------
             CEK PATH
             --------------------------------------------- */

          if (!geometry.paths) {

            return;

          }


          /* ---------------------------------------------
             LOOP PATH
             --------------------------------------------- */

          geometry.paths.forEach(

            function(path) {


              /*
                ESRI JSON:

                [X,Y]

                X = Longitude
                Y = Latitude

                Leaflet:

                [Latitude,Longitude]
              */

              const latLngs =

                path.map(

                  function(point) {

                    return [
                      point[1],
                      point[0]
                    ];

                  }

                );


              /* -----------------------------------------
                 BUAT GARIS
                 ----------------------------------------- */

              const line =

                L.polyline(

                  latLngs,

                  coastlineStyle

                );


              /* -----------------------------------------
                 POPUP
                 ----------------------------------------- */

              let html =

                '<div>' +

                '<div class="popup-title">' +

                'Informasi Garis Pantai' +

                '</div>';


              const keys =
                Object.keys(attributes);


              if (
                keys.length === 0
              ) {

                html +=
                  'Tidak terdapat atribut.';

              }

              else {

                keys.forEach(

                  function(key) {


                    let value =
                      attributes[key];


                    if (
                      value === null ||
                      value === undefined ||
                      value === ''
                    ) {

                      value = '-';

                    }


                    html +=

                      '<b>' +
                      key +
                      '</b>: ' +
                      value +
                      '<br>';

                  }

                );

              }


              html +=
                '</div>';


              line.bindPopup(html);


              /* -----------------------------------------
                 HOVER
                 ----------------------------------------- */

              line.on(

                'mouseover',

                function() {

                  this.setStyle({

                    color: '#ff0000',

                    weight: 6

                  });

                }

              );


              line.on(

                'mouseout',

                function() {

                  this.setStyle(
                    coastlineStyle
                  );

                }

              );


              /* -----------------------------------------
                 MASUKKAN KE GROUP
                 ----------------------------------------- */

              coastlineGroup.addLayer(line);


            }

          );


        }

      );


      return coastlineGroup;

    }


    /* =====================================================
       12. LOAD GP_RT.JSON
       ===================================================== */

    fetch('GP_RT.json')


      .then(

        function(response) {


          if (!response.ok) {

            throw new Error(
              'GP_RT.json tidak ditemukan.'
            );

          }


          return response.json();


        }

      )


      .then(

        function(data) {


          console.log(
            'GP_RT.json berhasil dimuat:',
            data
          );


          /* -----------------------------------------------
             KONVERSI
             ----------------------------------------------- */

          coastline =
            convertEsriJSON(data);


          /* -----------------------------------------------
             TAMBAHKAN KE PETA
             ----------------------------------------------- */

          coastline.addTo(map);


          /* -----------------------------------------------
             AUTO ZOOM SAAT PERTAMA DIMUAT
             ----------------------------------------------- */

          zoomToCoastline();


          /* -----------------------------------------------
             CHECKBOX GARIS PANTAI
             ----------------------------------------------- */

          document

            .getElementById(
              'coastlineCheck'
            )

            .addEventListener(

              'change',

              function() {


                if (this.checked) {

                  coastline.addTo(map);

                  /*
                    Setelah layer dinyalakan kembali,
                    otomatis zoom ke layer.
                  */

                  zoomToCoastline();

                }

                else {

                  map.removeLayer(
                    coastline
                  );

                }


              }

            );


        }

      )


      .catch(

        function(error) {


          console.error(error);


          alert(

            'Gagal membaca GP_RT.json.\n\n' +

            'Pastikan file GP_RT.json berada ' +

            'satu folder dengan index.html.'

          );


        }

      );


    /* =====================================================
       13. BASemap WORLD IMAGERY
       ===================================================== */

    document

      .getElementById(
        'satelliteRadio'
      )

      .addEventListener(

        'change',

        function() {


          if (this.checked) {


            map.removeLayer(
              street
            );


            satellite.addTo(map);


          }


        }

      );


    /* =====================================================
       14. BASEMAP WORLD STREET MAP
       ===================================================== */

    document

      .getElementById(
        'streetRadio'
      )

      .addEventListener(

        'change',

        function() {


          if (this.checked) {


            map.removeLayer(
              satellite
            );


            street.addTo(map);


          }


        }

      );


    /* =====================================================
       15. SCALE BAR
       ===================================================== */

    L.control.scale({

      imperial: false,

      metric: true,

      position: 'bottomleft'

    }).addTo(map);


    /* =====================================================
       16. KOORDINAT KURSOR
       ===================================================== */

    map.on(

      'mousemove',

      function(e) {


        document

          .getElementById(
            'latitude'
          )

          .innerHTML =
          e.latlng.lat.toFixed(6);


        document

          .getElementById(
            'longitude'
          )

          .innerHTML =
          e.latlng.lng.toFixed(6);


      }

    );


  </script>

</body>

</html>
