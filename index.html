<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>WEBGIS KELOMPOK 1</title>


  <!-- =====================================================
       LEAFLET CSS
       ===================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    /* =====================================================
       DASAR
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow: hidden;
    }


    /* =====================================================
       PETA
       ===================================================== */

    #map {

      position: absolute;

      left: 350px;
      top: 0;

      width:
        calc(100% - 350px);

      height:
        100vh;

      transition:
        left 0.3s ease,
        width 0.3s ease;
    }


    /* =====================================================
       SIDEBAR
       ===================================================== */

    .sidebar {

      position: fixed;

      left: 0;
      top: 0;

      width: 350px;
      height: 100vh;

      background:
        #ffffff;

      box-shadow:
        2px 0 12px
        rgba(0, 0, 0, 0.18);

      z-index: 2000;

      overflow: hidden;

      transition:
        transform 0.3s ease;
    }


    .sidebar.collapsed {

      transform:
        translateX(-350px);
    }


    /* =====================================================
       TOMBOL PANAH SIDEBAR
       ===================================================== */

    .sidebar-toggle {

      position: fixed;

      top: 50%;
      left: 350px;

      width: 34px;
      height: 70px;

      transform:
        translateY(-50%);

      border: none;

      border-radius:
        0 8px 8px 0;

      background:
        #17324d;

      color:
        white;

      z-index: 3000;

      cursor:
        pointer;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      font-size:
        22px;

      font-weight:
        bold;

      box-shadow:
        2px 0 8px
        rgba(0, 0, 0, 0.25);

      transition:
        left 0.3s ease,
        background 0.2s ease;
    }


    .sidebar-toggle:hover {

      background:
        #244e73;
    }


    .sidebar-toggle.collapsed {

      left:
        0;
    }


    /* =====================================================
       4 LOGO
       ORANGE BATA
       ===================================================== */

    .logo-section {

      position:
        relative;

      z-index:
        10;

      display:
        flex;

      flex-direction:
        row;

      justify-content:
        space-between;

      align-items:
        center;

      width:
        100%;

      height:
        108px;

      padding:
        18px 10px;

      gap:
        5px;

      /*
       * ORANGE BATA
       */

      background:
        #B65F3A;

      border-bottom:
        1px solid
        #9D4D2E;

      flex-shrink:
        0;
    }


    .logo-item {

      flex:
        1;

      min-width:
        0;

      height:
        72px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      /*
       * Sedikit ruang agar logo
       * tetap rapi di dalam kotak.
       */

      padding:
        4px;

      border-radius:
        6px;
    }


    .logo-item img {

      width:
        100%;

      height:
        100%;

      object-fit:
        contain;

      display:
        block;
    }


    /* =====================================================
       SIDEBAR BODY
       ===================================================== */

    .sidebar-body {

      position:
        relative;

      height:
        calc(100vh - 108px);

      min-height:
        0;

      overflow-y:
        auto;

      overflow-x:
        hidden;

      background:
        transparent;

      scrollbar-width:
        thin;
    }


    /* =====================================================
       BACKGROUND 3 FOTO

       ATAS
       TENGAH
       BAWAH

       TIDAK IKUT SCROLL
       ===================================================== */

    .background-slideshow {

      position:
        fixed;

      left:
        0;

      top:
        108px;

      width:
        350px;

      height:
        calc(100vh - 108px);

      overflow:
        hidden;

      z-index:
        0;

      pointer-events:
        none;
    }


    .bg-photo {

      position:
        absolute;

      left:
        0;

      width:
        100%;

      height:
        33.333333%;

      margin:
        0;

      padding:
        0;

      background-repeat:
        no-repeat;

      background-position:
        center center;

      background-size:
        cover;

      background-color:
        #ffffff;

      opacity:
        0.20;

      transition:

        top 1.35s
        cubic-bezier(
          0.4,
          0,
          0.2,
          1
        ),

        opacity 0.85s
        ease-in-out;
    }


    .bg-photo.pos-top {

      top:
        0;
    }


    .bg-photo.pos-middle {

      top:
        33.333333%;
    }


    .bg-photo.pos-bottom {

      top:
        66.666666%;
    }


    /* =====================================================
       EFEK FADE
       ===================================================== */

    .background-slideshow.changing
    .bg-photo {

      opacity:
        0.035;
    }


    /* =====================================================
       ISI SIDEBAR
       ===================================================== */

    .sidebar-content {

      position:
        relative;

      z-index:
        2;

      min-height:
        100%;
    }


    /* =====================================================
       JUDUL
       ===================================================== */

    .title-section {

      padding:
        18px 20px 16px;

      text-align:
        center;

      background:
        rgba(
          255,
          255,
          255,
          0.72

      border-bottom:
        1px solid
        rgba(
          238,
          238,
          238,
          0.9
        );
    }


    .title-section h1 {

        0;

      font-size:
        22px;

      font-weight:
        700;

      color:
        #17324d;

      letter-spacing:

    }


    .title-section p {

        7px 0 0;

      font-size:
        12px;

      line-height:
        1.4;

      color:
        #555555;
    }


    /* =====================================================
       PANEL
       ===================================================== */

    .panel-content {

      padding:
        18px 20px;
    }


    .section-title {

      margin-top:
        18px;

      margin-bottom:
        10px;

      padding-bottom:
        7px;

      border-bottom:
        2px solid
        #17324d;

      color:
        #17324d;

      font-size:
        14px;

      font-weight:
        bold;

      text-transform:
        uppercase;
    }


    .section-title:first-child {

      margin-top:
        0;
    }


    /* =====================================================
       KOTAK KONTROL
       ===================================================== */

    .layer-control-box {

      background:
        rgba(
          255,
          255,
          255,
          0.84
        );

      border-radius:

      padding:
        10px;

      border:

          229,
          232,

          0,
          0,

    }


    .layer-item {

      align-items:
        center;

      padding:

      font-size:
        13px;

        pointer;
    }


    .layer-item input {

      cursor:
        pointer;
    }


    /* =====================================================
       AUTO ZOOM
       ===================================================== */

    .zoom-layer-button {

      width:

      margin-top:

      padding:

      border:

      font-size:
        13px;

        bold;

    }


    .zoom-layer-button:active {

      transform:

       KOORDINAT
       ===================================================== */

      margin-bottom:

    }


    .coordinate-box .value {

        14px;

      font-weight:
        bold;

      color:
        #17324d;

      margin-bottom:
        10px;
    }


    .cursor-box {

      background:
        rgba(
          23,
          50,
          77,
          0.90
        );

      color:
        white;

      border-radius:
        7px;

      padding:
        10px;

      font-size:
        11px;

      line-height:
        1.6;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .sidebar-footer {

      margin-top:
        25px;

      padding:
        15px 20px;

      border-top:
        1px solid
        rgba(

          238,
          238,

        );

        10px;

        #666666;

      background:
        rgba(

          255,
          255,
          0.72

    }


    /* =====================================================
       POPUP

    .popup-title {

      margin-bottom:

    }


    /* =====================================================
       AUTO ZOOM CONTROL
       ===================================================== */

    .zoom-to-layer-control {

      margin-top:

    }


    .zoom-to-layer-button-map {

        0 1px 5px

    /* =====================================================

      border-radius:

      border:
        1px solid

      box-shadow:

    /* =====================================================
       RESPONSIVE

      }

        transform:

      }

      }

      }

      }


      .title-section h1 {

          18px;
      }

    }

  </style>

    ◀

  </button>


  <!-- =====================================================
       MAP
       ===================================================== -->

  <!-- =====================================================
       LEAFLET JS
       ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>


    /* =====================================================
       1. INITIAL MAP
       ===================================================== */

    const map =
      L.map(
        'map',
        {

          center:
            [-5.45, 105.25],

          zoom:
            10,

          minZoom:
            0,

          maxZoom:
            23,

          zoomControl:
            true,

          scrollWheelZoom:
            true,

          doubleClickZoom:
            true,

          touchZoom:
            true,

          boxZoom:
            true

        }
      );


    /* =====================================================
       2. SIDEBAR TOGGLE
       ===================================================== */

    const sidebar =
      document.getElementById(
        'sidebar'
      );


    const sidebarToggle =
      document.getElementById(
        'sidebarToggle'
      );


    let sidebarCollapsed =
      false;


    sidebarToggle.addEventListener(

      'click',

      function() {


        sidebarCollapsed =
          !sidebarCollapsed;


        if (
          sidebarCollapsed
        ) {


          sidebar.classList.add(
            'collapsed'
          );


          sidebarToggle.classList.add(
            'collapsed'
          );


          sidebarToggle.innerHTML =
            '▶';


          document
            .getElementById(
              'map'
            )
            .style.left =
            '0';


          document
            .getElementById(
              'map'
            )
            .style.width =
            '100%';

        }

        else {


          sidebar.classList.remove(
            'collapsed'
          );


          sidebarToggle.classList.remove(
            'collapsed'
          );


          sidebarToggle.innerHTML =
            '◀';


          document
            .getElementById(
              'map'
            )
            .style.left =
            '350px';


          document
            .getElementById(
              'map'
            )
            .style.width =
            'calc(100% - 350px)';

        }


        setTimeout(

          function() {

            map.invalidateSize();

          },

          320

        );

      }

    );


    /* =====================================================
       3. ESRI WORLD IMAGERY
       ===================================================== */

    const satellite =
      L.tileLayer(

        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

        {

          minZoom:
            0,

          maxZoom:
            19,

          attribution:
            'Tiles &copy; Esri'

        }

      );


    /* =====================================================
       4. ESRI WORLD STREET MAP
       ===================================================== */

    const street =
      L.tileLayer(

        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',

        {

          minZoom:
            0,

          maxZoom:
            19,

          attribution:
            'Tiles &copy; Esri'

        }

      );


    /* =====================================================
       5. ORTHOPHOTO LAYER

       VERSI LANGSUNG TILE ARCMAP

       L12 - L18

       TANPA CANVAS
       TANPA MULTIPLY

       INI VERSI YANG MEMANG
       SEBELUMNYA BERHASIL MUNCUL.
       ===================================================== */

    const ORTHO_OPACITY =
      0.75;


    const orthoLayer =
      L.tileLayer(

        '',

        {

          minZoom:
            12,

          maxZoom:
            18,

          minNativeZoom:
            12,

          maxNativeZoom:
            18,

          tileSize:
            256,

          noWrap:
            true,

          opacity:
            ORTHO_OPACITY,

          zIndex:
            500,

          attribution:
            'Orthophoto'

        }

      );


    /* =====================================================
       6. URL TILE ORTHOPHOTO
       ===================================================== */

    orthoLayer.getTileUrl =
      function(coords) {


        const z =
          coords.z;


        const x =
          coords.x;


        const y =
          coords.y;


        /* -----------------------------------------------
           HANYA L12-L18
           ----------------------------------------------- */

        if (
          z < 12 ||
          z > 18
        ) {

          return '';

        }


        /* -----------------------------------------------
           TIDAK BOLEH NEGATIF
           ----------------------------------------------- */

        if (
          x < 0 ||
          y < 0
        ) {

          return '';

        }


        /* -----------------------------------------------
           ROW ARCMAP

           Leaflet Y
           -> HEX
           -> Rxxxxxxxx
           ----------------------------------------------- */

        const rowHex =
          Math.floor(y)
            .toString(16)
            .padStart(
              8,
              '0'
            )
            .toLowerCase();


        /* -----------------------------------------------
           COLUMN ARCMAP

           Leaflet X
           -> HEX
           -> Cxxxxxxxx
           ----------------------------------------------- */

        const colHex =
          Math.floor(x)
            .toString(16)
            .padStart(
              8,
              '0'
            )
            .toLowerCase();


        /* -----------------------------------------------
           URL
           ----------------------------------------------- */

        const url =

          'https://raw.githubusercontent.com/' +

          'rivaldo123230038-cloud/' +

          'WebGIS-Kemker-Kelompok-1/' +

          'main/' +

          'Fix_Ortho_web/' +

          '_alllayers/' +

          'L' +
          z +

          '/' +

          'R' +
          rowHex +

          '/' +

          'C' +
          colHex +

          '.png';


        console.log(
          'ORTHOPHOTO TILE:',
          url
        );


        return url;

      };


    /* =====================================================
       7. TILE LOAD / ERROR

       UNTUK DEBUG
       ===================================================== */

    orthoLayer.on(

      'tileload',

      function(e) {


        console.log(

          'ORTHOPHOTO BERHASIL:',
          e.coords

        );

      }

    );


    orthoLayer.on(

      'tileerror',

      function(e) {


        console.error(

          'ORTHOPHOTO GAGAL:',

          e.coords

        );


        if (
          e.coords
        ) {


          const rowHex =
            Math.floor(
              e.coords.y
            )
              .toString(16)
              .padStart(
                8,
                '0'
              )
              .toLowerCase();


          const colHex =
            Math.floor(
              e.coords.x
            )
              .toString(16)
              .padStart(
                8,
                '0'
              )
              .toLowerCase();


          console.error(

            'URL TILE GAGAL:',

            'https://raw.githubusercontent.com/' +

            'rivaldo123230038-cloud/' +

            'WebGIS-Kemker-Kelompok-1/' +

            'main/' +

            'Fix_Ortho_web/' +

            '_alllayers/' +

            'L' +
            e.coords.z +

            '/' +

            'R' +
            rowHex +

            '/' +

            'C' +
            colHex +

            '.png'

          );

        }

      }

    );


    /* =====================================================
       8. BASEMAP DEFAULT
       ===================================================== */

    satellite.addTo(
      map
    );


    /* =====================================================
       9. AKTIFKAN ORTHOPHOTO SEJAK AWAL

       KARENA CHECKBOX DEFAULT = CHECKED
       ===================================================== */

    orthoLayer.addTo(
      map
    );


    /* =====================================================
       10. STYLE GARIS PANTAI
       ===================================================== */

    const coastlineStyle = {

      color:
        '#00ffff',

      weight:
        4,

      opacity:
        0.95

    };


    /* =====================================================
       11. VARIABEL GARIS PANTAI
       ===================================================== */

    let coastline =
      null;


    /* =====================================================
       12. AUTO ZOOM
       ===================================================== */

    function zoomToCoastline() {


      if (

        coastline &&

        coastline.getLayers().length > 0

      ) {


        const bounds =
          coastline.getBounds();


        if (
          bounds.isValid()
        ) {


          map.fitBounds(

            bounds,

            {

              padding:
                [40,40],

              maxZoom:
                16

            }

          );

        }

      }

    }


    /* =====================================================
       13. AUTO ZOOM SIDEBAR
       ===================================================== */

    document

      .getElementById(
        'zoomLayerButton'
      )

      .addEventListener(

        'click',

        function() {

          zoomToCoastline();

        }

      );


    /* =====================================================
       14. AUTO ZOOM MAP CONTROL
       ===================================================== */

    const ZoomToLayerControl =
      L.Control.extend({

        options: {

          position:
            'topright'

        },


        onAdd:
          function() {


            const container =
              L.DomUtil.create(

                'div',

                'leaflet-bar zoom-to-layer-control'

              );


            const button =
              L.DomUtil.create(

                'button',

                'zoom-to-layer-button-map',

                container

              );


            button.type =
              'button';


            button.innerHTML =
              '⌖';


            button.title =
              'Auto Zoom to Layer';


            L.DomEvent
              .disableClickPropagation(
                container
              );


            L.DomEvent.on(

              button,

              'click',

              function() {

                zoomToCoastline();

              }

            );


            return container;

          }

      });


    map.addControl(

      new ZoomToLayerControl()

    );


    /* =====================================================
       15. KONVERSI ESRI JSON
       ===================================================== */

    function convertEsriJSON(
      data
    ) {


      const group =
        L.featureGroup();


      if (
        !data.features
      ) {

        return group;

      }


      data.features.forEach(

        function(feature) {


          const geometry =
            feature.geometry || {};


          const attributes =
            feature.attributes || {};


          if (
            !geometry.paths
          ) {

            return;

          }


          geometry.paths.forEach(

            function(path) {


              const latLngs =
                path.map(

                  function(point) {

                    return [

                      point[1],

                      point[0]

                    ];

                  }

                );


              const line =
                L.polyline(

                  latLngs,

                  coastlineStyle

                );


              let html =

                '<div>' +

                '<div class="popup-title">' +

                'Informasi Garis Pantai' +

                '</div>';


              const keys =
                Object.keys(
                  attributes
                );


              if (
                keys.length === 0
              ) {


                html +=
                  'Tidak terdapat atribut.';

              }

              else {


                keys.forEach(

                  function(key) {


                    let value =
                      attributes[key];


                    if (

                      value === null ||

                      value === undefined ||

                      value === ''

                    ) {

                      value =
                        '-';

                    }


                    html +=

                      '<b>' +
                      key +
                      '</b>: ' +
                      value +
                      '<br>';

                  }

                );

              }


              html +=
                '</div>';


              line.bindPopup(
                html
              );


              /* HOVER */

              line.on(

                'mouseover',

                function() {


                  this.setStyle({

                    color:
                      'red',

                    weight:
                      6

                  });

                }

              );


              line.on(

                'mouseout',

                function() {


                  this.setStyle(
                    coastlineStyle
                  );

                }

              );


              group.addLayer(
                line
              );

            }

          );

        }

      );


      return group;

    }


    /* =====================================================
       16. LOAD GP_RT.JSON
       ===================================================== */

    fetch(
      'GP_RT.json'
    )

      .then(

        function(response) {


          if (
            !response.ok
          ) {

            throw new Error(
              'GP_RT.json tidak ditemukan.'
            );

          }


          return response.json();

        }

      )

      .then(

        function(data) {


          coastline =
            convertEsriJSON(
              data
            );


          coastline.addTo(
            map
          );


          zoomToCoastline();

        }

      )

      .catch(

        function(error) {


          console.error(
            'GP_RT.json:',
            error
          );

        }

      );


    /* =====================================================
       17. CHECKBOX GARIS PANTAI
       ===================================================== */

    document

      .getElementById(
        'coastlineCheck'
      )

      .addEventListener(

        'change',

        function() {


          if (
            this.checked
          ) {


            coastline.addTo(
              map
            );

          }

          else {


            map.removeLayer(
              coastline
            );

          }

        }

      );


    /* =====================================================
       18. HAPUS BASEMAP
       ===================================================== */

    function removeBasemaps() {


      if (
        map.hasLayer(
          satellite
        )
      ) {

        map.removeLayer(
          satellite
        );

      }


      if (
        map.hasLayer(
          street
        )
      ) {

        map.removeLayer(
          street
        );

      }

    }


    /* =====================================================
       19. ESRI WORLD IMAGERY
       ===================================================== */

    document

      .getElementById(
        'satelliteRadio'
      )

      .addEventListener(

        'change',

        function() {


          if (
            this.checked
          ) {


            removeBasemaps();


            satellite.addTo(
              map
            );


            if (
              document
                .getElementById(
                  'orthoCheck'
                )
                .checked
            ) {


              orthoLayer.bringToFront();

            }

          }

        }

      );


    /* =====================================================
       20. ESRI WORLD STREET MAP
       ===================================================== */

    document

      .getElementById(
        'streetRadio'
      )

      .addEventListener(

        'change',

        function() {


          if (
            this.checked
          ) {


            removeBasemaps();


            street.addTo(
              map
            );


            if (
              document
                .getElementById(
                  'orthoCheck'
                )
                .checked
            ) {


              orthoLayer.bringToFront();

            }

          }

        }

      );


    /* =====================================================
       21. ORTHOPHOTO CHECKBOX
       ===================================================== */

    document

      .getElementById(
        'orthoCheck'
      )

      .addEventListener(

        'change',

        function() {


          if (
            this.checked
          ) {


            /*
             * Jika zoom terlalu rendah,
             * naikkan ke L12.
             */

            if (
              map.getZoom() < 12
            ) {

              map.setZoom(
                12
              );

            }


            /*
             * Jika zoom terlalu tinggi,
             * batasi sampai L18.
             */

            if (
              map.getZoom() > 18
            ) {

              map.setZoom(
                18
              );

            }


            /*
             * Tambahkan Orthophoto
             */

            orthoLayer.addTo(
              map
            );


            /*
             * Pastikan di atas basemap
             */

            orthoLayer.bringToFront();


          }

          else {


            if (
              map.hasLayer(
                orthoLayer
              )
            ) {


              map.removeLayer(
                orthoLayer
              );

            }

          }

        }

      );


    /* =====================================================
       22. SCALE BAR
       ===================================================== */

    L.control.scale({

      imperial:
        false,

      metric:
        true,

      position:
        'bottomleft'

    }).addTo(
      map
    );


    /* =====================================================
       23. LEGENDA
       ===================================================== */

    const legend =
      L.control({

        position:
          'bottomright'

      });


    legend.onAdd =
      function() {


        const div =
          L.DomUtil.create(

            'div',

            'map-legend'

          );


        div.innerHTML = `

          <div class="map-legend-title">
            Legenda
          </div>

          <div class="legend-item">

            <span
              class="legend-line-coastline">
            </span>

            <span>
              Garis Pantai
            </span>

          </div>

        `;


        return div;

      };


    legend.addTo(
      map
    );


    /* =====================================================
       24. KOORDINAT KURSOR
       ===================================================== */

    map.on(

      'mousemove',

      function(e) {


        document

          .getElementById(
            'latitude'
          )

          .innerHTML =
          e.latlng
            .lat
            .toFixed(6);


        document

          .getElementById(
            'longitude'
          )

          .innerHTML =
          e.latlng
            .lng
            .toFixed(6);

      }

    );


    /* =====================================================
       25. BACKGROUND 3 FOTO
       ===================================================== */

    const bgSlideshow =
      document.getElementById(
        'backgroundSlideshow'
      );


    const bgPhoto1 =
      document.getElementById(
        'bgPhoto1'
      );


    const bgPhoto2 =
      document.getElementById(
        'bgPhoto2'
      );


    const bgPhoto3 =
      document.getElementById(
        'bgPhoto3'
      );


    let bgStep =
      0;


    /* =====================================================
       26. ROTASI BACKGROUND
       ===================================================== */

    function rotateBackgroundPhotos() {


      bgSlideshow.classList.add(
        'changing'
      );


      setTimeout(

        function() {


          bgStep++;


          /* ===============================================
             PUTARAN 1
             =============================================== */

          if (
            bgStep === 1
          ) {


            bgPhoto1.className =
              'bg-photo pos-bottom';


            bgPhoto2.className =
              'bg-photo pos-top';


            bgPhoto3.className =
              'bg-photo pos-middle';

          }


          /* ===============================================
             PUTARAN 2
             =============================================== */

          else if (
            bgStep === 2
          ) {


            bgPhoto1.className =
              'bg-photo pos-middle';


            bgPhoto2.className =
              'bg-photo pos-bottom';


            bgPhoto3.className =
              'bg-photo pos-top';

          }


          /* ===============================================
             PUTARAN 3
             =============================================== */

          else {


            bgStep =
              0;


            bgPhoto1.className =
              'bg-photo pos-top';


            bgPhoto2.className =
              'bg-photo pos-middle';


            bgPhoto3.className =
              'bg-photo pos-bottom';

          }


          setTimeout(

            function() {


              bgSlideshow.classList.remove(
                'changing'
              );


            },

            180

          );


        },

        550

      );

    }


    /* =====================================================
       27. INTERVAL BACKGROUND
       ===================================================== */

    setInterval(

      rotateBackgroundPhotos,

      5000

    );


  </script>

</body>

</html>
