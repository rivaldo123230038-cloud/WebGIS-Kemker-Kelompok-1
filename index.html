<script>

/* =====================================================
   1. PENGATURAN
===================================================== */


/*
   MAP BOLEH ZOOM SAMPAI 24.

   Ini TIDAK mengubah data asli.
   Di atas native zoom, tile diperbesar.
*/

const MAP_MAX_ZOOM = 24;


/*
   Orthophoto asli tersedia sampai L18.
*/

const ORTHO_NATIVE_ZOOM = 18;


/* =====================================================
   2. PROYEKSI UTM 48S
===================================================== */

proj4.defs(
  "EPSG:32748",
  "+proj=utm +zone=48 +south +datum=WGS84 +units=m +no_defs +type=crs"
);


/* =====================================================
   3. INISIALISASI MAP
===================================================== */

const map =
  L.map(
    'map',
    {

      center:
        [-5.45,105.25],

      zoom:
        10,

      minZoom:
        0,

      maxZoom:
        MAP_MAX_ZOOM,

      zoomControl:
        true,

      scrollWheelZoom:
        true,

      doubleClickZoom:
        true,

      touchZoom:
        true,

      boxZoom:
        true

    }
  );


/* =====================================================
   4. SIDEBAR
===================================================== */

const sidebar =
  document.getElementById(
    'sidebar'
  );


const sidebarToggle =
  document.getElementById(
    'sidebarToggle'
  );


let sidebarCollapsed =
  false;


sidebarToggle.addEventListener(
  'click',
  function() {


    sidebarCollapsed =
      !sidebarCollapsed;


    if (sidebarCollapsed) {


      sidebar.classList.add(
        'collapsed'
      );


      sidebarToggle.classList.add(
        'collapsed'
      );


      sidebarToggle.innerHTML =
        '▶';


      sidebarToggle.title =
        'Tampilkan Panel';


      sidebarToggle.setAttribute(
        'aria-label',
        'Tampilkan Panel'
      );


      document
        .getElementById('map')
        .style.left =
        '0';


      document
        .getElementById('map')
        .style.width =
        '100%';


    }


    else {


      sidebar.classList.remove(
        'collapsed'
      );


      sidebarToggle.classList.remove(
        'collapsed'
      );


      sidebarToggle.innerHTML =
        '◀';


      sidebarToggle.title =
        'Minimize Panel';


      sidebarToggle.setAttribute(
        'aria-label',
        'Minimize Panel'
      );


      const sidebarWidth =
        window.innerWidth <= 800
          ? '280px'
          : '350px';


      document
        .getElementById('map')
        .style.left =
        sidebarWidth;


      document
        .getElementById('map')
        .style.width =
        `calc(100% - ${sidebarWidth})`;

    }


    setTimeout(
      function() {

        map.invalidateSize();

      },
      320
    );

  }
);


/* =====================================================
   5. ESRI WORLD IMAGERY
===================================================== */

const satellite =
  L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

    {

      minZoom:
        0,

      maxZoom:
        MAP_MAX_ZOOM,

      /*
         Native tile sampai 19.
         Zoom 20-24 menggunakan pembesaran
         dari tile native terakhir.
      */

      maxNativeZoom:
        19,

      tileSize:
        256,

      attribution:
        'Tiles &copy; Esri'

    }

  );


/* =====================================================
   6. ESRI WORLD STREET MAP
===================================================== */

const street =
  L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',

    {

      minZoom:
        0,

      maxZoom:
        MAP_MAX_ZOOM,

      maxNativeZoom:
        19,

      tileSize:
        256,

      attribution:
        'Tiles &copy; Esri'

    }

  );


/* =====================================================
   7. DEFAULT BASEMAP
===================================================== */

satellite.addTo(map);


/* =====================================================
   8. FUNGSI NOMOR TILE
===================================================== */

function decimalToHex(value) {

  return Math
    .floor(value)
    .toString(16)
    .padStart(8,'0')
    .toLowerCase();

}


/* =====================================================
   9. HAPUS WHITE NO-DATA ORTHOPHOTO
===================================================== */


/*
   Hanya warna putih yang TERHUBUNG KE TEPI TILE
   yang dihapus.

   Jadi objek putih yang berada di tengah
   orthophoto tidak ikut hilang.
*/

function removeWhiteEdge(canvas) {


  try {


    const ctx =
      canvas.getContext(
        '2d'
      );


    const width =
      canvas.width;


    const height =
      canvas.height;


    const imageData =
      ctx.getImageData(
        0,
        0,
        width,
        height
      );


    const data =
      imageData.data;


    const total =
      width * height;


    const visited =
      new Uint8Array(
        total
      );


    const queue =
      new Int32Array(
        total
      );


    let head = 0;

    let tail = 0;


    function isWhite(index) {


      const r =
        data[index];


      const g =
        data[index + 1];


      const b =
        data[index + 2];


      const a =
        data[index + 3];


      return (

        a > 0 &&

        r >= 240 &&

        g >= 240 &&

        b >= 240

      );

    }


    function addPixel(
      x,
      y
    ) {


      if (

        x < 0 ||

        x >= width ||

        y < 0 ||

        y >= height

      ) {

        return;

      }


      const pos =
        y * width + x;


      if (
        visited[pos]
      ) {

        return;

      }


      const index =
        pos * 4;


      if (
        !isWhite(index)
      ) {

        return;

      }


      visited[pos] =
        1;


      queue[tail++] =
        pos;

    }


    /*
       Ambil semua piksel putih
       dari keempat sisi tile.
    */

    for (
      let x = 0;
      x < width;
      x++
    ) {

      addPixel(
        x,
        0
      );

      addPixel(
        x,
        height - 1
      );

    }


    for (
      let y = 0;
      y < height;
      y++
    ) {

      addPixel(
        0,
        y
      );

      addPixel(
        width - 1,
        y
      );

    }


    /*
       Flood fill
    */

    while (
      head < tail
    ) {


      const pos =
        queue[head++];


      const x =
        pos % width;


      const y =
        Math.floor(
          pos / width
        );


      const index =
        pos * 4;


      /*
         Jadikan transparan
      */

      data[
        index + 3
      ] = 0;


      addPixel(
        x + 1,
        y
      );


      addPixel(
        x - 1,
        y
      );


      addPixel(
        x,
        y + 1
      );


      addPixel(
        x,
        y - 1
      );

    }


    ctx.putImageData(
      imageData,
      0,
      0
    );


  }

  catch (error) {


    console.warn(
      'White no-data tidak dapat diproses:',
      error
    );


  }

}


/* =====================================================
   10. CUSTOM ORTHOPHOTO GRID LAYER
===================================================== */

const OrthophotoLayer =
  L.GridLayer.extend(

    {


      options: {


        tileSize:
          256,


        minZoom:
          12,


        maxZoom:
          MAP_MAX_ZOOM,


        maxNativeZoom:
          ORTHO_NATIVE_ZOOM,


        noWrap:
          true,


        updateWhenZooming:
          false,


        updateWhenIdle:
          true,


        keepBuffer:
          3

      },


      createTile:
        function(
          coords,
          done
        ) {


          const canvas =
            document.createElement(
              'canvas'
            );


          canvas.width =
            256;


          canvas.height =
            256;


          const ctx =
            canvas.getContext(
              '2d'
            );


          /*
             Folder asli:

             Fix_Ortho_web
             _alllayers
             L12 ... L18
             Rxxxxxxxx
             Cxxxxxxxx.png
          */


          const z =
            coords.z;


          const row =
            decimalToHex(
              coords.y
            );


          const col =
            decimalToHex(
              coords.x
            );


          /*
             jsDelivr dipakai agar tile
             bisa dibaca canvas tanpa
             masalah CORS GitHub.
          */

          const url =

            'https://cdn.jsdelivr.net/gh/' +

            'rivaldo123230038-cloud/' +

            'WebGIS-Kemker-Kelompok-1' +

            '@main/' +

            'Fix_Ortho_web/' +

            '_alllayers/' +

            'L' + z + '/' +

            'R' + row + '/' +

            'C' + col + '.png';


          const img =
            new Image();


          img.crossOrigin =
            'anonymous';


          img.onload =
            function() {


              try {


                ctx.clearRect(
                  0,
                  0,
                  256,
                  256
                );


                ctx.drawImage(
                  img,
                  0,
                  0,
                  256,
                  256
                );


                /*
                   Hapus white no-data
                */

                removeWhiteEdge(
                  canvas
                );


              }

              catch (error) {


                console.warn(
                  'Orthophoto canvas error:',
                  error
                );


              }


              done(
                null,
                canvas
              );


            };


          img.onerror =
            function() {


              /*
                 Tile kosong jika
                 file memang tidak ada.

                 Tidak menampilkan
                 broken image.
              */

              ctx.clearRect(
                0,
                0,
                256,
                256
              );


              done(
                null,
                canvas
              );


            };


          img.src =
            url;


          return canvas;

        }

    }

  );


/* =====================================================
   11. INSTANCE ORTHOPHOTO
===================================================== */

const ortho =
  new OrthophotoLayer();


/* =====================================================
   12. GARIS PANTAI
===================================================== */

let coastline =
  null;


let coastlineReady =
  false;


/* =====================================================
   13. CARI KOORDINAT PERTAMA
===================================================== */

function findFirstCoordinate(
  coordinates
) {


  if (

    Array.isArray(
      coordinates
    ) &&

    coordinates.length >= 2 &&

    typeof coordinates[0]
      === 'number' &&

    typeof coordinates[1]
      === 'number'

  ) {

    return coordinates;

  }


  if (
    Array.isArray(
      coordinates
    )
  ) {


    for (
      const item
      of coordinates
    ) {


      const result =
        findFirstCoordinate(
          item
        );


      if (result) {

        return result;

      }

    }

  }


  return null;

}


/* =====================================================
   14. UBAH SATU KOORDINAT
===================================================== */

function convertCoordinate(
  coordinate
) {


  const result =
    proj4(

      'EPSG:32748',

      'EPSG:4326',

      [
        coordinate[0],
        coordinate[1]
      ]

    );


  return [

    result[0],
    result[1]

  ];

}


/* =====================================================
   15. UBAH RECURSIVE COORDINATES
===================================================== */

function transformCoordinates(
  coordinates
) {


  if (

    Array.isArray(
      coordinates
    ) &&

    coordinates.length >= 2 &&

    typeof coordinates[0]
      === 'number' &&

    typeof coordinates[1]
      === 'number'

  ) {


    return convertCoordinate(
      coordinates
    );

  }


  if (
    Array.isArray(
      coordinates
    )
  ) {


    return coordinates.map(
      function(item) {

        return transformCoordinates(
          item
        );

      }
    );

  }


  return coordinates;

}


/* =====================================================
   16. TRANSFORMASI GEOMETRY
===================================================== */

function transformGeometry(
  geometry
) {


  if (
    !geometry
  ) {

    return geometry;

  }


  return {

    ...geometry,

    coordinates:
      transformCoordinates(
        geometry.coordinates
      )

  };

}


/* =====================================================
   17. TRANSFORMASI GEOJSON
===================================================== */

function convertGeoJSONToWGS84(
  geojson
) {


  const firstCoord =
    findFirstCoordinate(
      geojson
    );


  if (
    !firstCoord
  ) {

    throw new Error(
      'Koordinat GeoJSON tidak ditemukan.'
    );

  }


  /*
     Jika:

     X > 180
     atau
     Y > 90

     maka diasumsikan UTM.
  */

  const isUTM =

    Math.abs(
      firstCoord[0]
    ) > 180 ||

    Math.abs(
      firstCoord[1]
    ) > 90;


  if (!isUTM) {


    console.log(
      'GeoJSON sudah berada pada koordinat geografis.'
    );


    return geojson;

  }


  console.log(
    'GeoJSON terdeteksi UTM 48S.'
  );


  console.log(
    'Transformasi EPSG:32748 -> EPSG:4326'
  );


  if (
    geojson.type ===
    'FeatureCollection'
  ) {


    return {

      ...geojson,

      features:
        geojson.features.map(
          function(feature) {

            return {

              ...feature,

              geometry:
                transformGeometry(
                  feature.geometry
                )

            };

          }
        )

    };

  }


  if (
    geojson.type ===
    'Feature'
  ) {


    return {

      ...geojson,

      geometry:
        transformGeometry(
          geojson.geometry
        )

    };

  }


  if (
    geojson.type
  ) {


    return {

      ...geojson,

      coordinates:
        transformCoordinates(
          geojson.coordinates
        )

    };

  }


  return geojson;

}


/* =====================================================
   18. POPUP GEOJSON
===================================================== */

function popupContent(
  properties
) {


  if (

    !properties ||

    Object.keys(
      properties
    ).length === 0

  ) {


    return `

      <div class="popup-title">
        Garis Pantai RTK
      </div>

      <div>
        Tidak ada atribut.
      </div>

    `;

  }


  let html = `

    <div class="popup-title">
      Garis Pantai RTK
    </div>

  `;


  Object.entries(
    properties
  ).forEach(
    function(
      [key,value]
    ) {


      if (
        value === null ||
        value === undefined
      ) {

        value = '-';

      }


      html +=

        '<b>' +

        key +

        '</b>: ' +

        value +

        '<br>';

    }
  );


  return html;

}


/* =====================================================
   19. STYLE GARIS PANTAI
===================================================== */

function coastlineStyle() {

  return {

    color:
      '#00ffff',

    weight:
      4,

    opacity:
      0.95

  };

}


/* =====================================================
   20. LOAD GARIS PANTAI RTK
===================================================== */

fetch(
  'Garis_Pantai_RTK.geojson'
)

.then(
  function(response) {


    if (
      !response.ok
    ) {

      throw new Error(
        'File Garis_Pantai_RTK.geojson tidak ditemukan.'
      );

    }


    return response.json();

  }
)

.then(
  function(data) {


    console.log(
      'GeoJSON berhasil dimuat.'
    );


    /*
       UTM 48S -> WGS84
    */

    const converted =
      convertGeoJSONToWGS84(
        data
      );


    /*
       BUAT LAYER GEOJSON
    */

    coastline =
      L.geoJSON(

        converted,

        {

          style:
            coastlineStyle(),


          onEachFeature:
            function(
              feature,
              layer
            ) {


              /*
                 Popup
              */

              layer.bindPopup(
                popupContent(
                  feature.properties
                )
              );


              /*
                 Hover
              */

              layer.on(
                'mouseover',
                function() {


                  layer.setStyle({

                    color:
                      '#ff0000',

                    weight:
                      6,

                    opacity:
                      1

                  });


                }
              );


              layer.on(
                'mouseout',
                function() {


                  coastline.resetStyle(
                    layer
                  );


                }
              );


            }

        }

      );


    /*
       TAMBAHKAN KE MAP
    */

    coastline.addTo(
      map
    );


    coastlineReady =
      true;


    console.log(
      'Garis Pantai RTK berhasil ditampilkan.'
    );


    /*
       AUTO ZOOM SETELAH
       LAYER BENAR-BENAR SELESAI
    */

    setTimeout(
      function() {

        zoomToCoastline();

      },
      300
    );


  }
)

.catch(
  function(error) {


    console.error(
      'Gagal memuat Garis Pantai RTK:',
      error
    );


    alert(

      'Garis Pantai RTK gagal dimuat.\\n\\n' +

      'Pastikan file berikut berada satu folder dengan index.html:\\n\\n' +

      'Garis_Pantai_RTK.geojson'

    );

  }
);


/* =====================================================
   21. AUTO ZOOM
===================================================== */

function zoomToCoastline() {


  if (
    !coastlineReady ||
    !coastline
  ) {


    console.warn(
      'Garis pantai belum selesai dimuat.'
    );


    return;

  }


  const bounds =
    coastline.getBounds();


  if (
    !bounds.isValid()
  ) {


    console.warn(
      'Bounds garis pantai tidak valid.'
    );


    return;

  }


  console.log(
    'Auto Zoom ke garis pantai:',
    bounds
  );


  /*
     Tidak dibatasi maxZoom 20 lagi.

     Bisa mendekati level 24.
  */

  map.fitBounds(

    bounds,

    {

      padding:
        [40,40],

      maxZoom:
        24,

      animate:
        true

    }

  );

}


/* =====================================================
   22. CHECKBOX GARIS PANTAI
===================================================== */

document
  .getElementById(
    'coastlineCheck'
  )
  .addEventListener(
    'change',
    function() {


      if (
        this.checked
      ) {


        if (
          coastline
        ) {

          coastline.addTo(
            map
          );

        }


      }

      else {


        if (
          coastline
        ) {

          map.removeLayer(
            coastline
          );

        }

      }

    }
  );


/* =====================================================
   23. TOMBOL AUTO ZOOM SIDEBAR
===================================================== */

document
  .getElementById(
    'zoomLayerButton'
  )
  .addEventListener(
    'click',

         Jika layer belum muncul,
         jangan gagal diam-diam.
      */

      if (
        !coastlineReady
      ) {


        console.warn(
          'Layer masih dimuat.'
        );


        return;

      }


      zoomToCoastline();

    }
  );

/* =====================================================
   27. SCALE BAR
===================================================== */

L.control.scale({

  imperial:
    false,

  metric:
    true,

  position:
    'bottomleft'

}).addTo(
  map
);


/* =====================================================
   28. AUTO ZOOM CONTROL DI MAP
===================================================== */

const ZoomToLayerControl =
  L.Control.extend({

    options: {

      position:
        'topright'

    },


    onAdd:
      function() {


        const container =
          L.DomUtil.create(
            'div',
            'leaflet-bar zoom-to-layer-control'
          );


        const button =
          L.DomUtil.create(
            'button',
            'zoom-to-layer-button-map',
            container
          );


        button.type =
          'button';


        button.innerHTML =
          '⌖';


        button.title =
          'Auto Zoom to Layer';


        button.setAttribute(
          'aria-label',
          'Auto Zoom to Layer'
        );


        L.DomEvent
          .disableClickPropagation(
            container
          );


        L.DomEvent.on(
          button,
          'click',
          function(e) {


            L.DomEvent
              .stopPropagation(e);


            zoomToCoastline();


          }
        );


        return container;

      }

  });


map.addControl(
  new ZoomToLayerControl()
);


/* =====================================================
   29. LEGEND
===================================================== */

const legend =
  L.control({

    position:
      'bottomright'

  });


legend.onAdd =
  function() {


    const div =
      L.DomUtil.create(
        'div',
        'map-legend'
      );


    div.innerHTML = `

      <div class="map-legend-title">
        Legenda
      </div>

      <div class="legend-item">

        <span
          class="legend-line-coastline">
        </span>

        <span>
          Garis Pantai RTK
        </span>

      </div>

    `;


    L.DomEvent
      .disableClickPropagation(
        div
      );


    return div;

  };


legend.addTo(
  map
);


/* =====================================================
   30. KOORDINAT KURSOR
===================================================== */

map.on(

);

   31. INFO ZOOM
===================================================== */

map.on(

  function() {


    console.log(
      'Zoom level:',
      map.getZoom()
    );

);

   32. INVALIDATE MAP
===================================================== */

setTimeout(
  function() {

    map.invalidateSize();

  500
